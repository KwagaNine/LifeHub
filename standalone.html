                                        }}
                                    />
                                    <div className="space-y-3 pb-4">
                                        <div className="flex items-baseline justify-between px-1">
                                            <div className="flex items-baseline gap-2 min-w-0">
                                                <h3 className="text-lg font-bold text-slate-700 truncate">Операции за {selectedDateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}</h3>
                                                <span className="text-[11px] font-black text-slate-300 truncate">
                                                    • баланс {Number(balanceAtEndOfSelectedDay).toLocaleString('ru-RU')} ₽
                                                </span>
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 border border-slate-100 rounded-3xl p-4">
                                            <div className="flex items-end justify-between">
                                                <div>
                                                    <div className="text-[11px] font-black uppercase tracking-widest text-slate-400">Итого за день</div>
                                                    <div className="mt-1 text-2xl font-extrabold text-slate-900">
                                                        -{Number(dayExpenseTotal).toLocaleString('ru-RU')} ₽
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-xs font-bold text-slate-400">Доходы: <span className="text-emerald-600 font-extrabold">+{Number(dayIncomeTotal).toLocaleString('ru-RU')} ₽</span></div>
                                                    <div className="text-xs font-bold text-slate-400 mt-1">
                                                        Итог: <span className={`${dayNetTotal >= 0 ? 'text-emerald-700' : 'text-rose-600'} font-extrabold`}>{dayNetTotal >= 0 ? '+' : ''}{Number(dayNetTotal).toLocaleString('ru-RU')} ₽</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="mt-3 w-full h-2.5 bg-white rounded-full overflow-hidden border border-slate-100">
                                                {Number(monthLimit) > 0 ? (
                                                    <div
                                                        className={`${dayExpenseTotal > 0 ? 'bg-rose-400' : 'bg-slate-200'} h-full rounded-full`}
                                                        style={{ width: `${Math.min(100, Math.round((Number(dayExpenseTotal) / Number(monthLimit)) * 100))}%` }}
                                                    />
                                                ) : (
                                                    <div className="bg-slate-200 h-full rounded-full" style={{ width: '0%' }} />
                                                )}
                                            </div>
                                            <div className="mt-2 text-[11px] font-bold text-slate-400">
                                                Расходы этого дня: {Number(dayExpenseTotal).toLocaleString('ru-RU')} ₽
                                                {Number(monthLimit) > 0 ? ` • ${Math.min(100, Math.round((Number(dayExpenseTotal) / Number(monthLimit)) * 100))}% от месячного лимита` : ''}
                                            </div>
                                        </div>

                                        {filteredTransactions.length > 0 ? (
                                            filteredTransactions.map(t => (
                                                <div key={t.id} className="flex justify-between items-center p-4 bg-white border border-slate-100 rounded-2xl shadow-sm">
                                                    <button
                                                        onClick={() => openEditTransactionModal(t)}
                                                        className="flex items-center gap-4 text-left flex-1 min-w-0"
                                                        title="Редактировать"
                                                    >
                                                        <div className={`p-3 rounded-xl ${t.type === 'income' ? 'bg-emerald-50 text-emerald-500' : 'bg-rose-50 text-rose-500'}`}>
                                                            {t.type === 'income' ? <Icons.TrendingUp className="w-5 h-5" /> : <Icons.TrendingDown className="w-5 h-5" />}
                                                        </div>
                                                        <div className="min-w-0">
                                                            <p className="font-bold text-slate-800 truncate">{t.title}</p>
                                                            <p className="text-xs text-slate-400 font-bold bg-slate-50 px-2 py-0.5 rounded mt-1 w-fit">{t.category}</p>
                                                        </div>
                                                    </button>

                                                    <div className="flex items-center gap-3 shrink-0">
                                                        <span className={`font-mono font-bold ${t.type === 'income' ? 'text-emerald-500' : 'text-slate-900'}`}>
                                                            {t.type === 'income' ? '+' : '-'}{t.amount} ₽
                                                        </span>
                                                        <button
                                                            onClick={() => deleteTransaction(t.id)}
                                                            className="p-2 rounded-xl bg-slate-50 text-slate-300 hover:text-rose-500 hover:bg-rose-50"
                                                            title="Удалить"
                                                        >
                                                            <Icons.Trash className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-40 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                <Icons.Receipt className="w-10 h-10 mb-2 opacity-50" />
                                                <p className="text-sm font-medium">Нет операций</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add/Edit Transaction Modal - opens ON TOP of Operations modal */}
                    {isAddTransOpen && (
                        <div className="fixed inset-0 z-[150] flex items-end overflow-hidden">
                            <div
                                className="absolute inset-0 bg-slate-900/40 backdrop-blur-md"
                                onClick={() => { setAddTransOpen(false); setEditingTransactionId(null); }}
                            />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-5 space-y-4 shadow-2xl relative animate-slideUp max-h-[90vh] overflow-y-auto scrollbar-hide">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingTransactionId ? 'Редактирование' : 'Новая операция'}</h2>
                                    <div className="flex items-center gap-2">
                                        {editingTransactionId && (
                                            <button
                                                onClick={() => { deleteTransaction(editingTransactionId); setAddTransOpen(false); setEditingTransactionId(null); }}
                                                className="bg-rose-50 p-2.5 rounded-2xl text-rose-600 hover:bg-rose-100"
                                                title="Удалить"
                                            >
                                                <Icons.Trash className="w-5 h-5" />
                                            </button>
                                        )}
                                        <button
                                            onClick={() => { setAddTransOpen(false); setEditingTransactionId(null); }}
                                            className="bg-slate-50 p-2 rounded-full text-slate-400"
                                            title="Закрыть"
                                        >
                                            <Icons.X className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                                <div className="text-xs text-slate-400 font-bold bg-slate-50 px-3 py-2 rounded-2xl border border-slate-100">
                                    Дата: {selectedDateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}
                                </div>

                                <div className="flex gap-2 p-1 bg-slate-100 rounded-2xl">
                                    <button onClick={() => setNewTrans({ ...newTrans, type: 'expense' })} className={`flex-1 py-3 rounded-xl font-bold transition-all ${newTrans.type === 'expense' ? 'bg-white shadow text-slate-900' : 'text-slate-400'}`}>Расход</button>
                                    <button onClick={() => setNewTrans({ ...newTrans, type: 'income' })} className={`flex-1 py-3 rounded-xl font-bold transition-all ${newTrans.type === 'income' ? 'bg-white shadow text-slate-900' : 'text-slate-400'}`}>Доход</button>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Сумма</label>
                                        <input
                                            type="number"
                                            value={newTrans.amount}
                                            onChange={e => setNewTrans({ ...newTrans, amount: e.target.value })}
                                            placeholder="0"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-2xl font-bold text-slate-800 outline-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={newTrans.title}
                                            onChange={e => setNewTrans({ ...newTrans, title: e.target.value })}
                                            placeholder="Напр: Продукты"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Категория</label>

                                        {/* Список категорий */}
                                        <div className="flex flex-wrap gap-2">
                                            {categories.map(cat => {
                                                const isCustom = (customCategories || []).includes(cat);
                                                const selected = newTrans.category === cat;
                                                return (
                                                    <div key={cat} className="flex items-center">
                                                        <button
                                                            onClick={() => setNewTrans({ ...newTrans, category: cat })}
                                                            className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${selected ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                                        >
                                                            {cat}
                                                        </button>
                                                        {isCustom && (
                                                            <button
                                                                title="Удалить категорию"
                                                                onClick={() => removeCustomCategory(cat)}
                                                                className={`ml-1 p-2 rounded-xl transition-colors ${selected ? 'bg-slate-900 text-white/70 hover:text-white' : 'bg-slate-100 text-slate-300 hover:text-rose-500 hover:bg-rose-50'}`}
                                                            >
                                                                <Icons.Trash className="w-4 h-4" />
                                                            </button>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Добавление новой категории */}
                                        {!isAddingCategory ? (
                                            <button
                                                onClick={() => setIsAddingCategory(true)}
                                                className="mt-2 inline-flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-sm bg-slate-50 text-slate-500 hover:bg-slate-100 border border-slate-100"
                                            >
                                                <Icons.Plus className="w-4 h-4" />
                                                Добавить категорию
                                            </button>
                                        ) : (
                                            <div className="mt-2 flex gap-2">
                                                <input
                                                    value={newCategoryName}
                                                    onChange={(e) => setNewCategoryName(e.target.value)}
                                                    placeholder="Напр: Кофе"
                                                    className="flex-1 bg-slate-50 rounded-2xl py-3 px-4 font-bold text-slate-800 outline-none"
                                                    autoFocus
                                                />
                                                <button
                                                    onClick={handleAddCustomCategory}
                                                    className="px-4 rounded-2xl bg-emerald-500 text-white font-bold"
                                                >
                                                    <Icons.Check className="w-5 h-5" />
                                                </button>
                                                <button
                                                    onClick={() => { setIsAddingCategory(false); setNewCategoryName(''); }}
                                                    className="px-4 rounded-2xl bg-slate-100 text-slate-500 font-bold"
                                                >
                                                    <Icons.X className="w-5 h-5" />
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <PressableScale onClick={handleAddTransaction} className="w-full pt-2">
                                    <div className={`h-14 rounded-3xl flex items-center justify-center shadow-xl ${newTrans.type === 'expense' ? 'bg-rose-500' : 'bg-emerald-500'}`}>
                                        <span className="text-white font-bold text-lg">Добавить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}

                    {/* Bills Modal with Calendar */}
                    {isBillsOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setBillsOpen(false)} />
                            <div className="bg-white dark:bg-slate-800 w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden" style={{ height: '90vh' }}>
                                <div className="flex justify-between items-center p-5 pb-2 bg-white dark:bg-slate-800 shrink-0">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Платежи</h2>
                                        <p className="text-slate-500 dark:text-slate-400 text-sm">Регулярные счета</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <PressableScale onClick={() => setAddBillOpen(true)} className="bg-violet-500 p-2.5 rounded-xl text-white shadow-lg">
                                            <Icons.Plus className="w-5 h-5" />
                                        </PressableScale>
                                        <button onClick={() => setBillsOpen(false)} className="bg-slate-100 dark:bg-slate-700 p-2 rounded-full text-slate-400"><Icons.X className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto px-5 pb-6 pt-2 scrollbar-hide">
                                    {/* Bills Calendar */}
                                    <MonthCalendar
                                        viewMonth={billsViewMonth}
                                        selectedDate={selectedBillDateObj}
                                        onSelectDate={(d) => setSelectedBillDateObj(startOfDay(d))}
                                        onPrevMonth={() => setBillsViewMonth(new Date(billsViewMonth.getFullYear(), billsViewMonth.getMonth() - 1, 1))}
                                        onNextMonth={() => setBillsViewMonth(new Date(billsViewMonth.getFullYear(), billsViewMonth.getMonth() + 1, 1))}
                                        selectedClassName="bg-violet-500 text-white shadow-lg"
                                        todayClassName="bg-violet-50 text-violet-700"
                                        renderMarkers={(day, selected) => {
                                            const m = billsMarkersByDay[day];
                                            if (!m) return null;
                                            return (
                                                <div className="flex gap-0.5 absolute bottom-1.5">
                                                    {m.unpaid && <div className={`w-1.5 h-1.5 rounded-full ${selected ? 'bg-white' : 'bg-rose-400'}`} />}
                                                    {m.paid && <div className={`w-1.5 h-1.5 rounded-full ${selected ? 'bg-white/70' : 'bg-emerald-400'}`} />}
                                                </div>
                                            );
                                        }}
                                    />

                                    <SectionHeader title={`Платежи за ${selectedBillDateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}`} />
                                    <div className="space-y-3">
                                        {filteredBills.length > 0 ? filteredBills.map(bill => (
                                            <div key={bill.id} className={`p-5 rounded-2xl border transition-all ${bill.paid ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-100 shadow-sm'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div className="flex items-center gap-3">
                                                        <button onClick={() => toggleBillPaid(bill.id)} className={`p-2 rounded-xl ${bill.paid ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}>
                                                            {bill.paid ? <Icons.CheckCircle className="w-5 h-5" /> : <Icons.Circle className="w-5 h-5" />}
                                                        </button>
                                                        <div>
                                                            <h3 className={`font-bold ${bill.paid ? 'text-emerald-700 line-through' : 'text-slate-800'}`}>{bill.title}</h3>
                                                            <p className="text-xs text-slate-400">
                                                            {bill.repeat === 'weekly' ? 'Каждую неделю' : 
                                                             bill.repeat === 'biweekly' ? 'Каждые 2 недели' : 
                                                             bill.repeat === 'none' ? 'Разовый платёж' : 
                                                             (() => {
                                                                 const originalDay = Number(bill.date) || 1;
                                                                 const adjustedDay = getAdjustedBillDay(originalDay, selectedBillDateObj.getFullYear(), selectedBillDateObj.getMonth());
                                                                 if (adjustedDay !== originalDay) {
                                                                     return `${originalDay}-е → ${adjustedDay}-е (перенос)`;
                                                                 }
                                                                 return `Каждое ${bill.date} число`;
                                                             })()}
                                                        </p>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">

                    {/* Category Modal (Add/Edit/Delete + Limit) + Полный список категорий */}
                    {isCategoryLimitOpen && (

                                        <h2 className="text-2xl font-bold text-slate-900">
                                            {categoryModalMode === 'add' ? 'Новая категория' : (editingLimitCategory ? 'Настройки категории' : 'Лимиты/Категории')}

                                    {/* Режим: список всех категорий (когда editingLimitCategory === null и не режим добавления) */}

                                                                    <button

                                    ) : (
                                        /* Режим: добавление или редактирование конкретной категории */
                                        <div className="space-y-4">
                                            {/* Кнопка «Назад к списку» если редактируем */}
                                            {editingLimitCategory && (

                                        <button onClick={handleDeleteGoal} className="bg-rose-50 p-3 rounded-full text-rose-500">

                                            type="number"

                                        <div className="space-y-2">
                                            <label className={THEME.label}>Накоплено</label>
                                            <input
                                                type="number"
                                                value={goalForm.currentAmount}
                                                onChange={e => setGoalForm({ ...goalForm, currentAmount: e.target.value })}

                                                className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            />

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Дата цели</label>
                                        <input
                                            type="date"
                                            value={goalForm.date}
                                            onChange={e => setGoalForm({ ...goalForm, date: e.target.value })}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                <PressableScale onClick={handleSaveGoal} className="w-full pt-2">
                                    <div className="bg-emerald-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">

                    )}
                </div>
            );
        };

        // --- Notes Tab ---
        const NotesTab = () => {
            const [notes, setNotes] = useLocalStorage('lifehub_notes', []);
            const [query, setQuery] = useState('');
            const [mobileSearchOpen, setMobileSearchOpen] = useState(false);
            const [activeCategory, setActiveCategory] = useState('Все');
            const [categoryMenuOpen, setCategoryMenuOpen] = useState(false);
            const [sortMode, setSortMode] = useState('recent');
            const [selectedId, setSelectedId] = useState(null);
            const [mobileDetailOpen, setMobileDetailOpen] = useState(false);
            const [editorOpen, setEditorOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [deleteCandidate, setDeleteCandidate] = useState(null);
            const [menuNote, setMenuNote] = useState(null);
            const [toast, setToast] = useState('');
            const [noteForm, setNoteForm] = useState({
                title: '',
                content: '',
                category: 'Без категории',
                isPinned: false,
                checklist: []
            });

            const baseCategories = ['Все', 'Личные', 'Работа', 'Идеи', 'Без категории'];

            const normalizeChecklist = (checklist) => {
                if (!Array.isArray(checklist)) return [];
                return checklist
                    .map((item, index) => {
                        if (typeof item === 'string') {
                            return { id: `${Date.now()}-${index}`, text: item, done: false };
                        }
                        return {
                            id: item?.id || `${Date.now()}-${index}`,
                            text: String(item?.text || item?.title || '').trim(),
                            done: Boolean(item?.done || item?.completed)
                        };
                    })
                    .filter(item => item.text);
            };

            const normalizeNote = (note) => ({
                ...note,
                id: String(note?.id || Date.now()),
                title: String(note?.title || '').trim(),
                content: String(note?.content || note?.body || '').trim(),
                category: String(note?.category || 'Без категории').trim() || 'Без категории',
                isPinned: Boolean(note?.isPinned || note?.pinned),
                createdAt: Number(note?.createdAt || note?.created_at || Date.now()),
                updatedAt: Number(note?.updatedAt || note?.updated_at || note?.createdAt || Date.now()),
                checklist: normalizeChecklist(note?.checklist),
                tags: Array.isArray(note?.tags) ? note.tags : [],
                attachments: Array.isArray(note?.attachments) ? note.attachments : []
            });

            const normalizedNotes = useMemo(() => (Array.isArray(notes) ? notes : []).map(normalizeNote), [notes]);
            const categories = useMemo(() => {
                const custom = normalizedNotes.map(note => note.category).filter(Boolean);
                return [...new Set([...baseCategories, ...custom])];
            }, [normalizedNotes]);

            const showNoteToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(''), 1800);
            };

            const naturalDate = (timestamp) => {
                const value = Number(timestamp || Date.now());
                const date = new Date(value);
                const diff = Date.now() - value;
                if (diff < 60000) return 'Только что';
                if (diff < 3600000) return `${Math.max(1, Math.floor(diff / 60000))} мин назад`;
                const today = new Date();
                const yesterday = new Date();
                yesterday.setDate(today.getDate() - 1);
                const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
                const time = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                if (isSameDay(date, today)) return `Сегодня, ${time}`;
                if (isSameDay(date, yesterday)) return `Вчера, ${time}`;
                return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            };

            const categoryClass = (category) => {
                if (category === 'Работа') return 'nt-badge-work';
                if (category === 'Личные') return 'nt-badge-personal';
                if (category === 'Идеи') return 'nt-badge-idea';
                return 'nt-badge-empty';
            };

            const CategoryIcon = ({ category }) => {
                const IconComponent =
                    category === 'Все' ? Icons.List :
                    category === 'Работа' ? Icons.Wallet :
                    category === 'Личные' ? Icons.StickyNote :
                    category === 'Идеи' ? Icons.Sparkle :
                    Icons.Circle;
                return <IconComponent className="w-4 h-4" />;
            };

            const stripMarkdown = (text = '') => String(text)
                .replace(/\*\*([^*]+)\*\*/g, '$1')
                .replace(/__([^_]+)__/g, '$1')
                .replace(/(^|[\s(])_([^_\n]+)_/g, '$1$2')
                .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1$2')
                .replace(/^\s*[-*•]\s+/gm, '')
                .replace(/^\s*\d+\.\s+/gm, '')
                .trim();

            const renderInlineMarkdown = (text = '') => {
                const parts = [];
                const pattern = /(\*\*([^*]+)\*\*|__([^_]+)__|(^|[\s(])_([^_\n]+)_|(^|[\s(])\*([^*\n]+)\*)/g;
                let lastIndex = 0;
                let match;

                while ((match = pattern.exec(text)) !== null) {
                    if (match.index > lastIndex) parts.push(text.slice(lastIndex, match.index));
                    if (match[2] || match[3]) {
                        parts.push(<strong key={`b-${match.index}`}>{match[2] || match[3]}</strong>);
                    } else {
                        const prefix = match[4] || match[6] || '';
                        const value = match[5] || match[7] || '';
                        if (prefix) parts.push(prefix);
                        parts.push(<em key={`i-${match.index}`}>{value}</em>);
                    }
                    lastIndex = pattern.lastIndex;
                }

                if (lastIndex < text.length) parts.push(text.slice(lastIndex));
                return parts.length ? parts : text;
            };

            const renderNoteContent = (content = '') => {
                const lines = String(content).split('\n');
                const nodes = [];
                let listItems = [];
                const flushList = () => {
                    if (!listItems.length) return;
                    nodes.push(
                        <ul key={`list-${nodes.length}`}>
                            {listItems.map((item, index) => <li key={`${item}-${index}`}>{renderInlineMarkdown(item)}</li>)}
                        </ul>
                    );
                    listItems = [];
                };

                lines.forEach((line, index) => {
                    const trimmed = line.trim();
                    const bullet = trimmed.match(/^[-*•]\s+(.+)$/);
                    const numbered = trimmed.match(/^\d+\.\s+(.+)$/);
                    if (bullet || numbered) {
                        listItems.push((bullet?.[1] || numbered?.[1] || '').trim());
                        return;
                    }
                    flushList();
                    if (trimmed) {
                        nodes.push(<p key={`p-${index}`}>{renderInlineMarkdown(trimmed)}</p>);
                    }
                });
                flushList();

                return nodes.length ? nodes : <p>Текст пока пустой. Можно быстро добавить его через редактирование.</p>;
            };

            const previewText = (note) => {
                if (note.content) return stripMarkdown(note.content);
                if (note.checklist?.length) return note.checklist.map(item => `• ${item.text}`).join('\n');
                return 'Пустая заметка';
            };

            const filteredNotes = useMemo(() => {
                const q = query.trim().toLowerCase();
                const result = normalizedNotes.filter(note => {
                    const categoryOk = activeCategory === 'Все' || note.category === activeCategory;
                    const haystack = [
                        note.title,
                        note.content,
                        note.category,
                        ...(note.tags || []),
                        ...(note.checklist || []).map(item => item.text)
                    ].join(' ').toLowerCase();
                    return categoryOk && (!q || haystack.includes(q));
                });

                return result.sort((a, b) => {
                    if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
                    if (sortMode === 'oldest') return (a.updatedAt || a.createdAt) - (b.updatedAt || b.createdAt);
                    if (sortMode === 'title') return a.title.localeCompare(b.title, 'ru');
                    return (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt);
                });
            }, [normalizedNotes, activeCategory, query, sortMode]);

            const pinnedNotes = filteredNotes.filter(note => note.isPinned).slice(0, 3);
            const recentNotes = filteredNotes;
            const selectedNote = normalizedNotes.find(note => note.id === selectedId) || filteredNotes[0] || null;

            useEffect(() => {
                if (!selectedId && filteredNotes[0]) setSelectedId(filteredNotes[0].id);
                if (selectedId && !normalizedNotes.some(note => note.id === selectedId)) {
                    setSelectedId(filteredNotes[0]?.id || null);
                }
            }, [selectedId, filteredNotes, normalizedNotes]);

            const persistNote = (nextNote, message = 'Заметка сохранена') => {
                setNotes(prev => {
                    const safePrev = Array.isArray(prev) ? prev : [];
                    const exists = safePrev.some(note => String(note.id) === String(nextNote.id));
                    return exists
                        ? safePrev.map(note => String(note.id) === String(nextNote.id) ? { ...note, ...nextNote } : note)
                        : [nextNote, ...safePrev];
                });
                setSelectedId(nextNote.id);
                showNoteToast(message);
            };

            const openEditor = (note = null, preset = {}) => {
                const source = note ? normalizeNote(note) : null;
                setEditingNote(source);
                setNoteForm(source ? {
                    title: source.title,
                    content: source.content,
                    category: source.category,
                    isPinned: source.isPinned,
                    checklist: source.checklist
                } : {
                    title: preset.title || '',
                    content: preset.content || '',
                    category: activeCategory !== 'Все' ? activeCategory : 'Без категории',
                    isPinned: false,
                    checklist: []
                });
                setEditorOpen(true);
            };

            useEffect(() => {
                const onQuickNote = (event) => openEditor(null, event?.detail || {});
                const onToggleSearch = () => setMobileSearchOpen(prev => !prev);
                window.addEventListener('lifehub:add-note', onQuickNote);
                window.addEventListener('lifehub:toggle-notes-search', onToggleSearch);
                return () => {
                    window.removeEventListener('lifehub:add-note', onQuickNote);
                    window.removeEventListener('lifehub:toggle-notes-search', onToggleSearch);
                };
            }, []);

            const saveEditor = () => {
                const cleanChecklist = normalizeChecklist(noteForm.checklist);
                const cleanTitle = noteForm.title.trim() || noteForm.content.trim().split('\n')[0] || 'Без названия';
                if (!cleanTitle.trim() && !noteForm.content.trim() && cleanChecklist.length === 0) return;
                const now = Date.now();
                const nextNote = {
                    ...(editingNote || {}),
                    id: editingNote?.id || now.toString(),
                    title: cleanTitle.trim(),
                    content: noteForm.content.trim(),
                    category: noteForm.category || 'Без категории',
                    isPinned: Boolean(noteForm.isPinned),
                    checklist: cleanChecklist,
                    createdAt: editingNote?.createdAt || now,
                    updatedAt: now
                };
                persistNote(nextNote, editingNote ? 'Изменения сохранены' : 'Заметка создана');
                setEditorOpen(false);
            };

            const togglePin = (note, event) => {
                event?.stopPropagation?.();
                const source = normalizeNote(note);
                persistNote({ ...source, isPinned: !source.isPinned, updatedAt: Date.now() }, source.isPinned ? 'Заметка откреплена' : 'Заметка закреплена');
            };

            const toggleChecklist = (note, itemId) => {
                const source = normalizeNote(note);
                const nextChecklist = source.checklist.map(item => item.id === itemId ? { ...item, done: !item.done } : item);
                persistNote({ ...source, checklist: nextChecklist, updatedAt: Date.now() }, 'Чек-лист обновлён');
            };

            const deleteNote = () => {
                if (!deleteCandidate) return;
                const candidateId = String(deleteCandidate.id);
                setNotes(prev => (Array.isArray(prev) ? prev : []).filter(note => String(note.id) !== candidateId));
                setDeleteCandidate(null);
                setMenuNote(null);
                setEditorOpen(false);
                setEditingNote(null);
                setMobileDetailOpen(false);
                setSelectedId(filteredNotes.find(note => note.id !== candidateId)?.id || null);
                showNoteToast('Заметка удалена');
            };

            const appendContent = (snippet) => {
                setNoteForm(prev => ({
                    ...prev,
                    content: prev.content ? `${prev.content}\n${snippet}` : snippet
                }));
            };

            const addChecklistItem = () => {
                setNoteForm(prev => ({
                    ...prev,
                    checklist: [...prev.checklist, { id: `${Date.now()}-${prev.checklist.length}`, text: '', done: false }]
                }));
            };

            const updateChecklistItem = (id, patch) => {
                setNoteForm(prev => ({
                    ...prev,
                    checklist: prev.checklist.map(item => item.id === id ? { ...item, ...patch } : item)
                }));
            };

            const removeChecklistItem = (id) => {
                setNoteForm(prev => ({
                    ...prev,
                    checklist: prev.checklist.filter(item => item.id !== id)
                }));
            };

            const openNote = (note) => {
                setSelectedId(note.id);
                setMobileDetailOpen(true);
            };

            const NoteCard = ({ note, index }) => (
                <div
                    role="button"
                    tabIndex={0}
                    onClick={() => openNote(note)}
                    onKeyDown={(event) => event.key === 'Enter' && openNote(note)}
                    className={`nt-note-card nt-tint-${index % 3}`}
                >
                    <div>
                        <div className="nt-card-top">
                            <h3 className="nt-note-title">{stripMarkdown(note.title) || 'Без названия'}</h3>
                            <button onClick={(event) => togglePin(note, event)} className={`nt-pin ${note.isPinned ? 'is-active' : ''}`} aria-label={note.isPinned ? 'Открепить заметку' : 'Закрепить заметку'}>
                                <Icons.Pin className="w-4 h-4" />
                            </button>
                        </div>
                        <p className="nt-preview">{previewText(note)}</p>
                    </div>
                    <div className="nt-meta">
                        <span>{naturalDate(note.updatedAt)}</span>
                        <span className={`nt-badge ${categoryClass(note.category)}`}>{note.category}</span>
                    </div>
                </div>
            );

            const NoteRow = ({ note }) => (
                <div
                    role="button"
                    tabIndex={0}
                    onClick={() => openNote(note)}
                    onKeyDown={(event) => event.key === 'Enter' && openNote(note)}
                    className={`nt-note-row ${selectedNote?.id === note.id ? 'is-active' : ''}`}
                >
                    <div className="nt-row-icon">
                        <Icons.StickyNote className="w-4 h-4" />
                    </div>
                    <div className="min-w-0">
                        <div className="nt-row-top">
                            <h3 className="nt-note-title truncate">{stripMarkdown(note.title) || 'Без названия'}</h3>
                        </div>
                        <p className="nt-preview">{previewText(note)}</p>
                        <div className="nt-meta mt-2 md:hidden">
                            <span className={`nt-badge ${categoryClass(note.category)}`}>{note.category}</span>
                            <span>{naturalDate(note.updatedAt)}</span>
                        </div>
                    </div>
                    <div className="nt-row-action">
                        <div className="nt-meta hidden md:flex">
                            <span className={`nt-badge ${categoryClass(note.category)}`}>{note.category}</span>
                            <span>{naturalDate(note.updatedAt)}</span>
                        </div>
                        <button onClick={(event) => togglePin(note, event)} className={`nt-pin ${note.isPinned ? 'is-active' : ''}`} aria-label={note.isPinned ? 'Открепить заметку' : 'Закрепить заметку'}>
                            <Icons.Pin className="w-4 h-4" />
                        </button>
                    </div>
                </div>
            );

            const NoteDetail = ({ note, mobile = false }) => {
                if (!note) {
                    return (
                        <div className="nt-detail-placeholder">
                            <div className="nt-empty-icon"><Icons.StickyNote className="w-7 h-7" /></div>
                            <h3 className="mt-4 font-black text-slate-900">Выберите заметку</h3>
                            <p className="mt-2 text-sm font-semibold max-w-[220px]">Содержимое появится здесь, без лишнего шума.</p>
                        </div>
                    );
                }

                return (
                    <div className="nt-detail-body">
                        <div className="nt-detail-top">
                            {mobile && (
                                <button onClick={() => setMobileDetailOpen(false)} className="nt-icon-btn" aria-label="Назад к списку">
                                    <Icons.ChevronLeft className="w-4 h-4" />
                                </button>
                            )}
                            <div className="min-w-0">
                                <h2 className="nt-detail-title">{stripMarkdown(note.title) || 'Без названия'}</h2>
                                <div className="nt-meta mt-3">
                                    <span className={`nt-badge ${categoryClass(note.category)}`}>{note.category}</span>
                                    <span>{naturalDate(note.updatedAt)}</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {!mobile && (
                                    <button onClick={(event) => togglePin(note, event)} className={`nt-pin ${note.isPinned ? 'is-active' : ''}`} aria-label={note.isPinned ? 'Открепить заметку' : 'Закрепить заметку'}>
                                        <Icons.Pin className="w-4 h-4" />
                                    </button>
                                )}
                                <button onClick={() => setMenuNote(note)} className="nt-icon-btn" aria-label="Действия с заметкой">
                                    <Icons.Ellipsis className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        {note.checklist?.length > 0 && (
                            <div className="nt-detail-section">
                                <h4>Задачи</h4>
                                <div className="nt-checklist">
                                    {note.checklist.map(item => (
                                        <label key={item.id} className="nt-check">
                                            <input type="checkbox" checked={item.done} onChange={() => toggleChecklist(note, item.id)} />
                                            <span className={item.done ? 'line-through text-slate-400' : ''}>{item.text}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="nt-detail-section">
                            <h4>Заметки</h4>
                            <div className="nt-content-flow">{renderNoteContent(note.content)}</div>
                        </div>

                        {note.attachments?.length > 0 && (
                            <div className="nt-detail-section">
                                <h4>Файлы</h4>
                                <div className="space-y-2">
                                    {note.attachments.map((file, index) => (
                                        <div key={`${file.name || 'file'}-${index}`} className="nt-ghost-btn justify-start px-3">
                                            <Icons.StickyNote className="w-4 h-4" />
                                            <span className="truncate">{file.name || 'Вложение'}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="nt-detail-actions">
                            <button onClick={() => openEditor(note)} className="nt-secondary-btn px-4 self-start">
                                <Icons.Pencil className="w-4 h-4" />
                                Редактировать
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="nt-page animate-fadeIn">
                    <div className={`nt-search-row ${mobileSearchOpen ? 'is-open' : ''}`}>
                        <label className="nt-search" aria-label="Поиск заметок">
                            <Icons.Search className="w-5 h-5 text-slate-400" />
                            <input value={query} onChange={event => setQuery(event.target.value)} placeholder="Поиск заметок..." />
                            {query && (
                                <button onClick={() => setQuery('')} className="nt-icon-btn !w-8 !h-8" type="button" aria-label="Очистить поиск">
                                    <Icons.X className="w-4 h-4" />
                                </button>
                            )}
                        </label>
                        <select value={sortMode} onChange={event => setSortMode(event.target.value)} className="nt-sort" aria-label="Сортировка заметок">
                            <option value="recent">Последние</option>
                            <option value="oldest">Сначала старые</option>
                            <option value="title">По названию</option>
                        </select>
                    </div>

                    <div className="nt-filter-line">
                        <div className="nt-filter-wrap">
                            <button
                                onClick={() => setCategoryMenuOpen(prev => !prev)}
                                className="nt-filter-button"
                                aria-haspopup="menu"
                                aria-expanded={categoryMenuOpen}
                            >
                                <Icons.Filter className="w-4 h-4" />
                                Фильтр: <strong>{activeCategory}</strong>
                                <Icons.ChevronRight className={`w-4 h-4 transition-transform ${categoryMenuOpen ? 'rotate-90' : ''}`} />
                            </button>
                            {categoryMenuOpen && (
                                <div className="nt-filter-menu" role="menu">
                                    {categories.map(category => (
                                        <button
                                            key={category}
                                            onClick={() => {
                                                setActiveCategory(category);
                                                setCategoryMenuOpen(false);
                                            }}
                                            className={`nt-filter-option ${activeCategory === category ? 'is-active' : ''}`}
                                            role="menuitem"
                                        >
                                            <span className="nt-filter-option-label">
                                                <CategoryIcon category={category} />
                                                {category}
                                            </span>
                                            {activeCategory === category && <Icons.Check className="w-4 h-4" />}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {normalizedNotes.length === 0 ? (
                        <div className="nt-empty">
                            <div className="nt-empty-icon"><Icons.StickyNote className="w-7 h-7" /></div>
                            <h3>Здесь будут ваши заметки</h3>
                            <p>Записывайте мысли, идеи и важную информацию — LifeHub аккуратно соберёт их в одном месте.</p>
                            <button onClick={() => openEditor()} className="nt-add-btn mt-5">
                                <Icons.Plus className="w-4 h-4" />
                                <span>Создать заметку</span>
                            </button>
                        </div>
                    ) : filteredNotes.length === 0 ? (
                        <div className="nt-empty">
                            <div className="nt-empty-icon"><Icons.Search className="w-7 h-7" /></div>
                            <h3>Ничего не найдено</h3>
                            <p>По запросу «{query || activeCategory}» нет заметок. Попробуйте изменить фильтр.</p>
                            <button onClick={() => { setQuery(''); setActiveCategory('Все'); }} className="nt-secondary-btn mt-5 px-5">
                                Очистить поиск
                            </button>
                        </div>
                    ) : (
                        <div className="nt-layout">
                            <main className="nt-main">
                                {pinnedNotes.length > 0 && (
                                    <section className="nt-panel">
                                        <div className="nt-section-head">
                                            <div>
                                                <p className="nt-section-kicker">Закреплённые</p>
                                                <h2 className="nt-section-title">Важное под рукой</h2>
                                            </div>
                                            <button onClick={() => setActiveCategory('Все')} className="nt-section-link">Все →</button>
                                        </div>
                                        <div className="nt-pinned-grid">
                                            {pinnedNotes.map((note, index) => <NoteCard key={note.id} note={note} index={index} />)}
                                        </div>
                                    </section>
                                )}

                                <section className="nt-panel">
                                    <div className="nt-section-head">
                                        <div>
                                            <p className="nt-section-kicker">Недавние заметки</p>
                                            <h2 className="nt-section-title">Последние записи</h2>
                                        </div>
                                    </div>
                                    <div className="nt-row-list">
                                        {recentNotes.map(note => <NoteRow key={note.id} note={note} />)}
                                    </div>
                                </section>
                            </main>

                            <aside className="nt-detail">
                                <NoteDetail note={selectedNote} />
                            </aside>
                        </div>
                    )}

                    {selectedNote && mobileDetailOpen && (
                        <div className="nt-mobile-detail">
                            <div className="nt-mobile-detail-card">
                                <NoteDetail note={selectedNote} mobile />
                            </div>
                        </div>
                    )}

                    {editorOpen && (
                        <div className="nt-overlay">
                            <div className="absolute inset-0" onClick={() => setEditorOpen(false)} />
                            <div className="nt-editor-sheet relative animate-slideUp">
                                <div className="nt-editor-head">
                                    <h2 className="nt-editor-title">{editingNote ? 'Редактировать заметку' : 'Новая заметка'}</h2>
                                    <button onClick={() => setEditorOpen(false)} className="nt-icon-btn" aria-label="Закрыть редактор">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="nt-form-grid">
                                    <div className="nt-field">
                                        <label>Название</label>
                                        <input value={noteForm.title} onChange={event => setNoteForm(prev => ({ ...prev, title: event.target.value }))} placeholder="Название заметки" autoFocus />
                                    </div>
                                    <div className="nt-field">
                                        <label>Категория</label>
                                        <select value={noteForm.category} onChange={event => setNoteForm(prev => ({ ...prev, category: event.target.value }))}>
                                            {categories.filter(category => category !== 'Все').map(category => (
                                                <option key={category} value={category}>{category}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="nt-editor-tools">
                                    <button className="nt-tool-btn" onClick={() => appendContent('**важный текст**')} type="button">Bold</button>
                                    <button className="nt-tool-btn" onClick={() => appendContent('_акцент_')} type="button">Italic</button>
                                    <button className="nt-tool-btn" onClick={() => appendContent('• пункт списка')} type="button">Список</button>
                                    <button className="nt-tool-btn" onClick={addChecklistItem} type="button">+ Чек-лист</button>
                                </div>

                                <div className="nt-field">
                                    <label>Содержание</label>
                                    <textarea value={noteForm.content} onChange={event => setNoteForm(prev => ({ ...prev, content: event.target.value }))} placeholder="Запишите мысль, идею или план..." />
                                </div>

                                <div className="nt-field mt-3">
                                    <label>Чек-лист</label>
                                    {noteForm.checklist.length === 0 ? (
                                        <button onClick={addChecklistItem} className="nt-ghost-btn justify-start px-4" type="button">
                                            <Icons.Plus className="w-4 h-4" />
                                            Добавить пункт
                                        </button>
                                    ) : (
                                        <div className="nt-check-editor">
                                            {noteForm.checklist.map(item => (
                                                <div key={item.id} className="nt-check-edit-row">
                                                    <input type="checkbox" checked={item.done} onChange={event => updateChecklistItem(item.id, { done: event.target.checked })} />
                                                    <input type="text" value={item.text} onChange={event => updateChecklistItem(item.id, { text: event.target.value })} onKeyDown={event => event.key === 'Enter' && addChecklistItem()} placeholder="Пункт чек-листа" />
                                                    <button onClick={() => removeChecklistItem(item.id)} className="nt-icon-btn !w-8 !h-8" type="button" aria-label="Удалить пункт">
                                                        <Icons.X className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            ))}
                                            <button onClick={addChecklistItem} className="nt-secondary-btn px-4 self-start" type="button">
                                                <Icons.Plus className="w-4 h-4" />
                                                Добавить пункт
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <label className="nt-check mt-4">
                                    <input type="checkbox" checked={noteForm.isPinned} onChange={event => setNoteForm(prev => ({ ...prev, isPinned: event.target.checked }))} />
                                    Закрепить заметку
                                </label>

                                <div className="nt-editor-actions">
                                    {editingNote && (
                                        <button onClick={() => setDeleteCandidate(editingNote)} className="nt-danger-btn px-4" type="button">
                                            <Icons.Trash className="w-4 h-4" />
                                            Удалить
                                        </button>
                                    )}
                                    <button onClick={() => setEditorOpen(false)} className="nt-ghost-btn px-4" type="button">Отмена</button>
                                    <button onClick={saveEditor} className="nt-save-btn" type="button">Готово</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteCandidate && (
                        <div className="nt-overlay">
                            <div className="absolute inset-0" onClick={() => setDeleteCandidate(null)} />
                            <div className="nt-confirm-card relative animate-slideUp">
                                <h3>Удалить заметку?</h3>
                                <p>Заметка будет удалена. Это действие нельзя отменить.</p>
                                <div className="nt-confirm-actions">
                                    <button onClick={() => setDeleteCandidate(null)} className="nt-ghost-btn px-4">Отмена</button>
                                    <button onClick={deleteNote} className="nt-danger-btn px-4">Удалить</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {menuNote && (
                        <div className="nt-overlay">
                            <div className="absolute inset-0" onClick={() => setMenuNote(null)} />
                            <div className="nt-confirm-card nt-menu-card relative animate-slideUp">
                                <div className="flex items-start justify-between gap-3">
                                    <div>
                                        <h3>{stripMarkdown(menuNote.title) || 'Без названия'}</h3>
                                        <p>{menuNote.category || 'Без категории'} · {naturalDate(menuNote.updatedAt)}</p>
                                    </div>
                                    <button onClick={() => setMenuNote(null)} className="nt-icon-btn" aria-label="Закрыть меню">
                                        <Icons.X className="w-4 h-4" />
                                    </button>
                                </div>
                                <div className="nt-menu-actions">
                                    <button onClick={() => { openEditor(menuNote); setMenuNote(null); }} className="nt-secondary-btn justify-start px-4">
                                        <Icons.Pencil className="w-4 h-4" />
                                        Редактировать
                                    </button>
                                    <button onClick={(event) => { togglePin(menuNote, event); setMenuNote(null); }} className="nt-ghost-btn justify-start px-4">
                                        <Icons.Pin className="w-4 h-4" />
                                        {menuNote.isPinned ? 'Открепить' : 'Закрепить'}
                                    </button>
                                    <div className="nt-menu-cats">
                                        {categories.filter(category => category !== 'Все').map(category => (
                                            <button
                                                key={category}
                                                onClick={() => {
                                                    persistNote({ ...normalizeNote(menuNote), category, updatedAt: Date.now() }, 'Категория изменена');
                                                    setMenuNote(null);
                                                }}
                                                className={`nt-chip ${menuNote.category === category ? 'is-active' : ''}`}
                                            >
                                                {category}
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={() => { setDeleteCandidate(menuNote); setMenuNote(null); }} className="nt-danger-subtle">
                                        <Icons.Trash className="w-4 h-4" />
                                        Удалить заметку
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <div className="nt-toast">{toast}</div>}
                </div>
            );
        };

        // --- Birthdays Tab (События → напоминания о Днях рождения) ---
        // Сохраняем компонент в кодовой базе, но также используем его как встроенный менеджер (embedded) на Главной.
        const EventsTab = ({ embedded = false } = {}) => {
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            const weekdayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            const eventCategories = [
                { id: 'all', label: 'Все', color: '#0a7a52', soft: '#eef8f2', icon: Icons.Calendar },
                { id: 'work', label: 'Работа', color: '#3b82f6', soft: '#eef5ff', icon: Icons.Calendar },
                { id: 'personal', label: 'Личное', color: '#ef7462', soft: '#fff1ee', icon: Icons.Gift },
                { id: 'health', label: 'Здоровье', color: '#10b981', soft: '#eef8f2', icon: Icons.CheckCircle },
                { id: 'study', label: 'Учёба', color: '#8b5cf6', soft: '#f4efff', icon: Icons.List },
            ];
            const categoryById = useMemo(() => Object.fromEntries(eventCategories.map(cat => [cat.id, cat])), []);

            const [events, setEvents] = useLocalStorage('lifehub_birthdays', []);

            const today = useMemo(() => {
                const d = new Date();
                return new Date(d.getFullYear(), d.getMonth(), d.getDate());
            }, []);

            const [viewMonth, setViewMonth] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
            const [selectedDate, setSelectedDate] = useState(() => today);
            const [activeCategory, setActiveCategory] = useState('all');
            const [eventFilterOpen, setEventFilterOpen] = useState(false);
            const [isModalOpen, setModalOpen] = useState(false);
            const [selectedEventId, setSelectedEventId] = useState(null);
            const [editingEvent, setEditingEvent] = useState(null);
            const [validation, setValidation] = useState({});
            const [showEventDetailsFields, setShowEventDetailsFields] = useState(false);
            const [form, setForm] = useState(() => ({
                title: '', date: formatDateKey(today), time: '09:00', endTime: '', allDay: false,
                category: 'personal', description: '', location: '', onlineUrl: '', participants: '', agenda: '', reminder: 'none', recurrence: 'none'
            }));

            const startOfDayLocal = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const isSameDayLocal = (a, b) => a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
            const safeDate = (year, monthIndex, day) => {
                const d = new Date(year, monthIndex, day);
                if (d.getMonth() !== monthIndex) return new Date(year, monthIndex + 1, 0);
                return d;
            };
            const eventDate = (event, yearOverride = null) => {
                if (event?.dateKey) return parseDateKey(event.dateKey);
                if (event?.date) return parseDateKey(event.date);
                const year = yearOverride || event?.year || selectedDate.getFullYear();
                return safeDate(Number(year), Number(event?.month || 1) - 1, Number(event?.day || 1));
            };
            const getEventTitle = (event) => event?.title || event?.name || 'Событие';
            const getEventCategory = (event) => event?.category || (event?.name && !event?.title ? 'personal' : 'work');
            const getCategory = (eventOrId) => categoryById[typeof eventOrId === 'string' ? eventOrId : getEventCategory(eventOrId)] || categoryById.personal;
            const formatEventTime = (event) => {
                if (event?.allDay) return 'Весь день';
                if (event?.time && event?.endTime) return `${event.time} – ${event.endTime}`;
                if (event?.time) return event.time;
                return 'Без времени';
            };
            const formatFullDate = (date) => date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'long' });
            const formatShortDate = (date) => date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            const selectedKey = formatDateKey(selectedDate);

            const normalizedEvents = useMemo(() => {
                return (events || []).map(event => {
                    const date = eventDate(event, today.getFullYear());
                    return {
                        ...event,
                        id: event.id || `${event.name || event.title}-${event.day}-${event.month}`,
                        _date: date,
                        _dateKey: formatDateKey(date),
                        _title: getEventTitle(event),
                        _category: getEventCategory(event),
                    };
                }).sort((a, b) => a._date.getTime() - b._date.getTime() || String(a.time || '').localeCompare(String(b.time || '')));
            }, [events, today]);

            const filteredEvents = useMemo(() => {
                return normalizedEvents.filter(event => activeCategory === 'all' || event._category === activeCategory);
            }, [normalizedEvents, activeCategory]);

            const eventsByDay = useMemo(() => {
                const map = {};
                filteredEvents.forEach(event => {
                    map[event._dateKey] = map[event._dateKey] || [];
                    map[event._dateKey].push(event);
                });
                return map;
            }, [filteredEvents]);

            const selectedDayEvents = useMemo(() => {
                return (eventsByDay[selectedKey] || []).sort((a, b) => (a.allDay ? -1 : 0) - (b.allDay ? -1 : 0) || String(a.time || '99:99').localeCompare(String(b.time || '99:99')));
            }, [eventsByDay, selectedKey]);

            const upcomingEvents = useMemo(() => {
                const today0 = startOfDayLocal(today);
                return filteredEvents.filter(event => event._date >= today0).slice(0, 5);
            }, [filteredEvents, today]);

            const selectedEvent = useMemo(() => {
                return normalizedEvents.find(event => event.id === selectedEventId) || selectedDayEvents[0] || upcomingEvents[0] || null;
            }, [normalizedEvents, selectedEventId, selectedDayEvents, upcomingEvents]);

            const calendarCells = useMemo(() => {
                const first = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
                const firstWeekday = (first.getDay() + 6) % 7;
                const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
                const cells = [];
                for (let i = 0; i < firstWeekday; i++) cells.push({ key: `empty-${i}`, empty: true });
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
                    const key = formatDateKey(date);
                    cells.push({ key, day, date, events: eventsByDay[key] || [] });
                }
                return cells;
            }, [viewMonth, eventsByDay]);

            const agendaItems = useMemo(() => {
                if (!selectedEvent?.agenda) return [];
                if (Array.isArray(selectedEvent.agenda)) return selectedEvent.agenda.map(item => typeof item === 'string' ? { text: item, done: false } : item);
                return String(selectedEvent.agenda).split('\n').map(text => text.trim()).filter(Boolean).map(text => ({ text, done: false }));
            }, [selectedEvent]);
            const participants = useMemo(() => {
                if (!selectedEvent?.participants) return [];
                return Array.isArray(selectedEvent.participants) ? selectedEvent.participants : String(selectedEvent.participants).split(',').map(x => x.trim()).filter(Boolean);
            }, [selectedEvent]);
            const selectedHasConflict = useMemo(() => {
                const timed = selectedDayEvents.filter(event => event.time && event.endTime && !event.allDay).map(event => ({
                    id: event.id,
                    start: Number(String(event.time).replace(':', '')),
                    end: Number(String(event.endTime).replace(':', '')),
                }));
                return timed.some((a, index) => timed.slice(index + 1).some(b => a.start < b.end && b.start < a.end));
            }, [selectedDayEvents]);

            const goPrevMonth = () => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1));
            const goNextMonth = () => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1));
            const goToday = () => { setSelectedDate(today); setViewMonth(new Date(today.getFullYear(), today.getMonth(), 1)); };
            const selectDay = (date) => {
                setSelectedDate(date);
                const dayEvents = eventsByDay[formatDateKey(date)] || [];
                setSelectedEventId(dayEvents[0]?.id || null);
                if (window.matchMedia('(max-width: 1023px)').matches) {
                    window.requestAnimationFrame(() => document.querySelector('.ev-selected-list')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
                }
            };

            const openAdd = (presetDate = selectedDate) => {
                setEditingEvent(null);
                setSelectedEventId(null);
                setValidation({});
                setShowEventDetailsFields(false);
                setForm({
                    title: '', date: formatDateKey(presetDate), time: '', endTime: '', allDay: false,
                    category: activeCategory === 'all' ? 'personal' : activeCategory,
                    description: '', location: '', onlineUrl: '', participants: '', agenda: '', reminder: 'none', recurrence: 'none'
                });
                setModalOpen(true);
            };

            useEffect(() => {
                const onQuickEvent = () => openAdd(selectedDate);
                window.addEventListener('lifehub:add-event', onQuickEvent);
                return () => window.removeEventListener('lifehub:add-event', onQuickEvent);
            }, [selectedDate, activeCategory]);

            const openEdit = (event) => {
                setEditingEvent(event);
                setSelectedEventId(event.id);
                setValidation({});
                setShowEventDetailsFields(Boolean(event.description || event.note || event.location || event.onlineUrl || event.participants?.length || event.agenda?.length));
                const date = eventDate(event, today.getFullYear());
                setForm({
                    title: getEventTitle(event),
                    date: formatDateKey(date),
                    time: event.time || '',
                    endTime: event.endTime || '',
                    allDay: Boolean(event.allDay),
                    category: getEventCategory(event),
