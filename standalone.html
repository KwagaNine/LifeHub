            const openQuickMenu = useCallback(() => {
                setSearchOpen(false);
                setMoreMenuOpen(false);
                setQuickMenuOpen(prev => !prev);
            }, []);

            const openSearch = useCallback(() => {
                setMoreMenuOpen(false);
                setQuickMenuOpen(false);
                setSearchOpen(true);
            }, []);
            const openMoreMenu = useCallback(() => {
                setSearchOpen(false);
                setQuickMenuOpen(false);
                setMoreMenuOpen(prev => !prev);
            }, []);

            const openLocalAdd = useCallback(() => {
                if (activeTab === 'notes') {
                    closeActionOverlays();
                    window.dispatchEvent(new CustomEvent('lifehub:add-note'));
                    return;
                }
                if (activeTab === 'goals') {
                    closeActionOverlays();
                    window.dispatchEvent(new CustomEvent('lifehub:add-goal'));
                    return;
                }
                openQuickMenu();
            }, [activeTab, closeActionOverlays, openQuickMenu]);

            const openLocalSearch = useCallback(() => {
                if (activeTab === 'notes' && window.innerWidth < 768) {
                    closeActionOverlays();
                    window.dispatchEvent(new CustomEvent('lifehub:toggle-notes-search'));
                    return;
                }
                openSearch();
            }, [activeTab, closeActionOverlays, openSearch]);

            useEffect(() => {
                const getScrollableParent = (startNode) => {
                    let node = startNode instanceof Element ? startNode : null;
                    while (node && node !== document.body && node !== document.documentElement) {
                        const style = getComputedStyle(node);
                        const canScroll = /(auto|scroll)/.test(style.overflowY) && node.scrollHeight > node.clientHeight;
                        if (canScroll) return node;
                        node = node.parentElement;
                    }
                    return null;
                };

                const getMainScrollTarget = (eventTarget) => {
                    const nestedScroll = getScrollableParent(eventTarget);
                    if (nestedScroll) return nestedScroll;

                    const appShell = document.querySelector('.app-container.lh-app-shell');
                    if (appShell && appShell.scrollHeight > appShell.clientHeight) return appShell;

                    return document.scrollingElement || document.documentElement;
                };

                const onWheelScrollFallback = (event) => {
                    if (!event.deltaY || event.ctrlKey) return;
                    const target = event.target instanceof Element ? event.target : null;
                    if (target?.closest('input, textarea, select, [contenteditable="true"]')) return;
                    if (target?.closest('.modal-overlay') && !target.closest('.lh-action-backdrop')) return;

                    const scrollTarget = getMainScrollTarget(target);
                    if (!scrollTarget) return;
                    const delta = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
                    event.preventDefault();

                    if (scrollTarget === document.documentElement || scrollTarget === document.body || scrollTarget === document.scrollingElement) {
                        window.scrollBy({ top: delta, left: 0, behavior: 'auto' });
                    } else {
                        scrollTarget.scrollTop += delta;
                    }
                };

                window.addEventListener('wheel', onWheelScrollFallback, { passive: false, capture: true });
                return () => window.removeEventListener('wheel', onWheelScrollFallback, { capture: true });
            }, []);

            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const profileName = tgUser?.first_name || tgUser?.username || 'Профиль';
            const profileInitials = String(profileName).slice(0, 2).toUpperCase();
            const toggleTheme = useCallback(() => {
                updateKey('theme', data?.theme === 'dark' ? 'light' : 'dark');
            }, [data?.theme, updateKey]);

            const searchResults = useMemo(() => {
                const query = String(searchQuery || '').trim().toLowerCase();
                const items = [];
                const addItem = (tab, icon, title, subtitle, text) => {
                    items.push({ tab, icon, title, subtitle, text: String(text || `${title} ${subtitle}`).toLowerCase() });
                };

                (data?.transactions || []).forEach(item => addItem('budget', Icons.Wallet, item.title || item.category || 'Операция', currency(item.amount || 0), `${item.title} ${item.category} ${item.type}`));
                (data?.bills || []).forEach(item => addItem('budget', Icons.Wallet, item.title || 'Платёж', currency(item.amount || 0), `${item.title} ${item.amount}`));
                (data?.notes || []).forEach(item => addItem('notes', Icons.StickyNote, item.title || 'Заметка', item.content || 'Заметки', `${item.title} ${item.content}`));
                (data?.birthdays || []).forEach(item => addItem('events', Icons.Calendar, item.name || 'Событие', item.note || 'Дата', `${item.name} ${item.note}`));
                (data?.goals || []).forEach(item => addItem('goals', Icons.Target, item.title || 'Финансовая цель', currency(item.targetAmount || 0), `${item.title} ${item.targetAmount}`));
                (data?.life_goals || []).forEach(item => addItem('goals', Icons.CheckCircle, item.title || 'Цель', item.done ? 'Выполнено' : 'В процессе', item.title));
                (data?.supplies || []).forEach(item => addItem('supplies', Icons.Package, item.name || 'Товар', item.category || 'Дом', `${item.name} ${item.category}`));

                if (!query) return items.slice(0, 6);
                return items.filter(item => item.text.includes(query)).slice(0, 8);
            }, [data, searchQuery]);

            // Global theme sync (applies to all tabs)
            useEffect(() => {
                try {
                    const t = (data && data.theme) ? String(data.theme) : 'light';
                    const root = document.documentElement;
                    if (t === 'dark') root.classList.add('dark');
                    else root.classList.remove('dark');

                    // Keep head preloader in sync (for next app start, to avoid theme flash)
                    try { localStorage.setItem('lifehub_theme', JSON.stringify(t)); } catch (e) {}
                } catch (e) {}
            }, [data?.theme]);

            useEffect(() => {
                const onKeyDown = (event) => {
                    if (event.key === 'Escape') closeActionOverlays();
                    if ((event.metaKey || event.ctrlKey) && String(event.key).toLowerCase() === 'k') {
                        event.preventDefault();
                        openSearch();
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [closeActionOverlays, openSearch]);

            // Показываем лоадер пока данные загружаются из Supabase
            if (loading) {
                return (
                    <div className="min-h-screen lh-bg p-4 lg:p-8">
                        <div className="max-w-6xl mx-auto grid gap-4 lg:grid-cols-[220px_1fr]">
                            <div className="hidden lg:block lh-skeleton-card bg-white rounded-3xl border border-slate-100 p-5">
                                <div className="lh-skeleton-line w-28 mb-8" />
                                <div className="space-y-3">
                                    <div className="lh-skeleton-line w-full" />
                                    <div className="lh-skeleton-line w-10/12" />
                                    <div className="lh-skeleton-line w-11/12" />
                                </div>
                            </div>
                            <div className="space-y-4">
                                <div className="lh-skeleton-card bg-white rounded-3xl border border-slate-100 p-5">
                                    <div className="lh-skeleton-line w-52 mb-3" />
                                    <div className="lh-skeleton-line w-72" />
                                </div>
                                <div className="grid gap-4 md:grid-cols-3">
                                    <div className="lh-skeleton-card bg-white rounded-3xl border border-slate-100 p-5" />
                                    <div className="lh-skeleton-card bg-white rounded-3xl border border-slate-100 p-5" />
                                    <div className="lh-skeleton-card bg-white rounded-3xl border border-slate-100 p-5" />
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const pageTitles = {
                home: 'Главная',
                budget: 'Финансы',
                events: 'События',
                notes: 'Заметки',
                goals: 'Цели',
                supplies: 'Дом'
            };
            const pageSubtitles = {
                notes: 'Мысли, списки и идеи — в одном спокойном месте.',
                goals: 'Большие цели становятся понятными маленькими шагами.'
            };

            const primaryTabs = [
                { id: 'home', icon: Icons.Home, label: 'Главная' },
                { id: 'budget', icon: Icons.Wallet, label: 'Финансы' },
                { id: 'events', icon: Icons.Calendar, label: 'События' },
                { id: 'notes', icon: Icons.StickyNote, label: 'Заметки' },
                { id: 'goals', icon: Icons.Target, label: 'Цели' },
            ];
            const bottomTabs = [
                { id: 'home', icon: Icons.Home, label: 'Главная' },
                { id: 'budget', icon: Icons.Wallet, label: 'Финансы' },
                { id: 'events', icon: Icons.Calendar, label: 'События' },
                { id: 'notes', icon: Icons.StickyNote, label: 'Заметки' },
                { id: 'more', icon: Icons.Ellipsis, label: 'Ещё' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'home': return <SuperDashboard onNavigate={setActiveTab} />;
                    case 'budget': return <BudgetTab />;
                    case 'events': return <EventsTab />;
                    case 'notes': return <NotesTab />;
                    case 'goals': return <GoalsTab />;
                    case 'supplies': return <SuppliesTab />;
                    default: return <HomeTab />;
                }
            };

            const runQuickAction = (tabId, eventName, detail = {}) => {
                setActiveTab(tabId);
                setQuickMenuOpen(false);
                setTimeout(() => window.dispatchEvent(new CustomEvent(eventName, { detail })), 80);
            };

            return (
                <ErrorBoundary>
                    <div className="app-container lh-bg lh-app-shell">
                        <aside className="lh-desktop-sidebar">
                            <div className="lh-brand">Life<span>Hub</span><i /></div>
                            <nav className="lh-side-nav">
                                {primaryTabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    const TabIcon = tab.icon;
                                    return (
                                        <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`lh-side-item ${isActive ? 'is-active' : ''}`}>
                                            <TabIcon className="w-5 h-5" />
                                            {tab.label}
                                        </button>
                                    );
                                })}
                                <button onClick={() => setActiveTab('supplies')} className={`lh-side-item ${activeTab === 'supplies' ? 'is-active' : ''}`}>
                                    <Icons.Package className="w-5 h-5" />
                                    Дом
                                </button>
                                <div className="lh-side-separator" />
                                <button onClick={() => setActiveTab('goals')} className="lh-side-item">
                                    <Icons.Moon className="w-5 h-5" />
                                    Фокус
                                </button>
                                <button onClick={toggleTheme} className="lh-side-item">
                                    <Icons.Wand className="w-5 h-5" />
                                    Настройки
                                </button>
                            </nav>
                            <div className="lh-sidebar-card">
                                <p className="text-xs font-black uppercase tracking-widest text-blue-600">LifeHub Pro</p>
                                <p className="text-sm font-bold text-slate-700 mt-2">Порядок в финансах, целях и событиях каждый день.</p>
                                <button className="mt-3 w-full h-10 rounded-xl bg-blue-600 text-white text-sm font-extrabold">Настроить</button>
                            </div>
                            <div className="lh-profile-row">
                                <div className="lh-avatar">L</div>
                                <div className="min-w-0">
                                    <p className="font-extrabold text-sm text-slate-800 truncate">Профиль</p>
                                    <p className="text-xs text-slate-400 truncate">User {USER_ID}</p>
                                </div>
                            </div>
                        </aside>

                        {/* Sync Status Indicator */}
                        <SyncIndicator />
                        
                        {/* Debug Panel (можно убрать в продакшене) */}
                        <DebugPanel />
                        
                        {/* Scrollable content area - ends BEFORE navbar */}
                        <main className="app-content w-full max-w-md mx-auto px-4 sm:px-5 edge-to-edge">
                            <div className="lh-mobile-header">
                                <div>
                                    <h1 className="lh-mobile-title">{pageTitles[activeTab] || 'Главная'}</h1>
                                </div>
                                <div className="lh-mobile-actions">
                                    {activeTab === 'notes' && (
                                        <button onClick={openLocalSearch} className="lh-icon-btn" title="Поиск заметок">
                                            <Icons.Search className="w-5 h-5" />
                                        </button>
                                    )}
                                    <button onClick={openLocalAdd} className="lh-primary-btn w-12 px-0 justify-center">
                                        <Icons.Plus className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>

                            <div className="lh-desktop-topbar">
                                {activeTab === 'home' ? (
                                    <button onClick={openSearch} className="lh-search lh-search-wide" title="Поиск по LifeHub">
                                        <Icons.Search className="w-5 h-5" />
                                        <span className="text-sm font-medium">Поиск...</span>
                                        <span className="ml-auto text-xs font-bold bg-slate-100 px-2 py-1 rounded-lg">Ctrl K</span>
                                    </button>
                                ) : (
                                    <div>
                                        <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">{pageTitles[activeTab] || 'LifeHub'}</h1>
                                        <p className="text-sm font-medium text-slate-500 mt-0.5">{pageSubtitles[activeTab] || 'Все важное — в одном спокойном пространстве.'}</p>
                                    </div>
                                )}
                                <div className="lh-top-actions">
                                    {activeTab !== 'home' && (
                                        <button onClick={openSearch} className="lh-search" title="Поиск по LifeHub">
                                            <Icons.Search className="w-5 h-5" />
                                            <span className="text-sm font-medium">Поиск...</span>
                                            <span className="ml-auto text-xs font-bold bg-slate-100 px-2 py-1 rounded-lg">Ctrl K</span>
                                        </button>
                                    )}
                                    <button onClick={reload} className="lh-icon-btn relative" title={error ? 'Повторить синхронизацию' : 'Синхронизация в порядке'}>
                                        <Icons.AlertTriangle className="w-5 h-5" />
                                        {error && <span className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-rose-500 text-white text-[10px] font-black flex items-center justify-center">!</span>}
                                    </button>
                                    <button onClick={toggleTheme} className="lh-icon-btn" title="Сменить тему">
                                        <Icons.Moon className="w-5 h-5" />
                                    </button>
                                    <button onClick={() => setActiveTab('home')} className="lh-top-profile" title="Профиль">
                                        <span className="lh-top-avatar">{profileInitials}</span>
                                        <span className="lh-top-name">{profileName}</span>
                                        <Icons.ChevronRight className="w-4 h-4 rotate-90 text-slate-400" />
                                    </button>
                                    <button onClick={openLocalAdd} className="lh-primary-btn">
                                        <Icons.Plus className="w-5 h-5" />
                                        {activeTab === 'notes' ? 'Новая заметка' : activeTab === 'goals' ? 'Новая цель' : 'Добавить'}
                                    </button>
                                </div>
                            </div>

                            {(quickMenuOpen || searchOpen || moreMenuOpen) && (
                                <button
                                    className="lh-action-backdrop"
                                    onClick={closeActionOverlays}
                                    onWheel={closeActionOverlaysAndScroll}
                                    onTouchMove={closeActionOverlays}
                                    aria-label="Закрыть меню"
                                />
                            )}

                            {searchOpen && (
                                <div className="lh-search-panel">
                                    <div className="flex items-center gap-2">
                                        <Icons.Search className="w-5 h-5 text-slate-400 shrink-0" />
                                        <input
                                            autoFocus
                                            value={searchQuery}
                                            onChange={event => setSearchQuery(event.target.value)}
                                            placeholder="Найти заметку, цель, платёж..."
                                            className="lh-search-input"
                                        />
                                    </div>
                                    <div className="mt-3 grid gap-1 max-h-[360px] overflow-auto">
                                        {searchResults.length > 0 ? searchResults.map((item, index) => {
                                            const ResultIcon = item.icon;
                                            return (
                                                <button
                                                    key={`${item.tab}-${item.title}-${index}`}
                                                    onClick={() => {
                                                        setActiveTab(item.tab);
                                                        closeActionOverlays();
                                                        setSearchQuery('');
                                                    }}
                                                    className="lh-search-result"
                                                >
                                                    <div className="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                                                        <ResultIcon className="w-5 h-5" />
                                                    </div>
                                                    <div className="min-w-0">
                                                        <p className="font-extrabold text-slate-900 truncate">{item.title}</p>
                                                        <p className="text-xs font-bold text-slate-500 truncate">{item.subtitle}</p>
                                                    </div>
                                                </button>
                                            );
                                        }) : (
                                            <div className="rounded-2xl bg-slate-50 p-5 text-center">
                                                <p className="font-extrabold text-slate-800">Ничего не найдено</p>
                                                <p className="text-sm font-semibold text-slate-500 mt-1">Попробуйте другой запрос.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {error && (
                                <div className="lh-fallback-banner mb-4 flex items-start justify-between gap-3">
                                    <div>
                                        <p className="font-extrabold">Не удалось подключиться к облаку</p>
                                        <p className="text-sm mt-1">Проверьте подключение или продолжайте с локальными данными.</p>
                                    </div>
                                    <button onClick={() => window.location.reload()} className="text-sm font-extrabold underline underline-offset-4">Повторить</button>
                                </div>
                            )}

                            {quickMenuOpen && (
                                <div className="lh-quick-menu">
                                    <button onClick={() => runQuickAction('budget', 'lifehub:add-transaction', { type: 'expense' })}><Icons.TrendingDown className="w-5 h-5 text-rose-500" /> Добавить расход</button>
                                    <button onClick={() => runQuickAction('budget', 'lifehub:add-transaction', { type: 'income' })}><Icons.TrendingUp className="w-5 h-5 text-emerald-600" /> Добавить доход</button>
                                    <button onClick={() => runQuickAction('events', 'lifehub:add-event')}><Icons.Calendar className="w-5 h-5 text-blue-600" /> Новое событие</button>
                                    <button onClick={() => runQuickAction('notes', 'lifehub:add-note')}><Icons.StickyNote className="w-5 h-5 text-amber-500" /> Новая заметка</button>
                                    <button onClick={() => runQuickAction('goals', 'lifehub:add-goal')}><Icons.Target className="w-5 h-5 text-violet-600" /> Новая цель</button>
                                    <button onClick={() => runQuickAction('supplies', 'lifehub:add-supply')}><Icons.Package className="w-5 h-5 text-sky-600" /> Добавить товар</button>
                                </div>
                            )}

                            {moreMenuOpen && (
                                <div className="lh-more-menu">
                                    <button onClick={() => { setActiveTab('goals'); setMoreMenuOpen(false); }}><Icons.Target className="w-5 h-5" /> Цели</button>
                                    <button onClick={() => { setActiveTab('supplies'); setMoreMenuOpen(false); }}><Icons.Package className="w-5 h-5" /> Дом</button>
                                    <button onClick={() => { setActiveTab('goals'); setMoreMenuOpen(false); }}><Icons.Moon className="w-5 h-5" /> Фокус</button>
                                    <button onClick={() => { toggleTheme(); setMoreMenuOpen(false); }}><Icons.Wand className="w-5 h-5" /> Настройки</button>
                                </div>
                            )}

                            {renderTab()}
                        </main>

                        {/* Bottom Navigation - fixed at very bottom, z-index ниже модалок */}
                        <nav className="fixed bottom-0 left-0 right-0 z-40 lh-glass-nav safe-bottom px-2 pt-2" style={{ paddingBottom: 'max(0.5rem, env(safe-area-inset-bottom))' }}>
                            <div className="w-full max-w-md mx-auto flex justify-around items-center h-full">
                                {bottomTabs.map(tab => {
                                    const isMoreActive = tab.id === 'more' && ['goals', 'supplies'].includes(activeTab);
                                    const isActive = activeTab === tab.id || isMoreActive;
                                    const TabIcon = tab.icon;
                                    return (
                                        <PressableScale
                                            key={tab.id}
                                            onClick={() => tab.id === 'more' ? openMoreMenu() : setActiveTab(tab.id)}
                                            className="flex flex-col items-center gap-0.5 py-1.5 px-1 min-w-0 flex-1 no-select"
                                        >
                                            <div className={`p-1.5 rounded-xl transition-all ${isActive ? 'lh-tab-active' : 'lh-tab-inactive'}`}>
                                                <TabIcon className="w-5 h-5" />
                                            </div>
                                            <span className={`lh-mobile-nav-label truncate ${isActive ? 'text-emerald-600' : 'lh-tab-inactive'}`}>
                                                {tab.label}
                                            </span>
                                        </PressableScale>
                                    );
                                })}
                            </div>
                        </nav>
                    </div>
                </ErrorBoundary>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <DataProvider>
                <App />
            </DataProvider>
        );

        if ('serviceWorker' in navigator && ['http:', 'https:'].includes(window.location.protocol)) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((error) => {
                    console.warn('Service worker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
