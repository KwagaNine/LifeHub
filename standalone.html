                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Заголовок</label>
                                        <input
                                            value={noteForm.title}
                                            onChange={e => setNoteForm({ ...noteForm, title: e.target.value })}
                                            placeholder="Название заметки"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Содержание</label>
                                        <textarea
                                            value={noteForm.content}
                                            onChange={e => setNoteForm({ ...noteForm, content: e.target.value })}
                                            placeholder="Текст заметки..."
                                            rows={4}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Цвет</label>
                                        <div className="flex gap-2">
                                            {colors.map(color => (
                                                <button
                                                    key={color}
                                                    onClick={() => setNoteForm({ ...noteForm, color })}
                                                    className={`w-10 h-10 rounded-xl ${color} ${noteForm.color === color ? 'ring-2 ring-slate-400 ring-offset-2' : ''}`}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={handleSave} className="w-full pt-2">
                                    <div className="bg-amber-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingNote ? 'Сохранить' : 'Создать'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Birthdays Tab (События → напоминания о Днях рождения) ---
        // Сохраняем компонент в кодовой базе, но также используем его как встроенный менеджер (embedded) на Главной.
        const EventsTab = ({ embedded = false } = {}) => {
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

            const [birthdays, setBirthdays] = useLocalStorage('lifehub_birthdays', [
                { id: 'b1', name: 'Мама', day: 22, month: 7, year: 1965, note: 'Купить цветы', createdAt: Date.now() },
                { id: 'b2', name: 'Аня', day: 3, month: 3, year: 1998, note: 'Подарок: сертификат', createdAt: Date.now() },
            ]);

            const today = useMemo(() => {
                const d = new Date();
                return new Date(d.getFullYear(), d.getMonth(), d.getDate());
            }, []);

            const [viewMonth, setViewMonth] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
            const [selectedDate, setSelectedDate] = useState(() => today);

            const [isModalOpen, setModalOpen] = useState(false);
            const [editingBirthday, setEditingBirthday] = useState(null);
            const [form, setForm] = useState({ name: '', day: today.getDate(), month: today.getMonth() + 1, year: '', note: '' });

            const safeDate = (year, monthIndex, day) => {
                const d = new Date(year, monthIndex, day);
                if (d.getMonth() !== monthIndex) {
                    // Например, 31 апреля → берём последний день месяца
                    return new Date(year, monthIndex + 1, 0);
                }
                return d;
            };

            const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

            const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

            const openAdd = (presetDate) => {
                const d = presetDate || selectedDate;
                setEditingBirthday(null);
                setForm({ name: '', day: d.getDate(), month: d.getMonth() + 1, year: '', note: '' });
                setModalOpen(true);
            };

            const openEdit = (b) => {
                setEditingBirthday(b);
                setForm({
                    name: b.name || '',
                    day: b.day,
                    month: b.month,
                    year: b.year ? String(b.year) : '',
                    note: b.note || ''
                });
                setModalOpen(true);
            };

            const handleSave = () => {
                if (!form.name.trim()) return;

                const day = Number(form.day);
                const month = Number(form.month);
                const year = form.year ? Number(form.year) : null;

                const payload = {
                    name: form.name.trim(),
                    day,
                    month,
                    year,
                    note: form.note.trim()
                };

                if (editingBirthday) {
                    setBirthdays(birthdays.map(b => b.id === editingBirthday.id ? { ...b, ...payload } : b));
                } else {
                    setBirthdays([{ id: String(Date.now()), ...payload, createdAt: Date.now() }, ...birthdays]);
                }

                setModalOpen(false);
            };

            const handleDelete = () => {
                if (!editingBirthday) return;
                setBirthdays(birthdays.filter(b => b.id !== editingBirthday.id));
                setModalOpen(false);
            };

            const daysInViewMonth = useMemo(() => {
                return new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
            }, [viewMonth]);

            const firstWeekdayMondayBased = useMemo(() => {
                // JS: 0=Вс..6=Сб → делаем 0=Пн..6=Вс
                const js = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1).getDay();
                return (js + 6) % 7;
            }, [viewMonth]);

            const birthdaysInViewMonthByDay = useMemo(() => {
                const m = viewMonth.getMonth() + 1;
                const map = {};
                birthdays.filter(b => b.month === m).forEach(b => {
                    map[b.day] = (map[b.day] || 0) + 1;
                });
                return map;
            }, [birthdays, viewMonth]);

            const birthdaysForSelectedDate = useMemo(() => {
                const d = selectedDate.getDate();
                const m = selectedDate.getMonth() + 1;
                return birthdays.filter(b => b.day === d && b.month === m);
            }, [birthdays, selectedDate]);

            const closestThisYear = useMemo(() => {
                const yearNow = today.getFullYear();
                const untilEndOfYear = new Date(yearNow, 11, 31);
                const today0 = startOfDay(today);

                return birthdays
                    .map(b => {
                        const occ = safeDate(yearNow, b.month - 1, b.day);
                        return { b, occ };
                    })
                    .filter(x => x.occ >= today0 && x.occ <= untilEndOfYear)
                    .sort((a, b) => a.occ.getTime() - b.occ.getTime());
            }, [birthdays, today]);

            const goPrevMonth = () => {
                setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1));
            };

            const goNextMonth = () => {
                setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1));
            };

            // Если пользователь выбрал дату вне текущего отображаемого месяца — синхронизируем, чтобы не было «пропажи» выделения.
            useEffect(() => {
                if (selectedDate.getFullYear() !== viewMonth.getFullYear() || selectedDate.getMonth() !== viewMonth.getMonth()) {
                    setViewMonth(new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1));
                }
            }, [selectedDate]);

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4 flex justify-between items-center">
                        <div>
                            <p className={THEME.label}>Напоминания</p>
                            <h1 className="text-3xl font-extrabold text-slate-800 mt-1">Дни рождения</h1>
                        </div>
                        <PressableScale onClick={() => openAdd(selectedDate)} className="bg-violet-500 p-3 rounded-2xl shadow-lg text-white">
                            <Icons.Plus className="w-6 h-6" />
                        </PressableScale>
                    </header>

                    {/* Calendar (листать по месяцам) */}
                    <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-4">
                        <div className="flex items-center justify-between px-2">
                            <PressableScale onClick={goPrevMonth} className="p-2 rounded-xl bg-slate-50 text-slate-500 hover:bg-slate-100">
                                <Icons.ChevronLeft className="w-5 h-5" />
                            </PressableScale>
                            <div className="text-center">
                                <div className="text-sm font-extrabold text-slate-900">
                                    {monthNames[viewMonth.getMonth()]} {viewMonth.getFullYear()}
                                </div>
                                <div className="text-[11px] font-bold uppercase tracking-widest text-slate-400">Выберите дату</div>
                            </div>
                            <PressableScale onClick={goNextMonth} className="p-2 rounded-xl bg-slate-50 text-slate-500 hover:bg-slate-100">
                                <Icons.ChevronRight className="w-5 h-5" />
                            </PressableScale>
                        </div>

                        <div className="grid grid-cols-7 gap-1 mt-4">
                            {['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w => (
                                <div key={w} className="h-7 flex items-center justify-center text-[10px] font-black text-slate-300 uppercase">{w}</div>
                            ))}

                            {Array.from({ length: firstWeekdayMondayBased }, (_, i) => (
                                <div key={`empty-${i}`} className="aspect-square" />
                            ))}

                            {Array.from({ length: daysInViewMonth }, (_, idx) => {
                                const day = idx + 1;
                                const cellDate = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
                                const isSelected = isSameDay(cellDate, selectedDate);
                                const isToday = isSameDay(cellDate, today);
                                const hasBd = Boolean(birthdaysInViewMonthByDay[day]);

                                return (
                                    <button
                                        key={day}
                                        onClick={() => setSelectedDate(cellDate)}
                                        className={`aspect-square rounded-2xl flex flex-col items-center justify-center relative transition-all
                                            ${isSelected ? 'bg-violet-500 text-white shadow-lg' : isToday ? 'bg-violet-50 text-violet-700' : 'hover:bg-slate-50 text-slate-700'}
                                        `}
                                    >
                                        <span className="text-sm font-bold">{day}</span>
                                        {hasBd && (
                                            <div className={`absolute bottom-1.5 w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-violet-400'}`} />
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Birthdays on selected day */}
                    <section>
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-lg font-bold text-slate-700">
                                {selectedDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                            </h2>
                            <button
                                onClick={() => openAdd(selectedDate)}
                                className="text-sm font-bold text-slate-400 hover:text-slate-800 transition-colors bg-white px-3 py-1.5 rounded-full shadow-sm"
                            >
                                + Добавить
                            </button>
                        </div>

                        <div className="space-y-3">
                            {birthdaysForSelectedDate.length > 0 ? birthdaysForSelectedDate.map(b => (
                                <PressableScale key={b.id} onClick={() => openEdit(b)} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex gap-4">
                                    <div className="w-1.5 rounded-full bg-violet-500" />
                                    <div className="flex-1">
                                        <div className="flex justify-between items-start">
                                            <h3 className="font-bold text-slate-800 text-lg">{b.name}</h3>
                                            <Icons.ChevronRight className="w-5 h-5 text-slate-300" />
                                        </div>
                                        {b.note && <p className="text-slate-500 text-sm mt-1">{b.note}</p>}
                                        {b.year && (
                                            <p className="text-xs text-slate-400 mt-2">
                                                Исполнится {today.getFullYear() - b.year}
                                            </p>
                                        )}
                                    </div>
                                </PressableScale>
                            )) : (
                                <div className="flex flex-col items-center justify-center h-28 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                    <Icons.Gift className="w-10 h-10 mb-2 opacity-50" />
                                    <p className="text-sm font-medium">На эту дату ничего нет</p>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Closest birthdays this year */}
                    <section className="mt-6 pt-4 border-t border-slate-100">
                        <p className={`${THEME.label} mb-3`}>Ближайшие в этом году</p>
                        <div className="space-y-2">
                            {closestThisYear.length > 0 ? closestThisYear.map(({ b, occ }) => {
                                const daysLeft = Math.max(0, Math.round((startOfDay(occ).getTime() - startOfDay(today).getTime()) / 86400000));
                                const badge = daysLeft === 0
                                    ? 'bg-rose-50 text-rose-600'
                                    : daysLeft <= 7
                                        ? 'bg-amber-50 text-amber-700'
                                        : daysLeft <= 31
                                            ? 'bg-emerald-50 text-emerald-700'
                                            : 'bg-slate-50 text-slate-500';

                                return (
                                    <PressableScale
                                        key={b.id}
                                        onClick={() => {
                                            const d = safeDate(today.getFullYear(), b.month - 1, b.day);
                                            setSelectedDate(d);
                                            setViewMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                                            openEdit(b);
                                        }}
                                        className="bg-white border border-slate-100 rounded-2xl p-4 flex items-center justify-between shadow-sm"
                                    >
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-2xl bg-violet-50 flex items-center justify-center text-violet-600">
                                                <Icons.Gift className="w-5 h-5" />
                                            </div>
                                            <div>
                                                <div className="font-bold text-slate-800">{b.name}</div>
                                                <div className="text-xs text-slate-400 font-medium">
                                                    {occ.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                                                    {b.year ? ` • исполнится ${today.getFullYear() - b.year}` : ''}
                                                </div>
                                            </div>
                                        </div>
                                        <div className={`text-xs font-black px-2.5 py-1 rounded-full ${badge}`}>
                                            {daysLeft === 0 ? 'Сегодня' : `через ${daysLeft} дн.`}
                                        </div>
                                    </PressableScale>
                                );
                            }) : (
                                <div className="text-sm text-slate-400 bg-slate-50 border border-slate-100 rounded-2xl p-4">
                                    На этот год ближайших дней рождения больше нет.
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Add/Edit Birthday Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingBirthday ? 'Редактирование' : 'Новый день рождения'}</h2>
                                    {editingBirthday && (
                                        <button onClick={handleDelete} className="bg-rose-50 p-3 rounded-full text-rose-500">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Имя</label>
                                        <input
                                            value={form.name}
                                            onChange={e => setForm({ ...form, name: e.target.value })}
                                            placeholder="Напр: Оля"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-2">
                                            <label className={THEME.label}>День</label>
                                            <input
                                                type="number"
                                                min="1"
                                                max="31"
                                                value={form.day}
                                                onChange={e => setForm({ ...form, day: Number(e.target.value) })}
                                                className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            />
                                        </div>
                                        <div className="space-y-2">
                                            <label className={THEME.label}>Месяц</label>
                                            <select
                                                value={form.month}
                                                onChange={e => setForm({ ...form, month: Number(e.target.value) })}
                                                className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            >
                                                {monthNames.map((m, i) => (
                                                    <option key={m} value={i + 1}>{m}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Год (необязательно)</label>
                                        <input
                                            type="number"
                                            value={form.year}
                                            onChange={e => setForm({ ...form, year: e.target.value })}
                                            placeholder="Напр: 1995"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Заметка</label>
                                        <textarea
                                            value={form.note}
                                            onChange={e => setForm({ ...form, note: e.target.value })}
                                            placeholder="Подарок, пожелания..."
                                            rows={3}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                </div>

                                <PressableScale onClick={handleSave} className="w-full pt-2">
                                    <div className="bg-violet-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingBirthday ? 'Сохранить' : 'Создать'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Supplies Tab (Дом / Запасы) ---
        const SuppliesTab = () => {
            const [supplies, setSupplies] = useLocalStorage('lifehub_supplies', [
                { id: '1', name: 'Молоко', category: 'Еда', inStock: true, price: 120, createdAt: Date.now() },
                { id: '2', name: 'Хлеб', category: 'Еда', inStock: false, price: 60, createdAt: Date.now() },
                { id: '3', name: 'Мыло', category: 'Гигиена', inStock: true, price: 90, createdAt: Date.now() },
                { id: '4', name: 'Средство для пола', category: 'Уборка', inStock: false, price: 250, createdAt: Date.now() },
            ]);
            const [isAddOpen, setAddOpen] = useState(false);
            const [showShoppingList, setShowShoppingList] = useState(false);
            const [newItem, setNewItem] = useState({ name: '', category: 'Еда', price: '' });

            // AI recipes module removed from Дом (disabled by request).

            // миграция старых записей, где price отсутствовал
            useEffect(() => {
                if (!supplies || supplies.length === 0) return;
                const needs = supplies.some(s => typeof s.price === 'undefined');
                if (!needs) return;
                setSupplies(supplies.map(s => (typeof s.price === 'undefined' ? { ...s, price: null } : s)));
            }, []);

            const categories = ['Еда', 'Уборка', 'Гигиена', 'Другое'];

            const categoryIcons = {
                'Еда': Icons.Apple,
                'Уборка': Icons.Sparkle,
                'Гигиена': Icons.Droplet,
                'Другое': Icons.Package
            };

            const categoryColors = {
                'Еда': { bg: 'bg-emerald-50', icon: 'bg-emerald-100', text: 'text-emerald-500' },
                'Уборка': { bg: 'bg-sky-50', icon: 'bg-sky-100', text: 'text-sky-500' },
                'Гигиена': { bg: 'bg-violet-50', icon: 'bg-violet-100', text: 'text-violet-500' },
                'Другое': { bg: 'bg-slate-50', icon: 'bg-slate-100', text: 'text-slate-500' }
            };

            const outOfStockCount = supplies.filter(s => !s.inStock).length;
            const outOfStockTotal = useMemo(() => {
                return (supplies || [])
                    .filter(s => !s.inStock)
                    .reduce((acc, s) => acc + (typeof s.price === 'number' && Number.isFinite(s.price) ? s.price : 0), 0);
            }, [supplies]);

            const displayedSupplies = showShoppingList 
                ? supplies.filter(s => !s.inStock)
                : supplies;

            const toggleStock = (id) => {
                setSupplies(supplies.map(s => s.id === id ? { ...s, inStock: !s.inStock } : s));
            };

            const deleteItem = (id) => {
                setSupplies(supplies.filter(s => s.id !== id));
            };

            const handleAdd = () => {
                if (!newItem.name.trim()) return;
                const priceNum = newItem.price === '' || newItem.price === null || typeof newItem.price === 'undefined'
                    ? null
                    : Number(newItem.price);

                const item = {
                    id: Date.now().toString(),
                    name: newItem.name.trim(),
                    category: newItem.category,
                    inStock: true,
                    price: Number.isFinite(priceNum) ? priceNum : null,
                    createdAt: Date.now()
                };
                setSupplies([item, ...supplies]);
                setNewItem({ name: '', category: 'Еда', price: '' });
                setAddOpen(false);
            };

            // Group by category
            const groupedSupplies = displayedSupplies.reduce((acc, item) => {
                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4">
                        <p className={THEME.label}>Запасы</p>
                        <h1 className="text-3xl font-extrabold text-slate-800 mt-1">Дом</h1>
                    </header>

                    {/* Control Panel */}
                    <div className="flex gap-3">
                        <PressableScale 
                            onClick={() => setShowShoppingList(!showShoppingList)}
                            className={`flex-1 py-3 px-4 rounded-2xl flex items-center justify-center gap-2 transition-all
                                ${showShoppingList ? 'bg-rose-500 text-white shadow-lg' : 'bg-white text-slate-700 border border-slate-100 shadow-sm'}
                            `}
                        >
                            <Icons.ShoppingCart className="w-5 h-5" />
                            <span className="font-bold">Список покупок</span>
                            {outOfStockCount > 0 && (
                                <span className={`ml-1 px-2 py-0.5 rounded-full text-xs font-bold
                                    ${showShoppingList ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-600'}
                                `}>
                                    {outOfStockCount}
                                </span>
                            )}
                        </PressableScale>

                        <PressableScale 
                            onClick={() => setAddOpen(true)}
                            className="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center shadow-lg text-white"
                        >
                            <Icons.Plus className="w-6 h-6" />
                        </PressableScale>
                    </div>

                    {/* AI recipes removed */}

                    {/* Supplies List */}
                    <div className="space-y-3">
                        {showShoppingList && outOfStockCount > 0 && (
                            <BentoCard className="bg-gradient-to-br from-rose-50 to-rose-100/50 !p-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <div className="text-xs font-black uppercase tracking-widest text-rose-600">Итого на покупки</div>
                                        <div className="text-2xl font-extrabold text-rose-700 mt-1">{outOfStockTotal.toLocaleString('ru-RU')} ₽</div>
                                    </div>
                                    <div className="w-10 h-10 rounded-2xl bg-white/60 flex items-center justify-center text-rose-600">
                                        <Icons.ShoppingCart className="w-5 h-5" />
                                    </div>
                                </div>
                                <p className="text-sm text-rose-700/80 mt-2">Сумма считается по ценам товаров со статусом «Купить».</p>
                            </BentoCard>
                        )}
                    </div>

                    <div className="space-y-6">
                        {Object.entries(groupedSupplies).map(([category, items]) => {
                            const IconComponent = categoryIcons[category] || Icons.Package;
                            const colors = categoryColors[category] || categoryColors['Другое'];
                            
                            return (
                                <section key={category}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <div className={`p-1.5 rounded-lg ${colors.icon}`}>
                                            <IconComponent className={`w-4 h-4 ${colors.text}`} />
                                        </div>
                                        <h3 className="font-bold text-slate-700">{category}</h3>
                                        <span className="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{items.length}</span>
                                    </div>
                                    <div className="space-y-2">
                                        {items.map(item => {
                                            const ItemIcon = categoryIcons[item.category] || Icons.Package;
                                            const itemColors = categoryColors[item.category] || categoryColors['Другое'];
                                            
                                            return (
                                                <div 
                                                    key={item.id}
                                                    className={`p-4 rounded-2xl border flex items-center justify-between transition-all
                                                        ${item.inStock 
                                                            ? 'bg-white border-slate-100 shadow-sm' 
                                                            : 'bg-slate-50/50 border-slate-100'
                                                        }
                                                    `}
                                                    style={{ opacity: item.inStock ? 1 : 0.7 }}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <PressableScale 
                                                            onClick={() => toggleStock(item.id)}
                                                            className={`p-2.5 rounded-xl transition-all ${item.inStock ? itemColors.icon : 'bg-slate-100'}`}
                                                        >
                                                            <ItemIcon className={`w-5 h-5 ${item.inStock ? itemColors.text : 'text-slate-400'}`} />
                                                        </PressableScale>
                                                        <div>
                                                            <p className={`font-bold ${item.inStock ? 'text-slate-800' : 'text-slate-500'}`}>
                                                                {item.name}
                                                            </p>

                                                            <div className="flex items-center gap-2 mt-1">
                                                                {!item.inStock && (
                                                                    <span className="text-xs font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">
                                                                        Купить
                                                                    </span>
                                                                )}
                                                                {typeof item.price === 'number' && Number.isFinite(item.price) && (
                                                                    <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">
                                                                        {item.price.toLocaleString('ru-RU')} ₽
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        {item.inStock && (
                                                            <span className="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded-lg">
                                                                Есть
                                                            </span>
                                                        )}
                                                        <PressableScale 
                                                            onClick={() => deleteItem(item.id)}
                                                            className="p-2 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-colors"
                                                        >
                                                            <Icons.Trash className="w-4 h-4" />
                                                        </PressableScale>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            );
                        })}
                    </div>

                    {displayedSupplies.length === 0 && (
                        <div className="flex flex-col items-center justify-center h-60 text-slate-300">
                            {showShoppingList ? (
                                <>
                                    <Icons.CheckCircle className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Всё куплено!</p>
                                    <p className="text-sm">Список покупок пуст</p>
                                </>
                            ) : (
                                <>
                                    <Icons.Package className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Нет товаров</p>
                                    <p className="text-sm">Добавьте первый товар</p>
                                </>
                            )}
                        </div>
                    )}

                    {/* AI favorites removed */}

                    {/* Add Item Modal */}
                    {isAddOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setAddOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">Новый товар</h2>
                                <p className="text-sm text-slate-500">Можно указать цену — она попадёт в итог «Список покупок».</p>
                                    <button onClick={() => setAddOpen(false)} className="bg-slate-50 p-2 rounded-full text-slate-400">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={newItem.name}
                                            onChange={e => setNewItem({ ...newItem, name: e.target.value })}
                                            placeholder="Напр: Яйца"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Цена (₽)</label>
                                        <input
                                            type="number"
                                            value={newItem.price}
                                            onChange={e => setNewItem({ ...newItem, price: e.target.value })}
                                            placeholder="Напр: 1000"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-mono text-xl font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Категория</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {categories.map(cat => {
                                                const CatIcon = categoryIcons[cat];
                                                const colors = categoryColors[cat];
                                                const isSelected = newItem.category === cat;
                                                
                                                return (
                                                    <button
                                                        key={cat}
                                                        onClick={() => setNewItem({ ...newItem, category: cat })}
                                                        className={`p-4 rounded-2xl flex items-center gap-3 transition-all border-2
                                                            ${isSelected 
                                                                ? `${colors.bg} border-current ${colors.text}` 
                                                                : 'bg-slate-50 border-transparent text-slate-600'
                                                            }
                                                        `}
                                                    >
                                                        <div className={`p-2 rounded-xl ${isSelected ? colors.icon : 'bg-slate-100'}`}>
                                                            <CatIcon className={`w-5 h-5 ${isSelected ? colors.text : 'text-slate-400'}`} />
                                                        </div>
                                                        <span className="font-bold">{cat}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={handleAdd} className="w-full pt-2">
                                    <div className="bg-sky-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Добавить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Statistics Tab (бывшая "Главная") ---
        const StatisticsTab = () => {
            // ЕДИНЫЙ источник: данные Supabase, которые редактируются во вкладке "Бюджет".
            // Никаких fallback на старые localStorage-ключи — иначе будут «не те» значения.
            const { data } = useData();

            const totalBalance = Number(data?.balance ?? 0);
            const transactions = Array.isArray(data?.transactions) ? data.transactions : [];
            const bills = Array.isArray(data?.bills) ? data.bills : [];
            const monthLimit = Number(data?.limit ?? 60000);
            const categoryLimits = (data?.category_limits && typeof data.category_limits === 'object') ? data.category_limits : {};

            // Верхние плашки (Баланс/Расходы/Доходы) → модалки с детализацией
            const [kpiModal, setKpiModal] = useState(null); // 'balance' | 'expenses' | 'income' | null

            // Детализация: расходы по выбранной категории за текущий месяц
            const [categoryDetailsOpen, setCategoryDetailsOpen] = useState(false);
            const [categoryDetailsName, setCategoryDetailsName] = useState(null);

            const today = new Date();
            const today0 = startOfDay(today);

            const nearestCreditPayment = useMemo(() => {
                if (!bills || bills.length === 0) return null;

                const currentYear = today0.getFullYear();
                const currentMonth = today0.getMonth();

                const nextOccurrence = (dayOfMonth) => {
                    const d1 = new Date(currentYear, currentMonth, dayOfMonth);
                    const candidate = startOfDay(d1);
                    if (candidate >= today0) return candidate;
                    return startOfDay(new Date(currentYear, currentMonth + 1, dayOfMonth));
                };

                const candidates = bills
                    .filter(b => !b.paid)
                    .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                    .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());

                return candidates[0] || null;
            }, [bills]);

            // --- Analytics ---
            const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today0);
            const prevMonthDate = new Date(today0.getFullYear(), today0.getMonth() - 1, 1);
            const prevMonthKey = monthKey(prevMonthDate);

            const txMonthKey = (t) => {
                if (t.dateKey) return String(t.dateKey).slice(0, 7);
                if (t.createdAt) return monthKey(startOfDay(new Date(t.createdAt)));
                return currentMonthKey;
            };

            const expensesCurrentMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            const incomeCurrentMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'income' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            // Данные по дням (текущий месяц): доходы/расходы/категории/дельта
            const monthDays = useMemo(() => {
                const y = today0.getFullYear();
                const m = today0.getMonth();
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                return Array.from({ length: daysInMonth }, (_, i) => {
                    const d = new Date(y, m, i + 1);
                    const key = formatDateKey(d);
                    return { date: d, key };
                });
            }, [today0]);

            const monthTx = useMemo(() => {
                return (transactions || []).filter(t => txMonthKey(t) === currentMonthKey);
            }, [transactions, currentMonthKey]);

            const dayStatsMap = useMemo(() => {
                const map = {};
                monthDays.forEach(({ key }) => {
                    map[key] = {
                        key,
                        expenseTotal: 0,
                        incomeTotal: 0,
                        delta: 0,
                        expenseByCategory: {},
                        incomeByCategory: {},
                        items: [],
                    };
                });
                (monthTx || []).forEach(t => {
                    const key = t.dateKey || (t.createdAt ? formatDateKey(startOfDay(new Date(t.createdAt))) : null);
                    if (!key || !map[key]) return;
                    const amount = Number(t.amount || 0);
                    const cat = t.category || 'Разное';
                    map[key].items.push(t);
                    if (t.type === 'expense') {
                        map[key].expenseTotal += amount;
                        map[key].expenseByCategory[cat] = (map[key].expenseByCategory[cat] || 0) + amount;
                    } else {
                        map[key].incomeTotal += amount;
                        map[key].incomeByCategory[cat] = (map[key].incomeByCategory[cat] || 0) + amount;
                    }
                    map[key].delta = map[key].incomeTotal - map[key].expenseTotal;
                });
                return map;
            }, [monthTx, monthDays]);

            const balanceHistory = useMemo(() => {
                // Баланс на конец каждого дня текущего месяца
                // totalBalance — финальный баланс после всех операций.
                // Для дня D: balance(D) = totalBalance - сумма(delta по операциям после D)
                const allTx = (transactions || []).filter(t => t.dateKey);
                const deltasAfter = (dayKey) => {
                    return allTx
                        .filter(t => String(t.dateKey) > dayKey)
                        .reduce((acc, t) => {
                            const a = Number(t.amount || 0);
                            return acc + (t.type === 'income' ? a : -a);
                        }, 0);
                };

                return monthDays.map(({ date, key }) => {
                    const after = deltasAfter(key);
                    const balanceEnd = Number(totalBalance) - Number(after);
                    const stats = dayStatsMap[key] || null;
                    return {
                        date,
                        key,
                        balanceEnd,
                        stats,
                    };
                });
            }, [monthDays, transactions, totalBalance, dayStatsMap]);

            const monthExpenseDays = useMemo(() => {
                return monthDays
                    .map(({ date, key }) => ({ date, key, ...(dayStatsMap[key] || {}) }))
                    .filter(x => Number(x.expenseTotal || 0) > 0)
                    .sort((a, b) => a.date.getTime() - b.date.getTime());
            }, [monthDays, dayStatsMap]);

            const monthIncomeDays = useMemo(() => {
                return monthDays
                    .map(({ date, key }) => ({ date, key, ...(dayStatsMap[key] || {}) }))
                    .filter(x => Number(x.incomeTotal || 0) > 0)
                    .sort((a, b) => a.date.getTime() - b.date.getTime());
            }, [monthDays, dayStatsMap]);

            const expensesPrevMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === prevMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, prevMonthKey]);

            const spentProgress = useMemo(() => {
                if (!monthLimit) return 0;
                return Math.min(100, Math.round((expensesCurrentMonth / Number(monthLimit)) * 100));
            }, [expensesCurrentMonth, monthLimit]);

            const expensesByCategory = useMemo(() => {
                const stats = {};
                (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .forEach(t => {
                        const c = t.category || 'Разное';
                        stats[c] = (stats[c] || 0) + Number(t.amount || 0);
                    });
                return Object.entries(stats)
                    .map(([name, amount]) => ({ name, amount }))
                    .sort((a, b) => b.amount - a.amount);
            }, [transactions, currentMonthKey]);

            const openCategoryDetails = (catName) => {
                setCategoryDetailsName(catName);
                setCategoryDetailsOpen(true);
            };

            const categoryMonthExpenses = useMemo(() => {
                if (!categoryDetailsName) return [];
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey && (t.category || 'Разное') === categoryDetailsName)
                    .sort((a, b) => {
                        const ad = a.dateKey ? (parseDateKey(a.dateKey)?.getTime() || 0) : (a.createdAt || 0);
                        const bd = b.dateKey ? (parseDateKey(b.dateKey)?.getTime() || 0) : (b.createdAt || 0);
                        return bd - ad;
                    });
            }, [transactions, currentMonthKey, categoryDetailsName]);

            const categoryMonthTotal = useMemo(() => {
                return (categoryMonthExpenses || []).reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [categoryMonthExpenses]);

            const pieData = useMemo(() => {
                const total = expensesByCategory.reduce((acc, x) => acc + x.amount, 0);
                const palette = ['#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#0ea5e9', '#64748b', '#22c55e', '#a855f7'];

                let accAngle = 0;
                const arcs = expensesByCategory.map((x, i) => {
                    const frac = total > 0 ? x.amount / total : 0;
                    const start = accAngle;
                    const end = accAngle + frac * 360;
                    accAngle = end;
                    return { ...x, frac, start, end, color: palette[i % palette.length] };
                });

                return { total, arcs };
            }, [expensesByCategory]);

            const polarToCartesian = (cx, cy, r, angleDeg) => {
                const a = (angleDeg - 90) * Math.PI / 180.0;
                return { x: cx + (r * Math.cos(a)), y: cy + (r * Math.sin(a)) };
            };

            const describeArc = (cx, cy, r, startAngle, endAngle) => {
                const start = polarToCartesian(cx, cy, r, endAngle);
                const end = polarToCartesian(cx, cy, r, startAngle);
                const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
                return [
                    'M', start.x, start.y,
                    'A', r, r, 0, largeArcFlag, 0, end.x, end.y,
                    'L', cx, cy,
                    'Z'
                ].join(' ');
            };

            const compare = useMemo(() => {
                const diff = expensesCurrentMonth - expensesPrevMonth;
                const pct = expensesPrevMonth > 0 ? Math.round((diff / expensesPrevMonth) * 100) : null;
                return { diff, pct };
            }, [expensesCurrentMonth, expensesPrevMonth]);

            // (Вычисления календаря платежей удалены)

            return (
                <div className="space-y-6 animate-fadeIn pt-4">
                    {/* Страница начинается сразу с карточек "Баланс" и "Расходы" (шапку убрали) */}

                    <div className="grid grid-cols-3 gap-3">
                        <PressableScale onClick={() => setKpiModal('balance')} className="text-left">
                            <BentoCard className="bg-gradient-to-br from-emerald-50 to-emerald-100/50 !p-4">
                                <div className="flex items-center gap-2 mb-2">
                                    <div className="bg-emerald-100 p-2 rounded-xl">
                                        <Icons.Wallet className="w-4 h-4 text-emerald-600" />
                                    </div>
                                    <span className={THEME.label}>Баланс</span>
                                </div>
                                <p className="text-lg font-extrabold text-emerald-700 leading-tight">{Number(totalBalance).toLocaleString('ru-RU')} ₽</p>
                                <p className="text-[10px] font-black text-emerald-700/60 mt-1">История по дням</p>
                            </BentoCard>
                        </PressableScale>

                        <PressableScale onClick={() => setKpiModal('expenses')} className="text-left">
                            <BentoCard className="bg-gradient-to-br from-rose-50 to-rose-100/50 !p-4">
                                <div className="flex items-center gap-2 mb-2">
                                    <div className="bg-rose-100 p-2 rounded-xl">
                                        <Icons.TrendingDown className="w-4 h-4 text-rose-600" />
                                    </div>
                                    <span className={THEME.label}>Расходы</span>
                                </div>
                                <p className="text-lg font-extrabold text-rose-700 leading-tight">{Number(expensesCurrentMonth).toLocaleString('ru-RU')} ₽</p>
                                <p className="text-[10px] font-black text-rose-700/60 mt-1">По дням</p>
                            </BentoCard>
                        </PressableScale>

                        <PressableScale onClick={() => setKpiModal('income')} className="text-left">
                            <BentoCard className="bg-gradient-to-br from-sky-50 to-sky-100/50 !p-4">
                                <div className="flex items-center gap-2 mb-2">
                                    <div className="bg-sky-100 p-2 rounded-xl">
                                        <Icons.TrendingUp className="w-4 h-4 text-sky-600" />
                                    </div>
                                    <span className={THEME.label}>Доходы</span>
                                </div>
                                <p className="text-lg font-extrabold text-sky-700 leading-tight">{Number(incomeCurrentMonth).toLocaleString('ru-RU')} ₽</p>
                                <p className="text-[10px] font-black text-sky-700/60 mt-1">По дням</p>
                            </BentoCard>
                        </PressableScale>
                    </div>

                    {/* Ближайшие платежи/кредиты — показываем 3 с прокруткой */}
                    {(() => {
                        // Вычисляем ближайшие платежи (все неоплаченные, отсортированные по дате)
                        const currentYear = today0.getFullYear();
                        const currentMonth = today0.getMonth();

                        // Функция для корректировки дня платежа с учётом коротких месяцев
                        const getAdjustedDay = (dayOfMonth, year, month) => {
                            const daysInMonth = new Date(year, month + 1, 0).getDate();
                            return Math.min(Number(dayOfMonth) || 1, daysInMonth);
                        };

                        const nextOccurrence = (dayOfMonth) => {
                            // Корректируем день для текущего месяца
                            const adjustedDay = getAdjustedDay(dayOfMonth, currentYear, currentMonth);
                            const d1 = new Date(currentYear, currentMonth, adjustedDay);
                            const candidate = startOfDay(d1);
                            if (candidate >= today0) return candidate;
                            // Для следующего месяца тоже корректируем
                            const nextMonthAdjustedDay = getAdjustedDay(dayOfMonth, currentYear, currentMonth + 1);
                            return startOfDay(new Date(currentYear, currentMonth + 1, nextMonthAdjustedDay));
                        };

                        const upcomingPayments = (bills || [])
                            .filter(b => !b.paid)
                            .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                            .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());

                        if (upcomingPayments.length === 0) return null;

                        return (
                            <section>
                                <SectionHeader title="Ближайшие платежи" />
                                <div className="relative">
                                    {/* Прокручиваемый контейнер с фиксированной высотой на 3 элемента */}
                                    <div 
                                        className="overflow-y-auto scrollbar-hide space-y-3 pr-1" 
                                        style={{ maxHeight: '264px' }} /* примерно 3 карточки по 80px + gaps */
                                    >
                                        {upcomingPayments.map((payment, idx) => {
                                            const daysLeft = Math.max(0, Math.round((startOfDay(payment.nextDate).getTime() - startOfDay(today0).getTime()) / 86400000));
                                            const badge = daysLeft === 0
                                                ? 'bg-rose-50 text-rose-600'
                                                : daysLeft <= 3
                                                    ? 'bg-amber-50 text-amber-700'
                                                    : daysLeft <= 7
                                                        ? 'bg-violet-50 text-violet-700'
                                                        : 'bg-slate-50 text-slate-500';

                                            return (
                                                <div 
                                                    key={payment.id} 
                                                    className="bg-white border border-slate-100 rounded-2xl p-4 flex gap-4 items-center shadow-sm"
                                                    style={{ animationDelay: `${idx * 50}ms` }}
                                                >
                                                    <div className="w-10 h-10 rounded-2xl bg-violet-50 flex items-center justify-center text-violet-600 shrink-0">
                                                        <Icons.Landmark className="w-5 h-5" />
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <h3 className="font-bold text-slate-800 truncate">{payment.title}</h3>
                                                            <span className={`text-xs font-black px-2.5 py-1 rounded-full shrink-0 ${badge}`}>
                                                                {daysLeft === 0 ? 'Сегодня' : `через ${daysLeft} дн.`}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center justify-between mt-1">
                                                            <p className="text-xs text-slate-400">
                                                                {payment.nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
                                                                {payment.repeat && payment.repeat !== 'none' && (
                                                                    <span className="ml-1.5 text-slate-300">
                                                                        • {payment.repeat === 'weekly' ? 'еженед.' : payment.repeat === 'biweekly' ? 'раз в 2 нед.' : 'ежемес.'}
                                                                    </span>
                                                                )}
                                                            </p>
                                                            <p className="text-sm font-bold text-slate-700">{Number(payment.amount).toLocaleString('ru-RU')} ₽</p>
                                                        </div>

            const [isHabitModalOpen, setHabitModalOpen] = useState(false);
