    <script>
        // Apply theme ASAP to avoid flashes.
        // Priority:
        // 1) User setting in localStorage (lifehub_theme)
        // 2) Telegram WebApp theme (if inside Telegram)
        // 3) light
        (function () {
            try {
                const raw = localStorage.getItem('lifehub_theme');
                const hasUserTheme = raw !== null && raw !== undefined;
                let theme = hasUserTheme ? JSON.parse(raw) : 'light';

                if (!hasUserTheme) {
                    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                    if (tg && tg.colorScheme) {
                        theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
                    }
                }

                if (theme === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}

            // Telegram init (safe)
            try {
                const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                if (tg) {
                    tg.ready();
                    tg.expand();
                }
            } catch (e) {}
        })();

                // РЎРїРѕСЃРѕР± 1: initDataUnsafe.user.id
                if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) {
                    return String(window.Telegram.WebApp.initDataUnsafe.user.id);
                }
                
                // РЎРїРѕСЃРѕР± 2: С‡РµСЂРµР· initData (РїР°СЂСЃРёРЅРі query string)
                if (window.Telegram?.WebApp?.initData) {
                    const params = new URLSearchParams(window.Telegram.WebApp.initData);
                    const userJson = params.get('user');
                    if (userJson) {
                        try {

                            if (user.id) return String(user.id);
                        } catch (e) {
                            console.warn('Failed to parse user from initData:', e);
                        }
                    }
                }
            } catch (e) {
                console.warn('Error getting Telegram user ID:', e);
            }
            
            // РўРµСЃС‚РѕРІС‹Р№ ID РґР»СЏ СЂР°Р·СЂР°Р±РѕС‚РєРё РІ Р±СЂР°СѓР·РµСЂРµ
            return '111111';

        const USER_ID = getUserId();

        // --- Supabase Data Context ---
        const DataContext = createContext(null);

        const DataProvider = ({ children }) => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [syncStatus, setSyncStatus] = useState('idle'); // 'idle' | 'saving' | 'saved' | 'error'
            const [lastSyncTime, setLastSyncTime] = useState(null);
            const saveTimeoutRef = useRef(null);
            const syncIndicatorTimeoutRef = useRef(null);

            // Р—Р°РіСЂСѓР·РєР° РґР°РЅРЅС‹С… РёР· Supabase
            const loadData = useCallback(async () => {
                try {
                    setLoading(true);
                    setError(null);
                    setSyncStatus('idle');
                    
                    console.log('[Supabase] Loading data for user:', USER_ID);
                    
                    const { data: row, error: fetchError } = await supabase
                        .from('user_data')
                        .select('data')
                        .eq('user_id', USER_ID)
                        .single();

                    console.log('[Supabase] Fetch result:', { row, error: fetchError });

                    if (fetchError && fetchError.code !== 'PGRST116') {
                        // PGRST116 = no rows found (new user)
                        throw fetchError;
                    }

                    if (row?.data) {
                        console.log('[Supabase] Loaded existing data');
                        setData(row.data);
                        setLastSyncTime(new Date());
                    } else {
                        // РќРѕРІС‹Р№ РїРѕР»СЊР·РѕРІР°С‚РµР»СЊ вЂ” СѓСЃС‚Р°РЅР°РІР»РёРІР°РµРј РґРµС„РѕР»С‚РЅС‹Рµ РґР°РЅРЅС‹Рµ
                        console.log('[Supabase] New user, creating default data');
                        const defaultData = getDefaultData();
                        setData(defaultData);
                        
                        // РЎРѕС…СЂР°РЅСЏРµРј РІ Р±Р°Р·Сѓ
                        const { error: insertError } = await supabase.from('user_data').upsert({
                            user_id: USER_ID,
                            data: defaultData
                        });
                        
                        if (insertError) {
                            console.error('[Supabase] Error creating new user:', insertError);
                            throw insertError;
                        }
                        
                        console.log('[Supabase] Created new user data successfully');
                        setLastSyncTime(new Date());
                    }
                } catch (err) {
                    console.error('[Supabase] Error loading data:', err);
                    setError(err.message || 'РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё РґР°РЅРЅС‹С…');
                    // Fallback to default data
                    setData(getDefaultData());
                } finally {
                    setLoading(false);
                }
            }, []);

            // РЎРѕС…СЂР°РЅРµРЅРёРµ РґР°РЅРЅС‹С… РІ Supabase (СЃ РґРµР±Р°СѓРЅСЃРѕРј)
            const saveData = useCallback(async (newData) => {
                setData(newData);
                setSyncStatus('saving');
                
                // Р”РµР±Р°СѓРЅСЃ вЂ” СЃРѕС…СЂР°РЅСЏРµРј С‡РµСЂРµР· 500РјСЃ РїРѕСЃР»Рµ РїРѕСЃР»РµРґРЅРµРіРѕ РёР·РјРµРЅРµРЅРёСЏ
                if (saveTimeoutRef.current) {
                    clearTimeout(saveTimeoutRef.current);
                }
                
                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        console.log('[Supabase] Saving data for user:', USER_ID);
                        
                        const { error: saveError } = await supabase.from('user_data').upsert({
                            user_id: USER_ID,
                            data: newData
                        });
                        
                        if (saveError) throw saveError;
                        
                        console.log('[Supabase] Data saved successfully');
                        setSyncStatus('saved');
                        setLastSyncTime(new Date());
                        
                        // РЎР±СЂР°СЃС‹РІР°РµРј СЃС‚Р°С‚СѓСЃ С‡РµСЂРµР· 2 СЃРµРєСѓРЅРґС‹
                        if (syncIndicatorTimeoutRef.current) {
                            clearTimeout(syncIndicatorTimeoutRef.current);
                        }
                        syncIndicatorTimeoutRef.current = setTimeout(() => {
                            setSyncStatus('idle');
                        }, 2000);
                        
                    } catch (err) {
                        console.error('[Supabase] Error saving data:', err);
                        setSyncStatus('error');
                    }
                }, 500);
            }, []);

            // РћР±РЅРѕРІР»РµРЅРёРµ РєРѕРЅРєСЂРµС‚РЅРѕРіРѕ РєР»СЋС‡Р° РІ РґР°РЅРЅС‹С…
            const updateKey = useCallback((key, value) => {
                setData(prev => {
                    const newData = { ...prev, [key]: value };
                    saveData(newData);
                    return newData;
                });
            }, [saveData]);

            useEffect(() => {
                loadData();
            }, [loadData]);

            return (
                <DataContext.Provider value={{ data, loading, error, syncStatus, lastSyncTime, updateKey, saveData, reload: loadData }}>
                    {children}
                </DataContext.Provider>
            );
        };

        const useData = () => useContext(DataContext);

        const useCloudStorage = (key, initialValue) => {
            const { data, updateKey } = useData();
            
            const value = data?.[key] ?? initialValue;

        const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

        // --- Budget Tab ---

            const [isAddingCategory, setIsAddingCategory] = useState(false);

            // РћРїРµСЂР°С†РёРё: РїРѕР»РЅРѕС†РµРЅРЅС‹Р№ РєР°Р»РµРЅРґР°СЂСЊ (РјРµСЃСЏС†/РіРѕРґ)
            const [selectedDateObj, setSelectedDateObj] = useState(() => startOfDay(new Date()));
            const [opsViewMonth, setOpsViewMonth] = useState(() => new Date(selectedDateObj.getFullYear(), selectedDateObj.getMonth(), 1));

            // РџР»Р°С‚РµР¶Рё: РєР°Р»РµРЅРґР°СЂСЊ СЃ РЅР°РІРёРіР°С†РёРµР№ РїРѕ РјРµСЃСЏС†Р°Рј (РґР»СЏ РІС‹Р±РѕСЂР° РґРЅСЏ)
            const [selectedBillDateObj, setSelectedBillDateObj] = useState(() => startOfDay(new Date()));
            const [billsViewMonth, setBillsViewMonth] = useState(() => new Date(selectedBillDateObj.getFullYear(), selectedBillDateObj.getMonth(), 1));

            const [transactions, setTransactions] = useCloudStorage('transactions', []);

            useEffect(() => {
                if (!transactions || transactions.length === 0) return;
                const needs = transactions.some(t => !t.dateKey);
                if (!needs) return;
                setTransactions(transactions.map(t => {
                    if (t.dateKey) return t;

            const [newTrans, setNewTrans] = useState({ amount: '', title: '', type: 'expense', category: '' });

            // Р•СЃР»Рё РєР°С‚РµРіРѕСЂРёСЏ РІ С„РѕСЂРјРµ РЅРµРІР°Р»РёРґРЅР° вЂ” РїРѕРґС…РІР°С‚С‹РІР°РµРј РїРµСЂРІСѓСЋ РёР· СЃРїРёСЃРєР°
            useEffect(() => {
                if (!Array.isArray(categories) || categories.length === 0) return;
                if (!newTrans.category || !categories.includes(newTrans.category)) {
                    setNewTrans(prev => ({ ...prev, category: categories[0] }));

            const [newBill, setNewBill] = useState({ title: '', amount: '' });
            const [goalForm, setGoalForm] = useState({ title: '', targetAmount: '', currentAmount: '', date: '' });
            const [manualBalanceInput, setManualBalanceInput] = useState('');

            // РўРµРєСѓС‰РёР№ РјРµСЃСЏС† РґР»СЏ СЂР°СЃС‡С‘С‚РѕРІ Р»РёРјРёС‚РѕРІ
            const today0 = startOfDay(new Date());
            const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;

                        stats[c] = (stats[c] || 0) + Number(t.amount || 0);

                return Object.entries(stats)
                    .map(([name, amount]) => ({ name, amount }))
                    .sort((a, b) => b.amount - a.amount);

            const getFinancialAdvice = async () => {

                ];

                };

                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                const remaining = Math.max(0, targetAmount - currentAmount);
                return Math.ceil(remaining / diffDays);

                    if (d.getFullYear() !== opsViewMonth.getFullYear() || d.getMonth() !== opsViewMonth.getMonth()) return;

                    return new Date(year, monthIndex + 1, 0);

                return d;

            const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

            const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

                if (!form.name.trim()) return;

                const day = Number(form.day);

                const year = form.year ? Number(form.year) : null;

                    name: form.name.trim(),

                    note: form.note.trim()

                if (editingBirthday) {
                    setBirthdays(birthdays.map(b => b.id === editingBirthday.id ? { ...b, ...payload } : b));

                    setBirthdays([{ id: String(Date.now()), ...payload, createdAt: Date.now() }, ...birthdays]);
                }

            };

            const handleDelete = () => {
                if (!editingBirthday) return;
                setBirthdays(birthdays.filter(b => b.id !== editingBirthday.id));
                setModalOpen(false);

            const daysInViewMonth = useMemo(() => {
                return new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();

                // JS: 0=Р’СЃ..6=РЎР± в†’ РґРµР»Р°РµРј 0=РџРЅ..6=Р’СЃ

                const yearNow = today.getFullYear();

                            </div>

                                <Icons.ChevronRight className="w-5 h-5" />

        // --- Statistics Tab (Р±С‹РІС€Р°СЏ "Р“Р»Р°РІРЅР°СЏ") ---

            const today = new Date();
            const today0 = startOfDay(today);

            const nearestCreditPayment = useMemo(() => {
                if (!bills || bills.length === 0) return null;

                const currentYear = today0.getFullYear();
                const currentMonth = today0.getMonth();

                const nextOccurrence = (dayOfMonth) => {
                    const d1 = new Date(currentYear, currentMonth, dayOfMonth);
                    const candidate = startOfDay(d1);
                    if (candidate >= today0) return candidate;
                    return startOfDay(new Date(currentYear, currentMonth + 1, dayOfMonth));
                };

                const candidates = bills
                    .filter(b => !b.paid)
                    .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                    .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());

                return candidates[0] || null;
            }, [bills]);

            // --- Analytics ---
            const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today0);
            const prevMonthDate = new Date(today0.getFullYear(), today0.getMonth() - 1, 1);
            const prevMonthKey = monthKey(prevMonthDate);

            const txMonthKey = (t) => {
                if (t.dateKey) return String(t.dateKey).slice(0, 7);
                if (t.createdAt) return monthKey(startOfDay(new Date(t.createdAt)));
                return currentMonthKey;
            };

            const expensesCurrentMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            const expensesPrevMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === prevMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, prevMonthKey]);

            const spentProgress = useMemo(() => {
                if (!monthLimit) return 0;
                return Math.min(100, Math.round((expensesCurrentMonth / Number(monthLimit)) * 100));

            const expensesByCategory = useMemo(() => {

                (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .forEach(t => {
                        const c = t.category || 'Р Р°Р·РЅРѕРµ';
                        stats[c] = (stats[c] || 0) + Number(t.amount || 0);

                return Object.entries(stats)
                    .map(([name, amount]) => ({ name, amount }))

                const palette = ['#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#0ea5e9', '#64748b', '#22c55e', '#a855f7'];

                let accAngle = 0;
                const arcs = expensesByCategory.map((x, i) => {
                    const frac = total > 0 ? x.amount / total : 0;
                    const start = accAngle;
                    const end = accAngle + frac * 360;
                    accAngle = end;
                    return { ...x, frac, start, end, color: palette[i % palette.length] };
                });

                return { total, arcs };
            }, [expensesByCategory]);

            const polarToCartesian = (cx, cy, r, angleDeg) => {
                const a = (angleDeg - 90) * Math.PI / 180.0;
                return { x: cx + (r * Math.cos(a)), y: cy + (r * Math.sin(a)) };
            };

            const describeArc = (cx, cy, r, startAngle, endAngle) => {
                const start = polarToCartesian(cx, cy, r, endAngle);
                const end = polarToCartesian(cx, cy, r, startAngle);
                const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
                return [
                    'M', start.x, start.y,
                    'A', r, r, 0, largeArcFlag, 0, end.x, end.y,
                    'L', cx, cy,
                    'Z'

                                </div>

                                </div>

                    )}

                    {/* РќРѕРІС‹Рµ РІРёРґР¶РµС‚С‹ Р°РЅР°Р»РёС‚РёРєРё */}
                    <section>
                        <SectionHeader title="РђРЅР°Р»РёС‚РёРєР°" />

                        {/* Pie Chart + Р»РµРіРµРЅРґР° */}
                        <BentoCard className="!p-4">
                            <div className="flex items-center justify-between mb-3">
                                <div>
                                    <p className={THEME.label}>РљР°С‚РµРіРѕСЂРёРё С‚СЂР°С‚</p>
                                    <p className="text-sm text-slate-500 font-medium">{today.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}</p>
                                </div>
                                <div className="text-xs font-black px-2.5 py-1 rounded-full bg-slate-50 text-slate-500">
                                    {pieData.total > 0 ? `${expensesByCategory.length} РєР°С‚.` : 'РЅРµС‚ РґР°РЅРЅС‹С…'}
                                </div>
                            </div>

                            <div className="flex gap-4">
                                <div className="shrink-0">
                                    <svg width="140" height="140" viewBox="0 0 140 140" className="block">
                                        <circle cx="70" cy="70" r="56" fill="#f1f5f9" />
                                        {pieData.arcs.map((a, i) => (
                                            a.frac > 0 ? (
                                                <path key={i} d={describeArc(70, 70, 56, a.start, a.end)} fill={a.color} />

                                        <circle cx="70" cy="70" r="34" fill="white" />

                                                <div key={c.name} className="flex items-center justify-between gap-2">

                                            </div>
                                        )}

                            </div>
                        </BentoCard>

                        {/* Progress: РџРѕС‚СЂР°С‡РµРЅРѕ РѕС‚ Р±СЋРґР¶РµС‚Р° */}
                        <BentoCard className="!p-4">

                                <div>

                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {Object.entries(categoryLimits)
                                        .filter(([_, lim]) => typeof lim === 'number' && Number.isFinite(lim) && lim > 0)

                                </div>
                                <div className={`text-xs font-black px-2.5 py-1 rounded-full ${compare.diff > 0 ? 'bg-rose-50 text-rose-600' : compare.diff < 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-50 text-slate-500'}`}>
                                    {compare.diff > 0 ? 'Р‘РѕР»СЊС€Рµ' : compare.diff < 0 ? 'РњРµРЅСЊС€Рµ' : 'Р РѕРІРЅРѕ'}

                            </div>

                            <div className="mt-3 grid grid-cols-2 gap-3">

        // --- Home Tab (Р’Р°Р¶РЅРѕРµ): Р»РёС‡РЅР°СЏ СЃС‚СЂР°РЅРёС†Р°, Р·Р°РјРµС‚РєРё Рё Р¶РёР·РЅРµРЅРЅС‹Рµ С†РµР»Рё ---

            const today = new Date();
            const today0 = startOfDay(today);
            const timeGreeting = today.getHours() < 12 ? 'Р”РѕР±СЂРѕРµ СѓС‚СЂРѕ' : today.getHours() < 18 ? 'Р”РѕР±СЂС‹Р№ РґРµРЅСЊ' : 'Р”РѕР±СЂС‹Р№ РІРµС‡РµСЂ';

            // Theme toggle
            const [theme, setTheme] = useLocalStorage('lifehub_theme', 'light');
            useEffect(() => {

            // Notes (РїРµСЂРµРЅРѕСЃ РёР· Р±С‹РІС€РµР№ РІРєР»Р°РґРєРё "Р—Р°РјРµС‚РєРё")

            const [isNoteModalOpen, setNoteModalOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [noteForm, setNoteForm] = useState({ title: '', content: '', color: 'bg-amber-100' });
            const noteColors = ['bg-amber-100', 'bg-emerald-100', 'bg-violet-100', 'bg-rose-100', 'bg-sky-100'];

                                        <input
                                            value={noteForm.title}
                                            onChange={e => setNoteForm({ ...noteForm, title: e.target.value })}
                                            placeholder="РќР°Р·РІР°РЅРёРµ"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>РЎРѕРґРµСЂР¶Р°РЅРёРµ</label>
                                        <textarea
                                            value={noteForm.content}
                                            onChange={e => setNoteForm({ ...noteForm, content: e.target.value })}
                                            placeholder="РўРµРєСЃС‚..."
                                            rows={4}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Р¦РІРµС‚</label>
                                        <div className="flex gap-2">
                                            {noteColors.map(color => (
                                                <button
                                                    key={color}
                                                    onClick={() => setNoteForm({ ...noteForm, color })}
                                                    className={`w-10 h-10 rounded-xl ${color} ${noteForm.color === color ? 'ring-2 ring-slate-400 ring-offset-2' : ''}`}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={saveNote} className="w-full pt-2">
                                    <div className="bg-amber-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingNote ? 'РЎРѕС…СЂР°РЅРёС‚СЊ' : 'РЎРѕР·РґР°С‚СЊ'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}

                    {/* Life goal modal */}
                    {isLifeGoalModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setLifeGoalModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingLifeGoal ? 'Р РµРґР°РєС‚РёСЂРѕРІР°РЅРёРµ' : 'РќРѕРІР°СЏ С†РµР»СЊ'}</h2>
                                    {editingLifeGoal && (
                                        <button onClick={deleteLifeGoal} className="bg-rose-50 p-3 rounded-full text-rose-500">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-2">
                                    <label className={THEME.label}>Р¤РѕСЂРјСѓР»РёСЂРѕРІРєР°</label>
                                    <input
                                        value={lifeGoalDraft}
                                        onChange={(e) => setLifeGoalDraft(e.target.value)}
                                        className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        placeholder="РќР°РїСЂ: РџСЂРѕР±РµР¶Р°С‚СЊ 5 РєРј"
                                        autoFocus
                                    />
                                </div>

                                <PressableScale onClick={saveLifeGoal} className="w-full pt-2">
                                    <div className="bg-slate-900 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">РЎРѕС…СЂР°РЅРёС‚СЊ</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Sync Status Indicator ---
        const SyncIndicator = () => {
            const { syncStatus, lastSyncTime } = useData();
            
            if (syncStatus === 'idle' && !lastSyncTime) return null;
            
            const statusConfig = {
                idle: { icon: null, text: '', bg: '' },
                saving: { icon: Icons.Loader, text: 'РЎРѕС…СЂР°РЅРµРЅРёРµ...', bg: 'bg-amber-50 text-amber-700 border-amber-100' },
                saved: { icon: Icons.CheckCircle, text: 'РЎРѕС…СЂР°РЅРµРЅРѕ', bg: 'bg-emerald-50 text-emerald-700 border-emerald-100' },
                error: { icon: Icons.AlertTriangle, text: 'РћС€РёР±РєР° СЃРёРЅС…СЂРѕРЅРёР·Р°С†РёРё', bg: 'bg-rose-50 text-rose-700 border-rose-100' }
            };
            
            const config = statusConfig[syncStatus];
            if (!config || syncStatus === 'idle') return null;
            
            const IconComponent = config.icon;
            
            return (
                <div className={`fixed top-2 left-1/2 -translate-x-1/2 z-[100] px-4 py-2 rounded-full border shadow-lg flex items-center gap-2 text-xs font-bold ${config.bg} animate-fadeIn`}>
                    {IconComponent && <IconComponent className="w-4 h-4" />}
                    <span>{config.text}</span>
                </div>
            );
        };
        
        // --- Debug Panel (РјРѕР¶РЅРѕ СЃРєСЂС‹С‚СЊ РІ РїСЂРѕРґР°РєС€РµРЅРµ) ---
        const DebugPanel = () => {
            const [isOpen, setIsOpen] = useState(false);
            const { lastSyncTime } = useData();
            
            return (
                <div className="fixed top-14 right-2 z-[100]">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-lg shadow-lg"
                    >
                        {isOpen ? 'вњ•' : 'Debug'}
                    </button>
                    
                    {isOpen && (
                        <div className="mt-2 bg-white border border-slate-200 rounded-xl p-3 shadow-xl text-xs w-64 max-h-80 overflow-auto">
                            <div className="font-bold text-slate-800 mb-2">Debug Info</div>
                            <div className="space-y-1 text-slate-600">
                                <div><span className="font-bold">User ID:</span> {USER_ID}</div>
                                <div><span className="font-bold">Telegram:</span> {window.Telegram?.WebApp ? 'Р”Р°' : 'РќРµС‚'}</div>
                                <div><span className="font-bold">initDataUnsafe.user.id:</span> {window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 'null'}</div>
                                <div><span className="font-bold">РџРѕСЃР»РµРґРЅСЏСЏ СЃРёРЅС…СЂРѕРЅРёР·Р°С†РёСЏ:</span> {lastSyncTime ? lastSyncTime.toLocaleTimeString('ru-RU') : 'РЅРµС‚'}</div>
                            </div>
                            <div className="mt-3 pt-2 border-t border-slate-100">
                                <div className="font-bold text-slate-800 mb-1">initDataUnsafe:</div>
                                <pre className="text-[9px] bg-slate-50 p-2 rounded overflow-auto max-h-32">
                                    {JSON.stringify(window.Telegram?.WebApp?.initDataUnsafe, null, 2) || 'null'}
                                </pre>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const { loading, error } = useData();
            const [activeTab, setActiveTab] = useState('home');

            // РџРѕРєР°Р·С‹РІР°РµРј Р»РѕР°РґРµСЂ РїРѕРєР° РґР°РЅРЅС‹Рµ Р·Р°РіСЂСѓР¶Р°СЋС‚СЃСЏ РёР· Supabase
            if (loading) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
                        <Icons.Loader className="w-12 h-12 text-slate-400 mb-4" />
                        <p className="text-slate-500 font-bold">Р—Р°РіСЂСѓР·РєР° РґР°РЅРЅС‹С…...</p>
                        <p className="text-slate-400 text-sm mt-2">РЎРёРЅС…СЂРѕРЅРёР·Р°С†РёСЏ СЃ РѕР±Р»Р°РєРѕРј</p>
                        <p className="text-slate-300 text-xs mt-4">User ID: {USER_ID}</p>
                    </div>
                );
            }

            // РџРѕРєР°Р·С‹РІР°РµРј РѕС€РёР±РєСѓ РµСЃР»Рё РЅРµ СѓРґР°Р»РѕСЃСЊ Р·Р°РіСЂСѓР·РёС‚СЊ
            if (error) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
                        <Icons.AlertTriangle className="w-16 h-16 text-amber-500 mb-4" />
                        <h1 className="text-xl font-bold text-slate-800 mb-2">РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё</h1>
                        <p className="text-slate-500 text-center mb-4">{error}</p>
                        <p className="text-slate-300 text-xs mb-4">User ID: {USER_ID}</p>
                        <button
                            onClick={() => window.location.reload()}
                            className="bg-slate-900 text-white px-6 py-3 rounded-full font-bold"
                        >
                            РџРµСЂРµР·Р°РіСЂСѓР·РёС‚СЊ
                        </button>
                    </div>
                );
            }

            // Tabs (СЂРѕРІРЅРѕ 4): Р“Р»Р°РІРЅР°СЏ (Р’Р°Р¶РЅРѕРµ) в†’ Р‘СЋРґР¶РµС‚ в†’ РЎС‚Р°С‚РёСЃС‚РёРєР° в†’ Р”РѕРј
            const tabs = [
                { id: 'home', icon: Icons.Home, label: 'Р“Р»Р°РІРЅР°СЏ' },
                { id: 'budget', icon: Icons.Wallet, label: 'Р‘СЋРґР¶РµС‚' },
                { id: 'stats', icon: Icons.PieChart, label: 'РЎС‚Р°С‚РёСЃС‚РёРєР°' },
                { id: 'supplies', icon: Icons.Package, label: 'Р”РѕРј' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'home': return <HomeTab />;
                    case 'budget': return <BudgetTab />;
                    case 'stats': return <StatisticsTab />;
                    case 'supplies': return <SuppliesTab />;
                    default: return <HomeTab />;
                }
            };

            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-slate-50 w-full max-w-full overflow-x-hidden">
                        {/* Sync Status Indicator */}
                        <SyncIndicator />
                        
                        {/* Debug Panel (РјРѕР¶РЅРѕ СѓР±СЂР°С‚СЊ РІ РїСЂРѕРґР°РєС€РµРЅРµ) */}
                        <DebugPanel />
                        
                        <main className="w-full max-w-md mx-auto px-4 sm:px-5 pb-28 overflow-x-hidden">
                            {renderTab()}
                        </main>

                        {/* Bottom Navigation - fixed for mobile */}
                        <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-slate-100 px-2 pt-2 safe-bottom z-50" style={{ paddingBottom: 'max(env(safe-area-inset-bottom), 0.5rem)' }}>
                            <div className="w-full max-w-md mx-auto flex justify-around items-center">
                                {tabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    const TabIcon = tab.icon;
                                    return (
                                        <PressableScale
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className="flex flex-col items-center gap-0.5 py-1.5 px-1 min-w-0 flex-1 no-select"
                                        >
                                            <div className={`p-2 rounded-xl transition-all ${isActive ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>
                                                <TabIcon className="w-5 h-5" />
                                            </div>
                                            <span className={`text-[9px] font-bold uppercase tracking-wider truncate ${isActive ? 'text-slate-900' : 'text-slate-400'}`}>
                                                {tab.label}
                                            </span>
                                        </PressableScale>
                                    );
                                })}
                            </div>
                        </nav>
                    </div>
                </ErrorBoundary>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <DataProvider>
                <App />
            </DataProvider>
        );
    </script>
</body>
</html>
