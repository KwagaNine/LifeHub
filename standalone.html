            const [habitBusyId, setHabitBusyId] = useState(null);
            const [toast, setToast] = useState(null); // { title, message, tone }
            const [xpParticles, setXpParticles] = useState([]);

            const HABIT_ICONS = ['🚬', '🍺', '🍬', '🎮', '📱', '🤬', '🍔', '💅', '⚡️'];

            const showToast = useCallback((title, message = '', tone = 'info') => {
                setToast({ id: Date.now(), title, message, tone });
                setTimeout(() => setToast(null), 2200);
            }, []);

            const addXpParticle = useCallback((x, y, text) => {
                const id = Date.now() + Math.random();
                setXpParticles(prev => [...prev, { id, x, y, text }]);
                setTimeout(() => setXpParticles(prev => prev.filter(p => p.id !== id)), 950);
            }, []);

            const hapticImpact = useCallback((style = 'medium') => {
                try {
                    if (window.Telegram?.WebApp?.HapticFeedback?.impactOccurred) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred(style);
                    }
                } catch (e) {}
            }, []);

            const formatHMS = (totalSeconds) => {
                const s = Math.max(0, Math.floor(totalSeconds));
                const hh = Math.floor(s / 3600);
                const mm = Math.floor((s % 3600) / 60);
                const ss = s % 60;
                return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
            };

            // Tick once per second for "live" timers
            useEffect(() => {
                const id = setInterval(() => setHabitNow(Date.now()), 1000);
                return () => clearInterval(id);
            }, []);

            const refreshUserXp = useCallback(async () => {
                try {
                    await supabase.rpc('ensure_user_profile', { p_user_id: USER_ID });
                    const { data: profile, error: profileErr } = await supabase
                        .from('user_profile')
                        .select('user_xp')
                        .eq('user_id', USER_ID)
                        .single();
                    if (profileErr) throw profileErr;
                    const xp = Number(profile?.user_xp || 0);
                    setUserXp(xp);
                    setXpLoaded(true);

                    // Инициализация трекера уровня: на загрузке просто фиксируем уровень,
                    // без каких-либо уведомлений.
                    if (!levelTracker.ready) {
                        levelTracker.ready = true;
                        levelTracker.prevLevel = calcLevel(xp);
                    }

                    return xp;
                } catch (e) {
                    console.warn('refreshUserXp failed:', e);
                    return null;
                }
            }, []);

            const loadHabits = useCallback(async () => {
                setHabitsError('');
                setHabitsLoading(true);
                try {
                    // Wallet XP (важно для общего уровня, даже если habits-таблица не готова)
                    await refreshUserXp();

                    // Habits list (если таблица/политики не готовы — не ломаем весь блок уровней)
                    const { data: rows, error: habitsErr } = await supabase
                        .from('habits')
                        .select('id,user_id,title,icon,start_date,last_claim_date,total_xp_earned,xp_rate,created_at')
                        .eq('user_id', USER_ID)
                        .order('created_at', { ascending: false });

                    if (habitsErr) {
                        console.warn('Habits load warning:', habitsErr);
                        setHabits([]);
                        setHabitsError('Не удалось загрузить привычки (таблица habits / RLS / RPC).');
                    } else {
                        setHabits(Array.isArray(rows) ? rows : []);
                    }
                } catch (e) {
                    console.error('Habits load error:', e);
                    // Если даже профиль не загрузился — показываем ошибку
                    setHabitsError('Не удалось загрузить данные XP/привычек. Проверьте SQL-скрипт (user_profile, habits, RPC).');
                } finally {
                    setHabitsLoading(false);
                }
            }, [refreshUserXp]);

            useEffect(() => {
                loadHabits();
            }, [loadHabits]);

            const habitsVM = useMemo(() => {
                return (habits || []).map(h => {
                    const last = new Date(h.last_claim_date || h.created_at || Date.now()).getTime();
                    const unclaimedMs = Math.max(0, habitNow - last);
                    const unclaimedSeconds = unclaimedMs / 1000;
                    const pending = Math.floor((unclaimedMs / 3600000) * Number(h.xp_rate || 10));
                    return {
                        ...h,
                        _lastMs: last,
                        _unclaimedSeconds: unclaimedSeconds,
                        _timer: formatHMS(unclaimedSeconds),
                        _pendingXp: Math.max(0, pending)
                    };
                });
            }, [habits, habitNow]);

            const createHabit = async () => {
                const title = String(habitForm.title || '').trim();
                const icon = String(habitForm.icon || '⚡️');
                if (!title) return;

                setHabitsError('');
                setHabitBusyId('new');
                try {
                    await supabase.rpc('ensure_user_profile', { p_user_id: USER_ID });
                    const { error: insErr } = await supabase
                        .from('habits')
                        .insert({
                            user_id: USER_ID,
                            title,
                            icon,
                            xp_rate: 10,
                            start_date: new Date().toISOString().slice(0, 10),
                            last_claim_date: new Date().toISOString(),
                        });
                    if (insErr) throw insErr;

                    setHabitModalOpen(false);
                    setHabitForm({ title: '', icon: '⚡️' });
                    showToast('Привычка создана', 'Теперь майните XP воздержанием.', 'success');
                    await loadHabits();
                } catch (e) {
                    console.error('Create habit error:', e);
                    showToast('Ошибка', 'Не удалось создать привычку.', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            const claimHabit = async (habitId, evt) => {
                setHabitBusyId(habitId);
                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('habit_claim', {
                        p_user_id: USER_ID,
                        p_habit_id: habitId,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    const added = Number(row?.added_xp || 0);
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) setUserXp(wallet);
                    else await refreshUserXp();

                    setHabits(prev => (prev || []).map(h => h.id === habitId ? ({
                        ...h,
                        last_claim_date: new Date().toISOString(),
                        total_xp_earned: Number(h.total_xp_earned || 0) + added,
                    }) : h));

                    hapticImpact('medium');

                    // Juicy effects
                    try {
                        const x = evt?.clientX || window.innerWidth * 0.7;
                        const y = evt?.clientY || window.innerHeight * 0.35;
                        addXpParticle(x, y, `+${added} XP`);
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 26, spread: 45, origin: { x: x / window.innerWidth, y: y / window.innerHeight }, scalar: 0.9 });
                        }
                    } catch (e) {}

                    if (added > 0) showToast('Собрано!', `+${added} XP`, 'success');
                    else showToast('Пока рано', 'Накопите немного времени.', 'info');
                } catch (e) {
                    console.error('Claim habit error:', e);
                    const msg = (e && (e.message || e.details || e.hint))
                        ? [e.message, e.details, e.hint].filter(Boolean).join(' • ')
                        : String(e || '');
                    showToast('Ошибка', msg || 'Не удалось собрать XP. Проверьте SQL/RPC habit_claim и права доступа (GRANT EXECUTE).', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            const relapseHabit = async (habitId) => {
                if (!confirm('Срыв? Вы потеряете XP по штрафу x2 от несобранной награды.')) return;
                setHabitBusyId(habitId);
                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('habit_relapse', {
                        p_user_id: USER_ID,
                        p_habit_id: habitId,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    const lost = Number(row?.lost_xp || 0);
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) setUserXp(wallet);
                    else await refreshUserXp();

                    setHabits(prev => (prev || []).map(h => h.id === habitId ? ({
                        ...h,
                        last_claim_date: new Date().toISOString(),
                    }) : h));

                    hapticImpact('light');
                    showToast('Срыв!', `Вы потеряли ${lost} XP (x2)`, 'error');
                } catch (e) {
                    console.error('Relapse habit error:', e);
                    const msg = (e && (e.message || e.details || e.hint))
                        ? [e.message, e.details, e.hint].filter(Boolean).join(' • ')
                        : String(e || '');
                    showToast('Ошибка', msg || 'Не удалось применить срыв. Проверьте SQL/RPC habit_relapse и права доступа.', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            const deleteHabit = async (habitId) => {
                if (!confirm('Удалить привычку? Весь опыт, добытый этой привычкой, будет аннулирован.')) return;
                setHabitBusyId(habitId);
                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('habit_delete', {
                        p_user_id: USER_ID,
                        p_habit_id: habitId,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    const lost = Number(row?.lost_xp || 0);
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) setUserXp(wallet);
                    else await refreshUserXp();

                    setHabits(prev => (prev || []).filter(h => h.id !== habitId));

                    hapticImpact('medium');
                    showToast('Привычка удалена', `Прогресс аннулирован (-${lost} XP)`, 'error');
                } catch (e) {
                    console.error('Delete habit error:', e);
                    const msg = (e && (e.message || e.details || e.hint))
                        ? [e.message, e.details, e.hint].filter(Boolean).join(' • ')
                        : String(e || '');
                    showToast('Ошибка', msg || 'Не удалось удалить привычку. Проверьте SQL/RPC habit_delete и права доступа.', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            // Editable greeting
            const [customGreeting, setCustomGreeting] = useLocalStorage('lifehub_home_greeting', `${timeGreeting}! 👋`);
            const [isEditingGreeting, setIsEditingGreeting] = useState(false);
            const [greetingDraft, setGreetingDraft] = useState(customGreeting);

            // Theme toggle
            const [theme, setTheme] = useLocalStorage('lifehub_theme', 'light');
            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'dark') root.classList.add('dark');
                else root.classList.remove('dark');
            }, [theme]);

            // Notes (перенос из бывшей вкладки "Заметки")
            const [notes, setNotes] = useLocalStorage('lifehub_notes', [
                { id: '1', title: 'Идеи', content: 'Сделать привычку читать 20 минут в день', color: 'bg-amber-100', createdAt: Date.now() },
                { id: '2', title: 'Планы', content: 'Разобрать бюджет и обновить цели', color: 'bg-emerald-100', createdAt: Date.now() - 86400000 },
            ]);
            const [isNoteModalOpen, setNoteModalOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [noteForm, setNoteForm] = useState({ title: '', content: '', color: 'bg-amber-100' });
            const noteColors = ['bg-amber-100', 'bg-emerald-100', 'bg-violet-100', 'bg-rose-100', 'bg-sky-100'];

            const openAddNote = () => {
                setEditingNote(null);
                setNoteForm({ title: '', content: '', color: 'bg-amber-100' });
                setNoteModalOpen(true);
            };
            const openEditNote = (note) => {
                setEditingNote(note);
                setNoteForm({ title: note.title, content: note.content, color: note.color });
                setNoteModalOpen(true);
            };
            const saveNote = () => {
                if (!noteForm.title.trim()) return;
                if (editingNote) {
                    setNotes(notes.map(n => n.id === editingNote.id ? { ...n, ...noteForm } : n));
                } else {
                    setNotes([{ id: String(Date.now()), ...noteForm, createdAt: Date.now() }, ...notes]);
                }
                setNoteModalOpen(false);
            };
            const deleteNote = () => {
                if (!editingNote) return;
                setNotes(notes.filter(n => n.id !== editingNote.id));
                setNoteModalOpen(false);
            };

            // Achievements / Life goals (новый блок)
            const [lifeGoals, setLifeGoals] = useLocalStorage('lifehub_life_goals', [
                { id: 'lg1', title: 'Сделать чек-лист целей', done: true, createdAt: Date.now() - 3 * 86400000 },
                { id: 'lg2', title: 'Нарисовать картину', done: false, createdAt: Date.now() - 2 * 86400000 },
                { id: 'lg3', title: 'Пройти 10 000 шагов', done: false, createdAt: Date.now() - 86400000 },
            ]);
            const [isLifeGoalModalOpen, setLifeGoalModalOpen] = useState(false);
            const [editingLifeGoal, setEditingLifeGoal] = useState(null);
            const [lifeGoalDraft, setLifeGoalDraft] = useState('');
            
            // --- Общая система XP/Уровней (единая для Целей + Привычек) ---
            // Источник истины: Supabase user_profile.user_xp (state userXp).
            const [archivedGoals, setArchivedGoals] = useLocalStorage('lifehub_goals_archived', []);
            const [showArchiveModal, setShowArchiveModal] = useState(false);
            const [showStageClearModal, setShowStageClearModal] = useState(false);
            const [stageClearCount, setStageClearCount] = useState(0);

            // Общий XP (общий для целей и привычек)
            const goalsXP = useMemo(() => Number(userXp || 0), [userXp]);
            const goalsLevel = useMemo(() => calcLevel(goalsXP), [goalsXP]);

            // Прогресс XP до следующего уровня
            const xpForCurrentLevel = useMemo(() => {
                const totalXPForPrevLevels = (Number(goalsLevel) - 1) * XP_PER_LEVEL;
                return Math.max(0, Number(goalsXP) - totalXPForPrevLevels);
            }, [goalsXP, goalsLevel]);

            const xpProgress = useMemo(() => {
                return Math.min(100, (xpForCurrentLevel / XP_PER_LEVEL) * 100);
            }, [xpForCurrentLevel]);

            // Уведомление о повышении уровня: показываем только ПОСЛЕ того,
            // как первый раз загрузили XP из Supabase. На старте — не показываем.
            useEffect(() => {
                // Пока XP не загружен — вообще ничего не показываем.
                if (!xpLoaded) return;

                const current = goalsLevel;

                // Если prevLevel ещё не инициализирован — инициализируем и не показываем уведомление.
                if (!levelTracker.ready) {
                    levelTracker.ready = true;
                    levelTracker.prevLevel = current;
                    return;
                }

                // Показываем тост только при реальном росте уровня в результате действий пользователя.
                if (current > Number(levelTracker.prevLevel || 1)) {
                    try {
                        if (window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred) {
                            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                        }
                    } catch (e) {}
                    showToast('Новый уровень!', `Lvl ${current}`, 'success');
                }

                levelTracker.prevLevel = current;
            }, [xpLoaded, goalsLevel, showToast]);

            // Атомарно добавить/убавить XP в Supabase кошельке.
            // Если RPC не настроен — не блокируем UI, просто показываем предупреждение.
            const addUserXp = useCallback(async (delta) => {
                const d = Number(delta || 0);
                if (!Number.isFinite(d) || d === 0) return null;

                // Оптимистично обновляем UI сразу (чтобы шкала XP не "стояла")
                setUserXp(prev => Math.max(0, Number(prev || 0) + d));

                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('user_add_xp', {
                        p_user_id: USER_ID,
                        p_amount: d,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) {
                        setUserXp(wallet);
                        return wallet;
                    }

                    // На всякий случай дотягиваем актуальное значение из БД
                    const refreshed = await refreshUserXp();
                    return refreshed;
                } catch (e) {
                    console.error('user_add_xp error:', e);
                    // UI уже обновлён оптимистично; просто предупреждаем
                    showToast('Внимание', 'XP не удалось синхронизировать (RPC user_add_xp).', 'error');
                    // Попробуем всё равно подтянуть актуальный wallet из БД чуть позже
                    setTimeout(() => { refreshUserXp(); }, 800);
                    return null;
                }
            }, [showToast, refreshUserXp]);

            // Авто-архивация при 100% выполнении
            const handleStageClear = useCallback(() => {
                if ((lifeGoals || []).length === 0) return;

                const count = (lifeGoals || []).length;
                setStageClearCount(count);

                // Архивируем все цели
                const completedGoals = (lifeGoals || []).map(g => ({
                    ...g,
                    archivedAt: Date.now()
                }));

                setArchivedGoals(prev => [...completedGoals, ...(prev || [])]);

                // Очищаем текущий список
                setLifeGoals([]);

                // Показываем модалку "Stage Clear"
                setShowStageClearModal(true);

                // Закрываем через 3 секунды
                setTimeout(() => {
                    setShowStageClearModal(false);
                }, 3000);
            }, [lifeGoals, setArchivedGoals, setLifeGoals]);

            // Important reminders (новая функция)
            const [reminders, setReminders] = useLocalStorage('lifehub_reminders', [
                { id: 'r1', text: 'Позвонить родителям', createdAt: Date.now() - 3600_000 },
                { id: 'r2', text: 'Записаться к врачу', createdAt: Date.now() - 7200_000 },
            ]);
            const [reminderDraft, setReminderDraft] = useState('');
            const addReminder = () => {
                const t = (reminderDraft || '').trim();
                if (!t) return;
                setReminders([{ id: String(Date.now()), text: t, createdAt: Date.now() }, ...(reminders || [])]);
                setReminderDraft('');
            };
            const deleteReminder = (id) => setReminders((reminders || []).filter(r => r.id !== id));

            // Ideas (wishlist) — новый блок
            const [ideasTitle] = useLocalStorage('lifehub_ideas_title', 'Идеи');

            const [ideas, setIdeas] = useLocalStorage('lifehub_ideas', []);
            const [ideaDraft, setIdeaDraft] = useState('');

            // миграция: если ранее в localStorage могли быть строки вместо объектов
            useEffect(() => {
                if (!Array.isArray(ideas) || ideas.length === 0) return;
                const needs = ideas.some(x => typeof x === 'string');
                if (!needs) return;
                setIdeas(ideas.map((x, idx) => (typeof x === 'string' ? { id: String(Date.now() + idx), text: x, createdAt: Date.now() } : x)));
            }, []);

            const addIdea = () => {
                const t = String(ideaDraft || '').trim();
                if (!t) return;
                setIdeas([{ id: String(Date.now()), text: t, createdAt: Date.now() }, ...(ideas || [])]);
                setIdeaDraft('');
            };

            const deleteIdea = (id) => setIdeas((ideas || []).filter(x => x.id !== id));

            const openAddLifeGoal = () => {
                setEditingLifeGoal(null);
                setLifeGoalDraft('');
                setLifeGoalModalOpen(true);
            };
            const openEditLifeGoal = (g) => {
                setEditingLifeGoal(g);
                setLifeGoalDraft(g.title);
                setLifeGoalModalOpen(true);
            };
            const saveLifeGoal = () => {
                const t = (lifeGoalDraft || '').trim();
                if (!t) return;
                if (editingLifeGoal) {
                    setLifeGoals(lifeGoals.map(g => g.id === editingLifeGoal.id ? { ...g, title: t } : g));
                } else {
                    setLifeGoals([{ id: String(Date.now()), title: t, done: false, createdAt: Date.now() }, ...lifeGoals]);
                }
                setLifeGoalModalOpen(false);
            };
            const deleteLifeGoal = () => {
                if (!editingLifeGoal) return;
                setLifeGoals(lifeGoals.filter(g => g.id !== editingLifeGoal.id));
                setLifeGoalModalOpen(false);
            };
            const toggleLifeGoal = (id) => setLifeGoals(lifeGoals.map(g => g.id === id ? { ...g, done: !g.done } : g));

            const doneCount = (lifeGoals || []).filter(g => g.done).length;
            const totalCount = (lifeGoals || []).length;
            const progressPercent = totalCount === 0 ? 0 : Math.round((doneCount / totalCount) * 100);
            const isAllComplete = totalCount > 0 && doneCount === totalCount;

            // Sorted goals: active first, then completed
            const sortedLifeGoals = useMemo(() => {
                return [...(lifeGoals || [])].sort((a, b) => {
                    if (a.done === b.done) return 0;
                    return a.done ? 1 : -1; // active first
                });
            }, [lifeGoals]);

            // Sound effect for completing a goal (short pop sound)
            const playCompleteSound = useCallback(() => {
                try {
                    // Short "pop" sound - base64 encoded for reliability
                    const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU' + 
                        'tvT19' + 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
                        'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA');
                    audio.volume = 0.3;
                    audio.play().catch(() => {});
                } catch (e) {
                    // Silently fail if sound doesn't work
                }
            }, []);

            // Confetti explosion at coordinates
            const fireConfetti = useCallback((originX = 0.5, originY = 0.5, big = false) => {
                try {
                    if (typeof confetti !== 'function') return;
                    
                    if (big) {
                        // Big celebration for 100% completion
                        const duration = 3000;
                        const end = Date.now() + duration;
                        
                        const colors = ['#f59e0b', '#fbbf24', '#10b981', '#8b5cf6', '#ef4444'];
                        
                        (function frame() {
                            confetti({
                                particleCount: 5,
                                angle: 60,
                                spread: 55,
                                origin: { x: 0 },
                                colors: colors
                            });
                            confetti({
                                particleCount: 5,
                                angle: 120,
                                spread: 55,
                                origin: { x: 1 },
                                colors: colors
                            });
                            
                            if (Date.now() < end) {
                                requestAnimationFrame(frame);
                            }
                        })();
                    } else {
                        // Small burst for single goal completion
                        confetti({
                            particleCount: 50,
                            spread: 60,
                            origin: { x: originX, y: originY },
                            colors: ['#10b981', '#fbbf24', '#8b5cf6'],
                            ticks: 100,
                            gravity: 1.2,
                            scalar: 0.9
                        });
                    }
                } catch (e) {
                    // Silently fail if confetti doesn't work
                }
            }, []);

            // Haptic feedback
            const triggerHaptic = useCallback((type = 'medium') => {
                try {
                    if (window.Telegram?.WebApp?.HapticFeedback?.impactOccurred) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
                    }
                } catch (e) {
                    // Silently fail
                }
            }, []);

            // Enhanced toggle with gamification effects
            const toggleLifeGoalWithEffects = useCallback((id, event) => {
                const goal = (lifeGoals || []).find(g => g.id === id);
                if (!goal) return;

                const willBeDone = !goal.done;

                // Calculate if this will complete ALL goals
                const newDoneCount = willBeDone ? doneCount + 1 : doneCount - 1;
                const willBeAllComplete = totalCount > 0 && newDoneCount === totalCount;

                // Haptic feedback
                triggerHaptic(willBeDone ? 'medium' : 'light');

                // If marking as done
                if (willBeDone) {
                    // Play sound
                    playCompleteSound();

                    // +XP за выполнение цели (единый XP кошелёк, общий с привычками)
                    addUserXp(XP_PER_GOAL);
                } else {
                    // Если снимаем галочку — возвращаем XP обратно
                    addUserXp(-XP_PER_GOAL);
                }

                // If marking as done
                if (willBeDone) {

                    // Get click position for confetti origin
                    let originX = 0.5;
                    let originY = 0.5;
                    if (event) {
                        const rect = event.currentTarget?.getBoundingClientRect?.();
                        if (rect) {
                            originX = (rect.left + rect.width / 2) / window.innerWidth;
                            originY = (rect.top + rect.height / 2) / window.innerHeight;
                        }
                    }

                    // Fire confetti
                    setTimeout(() => {
                        fireConfetti(originX, originY, false);

                        // If all goals complete, fire big celebration after small one
                        if (willBeAllComplete) {
                            setTimeout(() => {
                                triggerHaptic('heavy');
                                fireConfetti(0.5, 0.5, true);

                                // Авто-архивация через 1.5 секунды после большого конфетти
                                setTimeout(() => {
                                    handleStageClear();
                                }, 1500);
                            }, 300);
                        }
                    }, 100);
                }

                // Update state
                setLifeGoals((lifeGoals || []).map(g => g.id === id ? { ...g, done: willBeDone } : g));
            }, [lifeGoals, doneCount, totalCount, triggerHaptic, playCompleteSound, fireConfetti, addUserXp, handleStageClear]);

            // Дни рождения (вернули функционал на Главную)
            const [birthdays, setBirthdays] = useLocalStorage('lifehub_birthdays', []);
            const [bills] = useLocalStorage('lifehub_bills', []);

            const [isBirthdaysManagerOpen, setBirthdaysManagerOpen] = useState(false);
            const [isBirthdayModalOpen, setBirthdayModalOpen] = useState(false);
            const [editingBirthday, setEditingBirthday] = useState(null);
            const [birthdayForm, setBirthdayForm] = useState({
                name: '',
                day: today0.getDate(),
                month: today0.getMonth() + 1,
                year: '',
                note: ''
            });

            // safeDate как function (хойстится), чтобы использовать выше по коду
            function safeDate(year, monthIndex, day) {
                const d = new Date(year, monthIndex, day);
                if (d.getMonth() !== monthIndex) return new Date(year, monthIndex + 1, 0);
                return d;
            }

            // Полноэкранный менеджер календаря ДР (внутри Главной)
            const [bdViewMonth, setBdViewMonth] = useState(() => new Date(today0.getFullYear(), today0.getMonth(), 1));
            const [bdSelectedDate, setBdSelectedDate] = useState(() => today0);

            const birthdaysMarkersByDay = useMemo(() => {
                const map = {};
                const m = bdViewMonth.getMonth() + 1;
                const y = bdViewMonth.getFullYear();
                (birthdays || []).forEach(b => {
                    if (Number(b.month) !== m) return;
                    const d = safeDate(y, m - 1, Number(b.day) || 1);
                    const day = d.getDate();
                    map[day] = (map[day] || 0) + 1;
                });
                return map;
            }, [birthdays, bdViewMonth]);

            const birthdaysForSelectedManagerDay = useMemo(() => {
                const d = bdSelectedDate.getDate();
                const m = bdSelectedDate.getMonth() + 1;
                return (birthdays || []).filter(b => Number(b.day) === d && Number(b.month) === m);
            }, [birthdays, bdSelectedDate]);

            const openAddBirthday = (presetDate = today0) => {
                const d = presetDate || today0;
                setEditingBirthday(null);
                setBirthdayForm({ name: '', day: d.getDate(), month: d.getMonth() + 1, year: '', note: '' });
                setBirthdayModalOpen(true);
            };

            const openEditBirthday = (b) => {
                setEditingBirthday(b);
                setBirthdayForm({
                    name: b?.name || '',
                    day: Number(b?.day) || today0.getDate(),
                    month: Number(b?.month) || (today0.getMonth() + 1),
                    year: b?.year ? String(b.year) : '',
                    note: b?.note || ''
                });
                setBirthdayModalOpen(true);
            };

            const saveBirthday = () => {
                const name = String(birthdayForm.name || '').trim();
                if (!name) return;
                const payload = {
                    name,
                    day: Math.min(31, Math.max(1, Number(birthdayForm.day) || 1)),
                    month: Math.min(12, Math.max(1, Number(birthdayForm.month) || 1)),
                    year: birthdayForm.year ? Number(birthdayForm.year) : null,
                    note: String(birthdayForm.note || '').trim(),
                };

                if (editingBirthday?.id) {
                    setBirthdays((birthdays || []).map(x => x.id === editingBirthday.id ? { ...x, ...payload } : x));
                } else {
                    setBirthdays([{ id: String(Date.now()), ...payload, createdAt: Date.now() }, ...(birthdays || [])]);
                }
                setBirthdayModalOpen(false);
            };

            const deleteBirthday = () => {
                if (!editingBirthday?.id) return;
                setBirthdays((birthdays || []).filter(x => x.id !== editingBirthday.id));
                setBirthdayModalOpen(false);
            };

            // (safeDate определён выше как function safeDate())

            const upcomingBirthdays = useMemo(() => {
                if (!birthdays || birthdays.length === 0) return [];
                const year = today0.getFullYear();
                const candidates = birthdays
                    .map(b => ({ b, occ: safeDate(year, b.month - 1, b.day) }))
                    .filter(x => x.occ >= today0)
                    .sort((a, b) => a.occ.getTime() - b.occ.getTime());
                return candidates.slice(0, 3);
            }, [birthdays]);

            const nearestBirthday = upcomingBirthdays[0] || null;

            const nearestPayment = useMemo(() => {
                if (!bills || bills.length === 0) return null;
                const currentYear = today0.getFullYear();
                const currentMonth = today0.getMonth();
                const nextOccurrence = (dayOfMonth) => {
                    const candidate = startOfDay(new Date(currentYear, currentMonth, dayOfMonth));
                    if (candidate >= today0) return candidate;
                    return startOfDay(new Date(currentYear, currentMonth + 1, dayOfMonth));
                };
                const candidates = bills
                    .filter(b => !b.paid)
                    .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                    .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());
                return candidates[0] || null;
            }, [bills]);

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4">
                        <div className="flex items-start justify-between gap-3">
                            {!isEditingGreeting ? (
                                <div>
                                    <p className={THEME.label}>Важное</p>
                                    <h1 className="text-3xl font-extrabold text-slate-800 leading-tight mt-1">{customGreeting}</h1>
                                </div>
                            ) : (
                                <div className="flex-1">
                                    <p className={THEME.label}>Важное</p>
                                </div>
                            )}

                            {/* Moon toggle instead of text theme button */}
                            <div className="flex items-center gap-2">
                                <PressableScale
                                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                                    className="bg-white border border-slate-100 shadow-sm p-2.5 rounded-2xl text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-colors"
                                    title={theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'}
                                >
                                    <Icons.Moon className="w-5 h-5" />
                                </PressableScale>

                                {!isEditingGreeting && (
                                    <PressableScale
                                        onClick={() => { setGreetingDraft(customGreeting); setIsEditingGreeting(true); }}
                                        className="bg-white border border-slate-100 shadow-sm p-2.5 rounded-2xl text-slate-400 hover:text-slate-700"
                                        title="Изменить приветствие"
                                    >
                                        <Icons.Pencil className="w-4 h-4" />
                                    </PressableScale>
                                )}
                            </div>
                        </div>

                        {isEditingGreeting && (
                            <div className="mt-3 bg-white border border-slate-100 rounded-3xl p-4 shadow-sm">
                                <div className="flex items-center gap-2">
                                    <input
                                        value={greetingDraft}
                                        onChange={(e) => setGreetingDraft(e.target.value)}
                                        className="flex-1 bg-slate-50 rounded-2xl px-4 py-3 font-bold text-slate-800 outline-none"
                                        placeholder="Введите заголовок..."
                                        autoFocus
                                    />
                                    <PressableScale
                                        onClick={() => {
                                            const next = (greetingDraft || '').trim();
                                            setCustomGreeting(next || `${timeGreeting}!`);
                                            setIsEditingGreeting(false);
                                        }}
                                        className="px-4 py-3 rounded-2xl bg-emerald-500 text-white font-bold"
                                        title="Сохранить"
                                    >
                                        <Icons.Check className="w-5 h-5" />
                                    </PressableScale>
                                    <PressableScale
                                        onClick={() => { setIsEditingGreeting(false); setGreetingDraft(customGreeting); }}
                                        className="px-4 py-3 rounded-2xl bg-slate-100 text-slate-500 font-bold"
                                        title="Отмена"
                                    >
                                        <Icons.X className="w-5 h-5" />
                                    </PressableScale>
                                </div>
                                <p className="text-xs text-slate-400 mt-3">Например: «Фокус на здоровье» или «Главное на сегодня».</p>
                            </div>
                        )}
                    </header>

                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">Достижения / Цели</h2>
                            <div className="flex items-center gap-2">
                                {/* Кнопка архива */}
                                <PressableScale
                                    onClick={() => setShowArchiveModal(true)}
                                    className="bg-slate-100 p-2.5 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-200"
                                    title="История достижений"
                                >
                                    <Icons.Clock className="w-4 h-4" />
                                </PressableScale>
                                {/* Кнопка добавить */}
                                <PressableScale
                                    onClick={openAddLifeGoal}
                                    className="bg-slate-900 p-2.5 rounded-xl text-white shadow-sm"
                                    title="Добавить цель"
                                >
                                    <Icons.Plus className="w-4 h-4" />
                                </PressableScale>
                            </div>
                        </div>
                        <BentoCard className={`!p-4 ${isAllComplete ? 'celebrate' : ''}`}>
                            {/* Level & XP header */}
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center gap-3">
                                    {/* Level badge */}
                                    <div className="bg-gradient-to-br from-amber-400 to-amber-500 text-white px-3 py-1.5 rounded-xl shadow-lg shadow-amber-200">
                                        <span className="text-xs font-black">Lvl {goalsLevel}</span>
                                    </div>
                                    <div>
                                        <p className={THEME.label}>Прогресс целей</p>
                                        <p className="text-lg font-extrabold text-slate-800">{doneCount} / {totalCount}</p>
                                    </div>
                                </div>
                                <div className={`text-xs font-black px-2.5 py-1 rounded-full ${isAllComplete ? 'bg-amber-100 text-amber-700' : 'bg-slate-50 text-slate-500'}`}>
                                    {progressPercent}%
                                </div>
                            </div>
                            
                            {/* XP progress bar */}
                            <div className="mb-3 bg-slate-50 rounded-2xl p-3 border border-slate-100">
                                <div className="flex items-center justify-between mb-1.5">
                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Опыт (XP)</span>
                                    <span className="text-xs font-bold text-amber-600">{xpForCurrentLevel} / {XP_PER_LEVEL}</span>
                                </div>
                                <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full rounded-full bg-gradient-to-r from-amber-400 to-amber-500 progress-bar-animated"
                                        style={{ width: `${xpProgress}%` }}
                                    />
                                </div>
                                <p className="text-[10px] text-slate-400 mt-1.5">+{XP_PER_GOAL} XP за каждую выполненную цель</p>
                            </div>
                            
                            {/* Goals progress bar */}
                            {totalCount > 0 && (
                                <div className="mb-4">
                                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                        <div 
                                            className={`h-full rounded-full progress-bar-animated ${isAllComplete ? 'progress-bar-complete' : 'bg-emerald-400'}`}
                                            style={{ width: `${progressPercent}%` }}
                                        />
                                    </div>
                                    {isAllComplete && (
                                        <p className="text-xs font-bold text-amber-600 mt-2 text-center animate-fadeIn">
                                            🎉 Все цели выполнены! Архивируем...
                                        </p>
                                    )}
                                </div>
                            )}

                            {/* Goals list - sorted: active first, completed last */}
                            <div className="space-y-2">
                                {sortedLifeGoals.length > 0 ? sortedLifeGoals.map(g => (
                                    <div 
                                        key={g.id} 
                                        className={`goal-item flex items-center justify-between gap-3 py-2 ${g.done ? 'completed' : ''}`}
                                    >
                                        <button
                                            onClick={(e) => toggleLifeGoalWithEffects(g.id, e)}
                                            className="flex items-center gap-3 text-left flex-1"
                                        >
                                            <div className={`w-9 h-9 rounded-2xl flex items-center justify-center transition-all duration-300 ${g.done ? 'bg-emerald-100 text-emerald-600 scale-110' : 'bg-slate-100 text-slate-400'}`}>
                                                {g.done ? <Icons.CheckCircle className="w-5 h-5" /> : <Icons.Circle className="w-5 h-5" />}
                                            </div>
                                            <div>
                                                <p className={`font-bold transition-all duration-300 ${g.done ? 'text-slate-400 line-through' : 'text-slate-800'}`}>{g.title}</p>
                                                <p className="text-xs text-slate-400">
                                                    {g.done ? '✓ Выполнено' : 'Нажмите, чтобы отметить'}
                                                </p>
                                            </div>
                                        </button>
                                        <div className="flex items-center gap-2">
                                            <PressableScale onClick={() => openEditLifeGoal(g)} className="p-2 rounded-xl bg-slate-50 text-slate-400 hover:text-slate-700">
                                                <Icons.Pencil className="w-4 h-4" />
                                            </PressableScale>
                                        </div>
                                    </div>
                                )) : (
                                    <div className="py-8 text-center text-slate-300">
                                        <Icons.Target className="w-12 h-12 mx-auto mb-3 opacity-50" />
                                        <p className="text-sm font-medium">Добавьте первую цель</p>
                                    </div>
                                )}
                            </div>

                            {/* Habit Tracker встроен в тот же блок (общие XP/уровень) */}
                            <div className="mt-6 pt-5 border-t border-slate-100">
                                <div className="flex items-start justify-between gap-3 mb-3">
                                    <div className="min-w-0">
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">Трекер привычек</span>
                                            <span className="text-[10px] font-black text-slate-300">•</span>
                                            <span className="text-[10px] font-black text-slate-400">{(habitsVM || []).length} шт.</span>
                                        </div>
                                        <p className="text-xs text-slate-400 font-medium mt-1">Майнинг XP за воздержание</p>
                                    </div>
                                    <PressableScale
                                        onClick={() => { setHabitForm({ title: '', icon: '⚡️' }); setHabitModalOpen(true); }}
                                        className="bg-slate-900 p-2.5 rounded-xl text-white shadow-sm shrink-0"
                                        title="Добавить привычку"
                                    >
                                        <Icons.Plus className="w-4 h-4" />
                                    </PressableScale>
                                </div>

                                {habitsLoading ? (
                                    <div className="py-6 text-center text-slate-300">
                                        <Icons.Loader className="w-8 h-8 mx-auto mb-3 opacity-60" />
                                        <p className="text-sm font-medium">Загрузка привычек...</p>
                                    </div>
                                ) : habitsError ? (
                                    <div className="bg-rose-50 border border-rose-100 rounded-2xl p-4 text-rose-700">
                                        <p className="font-extrabold text-sm">Ошибка привычек</p>
                                        <p className="text-xs font-medium mt-1">{habitsError}</p>
                                        <button
                                            onClick={loadHabits}
                                            className="mt-3 text-xs font-black px-3 py-2 rounded-xl bg-white/70 border border-rose-100"
                                        >
                                            Повторить
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {habitsVM.length > 0 ? habitsVM.map(h => (
                                            <div key={h.id} className="bg-slate-50 border border-slate-100 rounded-3xl p-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-2xl bg-white border border-slate-100 flex items-center justify-center text-2xl shadow-sm shrink-0">
                                                        {h.icon || '⚡️'}
                                                    </div>

                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-start justify-between gap-3">
                                                            <div className="min-w-0">
                                                                <p className="font-extrabold text-slate-800 truncate">{h.title}</p>
                                                                <p className="text-xs text-slate-400 font-bold mt-1">
                                                                    {h._timer} • +{Number(h._pendingXp).toLocaleString('ru-RU')} XP
                                                                </p>
                                                            </div>

                                                            <div className="flex items-center gap-2 shrink-0">
                                                                <button
                                                                    onClick={() => relapseHabit(h.id)}
                                                                    disabled={habitBusyId === h.id}
                                                                    className="px-3 py-2 rounded-2xl bg-amber-50 text-amber-700 text-xs font-black border border-amber-100 hover:bg-amber-100 disabled:opacity-50"
                                                                    title="Срыв (штраф x2 от несобранного)"
                                                                >
                                                                    Срыв
                                                                </button>
                                                                <button
                                                                    onClick={() => deleteHabit(h.id)}
                                                                    disabled={habitBusyId === h.id}
                                                                    className="p-2.5 rounded-2xl bg-rose-50 text-rose-600 border border-rose-100 hover:bg-rose-100 disabled:opacity-50"
                                                                    title="Удалить привычку (аннулирует весь прогресс)"
                                                                >
                                                                    <Icons.Trash className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        </div>

                                                        <div className="mt-3">
                                                            <PressableScale
                                                                onClick={(e) => claimHabit(h.id, e)}
                                                                disabled={habitBusyId === h.id}
                                                                className="w-full"
                                                            >
                                                                <div className={`h-12 rounded-2xl flex items-center justify-center font-extrabold shadow-sm transition-all ${habitBusyId === h.id ? 'bg-slate-200 text-slate-500' : 'bg-emerald-500 text-white hover:bg-emerald-600'}`}>
                                                                    {habitBusyId === h.id ? '...' : 'Собрать'}
                                                                </div>
                                                            </PressableScale>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )) : (
                                            <div className="py-8 text-center text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                <div className="text-4xl mb-2">⛏️</div>
                                                <p className="text-sm font-medium">Добавьте привычку</p>
                                                <p className="text-xs mt-1">Например: «Не курить», «Не есть сладкое»</p>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </BentoCard>
                    </section>

                    {/* Habit modal: create */}
                    {isHabitModalOpen && (
                        <div className="fixed inset-0 z-[150] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setHabitModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp max-h-[90vh] overflow-y-auto scrollbar-hide">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">Новая привычка</h2>
                                    <button onClick={() => setHabitModalOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-400" title="Закрыть">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Иконка</label>
                                        <div className="flex flex-wrap gap-2">
                                            {HABIT_ICONS.map(ic => {
                                                const selected = habitForm.icon === ic;
                                                return (
                                                    <button
                                                        key={ic}
                                                        onClick={() => setHabitForm(prev => ({ ...prev, icon: ic }))}
                                                        className={`w-12 h-12 rounded-2xl border flex items-center justify-center text-2xl transition-all ${selected ? 'bg-violet-50 border-violet-200 ring-2 ring-violet-200' : 'bg-slate-50 border-slate-100 hover:bg-slate-100'}`}
                                                        title={ic}
                                                    >
                                                        {ic}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={habitForm.title}
                                            onChange={(e) => setHabitForm(prev => ({ ...prev, title: e.target.value }))}
                                            placeholder="Напр: Не курить"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="text-xs text-slate-400 font-medium bg-slate-50 border border-slate-100 rounded-2xl p-4">
                                        Награда копится с момента последнего сбора. Чем дольше держитесь — тем больше XP нужно собрать.
                                    </div>
                                </div>

                                <PressableScale onClick={createHabit} className="w-full pt-1" disabled={habitBusyId === 'new'}>
                                    <div className={`h-14 rounded-3xl flex items-center justify-center shadow-xl ${habitBusyId === 'new' ? 'bg-slate-200 text-slate-500' : 'bg-slate-900 text-white'}`}>
                                        <span className="font-bold text-lg">Создать</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}

                    {/* Habit Toast */}
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[220] w-[92vw] max-w-md px-4">
                            <div className={`toast-in rounded-2xl border shadow-lg px-4 py-3 bg-white ${toast.tone === 'error' ? 'border-rose-100' : toast.tone === 'success' ? 'border-emerald-100' : 'border-slate-100'}`}>
                                <div className="flex items-start justify-between gap-3">
                                    <div className="min-w-0">
                                        <div className={`text-sm font-extrabold ${toast.tone === 'error' ? 'text-rose-700' : toast.tone === 'success' ? 'text-emerald-700' : 'text-slate-800'}`}>{toast.title}</div>

                                    </div>
                                    
                                    {/* Список архивных целей */}
                                    <div className="space-y-3">
                                        {(archivedGoals || []).length > 0 ? (
                                            (archivedGoals || []).map((g, idx) => (
                                                <div 
                                                    key={g.id + '-' + idx}
                                                    className="bg-slate-50 border border-slate-100 rounded-2xl p-4 flex items-start gap-3"
                                                >
                                                    <div className="w-9 h-9 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                                                        <Icons.CheckCircle className="w-5 h-5" />
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <p className="font-bold text-slate-800">{g.title}</p>
                                                        <p className="text-xs text-slate-400 mt-1">
                                                            Выполнено: {g.archivedAt ? new Date(g.archivedAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Дата неизвестна'}
                                                        </p>
                                                    </div>
                                                    <div className="text-xs font-black text-amber-600 bg-amber-50 px-2 py-1 rounded-full shrink-0">
                                                        +{XP_PER_GOAL} XP
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-48 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                <Icons.Clock className="w-12 h-12 mb-3 opacity-50" />
                                                <p className="text-sm font-medium">История пуста</p>
                                                <p className="text-xs mt-1">Выполняйте цели, чтобы они появились здесь</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Stage Clear Modal - Уведомление об архивации */}
                    {showStageClearModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-md" />
                            <div className="bg-white rounded-[32px] p-8 shadow-2xl relative animate-zoomIn text-center max-w-sm">
                                <div className="text-6xl mb-4">🏆</div>
                                <h2 className="text-2xl font-extrabold text-slate-900 mb-2">Все цели достигнуты!</h2>
                                <p className="text-slate-500 mb-4">Список очищен и перемещён в архив. Готовы к новым свершениям!</p>
                                <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4">
                                    <p className="text-sm font-bold text-amber-700">
                                        Очищено целей: {stageClearCount}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Sync Status Indicator ---
        const SyncIndicator = () => {
            const { syncStatus, lastSyncTime } = useData();
            
            if (syncStatus === 'idle' && !lastSyncTime) return null;
            
            const statusConfig = {
                idle: { icon: null, text: '', bg: '' },
                saving: { icon: Icons.Loader, text: 'Сохранение...', bg: 'bg-amber-50 text-amber-700 border-amber-100' },
                saved: { icon: Icons.CheckCircle, text: 'Сохранено', bg: 'bg-emerald-50 text-emerald-700 border-emerald-100' },
                error: { icon: Icons.AlertTriangle, text: 'Ошибка синхронизации', bg: 'bg-rose-50 text-rose-700 border-rose-100' }
            };
            
            const config = statusConfig[syncStatus];
            if (!config || syncStatus === 'idle') return null;
            
            const IconComponent = config.icon;
            
            return (
                <div className={`fixed top-2 left-1/2 -translate-x-1/2 z-[100] px-4 py-2 rounded-full border shadow-lg flex items-center gap-2 text-xs font-bold ${config.bg} animate-fadeIn`}>
                    {IconComponent && <IconComponent className="w-4 h-4" />}
                    <span>{config.text}</span>
                </div>
            );
        };
        
        // --- Debug Panel (можно скрыть в продакшене) ---
        const DebugPanel = () => {
            const [isOpen, setIsOpen] = useState(false);
            const { lastSyncTime } = useData();

            // Показываем Debug только:
            // 1) в режиме разработки (тестовый пользователь), или
            // 2) если явно включено через параметр ?debug=1
            const allowDebug = (() => {
                try {
                    if (String(USER_ID) === '111111') return true;
                    const qs = new URLSearchParams(window.location.search);
                    if (qs.get('debug') === '1') return true;
                    const hash = String(window.location.hash || '').replace(/^#/, '');
                    const hs = new URLSearchParams(hash);
                    if (hs.get('debug') === '1') return true;
                } catch (e) {}
                return false;
            })();

            if (!allowDebug) return null;
            
            return (
                <div className="fixed top-14 right-2 z-[100]">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-lg shadow-lg"
                    >
                        {isOpen ? '✕' : 'Debug'}
                    </button>
                    
                    {isOpen && (
                        <div className="mt-2 bg-white border border-slate-200 rounded-xl p-3 shadow-xl text-xs w-64 max-h-80 overflow-auto">
                            <div className="font-bold text-slate-800 mb-2">Debug Info</div>
                            <div className="space-y-1 text-slate-600">
                                <div><span className="font-bold">User ID:</span> {USER_ID}</div>
                                <div><span className="font-bold">Telegram:</span> {window.Telegram?.WebApp ? 'Да' : 'Нет'}</div>
                                <div><span className="font-bold">initDataUnsafe.user.id:</span> {window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 'null'}</div>
                                <div><span className="font-bold">Последняя синхронизация:</span> {lastSyncTime ? lastSyncTime.toLocaleTimeString('ru-RU') : 'нет'}</div>
                            </div>
                            <div className="mt-3 pt-2 border-t border-slate-100">
                                <div className="font-bold text-slate-800 mb-1">initDataUnsafe:</div>
                                <pre className="text-[9px] bg-slate-50 p-2 rounded overflow-auto max-h-32">
                                    {JSON.stringify(window.Telegram?.WebApp?.initDataUnsafe, null, 2) || 'null'}
                                </pre>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const { loading, error } = useData();
            const [activeTab, setActiveTab] = useState('home');

            // Показываем лоадер пока данные загружаются из Supabase
            if (loading) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
                        <Icons.Loader className="w-12 h-12 text-slate-400 mb-4" />
                        <p className="text-slate-500 font-bold">Загрузка данных...</p>
                        <p className="text-slate-400 text-sm mt-2">Синхронизация с облаком</p>
                        <p className="text-slate-300 text-xs mt-4">User ID: {USER_ID}</p>
                    </div>
                );
            }

            // Показываем ошибку если не удалось загрузить
            if (error) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
                        <Icons.AlertTriangle className="w-16 h-16 text-amber-500 mb-4" />
                        <h1 className="text-xl font-bold text-slate-800 mb-2">Ошибка загрузки</h1>
                        <p className="text-slate-500 text-center mb-4">{error}</p>
                        <p className="text-slate-300 text-xs mb-4">User ID: {USER_ID}</p>
                        <button
                            onClick={() => window.location.reload()}
                            className="bg-slate-900 text-white px-6 py-3 rounded-full font-bold"
                        >
                            Перезагрузить
                        </button>
                    </div>
                );
            }

            // Tabs (ровно 4): Главная (Важное) → Бюджет → Статистика → Дом
            const tabs = [
                { id: 'home', icon: Icons.Home, label: 'Главная' },
                { id: 'budget', icon: Icons.Wallet, label: 'Бюджет' },
                { id: 'stats', icon: Icons.PieChart, label: 'Статистика' },
                { id: 'supplies', icon: Icons.Package, label: 'Дом' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'home': return <HomeTab />;
                    case 'budget': return <BudgetTab />;
                    case 'stats': return <StatisticsTab />;
                    case 'supplies': return <SuppliesTab />;
                    default: return <HomeTab />;
                }
            };

            return (
                <ErrorBoundary>
                    <div className="app-container bg-slate-50">
                        {/* Sync Status Indicator */}
                        <SyncIndicator />
                        
                        {/* Debug Panel (можно убрать в продакшене) */}
                        <DebugPanel />
                        
                        {/* Scrollable content area - ends BEFORE navbar */}
                        <main className="app-content w-full max-w-md mx-auto px-4 sm:px-5">
                            {renderTab()}
                        </main>

                        {/* Bottom Navigation - fixed at very bottom, z-index ниже модалок */}
                        <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-xl border-t border-slate-100 safe-bottom px-2 pt-2" style={{ paddingBottom: 'max(0.5rem, env(safe-area-inset-bottom))' }}>
                            <div className="w-full max-w-md mx-auto flex justify-around items-center h-full">
                                {tabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    const TabIcon = tab.icon;
                                    return (
                                        <PressableScale
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className="flex flex-col items-center gap-0.5 py-1.5 px-1 min-w-0 flex-1 no-select"
                                        >
                                            <div className={`p-2 rounded-xl transition-all ${isActive ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>
                                                <TabIcon className="w-5 h-5" />
                                            </div>
                                            <span className={`text-[9px] font-bold uppercase tracking-wider truncate ${isActive ? 'text-slate-900' : 'text-slate-400'}`}>
                                                {tab.label}
                                            </span>
                                        </PressableScale>
                                    );
                                })}
                            </div>
                        </nav>
                    </div>
                </ErrorBoundary>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <DataProvider>
                <App />
            </DataProvider>
        );
    </script>
</body>
</html>
