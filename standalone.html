                                    {selectedItem.notes && <div className="inv-tip"><Icons.StickyNote className="w-5 h-5 text-slate-500 flex-none" /><span>{selectedItem.notes}</span></div>}
                                </div>
                                <div className="flex flex-wrap justify-end gap-2 mt-5">
                                    <button onClick={() => updateItem(selectedItem, { shopping: true }, 'Добавлено в покупки')} className="inv-secondary"><Icons.ShoppingCart className="w-4 h-4" />Добавить в покупки</button>
                                    <button onClick={() => openEditItem(selectedItem)} className="inv-secondary"><Icons.Pencil className="w-4 h-4" />Редактировать</button>
                                    <button onClick={() => deleteItem(selectedItem)} className="inv-danger"><Icons.Trash className="w-4 h-4" />Удалить</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editorOpen && (
                        <div className="inv-overlay">
                            <div className="absolute inset-0" onClick={() => setEditorOpen(false)} />
                            <div className="inv-sheet relative animate-slideUp">
                                <div className="flex items-start justify-between gap-3 mb-4">
                                    <div><p className="inv-kicker">Запасы</p><h2 className="inv-heading">{itemForm.id ? 'Редактировать товар' : 'Новый товар'}</h2></div>
                                    <button onClick={() => setEditorOpen(false)} className="inv-icon-btn"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <datalist id="inv-category-list">{categories.filter(item => item.id !== 'Все').map(item => <option key={item.id} value={item.id} />)}</datalist>
                                <datalist id="inv-location-list">{locations.map(location => <option key={location} value={location} />)}</datalist>
                                <datalist id="inv-unit-list">{units.map(unit => <option key={unit} value={unit} />)}</datalist>
                                <div className="inv-field mb-3"><label>Название</label><input value={itemForm.name} onChange={e => setItemForm({ ...itemForm, name: e.target.value })} placeholder="Например: яйца" autoFocus /></div>
                                <div className="inv-form-grid">
                                    <div className="inv-field"><label>Категория</label><input list="inv-category-list" value={itemForm.category} onChange={e => setItemForm({ ...itemForm, category: e.target.value })} placeholder="Продукты" /></div>
                                    <div className="inv-field"><label>Место</label><input list="inv-location-list" value={itemForm.location} onChange={e => setItemForm({ ...itemForm, location: e.target.value })} placeholder="Кухня" /></div>
                                    <div className="inv-field"><label>Количество</label><input type="number" inputMode="decimal" value={itemForm.quantity} onChange={e => setItemForm({ ...itemForm, quantity: e.target.value })} placeholder="1" /></div>
                                    <div className="inv-field"><label>Единица</label><input list="inv-unit-list" value={itemForm.unit} onChange={e => setItemForm({ ...itemForm, unit: e.target.value })} placeholder="шт." /></div>
                                    <div className="inv-field"><label>Минимальный остаток</label><input type="number" inputMode="decimal" value={itemForm.minimumQuantity} onChange={e => setItemForm({ ...itemForm, minimumQuantity: e.target.value })} placeholder="Не задан" /></div>
                                    <div className="inv-field"><label>Цена</label><input type="number" inputMode="decimal" value={itemForm.price} onChange={e => setItemForm({ ...itemForm, price: e.target.value })} placeholder="₽" /></div>
                                    <div className="inv-field"><label>Куплено</label><input type="date" value={itemForm.purchaseDate} onChange={e => setItemForm({ ...itemForm, purchaseDate: e.target.value })} /></div>
                                    <div className="inv-field"><label>Срок годности</label><input type="date" value={itemForm.expiryDate} onChange={e => setItemForm({ ...itemForm, expiryDate: e.target.value })} /></div>
                                    <div className="inv-field md:col-span-2"><label>Заметка</label><textarea rows={3} value={itemForm.notes} onChange={e => setItemForm({ ...itemForm, notes: e.target.value })} placeholder="Например: купить такой же бренд" /></div>
                                    <div className="inv-field md:col-span-2"><label>Штрихкод</label><input value={itemForm.barcode} onChange={e => setItemForm({ ...itemForm, barcode: e.target.value })} placeholder="Можно добавить позже" /></div>
                                </div>
                                <div className="flex justify-end gap-2 mt-5">
                                    <button onClick={() => setEditorOpen(false)} className="inv-secondary">Отмена</button>
                                    <button onClick={saveItem} className="inv-primary">{itemForm.id ? 'Сохранить' : 'Добавить товар'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <div className="inv-toast">{toast}</div>}
                </div>
            );
        };

        // --- Statistics Tab (бывшая "Главная") ---
        const StatisticsTab = () => {
            // ЕДИНЫЙ источник: данные Supabase, которые редактируются во вкладке "Бюджет".
            // Никаких fallback на старые localStorage-ключи — иначе будут «не те» значения.
            const { data } = useData();

            const totalBalance = Number(data?.balance ?? 0);
            const transactions = Array.isArray(data?.transactions) ? data.transactions : [];
            const bills = Array.isArray(data?.bills) ? data.bills : [];
            const monthLimit = Number(data?.limit ?? 60000);
            const categoryLimits = (data?.category_limits && typeof data.category_limits === 'object') ? data.category_limits : {};

            // Верхние плашки (Баланс/Расходы/Доходы) → модалки с детализацией
            const [kpiModal, setKpiModal] = useState(null); // 'balance' | 'expenses' | 'income' | null
            const [incomeCatExpanded, setIncomeCatExpanded] = useState(null); // string | null

            // Детализация: расходы по выбранной категории за текущий месяц
            const [categoryDetailsOpen, setCategoryDetailsOpen] = useState(false);
            const [categoryDetailsName, setCategoryDetailsName] = useState(null);

            const today = new Date();
            const today0 = startOfDay(today);

            const nearestCreditPayment = useMemo(() => {
                if (!bills || bills.length === 0) return null;

                const currentYear = today0.getFullYear();
                const currentMonth = today0.getMonth();

                const nextOccurrence = (dayOfMonth) => {
                    const d1 = new Date(currentYear, currentMonth, dayOfMonth);
                    const candidate = startOfDay(d1);
                    if (candidate >= today0) return candidate;
                    return startOfDay(new Date(currentYear, currentMonth + 1, dayOfMonth));
                };

                const candidates = bills
                    .filter(b => !b.paid)
                    .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                    .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());

                return candidates[0] || null;
            }, [bills]);

            // --- Analytics ---
            const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today0);
            const prevMonthDate = new Date(today0.getFullYear(), today0.getMonth() - 1, 1);
            const prevMonthKey = monthKey(prevMonthDate);

            const txMonthKey = (t) => {
                if (t.dateKey) return String(t.dateKey).slice(0, 7);
                if (t.createdAt) return monthKey(startOfDay(new Date(t.createdAt)));
                return currentMonthKey;
            };

            const expensesCurrentMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            const incomeCurrentMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'income' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            // Данные по дням (текущий месяц): доходы/расходы/категории/дельта
            const monthDays = useMemo(() => {
                const y = today0.getFullYear();
                const m = today0.getMonth();
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                return Array.from({ length: daysInMonth }, (_, i) => {
                    const d = new Date(y, m, i + 1);
                    const key = formatDateKey(d);
                    return { date: d, key };
                });
            }, [today0]);

            const monthTx = useMemo(() => {
                return (transactions || []).filter(t => txMonthKey(t) === currentMonthKey);
            }, [transactions, currentMonthKey]);

            const dayStatsMap = useMemo(() => {
                const map = {};
                monthDays.forEach(({ key }) => {
                    map[key] = {
                        key,
                        expenseTotal: 0,
                        incomeTotal: 0,
                        delta: 0,
                        expenseByCategory: {},
                        incomeByCategory: {},
                        items: [],
                    };
                });
                (monthTx || []).forEach(t => {
                    const key = t.dateKey || (t.createdAt ? formatDateKey(startOfDay(new Date(t.createdAt))) : null);
                    if (!key || !map[key]) return;
                    const amount = Number(t.amount || 0);
                    const cat = t.category || 'Разное';
                    map[key].items.push(t);
                    if (t.type === 'expense') {
                        map[key].expenseTotal += amount;
                        map[key].expenseByCategory[cat] = (map[key].expenseByCategory[cat] || 0) + amount;
                    } else {
                        map[key].incomeTotal += amount;
                        map[key].incomeByCategory[cat] = (map[key].incomeByCategory[cat] || 0) + amount;
                    }
                    map[key].delta = map[key].incomeTotal - map[key].expenseTotal;
                });
                return map;
            }, [monthTx, monthDays]);

            const balanceHistory = useMemo(() => {
                // Баланс на конец каждого дня текущего месяца
                // totalBalance — финальный баланс после всех операций.
                // Для дня D: balance(D) = totalBalance - сумма(delta по операциям после D)
                const allTx = (transactions || []).filter(t => t.dateKey);
                const deltasAfter = (dayKey) => {
                    return allTx
                        .filter(t => String(t.dateKey) > dayKey)
                        .reduce((acc, t) => {
                            const a = Number(t.amount || 0);
                            return acc + (t.type === 'income' ? a : -a);
                        }, 0);
                };

                return monthDays.map(({ date, key }) => {
                    const after = deltasAfter(key);
                    const balanceEnd = Number(totalBalance) - Number(after);
                    const stats = dayStatsMap[key] || null;
                    return {
                        date,
                        key,
                        balanceEnd,
                        stats,
                    };
                });
            }, [monthDays, transactions, totalBalance, dayStatsMap]);

            const monthExpenseDays = useMemo(() => {
                return monthDays
                    .map(({ date, key }) => ({ date, key, ...(dayStatsMap[key] || {}) }))
                    .filter(x => Number(x.expenseTotal || 0) > 0)
                    .sort((a, b) => a.date.getTime() - b.date.getTime());
            }, [monthDays, dayStatsMap]);

            const monthIncomeDays = useMemo(() => {
                return monthDays
                    .map(({ date, key }) => ({ date, key, ...(dayStatsMap[key] || {}) }))
                    .filter(x => Number(x.incomeTotal || 0) > 0)
                    .sort((a, b) => a.date.getTime() - b.date.getTime());
            }, [monthDays, dayStatsMap]);

            // Доходы по категориям (сортировка по убыванию суммы) + разбивка по дням
            const incomeByCategory = useMemo(() => {
                const map = {};
                (monthIncomeDays || []).forEach(d => {
                    const cats = d.incomeByCategory || {};
                    Object.entries(cats).forEach(([cat, amount]) => {
                        const a = Number(amount || 0);
                        if (!Number.isFinite(a) || a <= 0) return;
                        if (!map[cat]) map[cat] = { category: cat, total: 0, days: [] };
                        map[cat].total += a;
                        map[cat].days.push({ key: d.key, date: d.date, amount: a });
                    });
                });

                return Object.values(map)
                    .map(x => ({
                        ...x,
                        days: (x.days || []).sort((a, b) => a.date.getTime() - b.date.getTime()),
                    }))
                    .sort((a, b) => Number(b.total) - Number(a.total));
            }, [monthIncomeDays]);

            const expensesPrevMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === prevMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, prevMonthKey]);

            const spentProgress = useMemo(() => {
                if (!monthLimit) return 0;
                return Math.min(100, Math.round((expensesCurrentMonth / Number(monthLimit)) * 100));
            }, [expensesCurrentMonth, monthLimit]);

            const expensesByCategory = useMemo(() => {
                const stats = {};
                (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .forEach(t => {
                        const c = t.category || 'Разное';
                        stats[c] = (stats[c] || 0) + Number(t.amount || 0);
                    });
                return Object.entries(stats)
                    .map(([name, amount]) => ({ name, amount }))
                    .sort((a, b) => b.amount - a.amount);
            }, [transactions, currentMonthKey]);

            const openCategoryDetails = (catName) => {
                setCategoryDetailsName(catName);
                setCategoryDetailsOpen(true);
            };

            const categoryMonthExpenses = useMemo(() => {
                if (!categoryDetailsName) return [];
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey && (t.category || 'Разное') === categoryDetailsName)
                    .sort((a, b) => {
                        const ad = a.dateKey ? (parseDateKey(a.dateKey)?.getTime() || 0) : (a.createdAt || 0);
                        const bd = b.dateKey ? (parseDateKey(b.dateKey)?.getTime() || 0) : (b.createdAt || 0);
                        return bd - ad;
                    });
            }, [transactions, currentMonthKey, categoryDetailsName]);

            const categoryMonthTotal = useMemo(() => {
                return (categoryMonthExpenses || []).reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [categoryMonthExpenses]);

            const pieData = useMemo(() => {
                const total = expensesByCategory.reduce((acc, x) => acc + x.amount, 0);
                const palette = ['#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#0ea5e9', '#64748b', '#22c55e', '#a855f7'];

                let accAngle = 0;
                const arcs = expensesByCategory.map((x, i) => {
                    const frac = total > 0 ? x.amount / total : 0;
                    const start = accAngle;
                    const end = accAngle + frac * 360;
                    accAngle = end;
                    return { ...x, frac, start, end, color: palette[i % palette.length] };
                });

                return { total, arcs };
            }, [expensesByCategory]);

            const polarToCartesian = (cx, cy, r, angleDeg) => {
                const a = (angleDeg - 90) * Math.PI / 180.0;
                return { x: cx + (r * Math.cos(a)), y: cy + (r * Math.sin(a)) };
            };

            const describeArc = (cx, cy, r, startAngle, endAngle) => {
                const start = polarToCartesian(cx, cy, r, endAngle);
                const end = polarToCartesian(cx, cy, r, startAngle);
                const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
                return [
                    'M', start.x, start.y,
                    'A', r, r, 0, largeArcFlag, 0, end.x, end.y,
                    'L', cx, cy,
                    'Z'
                ].join(' ');
            };

            const compare = useMemo(() => {
                const diff = expensesCurrentMonth - expensesPrevMonth;
                const pct = expensesPrevMonth > 0 ? Math.round((diff / expensesPrevMonth) * 100) : null;
                return { diff, pct };
            }, [expensesCurrentMonth, expensesPrevMonth]);

            // (Вычисления календаря платежей удалены)

            return (
                <div className="space-y-6 animate-fadeIn pt-4">
                    {/* Страница начинается сразу с карточек "Баланс" и "Расходы" (шапку убрали) */}

                    <div className="grid grid-cols-3 gap-2">
                        
                        {/* Neon glow: KPI cards */}
                        <PressableScale onClick={() => setKpiModal('balance')} className="text-left w-full min-w-0">
                            <BentoCard className="bg-gradient-to-br from-emerald-50/80 to-emerald-100/40 dark:from-white/10 dark:to-white/5 backdrop-blur-xl !p-3 overflow-hidden border border-white/10 lh-glow-primary">
                                <div className="flex items-center gap-1.5 min-w-0">
                                    <div className="bg-emerald-100 p-1.5 rounded-lg shrink-0">
                                        <Icons.Wallet className="w-3.5 h-3.5 text-emerald-600" />
                                    </div>
                                    <span className="text-[9px] font-extrabold tracking-tight text-slate-600 leading-none truncate min-w-0">Баланс</span>
                                </div>
                                <p className="mt-2 text-[13px] sm:text-lg font-extrabold text-emerald-700 leading-none tracking-tight truncate tabular-nums" title={Number(totalBalance).toLocaleString('ru-RU') + ' ₽'}>
                                    {Number(totalBalance).toLocaleString('ru-RU')} ₽
                                </p>
                                <p className="mt-1 text-[9px] font-bold text-emerald-700/60 leading-none truncate">История</p>
                            </BentoCard>
                        </PressableScale>

                        <PressableScale onClick={() => setKpiModal('expenses')} className="text-left w-full min-w-0">
                            <BentoCard className="bg-gradient-to-br from-rose-50/80 to-rose-100/40 dark:from-white/10 dark:to-white/5 backdrop-blur-xl !p-3 overflow-hidden border border-white/10 lh-glow-primary">
                                <div className="flex items-center gap-1.5 min-w-0">
                                    <div className="bg-rose-100 p-1.5 rounded-lg shrink-0">
                                        <Icons.TrendingDown className="w-3.5 h-3.5 text-rose-600" />
                                    </div>
                                    <span className="text-[9px] font-extrabold tracking-tight text-slate-600 leading-none truncate min-w-0">Расходы</span>
                                </div>
                                <p className="mt-2 text-[13px] sm:text-lg font-extrabold text-rose-700 leading-none tracking-tight truncate tabular-nums" title={Number(expensesCurrentMonth).toLocaleString('ru-RU') + ' ₽'}>
                                    {Number(expensesCurrentMonth).toLocaleString('ru-RU')} ₽
                                </p>
                                <p className="mt-1 text-[9px] font-bold text-rose-700/60 leading-none truncate">По дням</p>
                            </BentoCard>
                        </PressableScale>

                        <PressableScale onClick={() => setKpiModal('income')} className="text-left w-full min-w-0">
                            <BentoCard className="bg-gradient-to-br from-sky-50/80 to-sky-100/40 dark:from-white/10 dark:to-white/5 backdrop-blur-xl !p-3 overflow-hidden border border-white/10 lh-glow-primary">
                                <div className="flex items-center gap-1.5 min-w-0">
                                    <div className="bg-sky-100 p-1.5 rounded-lg shrink-0">
                                        <Icons.TrendingUp className="w-3.5 h-3.5 text-sky-600" />
                                    </div>
                                    <span className="text-[9px] font-extrabold tracking-tight text-slate-600 leading-none truncate min-w-0">Доходы</span>
                                </div>
                                <p className="mt-2 text-[13px] sm:text-lg font-extrabold text-sky-700 leading-none tracking-tight truncate tabular-nums" title={Number(incomeCurrentMonth).toLocaleString('ru-RU') + ' ₽'}>
                                    {Number(incomeCurrentMonth).toLocaleString('ru-RU')} ₽
                                </p>
                                <p className="mt-1 text-[9px] font-bold text-sky-700/60 leading-none truncate">Категории</p>
                            </BentoCard>
                        </PressableScale>
                    </div>

                    {/* Ближайшие платежи/кредиты — показываем 3 с прокруткой */}
                    {(() => {
                        // Вычисляем ближайшие платежи (все неоплаченные, отсортированные по дате)
                        const currentYear = today0.getFullYear();
                        const currentMonth = today0.getMonth();

                        // Функция для корректировки дня платежа с учётом коротких месяцев
                        const getAdjustedDay = (dayOfMonth, year, month) => {
                            const daysInMonth = new Date(year, month + 1, 0).getDate();
                            return Math.min(Number(dayOfMonth) || 1, daysInMonth);
                        };

                        const nextOccurrence = (dayOfMonth) => {
                            // Корректируем день для текущего месяца
                            const adjustedDay = getAdjustedDay(dayOfMonth, currentYear, currentMonth);
                            const d1 = new Date(currentYear, currentMonth, adjustedDay);
                            const candidate = startOfDay(d1);
                            if (candidate >= today0) return candidate;
                            // Для следующего месяца тоже корректируем
                            const nextMonthAdjustedDay = getAdjustedDay(dayOfMonth, currentYear, currentMonth + 1);
                            return startOfDay(new Date(currentYear, currentMonth + 1, nextMonthAdjustedDay));
                        };

                        const upcomingPayments = (bills || [])
                            .filter(b => !b.paid)
                            .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                            .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());

                        if (upcomingPayments.length === 0) return null;

                        return (
                            <section>
                                <SectionHeader title="Ближайшие платежи" />
                                <div className="relative">
                                    {/* Прокручиваемый контейнер с фиксированной высотой на 3 элемента */}
                                    <div 
                                        className="overflow-y-auto scrollbar-hide space-y-3 pr-1" 
                                        style={{ maxHeight: '264px' }} /* примерно 3 карточки по 80px + gaps */
                                    >
                                        {upcomingPayments.map((payment, idx) => {
                                            const daysLeft = Math.max(0, Math.round((startOfDay(payment.nextDate).getTime() - startOfDay(today0).getTime()) / 86400000));
                                            const badge = daysLeft === 0
                                                ? 'bg-rose-50 text-rose-600'
                                                : daysLeft <= 3
                                                    ? 'bg-amber-50 text-amber-700'
                                                    : daysLeft <= 7
                                                        ? 'bg-violet-50 text-violet-700'
                                                        : 'bg-slate-50 text-slate-500';

                                            return (
                                                <div 
                                                    key={payment.id} 
                                                    className="bg-white border border-slate-100 rounded-2xl p-4 flex gap-4 items-center shadow-sm"
                                                    style={{ animationDelay: `${idx * 50}ms` }}
                                                >
                                                    <div className="w-10 h-10 rounded-2xl bg-violet-50 flex items-center justify-center text-violet-600 shrink-0">
                                                        <Icons.Landmark className="w-5 h-5" />
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <h3 className="font-bold text-slate-800 truncate">{payment.title}</h3>
                                                            <span className={`text-xs font-black px-2.5 py-1 rounded-full shrink-0 ${badge}`}>
                                                                {daysLeft === 0 ? 'Сегодня' : `через ${daysLeft} дн.`}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center justify-between mt-1">
                                                            <p className="text-xs text-slate-400">
                                                                {payment.nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
                                                                {payment.repeat && payment.repeat !== 'none' && (
                                                                    <span className="ml-1.5 text-slate-300">
                                                                        • {payment.repeat === 'weekly' ? 'еженед.' : payment.repeat === 'biweekly' ? 'раз в 2 нед.' : 'ежемес.'}
                                                                    </span>
                                                                )}
                                                            </p>
                                                            <p className="text-sm font-bold text-slate-700">{Number(payment.amount).toLocaleString('ru-RU')} ₽</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Индикатор прокрутки (если платежей больше 3) */}
                                    {upcomingPayments.length > 3 && (
                                        <div className="absolute bottom-0 left-0 right-0 h-8 bg-gradient-to-t from-white dark:from-slate-950 to-transparent pointer-events-none rounded-b-2xl" />
                                    )}
                                </div>
                                
                                {/* Счётчик платежей */}
                                {upcomingPayments.length > 3 && (
                                    <p className="text-xs text-slate-400 text-center mt-2 font-medium">
                                        Прокрутите, чтобы увидеть все {upcomingPayments.length} платежей
                                    </p>
                                )}
                            </section>
                        );
                    })()}

                    {/* Новые виджеты аналитики */}
                    <section>
                        <SectionHeader title="Аналитика" />

                        {/* Pie Chart + легенда */}
                        <BentoCard className="!p-4 lh-glow-secondary">
                            <div className="flex items-center justify-between mb-3">
                                <div>
                                    <p className={THEME.label}>Категории трат</p>
                                    <p className="text-sm text-slate-500 font-medium">{today.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}</p>
                                </div>
                                <div className="text-xs font-black px-2.5 py-1 rounded-full bg-slate-50 text-slate-500">
                                    {pieData.total > 0 ? `${expensesByCategory.length} кат.` : 'нет данных'}
                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-4">
                                {/* Pie Chart */}
                                <div className="flex justify-center shrink-0">
                                    <svg width="140" height="140" viewBox="0 0 140 140" className="block">
                                        <circle cx="70" cy="70" r="56" fill="#f1f5f9" />
                                        {pieData.arcs.map((a, i) => (
                                            a.frac > 0 ? (
                                                <path key={i} d={describeArc(70, 70, 56, a.start, a.end)} fill={a.color} />
                                            ) : null
                                        ))}
                                        <circle cx="70" cy="70" r="34" fill="white" />
                                        <text x="70" y="66" textAnchor="middle" className="fill-slate-900" style={{ fontSize: 14, fontWeight: 800 }}>
                                            {Number(expensesCurrentMonth).toLocaleString('ru-RU')}
                                        </text>
                                        <text x="70" y="84" textAnchor="middle" className="fill-slate-400" style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.2 }}>
                                            ₽ / мес
                                        </text>
                                    </svg>
                                </div>

                                {/* Legend: вертикальный layout, чтобы имя категории и сумма не перекрывались */}
                                <div className="flex-1 min-w-0">
                                    <div className="space-y-3">
                                        {expensesByCategory.length > 0 ? expensesByCategory.slice(0, 6).map((c, idx) => {
                                            const color = pieData.arcs[idx]?.color || '#64748b';
                                            const pct = pieData.total > 0 ? Math.round((c.amount / pieData.total) * 100) : 0;
                                            return (
                                                <button
                                                    key={c.name}
                                                    onClick={() => openCategoryDetails(c.name)}
                                                    className="w-full text-left bg-slate-50/50 rounded-xl p-2.5 border border-slate-100/50 hover:bg-slate-50 transition-colors"
                                                    title="Показать операции"
                                                >
                                                    {/* Имя категории на отдельной строке */}
                                                    <div className="flex items-center gap-2 mb-1.5">
                                                        <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: color }} />
                                                        <span className="text-sm font-bold text-slate-700">{c.name}</span>
                                                    </div>
                                                    {/* Сумма и процент на отдельной строке */}
                                                    <div className="flex items-center justify-between pl-4">
                                                        <span className="text-base font-extrabold text-slate-900">{Number(c.amount).toLocaleString('ru-RU')} ₽</span>
                                                        <span className="text-[11px] font-black text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-100">{pct}%</span>
                                                    </div>
                                                </button>
                                            );
                                        }) : (
                                            <div className="py-8 text-center text-slate-300">
                                                <Icons.PieChart className="w-12 h-12 mx-auto mb-3 opacity-50" />
                                                <p className="text-sm font-medium">Нет расходов за месяц</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </BentoCard>

                        {/* Progress: Потрачено от бюджета */}
                        <BentoCard className="!p-4">
                            <div className="flex items-end justify-between mb-3">
                                <div>
                                    <p className={THEME.label}>Потрачено от бюджета</p>
                                    <p className="text-xl font-extrabold text-slate-800 mt-1">
                                        {Number(expensesCurrentMonth).toLocaleString('ru-RU')} <span className="text-slate-300 text-base">/ {Number(monthLimit).toLocaleString('ru-RU')} ₽</span>
                                    </p>
                                </div>
                                <span className={`text-xs font-black px-2.5 py-1 rounded-full ${spentProgress >= 100 ? 'bg-rose-50 text-rose-600' : spentProgress >= 80 ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'}`}>
                                    {spentProgress}%
                                </span>
                            </div>
                            <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                <div
                                    className={`h-full rounded-full ${spentProgress >= 100 ? 'bg-rose-400' : spentProgress >= 80 ? 'bg-amber-400' : 'bg-emerald-400'}`}
                                    style={{ width: `${Math.min(100, spentProgress)}%` }}
                                />
                            </div>
                            {spentProgress >= 100 && (
                                <p className="text-xs text-rose-600 font-bold mt-2">Лимит бюджета превышен.</p>
                            )}
                        </BentoCard>

                        {/* Category limits progress */}
                        {categoryLimits && Object.keys(categoryLimits).length > 0 && (
                            <BentoCard className="!p-4">
                                <div className="flex items-center justify-between mb-3">
                                    <div>
                                        <p className={THEME.label}>Лимиты по категориям</p>
                                        <p className="text-sm text-slate-500 font-medium">Показываются только категории с лимитом</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {Object.entries(categoryLimits)
                                        .filter(([_, lim]) => typeof lim === 'number' && Number.isFinite(lim) && lim > 0)
                                        .map(([cat, lim]) => {
                                            const spent = (expensesByCategory || []).find(x => x.name === cat)?.amount || 0;
                                            const pct = lim > 0 ? Math.round((spent / lim) * 100) : 0;
                                            const over = spent > lim;
                                            return (
                                                <div key={cat} className="bg-slate-50 border border-slate-100 rounded-2xl p-4">
                                                    <div className="flex items-center justify-between gap-3">
                                                        <div className="min-w-0">
                                                            <p className="font-extrabold text-slate-800 truncate">{cat}</p>
                                                            <p className="text-xs text-slate-500 font-bold mt-1">
                                                                {Number(spent).toLocaleString('ru-RU')} ₽ / {Number(lim).toLocaleString('ru-RU')} ₽
                                                            </p>
                                                        </div>
                                                        <span className={`text-xs font-black px-2.5 py-1 rounded-full ${over ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-700'}`}>
                                                            {pct}%
                                                        </span>
                                                    </div>
                                                    <div className="mt-3 w-full h-2.5 bg-white rounded-full overflow-hidden border border-slate-100">
                                                        <div className={`h-full rounded-full ${over ? 'bg-rose-400' : pct >= 80 ? 'bg-amber-400' : 'bg-emerald-400'}`} style={{ width: `${Math.min(100, pct)}%` }} />
                                                    </div>
                                                    {over && (
                                                        <p className="text-xs text-rose-600 font-bold mt-2">Лимит превышен.</p>
                                                    )}
                                                </div>
                                            );
                                        })}
                                </div>
                            </BentoCard>
                        )}

                        {/* Compare with previous month */}
                        <BentoCard className="!p-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className={THEME.label}>Сравнение с прошлым месяцем</p>
                                    <p className="text-sm text-slate-500 mt-1">{prevMonthDate.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })} → {today.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}</p>
                                </div>
                                <div className={`text-xs font-black px-2.5 py-1 rounded-full ${compare.diff > 0 ? 'bg-rose-50 text-rose-600' : compare.diff < 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-50 text-slate-500'}`}>
                                    {compare.diff > 0 ? 'Больше' : compare.diff < 0 ? 'Меньше' : 'Ровно'}
                                </div>
                            </div>

                            <div className="mt-3 grid grid-cols-2 gap-3">
                                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                                    <p className={THEME.label}>Прошлый</p>
                                    <p className="text-lg font-extrabold text-slate-800 mt-1">{Number(expensesPrevMonth).toLocaleString('ru-RU')} ₽</p>
                                </div>
                                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                                    <p className={THEME.label}>Текущий</p>
                                    <p className="text-lg font-extrabold text-slate-800 mt-1">{Number(expensesCurrentMonth).toLocaleString('ru-RU')} ₽</p>
                                </div>
                            </div>

                            <div className="mt-3 flex items-center justify-between">
                                <p className="text-sm font-bold text-slate-700">
                                    Разница: <span className={`${compare.diff > 0 ? 'text-rose-600' : compare.diff < 0 ? 'text-emerald-700' : 'text-slate-500'}`}>{compare.diff > 0 ? '+' : ''}{Number(compare.diff).toLocaleString('ru-RU')} ₽</span>
                                </p>
                                <p className="text-xs font-black text-slate-400 bg-slate-50 px-2.5 py-1 rounded-full">
                                    {compare.pct === null ? '—' : `${compare.pct > 0 ? '+' : ''}${compare.pct}%`}
                                </p>
                            </div>
                        </BentoCard>

                        {/* Календарь платежей удалён */}
                    </section>

                    {/* KPI Modals: Баланс / Расходы / Доходы */}
                    {kpiModal && (
                        <div className="fixed inset-0 z-[150] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setKpiModal(null)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden" style={{ height: '85vh' }}>
                                <div className="flex justify-between items-center p-5 pb-2 bg-white shrink-0">
                                    <div className="min-w-0">
                                        <h2 className="text-2xl font-bold text-slate-900 truncate">
                                            {kpiModal === 'balance' ? 'Баланс — история' : kpiModal === 'expenses' ? 'Расходы — по дням' : 'Доходы — по дням'}
                                        </h2>
                                        <p className="text-slate-500 text-sm font-medium">
                                            {today.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}
                                        </p>
                                    </div>
                                    <button onClick={() => setKpiModal(null)} className="bg-slate-100 p-2 rounded-full text-slate-400" title="Закрыть">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto px-5 pb-6 pt-3 scrollbar-hide">
                                    {/* BALANCE */}
                                    {kpiModal === 'balance' && (
                                        <div className="space-y-3">
                                            {balanceHistory.map(({ date, key, balanceEnd, stats }) => {
                                                const dayLabel = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                                                const exp = Number(stats?.expenseTotal || 0);
                                                const inc = Number(stats?.incomeTotal || 0);
                                                const delta = Number(stats?.delta || 0);

                                                // категории (используемые в этот день)
                                                const cats = (() => {
                                                    const out = [];
                                                    const expCats = stats?.expenseByCategory ? Object.entries(stats.expenseByCategory) : [];
                                                    const incCats = stats?.incomeByCategory ? Object.entries(stats.incomeByCategory) : [];
                                                    expCats.sort((a, b) => Number(b[1]) - Number(a[1]));
                                                    incCats.sort((a, b) => Number(b[1]) - Number(a[1]));
                                                    expCats.slice(0, 4).forEach(([c, v]) => out.push({ type: 'expense', c, v }));
                                                    incCats.slice(0, 4).forEach(([c, v]) => out.push({ type: 'income', c, v }));
                                                    return out;
                                                })();

                                                return (
                                                    <div key={key} className="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
                                                        <div className="flex items-start justify-between gap-3">
                                                            <div>
                                                                <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{dayLabel}</div>
                                                                <div className="text-xl font-extrabold text-slate-900 mt-1">{Number(balanceEnd).toLocaleString('ru-RU')} ₽</div>
                                                            </div>
                                                            <div className="text-right">
                                                                <div className="text-xs font-bold text-slate-400">+{inc.toLocaleString('ru-RU')} ₽</div>
                                                                <div className="text-xs font-bold text-slate-400">-{exp.toLocaleString('ru-RU')} ₽</div>
                                                                <div className={`text-xs font-black mt-1 ${delta >= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>{delta >= 0 ? '+' : ''}{delta.toLocaleString('ru-RU')} ₽</div>
                                                            </div>
                                                        </div>

                                                        {cats.length > 0 ? (
                                                            <div className="mt-3 flex flex-wrap gap-2">
                                                                {cats.map((x, idx) => (
                                                                    <span
                                                                        key={x.type + ':' + x.c + ':' + idx}
                                                                        className={`text-[10px] font-black px-2.5 py-1 rounded-full border ${x.type === 'expense' ? 'bg-rose-50 text-rose-700 border-rose-100' : 'bg-emerald-50 text-emerald-700 border-emerald-100'}`}
                                                                        title={`${x.c}: ${Number(x.v).toLocaleString('ru-RU')} ₽`}
                                                                    >
                                                                        {x.c} {Number(x.v).toLocaleString('ru-RU')}₽
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        ) : (
                                                            <div className="mt-3 text-xs text-slate-400 font-medium">Нет операций</div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {/* EXPENSES */}
                                    {kpiModal === 'expenses' && (
                                        <div className="space-y-3">
                                            {monthExpenseDays.length > 0 ? monthExpenseDays.map((d) => {
                                                const dayLabel = d.date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                                                const cats = Object.entries(d.expenseByCategory || {}).sort((a, b) => Number(b[1]) - Number(a[1]));
                                                return (
                                                    <div key={d.key} className="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
                                                        <div className="flex items-start justify-between gap-3">
                                                            <div>
                                                                <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{dayLabel}</div>
                                                                <div className="text-xl font-extrabold text-rose-700 mt-1">-{Number(d.expenseTotal || 0).toLocaleString('ru-RU')} ₽</div>
                                                            </div>
                                                            <div className="text-xs font-black px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 border border-rose-100">
                                                                {cats.length} кат.
                                                            </div>
                                                        </div>

                                                        {cats.length > 0 && (
                                                            <div className="mt-3 flex flex-wrap gap-2">
                                                                {cats.map(([c, v]) => (
                                                                    <span key={c} className="text-[10px] font-black px-2.5 py-1 rounded-full bg-slate-50 text-slate-600 border border-slate-100">
                                                                        {c} {Number(v).toLocaleString('ru-RU')}₽
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            }) : (
                                                <div className="flex flex-col items-center justify-center h-48 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                    <Icons.TrendingDown className="w-12 h-12 mb-3 opacity-50" />
                                                    <p className="text-sm font-medium">Нет расходов в этом месяце</p>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* INCOME */}
                                    {kpiModal === 'income' && (
                                        <div className="space-y-3">
                                            {incomeByCategory.length > 0 ? (
                                                incomeByCategory.map((catItem) => {
                                                    const isOpen = incomeCatExpanded === catItem.category;
                                                    return (
                                                        <div key={catItem.category} className="bg-white border border-slate-100 rounded-2xl shadow-sm overflow-hidden">
                                                            <button
                                                                onClick={() => setIncomeCatExpanded(isOpen ? null : catItem.category)}
                                                                className="w-full p-4 flex items-start justify-between gap-3 text-left hover:bg-slate-50 transition-colors"
                                                            >
                                                                <div className="min-w-0">
                                                                    <div className="text-xs font-black text-slate-400 uppercase tracking-widest">Категория</div>
                                                                    <div className="font-extrabold text-slate-900 truncate mt-1">{catItem.category}</div>
                                                                    <div className="text-xs text-slate-400 font-bold mt-1">Дней: {(catItem.days || []).length}</div>
                                                                </div>
                                                                <div className="shrink-0 text-right">
                                                                    <div className="text-xs font-black px-2.5 py-1 rounded-full bg-sky-50 text-sky-700 border border-sky-100">+{Number(catItem.total).toLocaleString('ru-RU')} ₽</div>
                                                                    <div className="mt-2 flex items-center justify-end gap-1 text-slate-300">
                                                                        <span className="text-[10px] font-black">{isOpen ? 'Скрыть' : 'Дни'}</span>
                                                                        <Icons.ChevronRight className={`w-4 h-4 transition-transform ${isOpen ? 'rotate-90' : ''}`} />
                                                                    </div>
                                                                </div>
                                                            </button>

                                                            {isOpen && (
                                                                <div className="px-4 pb-4">
                                                                    <div className="mt-1 space-y-2">
                                                                        {(catItem.days || []).map((d) => (
                                                                            <div key={d.key} className="bg-slate-50 border border-slate-100 rounded-2xl px-4 py-3 flex items-center justify-between">
                                                                                <div className="text-xs font-black text-slate-500">
                                                                                    {d.date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
                                                                                </div>
                                                                                <div className="text-sm font-extrabold text-sky-700">+{Number(d.amount).toLocaleString('ru-RU')} ₽</div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })
                                            ) : (
                                                <div className="flex flex-col items-center justify-center h-48 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                    <Icons.TrendingUp className="w-12 h-12 mb-3 opacity-50" />
                                                    <p className="text-sm font-medium">Нет доходов в этом месяце</p>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Category details modal: расходы за месяц в выбранной категории */}
                    {categoryDetailsOpen && categoryDetailsName && (
                        <div className="fixed inset-0 z-[150] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setCategoryDetailsOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden" style={{ height: '85vh' }}>
                                <div className="flex justify-between items-center p-5 pb-2 bg-white shrink-0">
                                    <div className="min-w-0">
                                        <h2 className="text-2xl font-bold text-slate-900 truncate">{categoryDetailsName}</h2>
                                        <p className="text-slate-500 text-sm font-medium">
                                            {today.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })} • {Number(categoryMonthTotal).toLocaleString('ru-RU')} ₽
                                        </p>
                                    </div>
                                    <button onClick={() => setCategoryDetailsOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-400" title="Закрыть">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto px-5 pb-6 pt-2 scrollbar-hide">
                                    {(categoryMonthExpenses || []).length > 0 ? (
                                        <div className="space-y-3">
                                            {(categoryMonthExpenses || []).map((t) => {
                                                const d = t.dateKey ? parseDateKey(t.dateKey) : (t.createdAt ? new Date(t.createdAt) : null);
                                                const dateLabel = d ? d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : '—';
                                                return (
                                                    <div key={t.id} className="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm flex items-center justify-between gap-4">
                                                        <div className="min-w-0">
                                                            <div className="font-bold text-slate-800 truncate">{t.title || 'Расход'}</div>
                                                            <div className="text-xs text-slate-400 font-bold mt-1">{dateLabel}</div>
                                                        </div>
                                                        <div className="font-mono font-extrabold text-slate-900 shrink-0">-{Number(t.amount || 0).toLocaleString('ru-RU')} ₽</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center h-48 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                            <Icons.TrendingDown className="w-12 h-12 mb-3 opacity-50" />
                                            <p className="text-sm font-medium">Нет расходов в этой категории</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Home Tab (Важное): личная страница, заметки и жизненные цели ---
        const HomeTab = () => {
            const today = new Date();
            const today0 = startOfDay(today);
            const timeGreeting = today.getHours() < 12 ? 'Доброе утро' : today.getHours() < 18 ? 'Добрый день' : 'Добрый вечер';

            // --- Общая система XP/Уровней (единая для Целей + Привычек) ---
            // Источник истины: Supabase user_profile.user_xp (state userXp)
            const XP_PER_GOAL = 10;
            const XP_PER_LEVEL = 50;
            const calcLevel = (xp) => Math.floor(Number(xp || 0) / XP_PER_LEVEL) + 1;

            // Нужны, чтобы не показывать «Новый уровень!» при первом запуске/монтировании.
            // Используем глобальный трекер window.__LH_LEVEL_TRACKER__, чтобы при повторном заходе на вкладку
            // не всплывало уведомление.
            const levelTracker = window.__LH_LEVEL_TRACKER__;

            // --- Habit Tracker (Supabase) ---
            const [xpLoaded, setXpLoaded] = useState(false);
            const [userXp, setUserXp] = useState(0);
            const [habits, setHabits] = useState([]);
            const [habitsLoading, setHabitsLoading] = useState(false);
            const [habitsError, setHabitsError] = useState('');
            const [habitNow, setHabitNow] = useState(Date.now());
            const [isHabitModalOpen, setHabitModalOpen] = useState(false);
            const [habitForm, setHabitForm] = useState({ title: '', icon: '⚡️' });
            const [habitBusyId, setHabitBusyId] = useState(null);
            const [toast, setToast] = useState(null); // { title, message, tone }
            const [xpParticles, setXpParticles] = useState([]);

            const HABIT_ICONS = ['🚬', '🍺', '🍬', '🎮', '📱', '🤬', '🍔', '💅', '⚡️'];

            const showToast = useCallback((title, message = '', tone = 'info') => {
                setToast({ id: Date.now(), title, message, tone });
                setTimeout(() => setToast(null), 2200);
            }, []);

            const addXpParticle = useCallback((x, y, text) => {
                const id = Date.now() + Math.random();
                setXpParticles(prev => [...prev, { id, x, y, text }]);
                setTimeout(() => setXpParticles(prev => prev.filter(p => p.id !== id)), 950);
            }, []);

            const hapticImpact = useCallback((style = 'medium') => {
                try {
                    if (window.Telegram?.WebApp?.HapticFeedback?.impactOccurred) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred(style);
                    }
                } catch (e) {}
            }, []);

            const formatHMS = (totalSeconds) => {
                const s = Math.max(0, Math.floor(totalSeconds));
                const hh = Math.floor(s / 3600);
                const mm = Math.floor((s % 3600) / 60);
                const ss = s % 60;
                return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
            };

            // Tick once per second for "live" timers
            useEffect(() => {
                const id = setInterval(() => setHabitNow(Date.now()), 1000);
                return () => clearInterval(id);
            }, []);

            const refreshUserXp = useCallback(async () => {
                try {
                    await supabase.rpc('ensure_user_profile', { p_user_id: USER_ID });
                    const { data: profile, error: profileErr } = await supabase
                        .from('user_profile')
                        .select('user_xp')
                        .eq('user_id', USER_ID)
                        .single();
                    if (profileErr) throw profileErr;
                    const xp = Number(profile?.user_xp || 0);
                    setUserXp(xp);
                    setXpLoaded(true);

                    // Инициализация трекера уровня: на загрузке просто фиксируем уровень,
                    // без каких-либо уведомлений.
                    if (!levelTracker.ready) {
                        levelTracker.ready = true;
                        levelTracker.prevLevel = calcLevel(xp);
                    }

                    return xp;
                } catch (e) {
                    console.warn('refreshUserXp failed:', e);
                    return null;
                }
            }, []);

            const loadHabits = useCallback(async () => {
                setHabitsError('');
                setHabitsLoading(true);
                try {
                    // Wallet XP (важно для общего уровня, даже если habits-таблица не готова)
                    await refreshUserXp();

                    // Habits list (если таблица/политики не готовы — не ломаем весь блок уровней)
                    const { data: rows, error: habitsErr } = await supabase
                        .from('habits')
                        .select('id,user_id,title,icon,start_date,last_claim_date,total_xp_earned,xp_rate,created_at')
                        .eq('user_id', USER_ID)
                        .order('created_at', { ascending: false });

                    if (habitsErr) {
                        console.warn('Habits load warning:', habitsErr);
                        setHabits([]);
                        setHabitsError('Не удалось загрузить привычки (таблица habits / RLS / RPC).');
                    } else {
                        setHabits(Array.isArray(rows) ? rows : []);
                    }
                } catch (e) {
                    console.error('Habits load error:', e);
                    // Если даже профиль не загрузился — показываем ошибку
                    setHabitsError('Не удалось загрузить данные XP/привычек. Проверьте SQL-скрипт (user_profile, habits, RPC).');
                } finally {
                    setHabitsLoading(false);
                }
            }, [refreshUserXp]);

            useEffect(() => {
                loadHabits();
            }, [loadHabits]);

            const habitsVM = useMemo(() => {
                return (habits || []).map(h => {
                    const last = new Date(h.last_claim_date || h.created_at || Date.now()).getTime();
                    const unclaimedMs = Math.max(0, habitNow - last);
                    const unclaimedSeconds = unclaimedMs / 1000;
                    const pending = Math.floor((unclaimedMs / 3600000) * Number(h.xp_rate || 10));
                    return {
                        ...h,
                        _lastMs: last,
                        _unclaimedSeconds: unclaimedSeconds,
                        _timer: formatHMS(unclaimedSeconds),
                        _pendingXp: Math.max(0, pending)
                    };
                });
            }, [habits, habitNow]);

            const createHabit = async () => {
                const title = String(habitForm.title || '').trim();
                const icon = String(habitForm.icon || '⚡️');
                if (!title) return;

                setHabitsError('');
                setHabitBusyId('new');
                try {
                    await supabase.rpc('ensure_user_profile', { p_user_id: USER_ID });
                    const { error: insErr } = await supabase
                        .from('habits')
                        .insert({
                            user_id: USER_ID,
                            title,
                            icon,
                            xp_rate: 10,
                            start_date: new Date().toISOString().slice(0, 10),
                            last_claim_date: new Date().toISOString(),
                        });
                    if (insErr) throw insErr;

                    setHabitModalOpen(false);
                    setHabitForm({ title: '', icon: '⚡️' });
                    showToast('Привычка создана', 'Теперь майните XP воздержанием.', 'success');
                    await loadHabits();
                } catch (e) {
                    console.error('Create habit error:', e);
                    showToast('Ошибка', 'Не удалось создать привычку.', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            const claimHabit = async (habitId, evt) => {
                setHabitBusyId(habitId);
                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('habit_claim', {
                        p_user_id: USER_ID,
                        p_habit_id: habitId,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    const added = Number(row?.added_xp || 0);
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) setUserXp(wallet);
                    else await refreshUserXp();

                    setHabits(prev => (prev || []).map(h => h.id === habitId ? ({
                        ...h,
                        last_claim_date: new Date().toISOString(),
                        total_xp_earned: Number(h.total_xp_earned || 0) + added,
                    }) : h));

                    hapticImpact('medium');

                    // Juicy effects
                    try {
                        const x = evt?.clientX || window.innerWidth * 0.7;
                        const y = evt?.clientY || window.innerHeight * 0.35;
                        addXpParticle(x, y, `+${added} XP`);
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 26, spread: 45, origin: { x: x / window.innerWidth, y: y / window.innerHeight }, scalar: 0.9 });
                        }
                    } catch (e) {}

                    if (added > 0) showToast('Собрано!', `+${added} XP`, 'success');
                    else showToast('Пока рано', 'Накопите немного времени.', 'info');
                } catch (e) {
                    console.error('Claim habit error:', e);
                    const msg = (e && (e.message || e.details || e.hint))
                        ? [e.message, e.details, e.hint].filter(Boolean).join(' • ')
                        : String(e || '');
                    showToast('Ошибка', msg || 'Не удалось собрать XP. Проверьте SQL/RPC habit_claim и права доступа (GRANT EXECUTE).', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            const relapseHabit = async (habitId) => {
                const PENALTY = 1000;
                if (!confirm('Срыв? Штраф: -1000 XP. Таймер будет сброшен.')) return;

                // Оптимистично списываем XP, чтобы UI сразу реагировал
                setUserXp(prev => Math.max(0, Number(prev || 0) - PENALTY));

                setHabitBusyId(habitId);
                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('habit_relapse', {
                        p_user_id: USER_ID,
                        p_habit_id: habitId,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    // Если сервер вернул lost_xp=0 (например, функция не обновлена) — всё равно считаем штраф 1000
                    const lostRaw = Number(row?.lost_xp);
                    const lost = Number.isFinite(lostRaw) && lostRaw > 0 ? lostRaw : PENALTY;
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) setUserXp(wallet);

                    // Обязательно подтягиваем актуальный кошелёк из БД (на случай кеша/старой RPC)
                    await refreshUserXp();

                    setHabits(prev => (prev || []).map(h => h.id === habitId ? ({
                        ...h,
                        last_claim_date: new Date().toISOString(),
                    }) : h));

                    hapticImpact('light');
                    showToast('Срыв!', `Штраф: -${Number(lost).toLocaleString('ru-RU')} XP`, 'error');
                } catch (e) {
                    console.error('Relapse habit error:', e);
                    // Если произошла ошибка — вернём фактическое значение XP из БД
                    await refreshUserXp();

                    const msg = (e && (e.message || e.details || e.hint))
                        ? [e.message, e.details, e.hint].filter(Boolean).join(' • ')
                        : String(e || '');
                    showToast('Ошибка', msg || 'Не удалось применить срыв. Проверьте SQL/RPC habit_relapse и права доступа.', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            const deleteHabit = async (habitId) => {
                if (!confirm('Удалить привычку? Весь опыт, добытый этой привычкой, будет аннулирован.')) return;
                setHabitBusyId(habitId);
                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('habit_delete', {
                        p_user_id: USER_ID,
                        p_habit_id: habitId,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    const lost = Number(row?.lost_xp || 0);
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) setUserXp(wallet);
                    else await refreshUserXp();

                    setHabits(prev => (prev || []).filter(h => h.id !== habitId));

                    hapticImpact('medium');
                    showToast('Привычка удалена', `Прогресс аннулирован (-${lost} XP)`, 'error');
                } catch (e) {
                    console.error('Delete habit error:', e);
                    const msg = (e && (e.message || e.details || e.hint))
                        ? [e.message, e.details, e.hint].filter(Boolean).join(' • ')
                        : String(e || '');
                    showToast('Ошибка', msg || 'Не удалось удалить привычку. Проверьте SQL/RPC habit_delete и права доступа.', 'error');
                } finally {
                    setHabitBusyId(null);
                }
            };

            // Editable greeting
            const [customGreeting, setCustomGreeting] = useLocalStorage('lifehub_home_greeting', `${timeGreeting}! 👋`);
            const [isEditingGreeting, setIsEditingGreeting] = useState(false);
            const [greetingDraft, setGreetingDraft] = useState(customGreeting);

            // Theme toggle removed from Greeting widget (theme still controlled globally in App).
            // (Ничего не удаляем глобально — просто не используем здесь.)

            // Notes (перенос из бывшей вкладки "Заметки")
            const [notes, setNotes] = useLocalStorage('lifehub_notes', [
                { id: '1', title: 'Идеи', content: 'Сделать привычку читать 20 минут в день', color: 'bg-amber-100', createdAt: Date.now() },
                { id: '2', title: 'Планы', content: 'Разобрать бюджет и обновить цели', color: 'bg-emerald-100', createdAt: Date.now() - 86400000 },
            ]);
            const [isNoteModalOpen, setNoteModalOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [noteForm, setNoteForm] = useState({ title: '', content: '', color: 'bg-amber-100' });
            const noteColors = ['bg-amber-100', 'bg-emerald-100', 'bg-violet-100', 'bg-rose-100', 'bg-sky-100'];

            const openAddNote = () => {
                setEditingNote(null);
                setNoteForm({ title: '', content: '', color: 'bg-amber-100' });
                setNoteModalOpen(true);
            };
            const openEditNote = (note) => {
                setEditingNote(note);
                setNoteForm({ title: note.title, content: note.content, color: note.color });
                setNoteModalOpen(true);
            };
