    <script>
        // Apply theme ASAP to avoid flashes.
        // Priority:
        // 1) User setting in localStorage (lifehub_theme)
        // 2) Telegram WebApp theme (if inside Telegram)
        // 3) light
        (function () {
            try {
                const raw = localStorage.getItem('lifehub_theme');
                const hasUserTheme = raw !== null && raw !== undefined;
                let theme = hasUserTheme ? JSON.parse(raw) : 'light';
    
                if (!hasUserTheme) {
                    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                    if (tg && tg.colorScheme) {
                        theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
                    }
                }

                if (theme === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}

            // Viewport height helper for mobile keyboards (Telegram/iOS)
            const setAppHeight = () => {
                try {
                    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                    const viewportH = (tg && tg.viewportHeight) ? tg.viewportHeight : window.innerHeight;
                    const stableH = (tg && tg.viewportStableHeight) ? tg.viewportStableHeight : window.innerHeight;
                    const keyboardH = Math.max(0, stableH - viewportH);
                    document.documentElement.style.setProperty('--app-height', viewportH + 'px');
                    document.documentElement.style.setProperty('--keyboard-height', keyboardH + 'px');
                } catch (e) {
                    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
                    document.documentElement.style.setProperty('--keyboard-height', '0px');
                }
            };

            setAppHeight();
            window.addEventListener('resize', setAppHeight);

            // Telegram init (safe)
            try {
                const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                if (tg) {
                    tg.ready();

                    // Try to maximize the WebApp viewport.
                    // expand() works on most clients. requestFullscreen() is supported on some newer clients.
                    const tryFullscreen = () => {
                        try { tg.expand(); } catch (e) {}
                        try { if (typeof tg.requestFullscreen === 'function') tg.requestFullscreen(); } catch (e) {}
                        try { if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes(); } catch (e) {}
                        try {
                            // Keep CSS viewport helpers in sync with Telegram stable/viewport heights
                            setAppHeight();
                        } catch (e) {}
                    };

                    // Call immediately, then again after a short delay (Telegram sometimes applies viewport later)
                    tryFullscreen();
                    setTimeout(tryFullscreen, 250);
                    setTimeout(tryFullscreen, 900);

                    // Some clients allow fullscreen/expand only after a user gesture.
                    // We'll retry on first interaction.
                    document.addEventListener('click', tryFullscreen, { once: true, passive: true });
                    document.addEventListener('touchstart', tryFullscreen, { once: true, passive: true });

                    // Seamless (edge-to-edge) chrome: make Telegram header/background match app background
                    // so Telegram controls (close/menu) look like they float over UI.
                    const syncChromeColors = () => {
                        try {
                            const bg = getComputedStyle(document.documentElement).getPropertyValue('--lh-bg').trim() || '#09090b';
                            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor(bg);
                            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor(bg);
                            if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor(bg);
                        } catch (e) {}
                    };
                    syncChromeColors();

                    // Optional: show confirmation on closing (does not block swipe, but prevents accidental loss)
                    // if (typeof tg.enableClosingConfirmation === 'function') tg.enableClosingConfirmation();

                    if (tg.onEvent) {
                        tg.onEvent('viewportChanged', () => {
                            setAppHeight();
                            // When viewport changes (e.g. top bar collapse), try to re-expand
                            tryFullscreen();
                        });
                        // when Telegram theme changes
                        tg.onEvent('themeChanged', syncChromeColors);
                    }

                    // Also update chrome colors after first paint
                    setTimeout(syncChromeColors, 250);
                }
            } catch (e) {}
        })();
    </script>

        /* =========================================================
           Base layout fixes
           ========================================================= */
        /* Фиксация размера окна и предотвращение горизонтального скролла */
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            /* Reduce iOS/Telegram overscroll gestures that may trigger app collapse */
            overscroll-behavior-y: none;
        }
        html {
            height: 100%;
            height: -webkit-fill-available;
        }
        body {
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--lh-bg);
            color: var(--lh-text);
        }

        /* Cosmic background for dark theme */
        .dark body {
            background:
              radial-gradient(1200px 900px at 20% 10%, rgba(59,130,246,0.18), transparent 55%),
              radial-gradient(900px 700px at 85% 15%, rgba(190,242,100,0.10), transparent 60%),
              radial-gradient(800px 650px at 50% 85%, rgba(168,85,247,0.10), transparent 60%),
              #09090b;
        }
        #root {
            min-height: 100%;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background: var(--lh-bg);
            color: var(--lh-text);
        }

        /* Корневой контейнер приложения должен всегда занимать весь экран */
        .app-container {
            min-height: var(--app-height, 100vh);
            background: var(--lh-bg);
            color: var(--lh-text);
        }

        /* Важно: контент пусть занимает хотя бы доступную высоту, иначе снизу виден фон окружения */
        .app-content {
            min-height: calc(var(--app-height, 100vh) - var(--navbar-height) - env(safe-area-inset-bottom));
            overflow-y: auto;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Utility: extra bottom padding when keyboard is open */
        .kbd-safe-bottom {
            padding-bottom: calc(max(env(safe-area-inset-bottom), 0px) + var(--keyboard-height, 0px));
        }
        * { -webkit-tap-highlight-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        .animate-slideUp { animation: slideUp 0.3s ease-out; }
        .animate-zoomIn { animation: zoomIn 0.3s ease-out; }
        .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

        /* Prevent text selection for app-like feel */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Safe-area helpers (Telegram/iOS)
           Edge-to-edge: фон уходит под системную панель, а контент получает безопасные отступы.
        */
        .safe-bottom { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-left { padding-left: env(safe-area-inset-left); }
        .safe-right { padding-right: env(safe-area-inset-right); }

        /* Seamless layout helpers */
        .edge-to-edge {
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        .edge-to-edge-bg {
            margin-top: calc(-1 * env(safe-area-inset-top));
            padding-top: calc(env(safe-area-inset-top) + 0.5rem);
        }

        /* Bottom navbar height for content padding */
        :root {
            --navbar-height: 72px;
        }
        
        /* Content area ends before navbar */
        .app-content {
            padding-bottom: calc(var(--navbar-height) + env(safe-area-inset-bottom) + 1rem);
        }
        
        /* Modal overlay - covers entire screen INCLUDING navbar */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100; /* выше navbar (z-40) */
        }

        /* Gamification: animated progress bar */
        .progress-bar-animated {
            transition: width 0.5s ease-out;
        }
        .progress-bar-complete {
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6), 0 0 40px rgba(251, 191, 36, 0.3);
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Gamification: goal item animation */
        .goal-item {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .goal-item.completed {
            opacity: 0.7;
        }
        .goal-item:active {
            transform: scale(0.98);
        }
        
        /* Confetti celebration effect */
        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }

        }

        .nt-chip {

        .nt-layout {

        .nt-panel { padding: 16px; }

            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;

            font-weight: 950;

        .nt-tint-0 { background: linear-gradient(135deg, #fff7df 0%, #fffaf0 100%); }

        .nt-badge-idea { color: #b45309; background: #fff5d6; border-color: #fde68a; }
        .nt-badge-empty { color: #64748b; background: #f1f5f9; border-color: #e2e8f0; }
        .nt-pin,
        .nt-icon-btn {

            height: 36px;
            flex: 0 0 auto;
            border-radius: 13px;
            display: inline-flex;
            align-items: center;

            background: rgba(255,255,255,0.66);
            border: 1px solid rgba(15,23,42,0.065);

        .nt-pin.is-active {

            box-shadow: 0 8px 18px rgba(4,120,87,0.11);

        .nt-row-list {
            display: flex;

            border: 1px solid rgba(15,23,42,0.055);
        }
        .nt-note-row {

            grid-template-columns: 40px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            text-align: left;
            min-height: 68px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.7);

        .nt-row-icon {

            align-items: center;
            justify-content: center;

            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nt-detail {

        .nt-detail-placeholder {

        }
        .nt-detail-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nt-detail-title {
            color: #0f172a;
            font-size: 21px;
            line-height: 1.12;
            font-weight: 950;
            letter-spacing: -0.035em;
        }
        .nt-detail-section h4 {
            margin-bottom: 10px;
            color: #0f172a;
            font-size: 13px;
            font-weight: 950;
        }
        .nt-content-text {
            color: #334155;
            font-size: 14px;
            line-height: 1.65;
            font-weight: 600;
            white-space: pre-wrap;
        }
        .nt-content-flow {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nt-content-flow p,
        .nt-content-flow li {
            color: #334155;
            font-size: 14px;
            line-height: 1.62;
            font-weight: 600;
        }
        .nt-content-flow ul,
        .nt-content-flow ol {
            margin: 0;
            padding-left: 20px;
        }
        .nt-content-flow strong { font-weight: 950; color: #0f172a; }
        .nt-content-flow em { color: #475569; }
        .nt-checklist {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .nt-check {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 14px;
            font-weight: 750;
            transition: color .18s ease, opacity .18s ease;
        }
        .nt-check input {
            width: 18px;
            height: 18px;
            accent-color: #047857;
        }
        .nt-check span {
            transition: color .18s ease, opacity .18s ease, text-decoration-color .18s ease;
        }

            text-decoration-color: rgba(4,120,87,0.45);
        }
        .nt-detail-actions {

            align-items: center;
            gap: 10px;
            padding-top: 4px;
        }
        .nt-secondary-btn,
        .nt-danger-btn,
        .nt-ghost-btn {
            min-height: 42px;
            border-radius: 14px;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .nt-secondary-btn {
            color: #064e3b;
            background: #eef8f2;
            border: 1px solid rgba(4,120,87,0.14);
        }
        .nt-danger-btn {
            color: #dc2626;
            background: #fff1f2;
            border: 1px solid #ffe4e6;
        }
        .nt-ghost-btn {
            color: #475569;
            background: #f8fafc;
            border: 1px solid rgba(15,23,42,0.07);
        }
        .nt-empty {
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            overflow: hidden;
            position: relative;
        }
        .nt-empty::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(16,185,129,0.16), transparent 68%);
            top: -72px;
            right: -40px;
        }
        .nt-empty-icon {
            width: 68px;
            height: 68px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #047857;
            background: linear-gradient(135deg, #ffffff, #e9f8ef);
            border: 1px solid rgba(4,120,87,0.12);
            box-shadow: 0 16px 38px rgba(4,120,87,0.12);
            z-index: 1;
        }
        .nt-empty h3 {
            z-index: 1;
            margin-top: 14px;
            color: #0f172a;
            font-size: 20px;
            font-weight: 950;
            letter-spacing: -0.035em;
        }
        .nt-empty p {
            z-index: 1;
            margin-top: 8px;
            color: #64748b;
            max-width: 320px;
            font-weight: 650;
            line-height: 1.5;
        }
        .nt-mobile-detail {
            display: none;
        }
        .nt-overlay {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(15,23,42,0.36);
            backdrop-filter: blur(14px);
            padding: 16px;
        }
        .nt-editor-sheet,
        .nt-confirm-card {
            width: min(620px, 100%);
            max-height: min(86vh, 760px);
            overflow: auto;
            padding: 18px;
        }
        .nt-editor-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .nt-editor-title {
            color: #0f172a;
            font-size: 22px;
            font-weight: 950;
            letter-spacing: -0.035em;
        }
        .nt-form-grid {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 12px;
        }
        .nt-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .nt-field label {
            color: #64748b;
            font-size: 11px;
            font-weight: 950;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nt-field input,
        .nt-field select,
        .nt-field textarea {
            width: 100%;
            border: 1px solid rgba(15,23,42,0.075);
            background: #f8fafc;
            color: #0f172a;
            border-radius: 16px;
            outline: none;
            padding: 13px 14px;
            font-weight: 750;
        }
        .nt-field textarea {
            min-height: 150px;

            line-height: 1.55;
        }
        .nt-editor-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 12px;
        }
        .nt-tool-btn {
            min-height: 34px;
            border-radius: 12px;
            padding: 0 11px;
            background: #f8fafc;
            border: 1px solid rgba(15,23,42,0.07);
            color: #334155;
            font-size: 12px;
            font-weight: 950;
        }
        .nt-check-editor {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            display: grid;
            grid-template-columns: 26px 1fr 34px;
            gap: 8px;
            align-items: center;

            width: 18px;
            height: 18px;
            accent-color: #047857;
        }

            padding: 10px 12px;
            border-radius: 13px;
        }
        .nt-editor-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }
        .nt-confirm-card {
            max-width: 420px;
            text-align: left;
        }
        .nt-confirm-card h3 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 950;
            letter-spacing: -0.035em;
        }
        .nt-confirm-card p {
            margin-top: 8px;
            color: #64748b;
            font-weight: 650;
        }
        .nt-confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
        .nt-menu-card {
            max-width: 460px;
        }
        .nt-menu-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .nt-menu-cats {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0 4px;
            scrollbar-width: none;
        }
        .nt-menu-cats::-webkit-scrollbar { display: none; }
        .nt-danger-subtle {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            padding: 0 12px;
            border-radius: 14px;
            color: #dc2626;
            font-weight: 900;
            background: transparent;
        }
        .nt-toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 90;
            padding: 11px 14px;
            border-radius: 999px;
            color: #064e3b;
            background: rgba(236, 253, 245, 0.96);
            border: 1px solid rgba(4,120,87,0.14);
            box-shadow: 0 18px 42px rgba(15,23,42,0.14);
            font-weight: 900;
            font-size: 13px;
        }
        @media (max-width: 1180px) {
            .nt-layout { grid-template-columns: minmax(0, 1fr); }
            .nt-detail {
                position: static;
                max-height: none;
                min-height: 0;
            }
            .nt-pinned-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 720px) {
            .nt-page {
                gap: 10px;
                padding-bottom: calc(88px + env(safe-area-inset-bottom));
            }
            .nt-search-row {
                display: none;
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .nt-search-row.is-open { display: grid; }
            .nt-sort { display: none; }
            .nt-search { min-height: 44px; border-radius: 16px; }
            .nt-filter-line {
                align-items: flex-start;
                min-height: 40px;
            }
            .nt-filter-button {
                min-height: 38px;
                border-radius: 13px;
                padding: 0 12px;
            }
            .nt-filter-menu {
                width: min(236px, calc(100vw - 32px));
            }
            .nt-tabs {
                margin-right: -16px;
                padding-right: 28px;
            }
            .nt-chip {
                min-height: 36px;
                padding: 0 14px;
                font-size: 12px;
            }
            .nt-layout { display: block; }
            .nt-main { gap: 13px; }
            .nt-detail { display: none; }
            .nt-panel {
                border-radius: 22px;
                padding: 12px;
            }
            .nt-section-head { margin-bottom: 10px; }
            .nt-section-title { font-size: 18px; }
            .nt-pinned-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .nt-note-card {
                min-height: 104px;
                border-radius: 18px;
                padding: 12px;
            }
            .nt-note-row {
                grid-template-columns: 36px minmax(0, 1fr) auto;
                min-height: 64px;
                padding: 10px;
                gap: 10px;
            }
            .nt-row-icon {
                width: 36px;
                height: 36px;
                border-radius: 13px;
            }
            .nt-row-action .nt-meta { display: none; }
            .nt-preview,
            .nt-note-card .nt-preview { -webkit-line-clamp: 2; }
            .nt-mobile-detail {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 65;
                background: #f7f4ee;
                overflow: auto;
                padding: calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
            }
            .nt-mobile-detail-card {
                border: 1px solid rgba(15,23,42,0.075);
                background: rgba(255,255,255,0.9);
                border-radius: 24px;
                padding: 16px;
                box-shadow: 0 18px 44px rgba(15,23,42,0.065);
            }
            .nt-mobile-detail .nt-detail-top {
                align-items: center;
                gap: 8px;
            }
            .nt-mobile-detail .nt-detail-title {
                font-size: 20px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .nt-form-grid { grid-template-columns: 1fr; }
            .nt-overlay {
                align-items: stretch;
                padding: 0;
            }
            .nt-editor-sheet {
                width: 100%;
                min-height: 100%;
                max-height: none;
                border-radius: 0;
                padding: calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
            }
            .nt-editor-actions {
                position: sticky;
                bottom: 0;
                padding-top: 12px;
                background: linear-gradient(to top, rgba(255,255,255,0.98) 70%, rgba(255,255,255,0));
            }
            .nt-save-btn { flex: 1; }
        }

        /* Supplies redesign — home inventory manager */

                if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) {
                    return String(window.Telegram.WebApp.initDataUnsafe.user.id);

                // Способ 2: initData (строка формата querystring)
                if (window.Telegram?.WebApp?.initData) {
                    const params = new URLSearchParams(window.Telegram.WebApp.initData);
                    const userJson = params.get('user');
                    if (userJson) {
                        try {
                            const user = JSON.parse(userJson);
                            if (user?.id) return String(user.id);
                        } catch (e) {
                            console.warn('Failed to parse user from initData:', e);
                        }
                    }
                }

                // Способ 3: Telegram часто пробрасывает данные в URL как tgWebAppData (query или hash)
                // Пример: ?tgWebAppData=... или #tgWebAppData=...
                const readTgWebAppDataFromUrl = () => {
                    const q = new URLSearchParams(window.location.search);
                    const hRaw = String(window.location.hash || '').replace(/^#/, '');
                    const h = new URLSearchParams(hRaw);
                    return q.get('tgWebAppData') || h.get('tgWebAppData') || null;
                };

                const tgWebAppData = readTgWebAppDataFromUrl();
                if (tgWebAppData) {
                    // tgWebAppData сам является querystring-ом, URL-encoded
                    const inner = new URLSearchParams(tgWebAppData);
                    const userJson = inner.get('user');
                    if (userJson) {
                        try {
                            const user = JSON.parse(userJson);
                            if (user?.id) return String(user.id);
                        } catch (e) {
                            console.warn('Failed to parse user from tgWebAppData:', e);
                        }
                    }
                }

        // --- Supabase Data Context ---

            const [data, setData] = useState(() => {
                try {
                    const cached = localStorage.getItem(localCacheKey);
                    const parsed = cached ? JSON.parse(cached) : null;
                    return { ...getDefaultData(), ...(parsed && typeof parsed === 'object' ? parsed : {}) };

            const [lastSyncTime, setLastSyncTime] = useState(null);

            const saveTimeoutRef = useRef(null);
            const syncIndicatorTimeoutRef = useRef(null);

                ]);

                try {
                    const cached = localStorage.getItem(localCacheKey);
                    if (!cached) return null;
                    const parsed = JSON.parse(cached);
                    return parsed && typeof parsed === 'object' ? parsed : null;
                } catch (e) {
                    return null;
                }
            }, [localCacheKey]);

                try {
                    localStorage.setItem(localCacheKey, JSON.stringify(nextData || getDefaultData()));

            }, [localCacheKey]);

            const persistNow = useCallback(async () => {
                const payload = pendingDataRef.current;
                if (!payload) return;

                try {
                    console.log('[Supabase] Persisting data for user:', USER_ID);
                    writeLocalCache(payload);

                    const { error: saveError } = await withTimeout(supabase.from('user_data').upsert({
                        user_id: USER_ID,
                        data: payload
                    }), 8000, 'Supabase save');
                    if (saveError) throw saveError;

                    console.log('[Supabase] Persisted successfully');
                    setSyncStatus('saved');
                    setLastSyncTime(new Date());
                    pendingDataRef.current = null;

                    if (syncIndicatorTimeoutRef.current) clearTimeout(syncIndicatorTimeoutRef.current);
                    syncIndicatorTimeoutRef.current = setTimeout(() => setSyncStatus('idle'), 2000);
                } catch (err) {
                    console.error('[Supabase] Persist error:', err);
                    setSyncStatus('error');
                }

                setSyncStatus('saving');

                        .eq('user_id', USER_ID)

                    if (fetchError && fetchError.code !== 'PGRST116') {
                        // PGRST116 = no rows found (new user)
                        throw fetchError;

                    if (row?.data) {
                        console.log('[Supabase] Loaded existing data');
                        const merged = { ...getDefaultData(), ...(row.data || {}) };
                        setData(merged);
                        writeLocalCache(merged);
                        pendingDataRef.current = null;
                        setLastSyncTime(new Date());

                        setData(defaultData);

                        const { error: insertError } = await withTimeout(supabase.from('user_data').upsert({

                    setError('Не удалось подключиться к облаку. Показаны локальные данные, если они были сохранены.');

                    setSyncStatus('error');
                } finally {
                    setLoading(false);
                }

                    pendingDataRef.current = next;
                    schedulePersist();
                    return next;
                });

                loadData();
            }, [loadData]);

                    window.removeEventListener('pagehide', onPageHide);

        // --- Error Boundary ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
                            <Icons.AlertTriangle className="w-16 h-16 text-rose-500 mb-4" />
                            <h1 className="text-2xl font-bold mb-2 text-slate-800">Что-то пошло не так</h1>
                            <p className="text-slate-500 text-center mb-6">Приложение столкнулось с ошибкой.</p>
                            <button onClick={() => window.location.reload()} className="bg-slate-900 text-white px-6 py-3 rounded-full font-bold">
                                Перезагрузить
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Design System ---
        const THEME = {
            // Под Premium Dark Neon: используем CSS-переменные/классы
            card: 'lh-card shadow-[0_18px_60px_rgba(0,0,0,0.35)]',
            label: 'text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-zinc-400'
        };

        // --- Components ---
        const PressableScale = ({ children, onClick, className = "", disabled = false }) => (
            <button onClick={onClick} disabled={disabled} className={`active:scale-95 transition-all duration-200 outline-none disabled:opacity-50 cursor-pointer ${className}`}>
                {children}
            </button>
        );

        const BentoCard = ({ children, className = "" }) => (
            <div className={`${THEME.card} p-5 ${className}`}>{children}</div>
        );

        // Utility for adding glow (primary accent)
        const GlowCard = ({ children, className = "" }) => (
            <div className={`${THEME.card} lh-glow-primary p-5 ${className}`}>{children}</div>
        );

        const SectionHeader = ({ title, actionLabel, onAction }) => (
            <div className="flex justify-between items-center mb-4">
                <h2 className="text-lg font-bold text-slate-700">{title}</h2>
                {actionLabel && (
                    <button onClick={onAction} className="text-sm font-bold text-slate-400 hover:text-slate-800 bg-white px-3 py-1.5 rounded-full shadow-sm">
                        {actionLabel}
                    </button>
                )}
            </div>
        );

        const currency = (value) => `${Number(value || 0).toLocaleString('ru-RU')} ₽`;

        const MiniLineChart = ({ points = [], stroke = '#059669', className = '' }) => {
            const safePoints = Array.isArray(points) && points.length > 1 ? points.map(Number) : [0, 0, 0, 0, 0, 0];
            const min = Math.min(...safePoints);
            const max = Math.max(...safePoints);
            const range = max - min || 1;
            const coords = safePoints.map((value, index) => {
                const x = (index / Math.max(1, safePoints.length - 1)) * 100;
                const y = 42 - ((value - min) / range) * 34;
                return `${x},${y}`;
            }).join(' ');

            return (
                <svg className={`w-full h-16 ${className}`} viewBox="0 0 100 48" preserveAspectRatio="none" aria-hidden="true">
                    <polyline points="0,43 100,43" fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth="1" />
                    <polyline points={coords} fill="none" stroke="rgba(255,255,255,0.62)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                    <polyline points={coords} fill="none" stroke={stroke} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
            );
        };

        const DonutChart = ({ items = [], total = 0, compact = false }) => {
            const palette = ['#059669', '#2563eb', '#f59e0b', '#f0645a', '#7c5cff', '#94a3b8'];
            const sum = Number(total || 0) || items.reduce((acc, item) => acc + Number(item.amount || item.value || 0), 0);
            let offset = 25;

            return (
                <div className={`relative shrink-0 ${compact ? 'w-16 h-16 sm:w-20 sm:h-20 lg:w-28 lg:h-28' : 'w-32 h-32'}`}>
                    <svg viewBox="0 0 42 42" className="w-full h-full -rotate-90">
                        <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="rgba(20,33,61,0.06)" strokeWidth="8" />
                        {sum > 0 && items.slice(0, 6).map((item, index) => {
                            const amount = Number(item.amount || item.value || 0);
                            const pct = (amount / sum) * 100;
                            const dash = `${pct} ${100 - pct}`;
                            const currentOffset = offset;
                            offset -= pct;
                            return (
                                <circle
                                    key={index}
                                    cx="21"
                                    cy="21"
                                    r="15.915"
                                    fill="transparent"
                                    stroke={palette[index % palette.length]}
                                    strokeWidth="8"
                                    strokeDasharray={dash}
                                    strokeDashoffset={currentOffset}
                                />
                            );
                        })}
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <div className={`${compact ? 'text-xs lg:text-sm' : 'text-base'} font-bold text-slate-900 leading-none`}>{currency(sum)}</div>
                        <div className="text-[9px] font-medium text-slate-400 mt-1">{sum > 0 ? 'за месяц' : 'нет'}</div>
                    </div>
                </div>
            );
        };

        const EmptyState = ({ icon: IconComponent = Icons.Sparkles, title, text, actionLabel, onAction }) => (
            <div className="relative overflow-hidden flex flex-col items-center justify-center min-h-52 text-center border border-slate-100 rounded-[28px] bg-white/78 p-7 shadow-sm">
                <div className="pointer-events-none absolute -top-14 -right-10 h-32 w-32 rounded-full bg-emerald-100/60 blur-2xl" />
                <div className="pointer-events-none absolute -bottom-16 -left-12 h-36 w-36 rounded-full bg-blue-100/55 blur-2xl" />
                <div className="relative mb-4">
                    <div className="absolute inset-0 rounded-[24px] bg-emerald-200/45 blur-xl" />
                    <div className="relative w-16 h-16 rounded-[24px] bg-gradient-to-br from-white to-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100 shadow-sm">
                        <IconComponent className="w-7 h-7" />
                    </div>
                </div>
                <p className="relative font-extrabold text-slate-900 text-lg tracking-tight">{title}</p>
                {text && <p className="relative text-sm text-slate-500 mt-2 max-w-xs font-semibold leading-relaxed">{text}</p>}
                {actionLabel && (
                    <button onClick={onAction} className="relative mt-5 lh-primary-btn h-11">
                        <Icons.Plus className="w-4 h-4" />
                        {actionLabel}
                    </button>
                )}
            </div>
        );

        const DashboardOverview = ({ onNavigate }) => {
            const { data } = useData();
            const today = startOfDay(new Date());
            const balance = Number(data?.balance || 0);
            const transactions = Array.isArray(data?.transactions) ? data.transactions : [];
            const bills = Array.isArray(data?.bills) ? data.bills : [];
            const goals = Array.isArray(data?.goals) ? data.goals : [];
            const notes = Array.isArray(data?.notes) ? data.notes : [];
            const birthdays = Array.isArray(data?.birthdays) ? data.birthdays : [];
            const lifeGoals = Array.isArray(data?.life_goals) ? data.life_goals : [];

            const monthKey = (date) => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today);
            const txMonthKey = (tx) => {
                if (tx.dateKey) return String(tx.dateKey).slice(0, 7);
                if (tx.createdAt) return monthKey(startOfDay(new Date(tx.createdAt)));
                return currentMonthKey;
            };
            const monthTransactions = transactions.filter(tx => txMonthKey(tx) === currentMonthKey);
            const monthExpenses = monthTransactions.filter(tx => tx.type === 'expense').reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
            const monthIncome = monthTransactions.filter(tx => tx.type === 'income').reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
            const expenseCategories = Object.entries(monthTransactions.filter(tx => tx.type === 'expense').reduce((map, tx) => {
                const category = tx.category || 'Разное';
                map[category] = (map[category] || 0) + Number(tx.amount || 0);
                return map;
            }, {})).map(([name, amount]) => ({ name, amount })).sort((a, b) => b.amount - a.amount);

            const chartPoints = Array.from({ length: 8 }, (_, index) => {
                const day = new Date(today.getFullYear(), today.getMonth(), Math.max(1, today.getDate() - (7 - index)));
                const key = formatDateKey(day);
                return transactions
                    .filter(tx => tx.dateKey === key && tx.type === 'expense')
                    .reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
            });

            const upcomingBills = bills
                .filter(bill => !bill.paid)
                .map(bill => {
                    const day = Math.min(Number(bill.date) || 1, new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate());
                    let nextDate = startOfDay(new Date(today.getFullYear(), today.getMonth(), day));
                    if (nextDate < today) nextDate = startOfDay(new Date(today.getFullYear(), today.getMonth() + 1, day));
                    return { ...bill, nextDate };
                })
                .sort((a, b) => a.nextDate - b.nextDate)
                .slice(0, 3);

            const upcomingBirthdays = birthdays
                .map(item => {
                    const day = Number(item.day) || 1;
                    const month = (Number(item.month) || 1) - 1;
                    let nextDate = startOfDay(new Date(today.getFullYear(), month, day));
                    if (nextDate < today) nextDate = startOfDay(new Date(today.getFullYear() + 1, month, day));
                    return { ...item, nextDate };
                })
                .sort((a, b) => a.nextDate - b.nextDate)
                .slice(0, 3);

            const activeLifeGoals = lifeGoals.filter(goal => !goal.done).slice(0, 2);
            const visibleGoals = goals.slice(0, 2);
            const visibleNotes = notes.slice(0, 3);
            const palette = ['#059669', '#2563eb', '#f59e0b', '#f0645a', '#7c5cff', '#94a3b8'];

            return (
                <section className="lh-page-enter space-y-4 lg:space-y-5 mb-6">
                    <div className="lg:hidden">
                        <p className="text-sm font-bold text-slate-500">Добрый день! 👋</p>
                        <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight mt-1">Всё важное рядом</h2>
                    </div>

                    <div className="grid gap-4 lg:grid-cols-[1.06fr_1fr_0.88fr]">
                        <div className="lh-hero-card">
                            <div className="relative z-10">
                                <div className="flex items-center justify-between">
                                    <p className="text-sm font-extrabold text-white/85">Финансы · {today.toLocaleDateString('ru-RU', { month: 'long' })}</p>
                                    <button onClick={() => onNavigate('budget')} className="w-8 h-8 rounded-xl bg-white/14 flex items-center justify-center">
                                        <Icons.ChevronRight className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-3 mt-5">
                                    <div className="lh-metric-tile">
                                        <p className="text-xs font-bold text-white/70">Баланс</p>
                                        <p className="text-3xl font-extrabold tracking-tight mt-1">{currency(balance)}</p>
                                    </div>
                                    <div className="lh-metric-tile">
                                        <p className="text-xs font-bold text-white/70">Расходы</p>
                                        <p className="text-2xl font-extrabold tracking-tight mt-1">{currency(monthExpenses)}</p>
                                    </div>
                                </div>
                                <MiniLineChart points={chartPoints} stroke="#ffffff" className="mt-4" />
                            </div>
                        </div>

                        <BentoCard className="!p-5 lh-events-card">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <p className={THEME.label}>Расходы</p>
                                    <h3 className="text-lg font-extrabold text-slate-900">По категориям</h3>
                                </div>
                                <button onClick={() => onNavigate('budget')} className="text-xs font-extrabold text-blue-600">Подробнее</button>
                            </div>
                            <div className="flex gap-5 items-center">
                                <DonutChart items={expenseCategories} total={monthExpenses} />
                                <div className="flex-1 space-y-2 min-w-0">
                                    {(expenseCategories.length ? expenseCategories : [{ name: 'Нет расходов', amount: 0 }]).slice(0, 5).map((item, index) => {
                                        const pct = monthExpenses > 0 ? Math.round((Number(item.amount || 0) / monthExpenses) * 100) : 0;
                                        return (
                                            <div key={item.name} className="flex items-center gap-2 text-sm">
                                                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: palette[index % palette.length] }} />
                                                <span className="font-bold text-slate-700 truncate flex-1">{item.name}</span>
                                                <span className="text-slate-400 font-bold">{pct}%</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </BentoCard>

                        <div className="lh-payment-card">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-lg font-extrabold">Ближайшие платежи</h3>
                                <button onClick={() => onNavigate('budget')} className="w-8 h-8 rounded-xl bg-white/16 flex items-center justify-center">
                                    <Icons.ChevronRight className="w-5 h-5" />
                                </button>
                            </div>
                            <div className="space-y-2">
                                {upcomingBills.length > 0 ? upcomingBills.map(bill => (
                                    <div key={bill.id} className="bg-white/82 text-slate-900 rounded-2xl p-3 flex items-center justify-between gap-3">
                                        <div className="min-w-0">
                                            <p className="font-extrabold text-sm truncate">{bill.title}</p>
                                            <p className="text-xs font-bold text-slate-500">{bill.nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}</p>
                                        </div>
                                        <p className="font-extrabold text-sm shrink-0">{currency(bill.amount)}</p>
                                    </div>
                                )) : (
                                    <div className="bg-white/18 rounded-2xl p-4">
                                        <p className="text-sm font-extrabold text-white">Платежей нет</p>
                                        <p className="text-xs font-bold text-white/72 mt-1">Когда появятся счета, они будут здесь.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="grid gap-4 lg:grid-cols-[1fr_1fr_1fr]">
                        <BentoCard className="!p-5 lh-goals-card">

                                <h3 className="text-lg font-extrabold text-slate-900">Ближайшие события</h3>
                                <button onClick={() => onNavigate('events')} className="text-xs font-extrabold text-blue-600">Календарь</button>
                            </div>
                            {upcomingBirthdays.length > 0 ? (
                                <div className="space-y-3">
                                    {upcomingBirthdays.map(item => (
                                        <div key={item.id} className="flex items-center gap-3">
                                            <div className="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex flex-col items-center justify-center shrink-0">
                                                <span className="text-base font-extrabold leading-none">{item.nextDate.getDate()}</span>
                                                <span className="text-[10px] font-black uppercase">{item.nextDate.toLocaleDateString('ru-RU', { month: 'short' })}</span>
                                            </div>
                                            <div className="min-w-0">
                                                <p className="font-extrabold text-slate-900 truncate">{item.name}</p>
                                                <p className="text-xs font-bold text-slate-500 truncate">{item.note || 'День рождения'}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <EmptyState icon={Icons.Calendar} title="Нет ближайших событий" text="Добавьте важные даты в календарь." />
                            )}
                        </BentoCard>

                        <BentoCard className="!p-5">

                                <button onClick={() => onNavigate('goals')} className="text-xs font-extrabold text-blue-600">Смотреть все</button>
                            </div>
                            {(visibleGoals.length || activeLifeGoals.length) ? (
                                <div className="space-y-3">
                                    {visibleGoals.map(goal => {
                                        const percent = Number(goal.targetAmount) ? Math.min(100, Math.round((Number(goal.currentAmount || 0) / Number(goal.targetAmount)) * 100)) : 0;
                                        return (
                                            <div key={goal.id} className="p-3 rounded-2xl bg-slate-50 border border-slate-100">
                                                <div className="flex justify-between gap-3">

                                        <div key={goal.id} className="p-3 rounded-2xl bg-violet-50 border border-violet-100">
                                            <p className="font-extrabold text-slate-900 truncate">{goal.title}</p>
                                            <p className="text-xs font-bold text-violet-600 mt-1">В процессе</p>

                            </div>

                                            <p className="text-xs text-slate-600 mt-1 line-clamp-2">{note.content}</p>

                                <EmptyState icon={Icons.StickyNote} title="Нет заметок" text="Быстрые мысли и списки появятся здесь." />
                            )}

                    </div>

            const { data, updateKey } = useData();

            const [quickNoteSaved, setQuickNoteSaved] = useState(false);
            const dateInputRef = useRef(null);
            const [selectedHomeDateKey, setSelectedHomeDateKey] = useState(() => {

            const selectedHomeDate = startOfDay(new Date(`${selectedHomeDateKey}T00:00:00`));
            const today = selectedHomeDate;
            const balance = Number(data?.balance || 0);
            const monthLimit = Number(data?.limit || 0);
            const transactions = Array.isArray(data?.transactions) ? data.transactions : [];
            const bills = Array.isArray(data?.bills) ? data.bills : [];
            const goals = Array.isArray(data?.goals) ? data.goals : [];
            const notes = Array.isArray(data?.notes) ? data.notes : [];
            const birthdays = Array.isArray(data?.birthdays) ? data.birthdays : [];
            const lifeGoals = Array.isArray(data?.life_goals) ? data.life_goals : [];

            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const userName = tgUser?.first_name || tgUser?.username || 'друг';
            const hour = new Date().getHours();
            const greeting = hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
            const monthKey = (date) => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today);
            const txMonthKey = (tx) => {
                if (tx.dateKey) return String(tx.dateKey).slice(0, 7);
                if (tx.createdAt) return monthKey(startOfDay(new Date(tx.createdAt)));
                return currentMonthKey;
            };
            const monthTx = transactions.filter(tx => txMonthKey(tx) === currentMonthKey);
            const monthExpenses = monthTx.filter(tx => tx.type === 'expense').reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
            const monthIncome = monthTx.filter(tx => tx.type === 'income').reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
            const budgetBase = monthLimit > 0 ? monthLimit : Math.max(monthIncome, monthExpenses, 1);
            const budgetPercent = Math.min(100, Math.round((monthExpenses / budgetBase) * 100));
            const categoryRows = Object.entries(monthTx.filter(tx => tx.type === 'expense').reduce((map, tx) => {
                const name = tx.category || 'Другое';
                map[name] = (map[name] || 0) + Number(tx.amount || 0);
                return map;
            }, {})).map(([name, amount]) => ({ name, amount })).sort((a, b) => b.amount - a.amount);

            const upcomingBills = bills
                .filter(bill => !bill.paid)
                .map(bill => {
                    const day = Math.min(Number(bill.date) || 1, new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate());
                    let nextDate = startOfDay(new Date(today.getFullYear(), today.getMonth(), day));
                    if (nextDate < today) nextDate = startOfDay(new Date(today.getFullYear(), today.getMonth() + 1, day));
                    return { ...bill, nextDate };
                })
                .sort((a, b) => a.nextDate - b.nextDate);

            const upcomingEvents = birthdays
                .map(item => {
                    const day = Number(item.day) || 1;
                    const month = (Number(item.month) || 1) - 1;
                    let nextDate = startOfDay(new Date(today.getFullYear(), month, day));
                    if (nextDate < today) nextDate = startOfDay(new Date(today.getFullYear() + 1, month, day));
                    return { ...item, nextDate };
                })
                .sort((a, b) => a.nextDate - b.nextDate);

            const activeLifeGoals = lifeGoals.filter(goal => !goal.done);
            const completedLifeGoals = lifeGoals.filter(goal => goal.done);
            const goalProgressList = goals.map(goal => Number(goal.targetAmount) ? Math.min(100, Math.round((Number(goal.currentAmount || 0) / Number(goal.targetAmount)) * 100)) : 0);
            const lifeProgress = lifeGoals.length ? Math.round((completedLifeGoals.length / lifeGoals.length) * 100) : 0;
            const totalGoalCount = goalProgressList.length + lifeGoals.length;
            const overallGoalProgress = totalGoalCount
                ? Math.round(([...goalProgressList, lifeProgress].reduce((sum, value) => sum + value, 0)) / (goalProgressList.length + (lifeGoals.length ? 1 : 0)))
                : 0;
            const inProgressGoals = goals.filter(goal => {
                const target = Number(goal.targetAmount || 0);
                return target > 0 && Number(goal.currentAmount || 0) < target;
            }).length + activeLifeGoals.length;

            const checklist = activeLifeGoals.slice(0, 4);
            const recentNotes = [...notes].sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0)).slice(0, 4);
            const importantItems = [
                upcomingBills[0] ? { icon: Icons.Wallet, title: upcomingBills[0].title || 'Платёж', meta: `${currency(upcomingBills[0].amount || 0)} · ${upcomingBills[0].nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}`, tab: 'budget' } : null,
                upcomingEvents[0] ? { icon: Icons.Calendar, title: upcomingEvents[0].name || 'Событие', meta: upcomingEvents[0].nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }), tab: 'events' } : null,
                activeLifeGoals[0] ? { icon: Icons.Target, title: activeLifeGoals[0].title, meta: 'важная цель', tab: 'goals' } : null,
            ].filter(Boolean).slice(0, 3);

            const quickAction = (tab, eventName, detail = {}) => {
                onNavigate(tab);
                window.setTimeout(() => window.dispatchEvent(new CustomEvent(eventName, { detail })), 120);
            };
            const toggleLifeGoal = (goalId) => {
                updateKey('life_goals', lifeGoals.map(goal => goal.id === goalId ? { ...goal, done: !goal.done } : goal));
            };
            const saveQuickNote = () => {
                const title = quickNoteDraft.trim();
                if (!title) return;
                updateKey('notes', [{ id: String(Date.now()), title, content: '', color: 'bg-amber-100', createdAt: Date.now() }, ...notes]);
                setQuickNoteDraft('');
                setQuickNoteSaved(true);
                window.setTimeout(() => setQuickNoteSaved(false), 1800);
            };
            const openDatePicker = () => {
                const input = dateInputRef.current;
                if (!input) return;
                if (typeof input.showPicker === 'function') input.showPicker();
                else input.click();
            };

            const EmptyMini = ({ icon: IconComponent, title, text, actionLabel, onAction }) => (
                <div className="mf-empty">
                    <div>
                        <div className="mf-icon mx-auto mb-3"><IconComponent className="w-5 h-5" /></div>
                        <p className="font-bold text-slate-800 text-sm">{title}</p>
                        <p className="mf-meta mt-1">{text}</p>
                        {actionLabel && <button onClick={onAction} className="mf-text-btn mt-3"><Icons.Plus className="w-4 h-4" />{actionLabel}</button>}
                    </div>
                </div>
            );

            return (
                <section className="mf-home">
                    <div className="mf-mobile-head">
                        <div>
                            <p className="mf-eyebrow">Главная</p>
                            <h2 className="mf-title">{greeting}, {userName}! 👋</h2>
                        </div>
                        <button onClick={() => quickAction('notes', 'lifehub:add-note')} className="mf-icon"><Icons.Plus className="w-5 h-5" /></button>
                    </div>

                    <div className="mf-home-header">
                        <div>
                            <h2 className="mf-title">{greeting}, {userName}! 👋</h2>
                            <p className="mf-subtitle">Короткий обзор того, что важно сегодня.</p>
                        </div>
                        <button type="button" onClick={openDatePicker} className="mf-date-chip mf-date-control">
                            <Icons.Calendar className="w-4 h-4" />
                            <span>{today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'long' })}</span>
                            <input
                                ref={dateInputRef}
                                type="date"
                                value={selectedHomeDateKey}
                                onChange={event => event.target.value && setSelectedHomeDateKey(event.target.value)}
                                onClick={event => event.stopPropagation()}
                                className="mf-date-input"
                                aria-label="Выбрать дату"
                            />
                        </button>
                    </div>

                    <div className="mf-dashboard">
                        <div className="mf-main">
                            <div className="mf-top-grid">
                                <button onClick={() => onNavigate('budget')} className="mf-card mf-card-click">
                                    <div className="mf-card-head">
                                        <div>
                                            <p className="mf-card-title">Финансы — {today.toLocaleDateString('ru-RU', { month: 'long' })}</p>
                                            <p className="mf-meta mt-1">Расходы месяца</p>
                                        </div>
                                        <Icons.ChevronRight className="w-4 h-4 text-slate-400" />
                                    </div>
                                    <p className="mf-number">{currency(monthExpenses)}</p>
                                    <p className="mf-meta mt-1">из {currency(budgetBase)}</p>
                                    <div className="flex items-center gap-3 mt-5">
                                        <div className="mf-progress flex-1"><span style={{ width: `${budgetPercent}%` }} /></div>
                                        <span className="text-xs font-bold text-slate-700">{budgetPercent}%</span>
                                    </div>
                                </button>

                                <button onClick={() => onNavigate('budget')} className="mf-card mf-card-click">
                                    <div className="mf-card-head">
                                        <div>
                                            <p className="mf-card-title">Расходы</p>
                                            <p className="mf-number mt-5">{currency(monthExpenses)}</p>
                                            <p className="mf-meta mt-1">{monthIncome > 0 ? `${Math.round((monthExpenses / Math.max(1, monthIncome)) * 100)}% от доходов` : 'за текущий месяц'}</p>
                                        </div>
                                    </div>
                                    <div className="mf-donut-layout">
                                        <DonutChart items={categoryRows} total={monthExpenses} compact />
                                        <div className="mf-list">
                                            {(categoryRows.length ? categoryRows : [{ name: 'Нет расходов', amount: 0 }]).slice(0, 5).map((item, index) => {
                                                const pct = monthExpenses > 0 ? Math.round((Number(item.amount || 0) / monthExpenses) * 100) : 0;
                                                const colors = monthExpenses > 0 ? ['#064c35', '#7b817d', '#b8bcb8', '#e8a552', '#8c7ae6'] : ['#c5cbc7'];
                                                return (
                                                    <div key={item.name} className="mf-row">
                                                        <span className="sd-dot" style={{ background: colors[index % colors.length] }} />
                                                        <span className="mf-row-title">{item.name}</span>
                                                        <span className="mf-row-meta">{pct}%</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </button>

                                <button onClick={() => onNavigate('goals')} className="mf-card mf-card-click">
                                    <div className="mf-card-head">
                                        <div>
                                            <p className="mf-card-title">Цели</p>
                                            <p className="mf-meta mt-1">{totalGoalCount ? `${inProgressGoals} в процессе` : 'Нет активных целей'}</p>
                                        </div>
                                        <Icons.ChevronRight className="w-4 h-4 text-slate-400" />
                                    </div>
                                    <div className="mf-focus-ring" style={{ background: `conic-gradient(#064c35 0 ${overallGoalProgress * 3.6}deg, #e8ebe8 ${overallGoalProgress * 3.6}deg 360deg)` }}>
                                        <div className="mf-focus-inner">
                                            <div>
                                                <p className="text-2xl font-bold text-slate-900">{totalGoalCount ? `${overallGoalProgress}%` : '0 из 0'}</p>
                                                <p className="text-[11px] font-medium text-slate-500">{totalGoalCount ? 'прогресс' : 'целей'}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <p className="mf-link">{totalGoalCount ? 'Смотреть цели →' : 'Создать цель →'}</p>
                                </button>
                            </div>

                            <div className="mf-mid-grid">
                                <article className="mf-card">
                                    <div className="mf-card-head">
                                        <p className="mf-card-title">Предстоящие события</p>
                                    </div>
                                    {upcomingEvents.length ? (
                                        <>
                                            <div className="mf-list">
                                                {upcomingEvents.slice(0, 3).map(event => (
                                                    <button key={event.id} onClick={() => onNavigate('events')} className="mf-row text-left">
                                                        <div className="mf-icon"><Icons.Calendar className="w-4 h-4" /></div>
                                                        <div className="min-w-0 flex-1">
                                                            <p className="mf-row-title">{event.name}</p>
                                                            <p className="mf-meta">{event.nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', weekday: 'short' })}</p>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                            <button onClick={() => onNavigate('events')} className="mf-link mt-3">Открыть календарь →</button>
                                        </>
                                    ) : <EmptyMini icon={Icons.Calendar} title="На сегодня ничего не запланировано" text="Добавьте событие, встречу или важную дату." actionLabel="Создать" onAction={() => quickAction('events', 'lifehub:add-event')} />}
                                </article>

                                <article className="mf-card">
                                    <div className="mf-card-head">
                                        <p className="mf-card-title">Чек-лист на сегодня</p>
                                        <button onClick={() => onNavigate('goals')} className="mf-link">Все задачи →</button>
                                    </div>
                                    {checklist.length ? (
                                        <div className="mf-list">
                                            {checklist.map(goal => (
                                                <button key={goal.id} onClick={() => toggleLifeGoal(goal.id)} className="mf-row text-left">
                                                    <span className={`mf-checkbox ${goal.done ? 'is-done' : ''}`}>
                                                        {goal.done && <Icons.Check className="w-3.5 h-3.5" />}
                                                    </span>
                                                    <span className="mf-row-title">{goal.title}</span>
                                                </button>
                                            ))}
                                        </div>
                                    ) : <EmptyMini icon={Icons.CheckCircle} title="День свободен ✦" text="Добавьте одну простую задачу на день." actionLabel="Создать" onAction={() => quickAction('goals', 'lifehub:add-goal')} />}
                                </article>

                                <article className="mf-card">
                                    <div className="mf-card-head">
                                        <p className="mf-card-title">Быстрая заметка</p>
                                        <button onClick={() => onNavigate('notes')} className="mf-link">Все →</button>
                                    </div>
                                    <textarea
                                        value={quickNoteDraft}
                                        onChange={event => setQuickNoteDraft(event.target.value)}
                                        placeholder="Запишите мысль, идею или задачу..."
                                        className="mf-note-box"
                                    />
                                    <div className="mf-note-actions">
                                        <div className="flex items-center gap-3 text-slate-700">
                                            <b>B</b><i>I</i><Icons.List className="w-4 h-4" />
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {quickNoteSaved && <span className="mf-note-saved">Сохранено</span>}
                                            <button onClick={saveQuickNote} className="mf-text-btn">Сохранить</button>
                                        </div>
                                    </div>
                                </article>

                                <article className="mf-card text-center">
                                    <p className="mf-card-title text-left">Фокус-блок</p>
                                    <div className="mf-focus-ring">
                                        <div className="mf-focus-inner">
                                            <div>
                                                <p className="text-2xl font-bold text-slate-900">25:00</p>
                                                <p className="text-[11px] font-semibold text-slate-500">фокус</p>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => quickAction('goals', 'lifehub:add-goal')} className="mf-text-btn w-full justify-center">Добавить фокус</button>
                                </article>
                            </div>
                        </div>

                        <aside className="mf-rail">
                            <article className="mf-card">
                                <div className="mf-card-head">
                                    <p className="mf-card-title">Важно</p>
                                </div>
                                {importantItems.length ? (
                                    <div className="mf-list">
                                        {importantItems.map((item, index) => {
                                            const ItemIcon = item.icon;
                                            return (
                                                <button key={`${item.title}-${index}`} onClick={() => onNavigate(item.tab)} className="mf-row text-left">
                                                    <div className="mf-icon"><ItemIcon className="w-4 h-4" /></div>
                                                    <div className="min-w-0 flex-1">
                                                        <p className="mf-row-title">{item.title}</p>
                                                        <p className="mf-meta">{item.meta}</p>
                                                    </div>
                                                    <span className="w-1.5 h-1.5 rounded-full bg-[#064c35]" />
                                                </button>
                                            );
                                        })}
                                    </div>
                                ) : <EmptyMini icon={Icons.Sparkles} title="Важного пока нет" text="LifeHub покажет здесь ближайшие дела." />}
                            </article>

                            <article className="mf-card">
                                <div className="mf-card-head">
                                    <p className="mf-card-title">Недавние заметки</p>
                                    <button onClick={() => onNavigate('notes')} className="mf-link">Все →</button>
                                </div>
                                {recentNotes.length ? (
                                    <div className="mf-list">
                                        {recentNotes.map(note => (
                                            <button key={note.id} onClick={() => onNavigate('notes')} className="mf-row text-left">
                                                <div className="mf-icon"><Icons.StickyNote className="w-4 h-4" /></div>
                                                <div className="min-w-0 flex-1">
                                                    <p className="mf-row-title">{note.title}</p>
                                                    <p className="mf-meta">{new Date(note.createdAt || Date.now()).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}</p>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                ) : <EmptyMini icon={Icons.StickyNote} title="Заметок пока нет" text="Здесь будут ваши мысли и идеи." actionLabel="Создать" onAction={() => quickAction('notes', 'lifehub:add-note')} />}
                            </article>
                        </aside>
                    </div>
                </section>
            );
        };

        // --- Bottom Sheet Modal (Pull-to-Close) ---
        // Поведение: как iOS/Telegram bottom sheet
        // - тянем вниз за любое место шторки → она следует за пальцем
        // - закрывается при смещении > 100px или >20% высоты, либо при резком "броске"
        // - конфликт со скроллом решён: жест закрытия активен ТОЛЬКО если контент внутри проскроллен в самый верх
        const BottomSheetModal = ({
            open,
            onClose,
            zIndex = 100,
            height = '90vh',
            maxWidth = 'max-w-md',
            header,
            footer,
            children,
            initialBackdrop = 0.4,
        }) => {
            const sheetRef = useRef(null);
            const scrollRef = useRef(null);

            const startYRef = useRef(0);
            const lastYRef = useRef(0);
            const startTRef = useRef(0);
            const lastTRef = useRef(0);
            const draggingRef = useRef(false);

            const [translateY, setTranslateY] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const [backdropOpacity, setBackdropOpacity] = useState(initialBackdrop);

            // reset when opened
            useEffect(() => {
                if (!open) return;
                draggingRef.current = false;
                setIsDragging(false);
                setTranslateY(0);
                setBackdropOpacity(initialBackdrop);
            }, [open, initialBackdrop]);

            const getSheetHeightPx = () => {
                try {
                    const h = sheetRef.current?.getBoundingClientRect?.().height;
                    return Number.isFinite(h) && h > 0 ? h : Math.round(window.innerHeight * 0.9);
                } catch (e) {
                    return Math.round(window.innerHeight * 0.9);
                }
            };

            const requestCloseAnimated = useCallback(() => {
                const h = getSheetHeightPx();
                setIsDragging(false);
