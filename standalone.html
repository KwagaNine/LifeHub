        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        .animate-slideUp { animation: slideUp 0.3s ease-out; }
        .animate-zoomIn { animation: zoomIn 0.3s ease-out; }

</head>

    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, Component } = React;

        // --- LocalStorage helper ---
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.log(error);
                }
            };

            return [storedValue, setValue];
        };

        };

        // --- Error Boundary ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
                            <Icons.AlertTriangle className="w-16 h-16 text-rose-500 mb-4" />
                            <h1 className="text-2xl font-bold mb-2 text-slate-800">Что-то пошло не так</h1>
                            <p className="text-slate-500 text-center mb-6">Приложение столкнулось с ошибкой.</p>
                            <button onClick={() => window.location.reload()} className="bg-slate-900 text-white px-6 py-3 rounded-full font-bold">
                                Перезагрузить
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Design System ---
        const THEME = {
            card: 'bg-white rounded-3xl border border-slate-100 shadow-lg shadow-slate-100',
            label: 'text-xs font-bold uppercase tracking-widest text-slate-400'
        };

        // --- Components ---
        const PressableScale = ({ children, onClick, className = "", disabled = false }) => (
            <button onClick={onClick} disabled={disabled} className={`active:scale-95 transition-all duration-200 outline-none disabled:opacity-50 cursor-pointer ${className}`}>
                {children}
            </button>
        );

        const BentoCard = ({ children, className = "" }) => (
            <div className={`${THEME.card} p-5 ${className}`}>{children}</div>
        );

        const SectionHeader = ({ title, actionLabel, onAction }) => (
            <div className="flex justify-between items-center mb-4">
                <h2 className="text-lg font-bold text-slate-700">{title}</h2>
                {actionLabel && (
                    <button onClick={onAction} className="text-sm font-bold text-slate-400 hover:text-slate-800 bg-white px-3 py-1.5 rounded-full shadow-sm">
                        {actionLabel}
                    </button>
                )}
            </div>
        );

        // --- Budget Tab ---
        const BudgetTab = () => {
            const [advice, setAdvice] = useState(null);
            const [loading, setLoading] = useState(false);
            const [isDailyOpen, setDailyOpen] = useState(false);
            const [isBillsOpen, setBillsOpen] = useState(false);
            const [isEditBalanceOpen, setEditBalanceOpen] = useState(false);
            const [isEditLimitOpen, setEditLimitOpen] = useState(false);
            const [isAddTransOpen, setAddTransOpen] = useState(false);
            const [isAddBillOpen, setAddBillOpen] = useState(false);
            const [isStatsOpen, setStatsOpen] = useState(false);
            const [isGoalModalOpen, setGoalModalOpen] = useState(false);
            const [editingGoalId, setEditingGoalId] = useState(null);

            const [totalBalance, setTotalBalance] = useLocalStorage('lifehub_balance', 125000);
            const [monthLimit, setMonthLimit] = useLocalStorage('lifehub_limit', 60000);
            const [selectedDate, setSelectedDate] = useState(new Date().getDate());
            const [selectedBillDate, setSelectedBillDate] = useState(1);

            const [categories] = useState(['Еда', 'Транспорт', 'Дом', 'Развлечения', 'Здоровье', 'Шоппинг', 'Фриланс', 'Разное']);

            const [transactions, setTransactions] = useLocalStorage('lifehub_transactions', [
                { id: '1', amount: 850, title: 'Продукты', type: 'expense', category: 'Еда', date: new Date().getDate(), createdAt: Date.now() },
                { id: '2', amount: 25000, title: 'Зарплата', type: 'income', category: 'Фриланс', date: new Date().getDate() - 1, createdAt: Date.now() - 86400000 },
            ]);
            const [bills, setBills] = useLocalStorage('lifehub_bills', [
                { id: '1', title: 'Аренда квартиры', amount: 35000, date: 1, paid: false, createdAt: Date.now() },
                { id: '2', title: 'Интернет', amount: 750, date: 15, paid: true, createdAt: Date.now() },
            ]);
            const [goals, setGoals] = useLocalStorage('lifehub_goals', [
                { id: '1', title: 'MacBook Pro', targetAmount: 200000, currentAmount: 85000, date: '2024-06-01', color: 'bg-emerald-500', createdAt: Date.now() },
            ]);

            const [newTrans, setNewTrans] = useState({ amount: '', title: '', type: 'expense', category: 'Еда' });
            const [newBill, setNewBill] = useState({ title: '', amount: '', date: 1 });
            const [goalForm, setGoalForm] = useState({ title: '', targetAmount: '', currentAmount: '', date: '' });
            const [manualBalanceInput, setManualBalanceInput] = useState('');
            const [manualLimitInput, setManualLimitInput] = useState('');

            const spentThisMonth = useMemo(() => {
                return transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            }, [transactions]);

            const progress = useMemo(() => {
                if (monthLimit === 0) return 0;
                return Math.min((spentThisMonth / monthLimit) * 100, 100);
            }, [spentThisMonth, monthLimit]);

            const expensesByCategory = useMemo(() => {
                const stats = {};
                transactions.filter(t => t.type === 'expense').forEach(t => {
                    stats[t.category] = (stats[t.category] || 0) + t.amount;
                });
                return Object.entries(stats).map(([name, amount]) => ({ name, amount })).sort((a, b) => b.amount - a.amount);
            }, [transactions]);

            const getFinancialAdvice = async () => {
                setLoading(true);
                await new Promise(resolve => setTimeout(resolve, 1500));
                const advices = [
                    `При текущих расходах ${spentThisMonth.toLocaleString()} ₽ вы используете ${Math.round(progress)}% лимита. Попробуйте сократить расходы на развлечения.`,
                    `Ваш баланс ${totalBalance.toLocaleString()} ₽ позволяет откладывать по ${Math.round((totalBalance - spentThisMonth) / 30)} ₽ в день.`,
                    `Совет: ведите учёт мелких расходов — они часто составляют до 30% бюджета!`,
                    `Рекомендую создать "подушку безопасности" в размере 3-х месячных расходов.`
                ];
                setAdvice(advices[Math.floor(Math.random() * advices.length)]);
                setLoading(false);
            };

            const handleManualBalanceUpdate = () => {
                if (manualBalanceInput) {
                    setTotalBalance(Number(manualBalanceInput));
                    setEditBalanceOpen(false);
                }
            };

            const handleManualLimitUpdate = () => {
                if (manualLimitInput) {
                    setMonthLimit(Number(manualLimitInput));
                    setEditLimitOpen(false);
                }
            };

            const handleAddTransaction = () => {
                if (!newTrans.amount || !newTrans.title) return;
                const amount = Number(newTrans.amount);
                const newTransaction = {
                    id: Date.now().toString(),
                    ...newTrans,
                    amount: amount,
                    date: selectedDate,
                    createdAt: Date.now()
                };
                setTransactions([newTransaction, ...transactions]);

                if (newTrans.type === 'expense') {
                    setTotalBalance(totalBalance - amount);
                } else {
                    setTotalBalance(totalBalance + amount);
                }

                setAddTransOpen(false);
                setNewTrans({ amount: '', title: '', type: 'expense', category: 'Еда' });
            };

            const handleAddBill = () => {
                if (!newBill.amount || !newBill.title) return;
                const newBillItem = {
                    id: Date.now().toString(),
                    title: newBill.title,
                    amount: Number(newBill.amount),
                    date: selectedBillDate,
                    paid: false,
                    createdAt: Date.now()
                };
                setBills([newBillItem, ...bills]);
                setAddBillOpen(false);
                setNewBill({ title: '', amount: '', date: 1 });
            };

            const toggleBillPaid = (billId) => {
                setBills(bills.map(b => b.id === billId ? { ...b, paid: !b.paid } : b));
            };

            const deleteBill = (billId) => {
                setBills(bills.filter(b => b.id !== billId));
            };

            const openAddGoalModal = () => {
                setEditingGoalId(null);
                setGoalForm({ title: '', targetAmount: '', currentAmount: '', date: '' });
                setGoalModalOpen(true);
            };

            const openEditGoalModal = (goal) => {
                setEditingGoalId(goal.id);
                setGoalForm({
                    title: goal.title,
                    targetAmount: String(goal.targetAmount),
                    currentAmount: String(goal.currentAmount),
                    date: goal.date
                });
                setGoalModalOpen(true);
            };

            const handleSaveGoal = () => {
                if (!goalForm.title || !goalForm.targetAmount || !goalForm.date) return;
                const target = Number(goalForm.targetAmount);
                const current = Number(goalForm.currentAmount) || 0;

                const goalData = {
                    title: goalForm.title,
                    targetAmount: target,
                    currentAmount: current,
                    date: goalForm.date,
                    color: 'bg-emerald-500'
                };

                if (editingGoalId) {
                    setGoals(goals.map(g => g.id === editingGoalId ? { ...g, ...goalData } : g));
                } else {
                    const newGoal = {
                        id: Date.now().toString(),
                        ...goalData,
                        createdAt: Date.now()
                    };
                    setGoals([newGoal, ...goals]);
                }
                setGoalModalOpen(false);
            };

            const handleDeleteGoal = () => {
                if (editingGoalId) {

            const calculateDailySavings = (targetAmount, currentAmount, targetDate) => {
                const today = new Date();
                const target = new Date(targetDate);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays <= 0) return 0;
                const remaining = Math.max(0, targetAmount - currentAmount);
                return Math.ceil(remaining / diffDays);
            };

            const filteredTransactions = transactions.filter(t => t.date === selectedDate);

                            <div className="flex items-center gap-3 mt-1">
                                <div className="flex items-baseline gap-2">

                                <div className="flex gap-2">

                    {/* Bento Grid */}

                                <Icons.Receipt className="w-6 h-6 text-emerald-500" />
                            </div>
                            <div>
                                <h3 className="text-slate-800 font-bold text-lg">Операции</h3>
                                <p className="text-slate-400 text-xs font-bold uppercase">История</p>

                            <div>

                        <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                            <div

                    </BentoCard>

                    {/* Goals */}

                        <SectionHeader title="Финансовые цели" actionLabel="+ Цель" onAction={openAddGoalModal} />

                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    {isDailyOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">

                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900">Операции</h2>
                                        <p className="text-slate-500 text-sm">История и Календарь</p>
                                    </div>
                                    <button onClick={() => setDailyOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-400"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto px-6 pb-32 pt-2 scrollbar-hide">
                                    <div className="bg-slate-50 rounded-3xl p-4 mb-6">
                                        <div className="grid grid-cols-7 gap-1">
                                            {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => (
                                                <div key={d} className="h-8 flex items-center justify-center text-[10px] font-black text-slate-300 uppercase">{d}</div>
                                            ))}
                                            {days.map(d => {
                                                const dayTrans = transactions.filter(t => t.date === d);
                                                const hasIncome = dayTrans.some(t => t.type === 'income');
                                                const hasExpense = dayTrans.some(t => t.type === 'expense');
                                                return (
                                                    <button key={d} onClick={() => setSelectedDate(d)} className={`aspect-square rounded-xl flex flex-col items-center justify-center relative ${selectedDate === d ? 'bg-slate-900 text-white shadow-lg' : 'hover:bg-white text-slate-700'}`}>

                                                        <div className="flex gap-0.5 absolute bottom-1">
                                                            {hasIncome && <div className="w-1 h-1 rounded-full bg-emerald-400" />}
                                                            {hasExpense && <div className="w-1 h-1 rounded-full bg-rose-400" />}
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="space-y-3 pb-4">
                                        <SectionHeader title={`Операции за ${selectedDate} число`} />
                                        {filteredTransactions.length > 0 ? (
                                            filteredTransactions.map(t => (
                                                <div key={t.id} className="flex justify-between items-center p-4 bg-white border border-slate-100 rounded-2xl shadow-sm">
                                                    <div className="flex items-center gap-4">

                                                        </div>
                                                        <div>

                                                            <p className="text-xs text-slate-400 font-bold bg-slate-50 px-2 py-0.5 rounded mt-1">{t.category}</p>
                                                        </div>
                                                    </div>
                                                    <span className={`font-mono font-bold ${t.type === 'income' ? 'text-emerald-500' : 'text-slate-900'}`}>
                                                        {t.type === 'income' ? '+' : '-'}{t.amount} ₽
                                                    </span>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-40 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                <Icons.Receipt className="w-10 h-10 mb-2 opacity-50" />
                                                <p className="text-sm font-medium">Нет операций</p>

                                <div className="absolute bottom-0 left-0 right-0 p-6 bg-white border-t border-slate-50">
                                    <PressableScale onClick={() => setAddTransOpen(true)} className="w-full">

                                            <Icons.Plus className="w-6 h-6 text-white mr-2" />
                                            <span className="text-white font-bold text-lg">Добавить операцию</span>
                                        </div>
                                    </PressableScale>
                                </div>
                            </div>
                        </div>

                    {/* Add Transaction Modal */}
                    {isAddTransOpen && (
                        <div className="fixed inset-0 z-[60] flex items-end">

                                    <button onClick={() => setNewTrans({ ...newTrans, type: 'income' })} className={`flex-1 py-3 rounded-xl font-bold transition-all ${newTrans.type === 'income' ? 'bg-white shadow text-slate-900' : 'text-slate-400'}`}>Доход</button>

                                        <textarea
                                            value={eventForm.description}
                                            onChange={e => setEventForm({ ...eventForm, description: e.target.value })}
                                            placeholder="Подробности..."
                                            rows={3}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>

                                    {/* Repeat Option */}
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Повтор</label>
                                        <div className="flex flex-wrap gap-2">
                                            {repeatOptions.map(option => (
                                                <button
                                                    key={option.value}
                                                    onClick={() => setEventForm({ ...eventForm, repeat: option.value })}
                                                    className={`px-4 py-2 rounded-xl font-bold text-sm transition-all flex items-center gap-2
                                                        ${eventForm.repeat === option.value 
                                                            ? option.value === 'none' 
                                                                ? 'bg-slate-900 text-white' 
                                                                : 'bg-amber-500 text-white' 
                                                            : 'bg-slate-100 text-slate-600'
                                                        }
                                                    `}
                                                >
                                                    {option.value !== 'none' && <Icons.Repeat className="w-4 h-4" />}
                                                    {option.label}
                                                </button>
                                            ))}
                                        </div>
                                        {eventForm.repeat !== 'none' && (
                                            <p className="text-xs text-amber-600 bg-amber-50 p-3 rounded-xl mt-2 flex items-center gap-2">
                                                <Icons.Gift className="w-4 h-4" />
                                                Отлично для дней рождений и регулярных событий!
                                            </p>
                                        )}
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Цвет</label>
                                        <div className="flex gap-2">
                                            {colors.map(color => (
                                                <button
                                                    key={color}
                                                    onClick={() => setEventForm({ ...eventForm, color })}
                                                    className={`w-10 h-10 rounded-xl ${color} ${eventForm.color === color ? 'ring-2 ring-slate-400 ring-offset-2' : ''}`}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={handleSave} className="w-full pt-2">
                                    <div className="bg-violet-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingEvent ? 'Сохранить' : 'Создать'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Supplies Tab (Дом / Запасы) ---
        const SuppliesTab = () => {
            const [supplies, setSupplies] = useLocalStorage('lifehub_supplies', [
                { id: '1', name: 'Молоко', category: 'Еда', inStock: true, createdAt: Date.now() },
                { id: '2', name: 'Хлеб', category: 'Еда', inStock: false, createdAt: Date.now() },
                { id: '3', name: 'Мыло', category: 'Гигиена', inStock: true, createdAt: Date.now() },
                { id: '4', name: 'Средство для пола', category: 'Уборка', inStock: false, createdAt: Date.now() },
            ]);
            const [isAddOpen, setAddOpen] = useState(false);
            const [showShoppingList, setShowShoppingList] = useState(false);
            const [newItem, setNewItem] = useState({ name: '', category: 'Еда' });

            const categories = ['Еда', 'Уборка', 'Гигиена', 'Другое'];

            const categoryIcons = {
                'Еда': Icons.Apple,
                'Уборка': Icons.Sparkle,
                'Гигиена': Icons.Droplet,
                'Другое': Icons.Package
            };

            const categoryColors = {
                'Еда': { bg: 'bg-emerald-50', icon: 'bg-emerald-100', text: 'text-emerald-500' },
                'Уборка': { bg: 'bg-sky-50', icon: 'bg-sky-100', text: 'text-sky-500' },
                'Гигиена': { bg: 'bg-violet-50', icon: 'bg-violet-100', text: 'text-violet-500' },
                'Другое': { bg: 'bg-slate-50', icon: 'bg-slate-100', text: 'text-slate-500' }
            };

            const outOfStockCount = supplies.filter(s => !s.inStock).length;

            const displayedSupplies = showShoppingList 
                ? supplies.filter(s => !s.inStock)
                : supplies;

            const toggleStock = (id) => {
                setSupplies(supplies.map(s => s.id === id ? { ...s, inStock: !s.inStock } : s));
            };

            const deleteItem = (id) => {
                setSupplies(supplies.filter(s => s.id !== id));
            };

            const handleAdd = () => {
                if (!newItem.name.trim()) return;
                const item = {
                    id: Date.now().toString(),
                    name: newItem.name,
                    category: newItem.category,
                    inStock: true,
                    createdAt: Date.now()
                };
                setSupplies([item, ...supplies]);
                setNewItem({ name: '', category: 'Еда' });
                setAddOpen(false);
            };

            // Group by category
            const groupedSupplies = displayedSupplies.reduce((acc, item) => {
                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4">
                        <p className={THEME.label}>Запасы</p>
                        <h1 className="text-3xl font-extrabold text-slate-800 mt-1">Дом</h1>
                    </header>

                    {/* Control Panel */}
                    <div className="flex gap-3">
                        <PressableScale 
                            onClick={() => setShowShoppingList(!showShoppingList)}
                            className={`flex-1 py-3 px-4 rounded-2xl flex items-center justify-center gap-2 transition-all
                                ${showShoppingList ? 'bg-rose-500 text-white shadow-lg' : 'bg-white text-slate-700 border border-slate-100 shadow-sm'}
                            `}
                        >
                            <Icons.ShoppingCart className="w-5 h-5" />
                            <span className="font-bold">Список покупок</span>
                            {outOfStockCount > 0 && (
                                <span className={`ml-1 px-2 py-0.5 rounded-full text-xs font-bold
                                    ${showShoppingList ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-600'}
                                `}>
                                    {outOfStockCount}
                                </span>
                            )}
                        </PressableScale>

                        <PressableScale 
                            onClick={() => setAddOpen(true)}
                            className="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center shadow-lg text-white"
                        >
                            <Icons.Plus className="w-6 h-6" />
                        </PressableScale>
                    </div>

                    {/* Supplies List */}
                    <div className="space-y-6">
                        {Object.entries(groupedSupplies).map(([category, items]) => {
                            const IconComponent = categoryIcons[category] || Icons.Package;
                            const colors = categoryColors[category] || categoryColors['Другое'];
                            
                            return (
                                <section key={category}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <div className={`p-1.5 rounded-lg ${colors.icon}`}>
                                            <IconComponent className={`w-4 h-4 ${colors.text}`} />
                                        </div>
                                        <h3 className="font-bold text-slate-700">{category}</h3>
                                        <span className="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{items.length}</span>
                                    </div>
                                    <div className="space-y-2">
                                        {items.map(item => {
                                            const ItemIcon = categoryIcons[item.category] || Icons.Package;
                                            const itemColors = categoryColors[item.category] || categoryColors['Другое'];
                                            
                                            return (
                                                <div 
                                                    key={item.id}
                                                    className={`p-4 rounded-2xl border flex items-center justify-between transition-all
                                                        ${item.inStock 
                                                            ? 'bg-white border-slate-100 shadow-sm' 
                                                            : 'bg-slate-50/50 border-slate-100'
                                                        }
                                                    `}
                                                    style={{ opacity: item.inStock ? 1 : 0.7 }}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <PressableScale 
                                                            onClick={() => toggleStock(item.id)}
                                                            className={`p-2.5 rounded-xl transition-all ${item.inStock ? itemColors.icon : 'bg-slate-100'}`}
                                                        >
                                                            <ItemIcon className={`w-5 h-5 ${item.inStock ? itemColors.text : 'text-slate-400'}`} />
                                                        </PressableScale>
                                                        <div>
                                                            <p className={`font-bold ${item.inStock ? 'text-slate-800' : 'text-slate-500'}`}>
                                                                {item.name}
                                                            </p>
                                                            {!item.inStock && (
                                                                <span className="text-xs font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">
                                                                    Купить
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        {item.inStock && (
                                                            <span className="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded-lg">
                                                                Есть
                                                            </span>
                                                        )}
                                                        <PressableScale 
                                                            onClick={() => deleteItem(item.id)}
                                                            className="p-2 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-colors"
                                                        >
                                                            <Icons.Trash className="w-4 h-4" />
                                                        </PressableScale>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            );
                        })}
                    </div>

                    {displayedSupplies.length === 0 && (
                        <div className="flex flex-col items-center justify-center h-60 text-slate-300">
                            {showShoppingList ? (
                                <>
                                    <Icons.CheckCircle className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Всё куплено!</p>
                                    <p className="text-sm">Список покупок пуст</p>
                                </>
                            ) : (
                                <>
                                    <Icons.Package className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Нет товаров</p>
                                    <p className="text-sm">Добавьте первый товар</p>
                                </>
                            )}
                        </div>
                    )}

                    {/* Add Item Modal */}
                    {isAddOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setAddOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">Новый товар</h2>
                                    <button onClick={() => setAddOpen(false)} className="bg-slate-50 p-2 rounded-full text-slate-400">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={newItem.name}
                                            onChange={e => setNewItem({ ...newItem, name: e.target.value })}
                                            placeholder="Напр: Молоко"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Категория</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {categories.map(cat => {
                                                const CatIcon = categoryIcons[cat];
                                                const colors = categoryColors[cat];
                                                const isSelected = newItem.category === cat;
                                                
                                                return (
                                                    <button
                                                        key={cat}
                                                        onClick={() => setNewItem({ ...newItem, category: cat })}
                                                        className={`p-4 rounded-2xl flex items-center gap-3 transition-all border-2
                                                            ${isSelected 
                                                                ? `${colors.bg} border-current ${colors.text}` 
                                                                : 'bg-slate-50 border-transparent text-slate-600'
                                                            }
                                                        `}
                                                    >
                                                        <div className={`p-2 rounded-xl ${isSelected ? colors.icon : 'bg-slate-100'}`}>
                                                            <CatIcon className={`w-5 h-5 ${isSelected ? colors.text : 'text-slate-400'}`} />
                                                        </div>
                                                        <span className="font-bold">{cat}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={handleAdd} className="w-full pt-2">
                                    <div className="bg-sky-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Добавить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Home Tab ---
        const HomeTab = () => {
            const [totalBalance] = useLocalStorage('lifehub_balance', 125000);
            const [transactions] = useLocalStorage('lifehub_transactions', []);
            const [events] = useLocalStorage('lifehub_events', []);
            const [goals] = useLocalStorage('lifehub_goals', []);
            const [supplies] = useLocalStorage('lifehub_supplies', []);

            const today = new Date();
            const greeting = today.getHours() < 12 ? 'Доброе утро' : today.getHours() < 18 ? 'Добрый день' : 'Добрый вечер';

            const todayDate = today.getDate();
            const upcomingEvents = events
                .filter(e => e.date >= todayDate)
                .sort((a, b) => a.date - b.date)
                .slice(0, 3);

            const recentTransactions = [...transactions]
                .sort((a, b) => b.createdAt - a.createdAt)
                .slice(0, 3);

            const monthlySpent = transactions
                .filter(t => t.type === 'expense')
                .reduce((acc, t) => acc + t.amount, 0);

            const outOfStockCount = supplies.filter(s => !s.inStock).length;

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4">
                        <p className={THEME.label}>{today.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                        <h1 className="text-3xl font-extrabold text-slate-800 mt-1">{greeting}! 👋</h1>
                    </header>

                    {/* Quick Stats */}
                    <div className="grid grid-cols-2 gap-4">
                        <BentoCard className="bg-gradient-to-br from-emerald-50 to-emerald-100/50">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="bg-emerald-100 p-2.5 rounded-xl">
                                    <Icons.Wallet className="w-5 h-5 text-emerald-600" />
                                </div>
                                <span className={THEME.label}>Баланс</span>
                            </div>
                            <p className="text-2xl font-extrabold text-emerald-700">{totalBalance.toLocaleString()} ₽</p>
                        </BentoCard>

                        <BentoCard className="bg-gradient-to-br from-rose-50 to-rose-100/50">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="bg-rose-100 p-2.5 rounded-xl">
                                    <Icons.TrendingDown className="w-5 h-5 text-rose-600" />
                                </div>
                                <span className={THEME.label}>Расходы</span>
                            </div>
                            <p className="text-2xl font-extrabold text-rose-700">{monthlySpent.toLocaleString()} ₽</p>
                        </BentoCard>
                    </div>

                    {/* Shopping List Alert */}
                    {outOfStockCount > 0 && (
                        <BentoCard className="bg-gradient-to-br from-amber-50 to-amber-100/50 !p-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-amber-100 p-2.5 rounded-xl">
                                    <Icons.ShoppingCart className="w-5 h-5 text-amber-600" />
                                </div>
                                <div className="flex-1">
                                    <p className="font-bold text-amber-800">Нужно купить</p>
                                    <p className="text-sm text-amber-600">{outOfStockCount} товар(ов) закончились</p>
                                </div>
                            </div>
                        </BentoCard>
                    )}

                    {/* Goals Progress */}
                    {goals.length > 0 && (
                        <section>
                            <SectionHeader title="Цели" />
                            <div className="space-y-3">
                                {goals.slice(0, 2).map(goal => {
                                    const percent = goal.targetAmount > 0 ? Math.round((goal.currentAmount / goal.targetAmount) * 100) : 0;
                                    return (
                                        <BentoCard key={goal.id} className="!p-4">
                                            <div className="flex justify-between items-center mb-2">
                                                <h3 className="font-bold text-slate-800">{goal.title}</h3>
                                                <span className="text-sm font-bold text-slate-500">{percent}%</span>
                                            </div>
                                            <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                                <div className={`h-full ${goal.color} rounded-full`} style={{ width: `${percent}%` }} />
                                            </div>
                                        </BentoCard>
                                    );
                                })}
                            </div>
                        </section>
                    )}

                    {/* Upcoming Events */}
                    {upcomingEvents.length > 0 && (
                        <section>
                            <SectionHeader title="Ближайшие события" />
                            <div className="space-y-3">
                                {upcomingEvents.map(event => (
                                    <BentoCard key={event.id} className="!p-4 flex gap-4 items-center">
                                        <div className={`w-1 h-12 rounded-full ${event.color}`} />
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2">
                                                <h3 className="font-bold text-slate-800">{event.title}</h3>
                                                {event.repeat && event.repeat !== 'none' && (
                                                    <Icons.Repeat className="w-3.5 h-3.5 text-amber-500" />
                                                )}
                                            </div>
                                            <p className="text-sm text-slate-400">
                                                {event.date} число
                                                {event.time && ` в ${event.time}`}
                                            </p>
                                        </div>
                                    </BentoCard>
                                ))}
                            </div>
                        </section>
                    )}

                    {/* Recent Transactions */}
                    {recentTransactions.length > 0 && (
                        <section>
                            <SectionHeader title="Последние операции" />
                            <BentoCard className="!p-4 space-y-3">
                                {recentTransactions.map(t => (
                                    <div key={t.id} className="flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <div className={`p-2 rounded-xl ${t.type === 'income' ? 'bg-emerald-50 text-emerald-500' : 'bg-rose-50 text-rose-500'}`}>
                                                {t.type === 'income' ? <Icons.TrendingUp className="w-4 h-4" /> : <Icons.TrendingDown className="w-4 h-4" />}
                                            </div>
                                            <div>
                                                <p className="font-bold text-slate-800 text-sm">{t.title}</p>
                                                <p className="text-xs text-slate-400">{t.category}</p>
                                            </div>
                                        </div>
                                        <span className={`font-mono font-bold text-sm ${t.type === 'income' ? 'text-emerald-500' : 'text-slate-700'}`}>
                                            {t.type === 'income' ? '+' : '-'}{t.amount} ₽
                                        </span>
                                    </div>
                                ))}
                            </BentoCard>
                        </section>
                    )}
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');

            // Updated tab order: Главная-Бюджет-События-Заметки-Дом
            const tabs = [
                { id: 'home', icon: Icons.Home, label: 'Главная' },
                { id: 'budget', icon: Icons.Wallet, label: 'Бюджет' },
                { id: 'events', icon: Icons.Calendar, label: 'События' },
                { id: 'notes', icon: Icons.StickyNote, label: 'Заметки' },
                { id: 'supplies', icon: Icons.Package, label: 'Дом' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'home': return <HomeTab />;
                    case 'budget': return <BudgetTab />;
                    case 'events': return <EventsTab />;
                    case 'notes': return <NotesTab />;
                    case 'supplies': return <SuppliesTab />;
                    default: return <HomeTab />;
                }
            };

            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-slate-50">
                        <main className="max-w-md mx-auto px-5 pb-28">
                            {renderTab()}
                        </main>

                        {/* Bottom Navigation */}
                        <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-slate-100 px-4 pt-2 pb-6">
                            <div className="max-w-md mx-auto flex justify-around">
                                {tabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    const TabIcon = tab.icon;
                                    return (
                                        <PressableScale
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className="flex flex-col items-center gap-1 py-2 px-2"
                                        >
                                            <div className={`p-2 rounded-xl transition-all ${isActive ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>
                                                <TabIcon className="w-5 h-5" />
                                            </div>
                                            <span className={`text-[9px] font-bold uppercase tracking-wider ${isActive ? 'text-slate-900' : 'text-slate-400'}`}>
                                                {tab.label}
                                            </span>
                                        </PressableScale>
                                    );
                                })}
                            </div>
                        </nav>
                    </div>
                </ErrorBoundary>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
