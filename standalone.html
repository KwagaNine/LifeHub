                                    Дата: {meetingsSelectedDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={meetingForm.title}
                                            onChange={(e) => setMeetingForm({ ...meetingForm, title: e.target.value })}
                                            placeholder="Напр: Встреча с клиентом"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Время (необязательно)</label>
                                        <input
                                            type="time"
                                            value={meetingForm.time}
                                            onChange={(e) => setMeetingForm({ ...meetingForm, time: e.target.value })}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Заметка</label>
                                        <textarea
                                            value={meetingForm.note}
                                            onChange={(e) => setMeetingForm({ ...meetingForm, note: e.target.value })}
                                            placeholder="Коротко: что важно"
                                            rows={3}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                </div>

                                <PressableScale onClick={saveMeeting} className="w-full pt-2">
                                    <div className="bg-sky-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Сохранить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}

                    {/* Идеи */}
                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">{ideasTitle || 'Идеи'}</h2>
                            <div className="text-[11px] font-black uppercase tracking-widest text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                                {Array.isArray(ideas) ? ideas.length : 0}
                            </div>
                        </div>

                        <BentoCard className="!p-4">
                            <div className="flex gap-2">
                                <input
                                    value={ideaDraft}
                                    onChange={(e) => setIdeaDraft(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter') {
                                            e.preventDefault();
                                            addIdea();
                                        }
                                    }}
                                    placeholder="Добавить идею..."
                                    className="flex-1 bg-slate-50 rounded-2xl px-4 py-3 font-bold text-slate-800 outline-none"
                                />
                                <PressableScale
                                    onClick={addIdea}
                                    className="w-12 h-12 rounded-2xl bg-slate-900 text-white font-bold flex items-center justify-center"
                                    title="Добавить"
                                >
                                    <Icons.Plus className="w-5 h-5" />
                                </PressableScale>
                            </div>

                            <div className="mt-4 space-y-2">
                                {(Array.isArray(ideas) && ideas.length > 0) ? (
                                    ideas.map(item => (
                                        <div key={item.id} className="flex items-center justify-between gap-3 bg-white border border-slate-100 rounded-2xl p-3 shadow-sm">
                                            <p className="font-bold text-slate-700 text-sm">{item.text}</p>
                                            <button
                                                onClick={() => deleteIdea(item.id)}
                                                className="p-2 rounded-xl bg-slate-50 text-slate-400 hover:text-rose-500 hover:bg-rose-50"
                                                title="Удалить"
                                            >
                                                <Icons.X className="w-4 h-4" />
                                            </button>
                                        </div>
                                    ))
                                ) : (
                                    <div className="py-8 text-center text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                        <p className="text-sm font-medium">Запиши идею для подарка или свидания...</p>
                                    </div>
                                )}
                            </div>
                        </BentoCard>
                    </section>

                    {/* Менеджер календаря дней рождений (поверх главной, перекрывает нижний бар) */}
                    {isBirthdaysManagerOpen && (
                        <div className="modal-overlay flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setBirthdaysManagerOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden" style={{ height: '90vh' }}>
                                <div className="flex justify-between items-center p-5 pb-2 bg-white shrink-0">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900">Дни рождения</h2>
                                        <p className="text-slate-500 text-sm">Календарь и список на дату</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <PressableScale
                                            onClick={() => openAddBirthday(bdSelectedDate)}
                                            className="bg-violet-500 p-2.5 rounded-xl text-white shadow-lg"
                                            title="Добавить"
                                        >
                                            <Icons.Plus className="w-5 h-5" />
                                        </PressableScale>
                                        <button onClick={() => setBirthdaysManagerOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-400" title="Закрыть">
                                            <Icons.X className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto px-5 pb-6 pt-2 scrollbar-hide">
                                    <MonthCalendar
                                        viewMonth={bdViewMonth}
                                        selectedDate={bdSelectedDate}
                                        onSelectDate={(d) => setBdSelectedDate(startOfDay(d))}
                                        onPrevMonth={() => setBdViewMonth(new Date(bdViewMonth.getFullYear(), bdViewMonth.getMonth() - 1, 1))}
                                        onNextMonth={() => setBdViewMonth(new Date(bdViewMonth.getFullYear(), bdViewMonth.getMonth() + 1, 1))}
                                        selectedClassName="bg-violet-500 text-white shadow-lg"
                                        todayClassName="bg-violet-50 text-violet-700"
                                        renderMarkers={(day, selected) => {
                                            const count = birthdaysMarkersByDay[day];
                                            if (!count) return null;
                                            return (
                                                <div className="absolute bottom-1.5 flex items-center gap-1">
                                                    <div className={`w-1.5 h-1.5 rounded-full ${selected ? 'bg-white' : 'bg-violet-400'}`} />
                                                    {count > 1 && (
                                                        <span className={`text-[9px] font-black ${selected ? 'text-white/90' : 'text-violet-600'}`}>+{count - 1}</span>
                                                    )}
                                                </div>
                                            );
                                        }}
                                    />

                                    <div className="mt-5">
                                        <SectionHeader
                                            title={bdSelectedDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                                            actionLabel="+"
                                            onAction={() => openAddBirthday(bdSelectedDate)}
                                        />

                                        <div className="space-y-3">
                                            {birthdaysForSelectedManagerDay.length > 0 ? birthdaysForSelectedManagerDay.map(b => (
                                                <PressableScale key={b.id} onClick={() => openEditBirthday(b)} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <div className="w-10 h-10 rounded-2xl bg-violet-50 flex items-center justify-center text-violet-600 shrink-0">
                                                            <Icons.Gift className="w-5 h-5" />
                                                        </div>
                                                        <div className="min-w-0">
                                                            <p className="font-bold text-slate-800 truncate">{b.name}</p>
                                                            <p className="text-xs text-slate-400 truncate">
                                                                {b.note ? b.note : 'Без заметки'}
                                                                {b.year ? ` • ${today0.getFullYear() - Number(b.year)} лет` : ''}
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <Icons.ChevronRight className="w-5 h-5 text-slate-300" />
                                                </PressableScale>
                                            )) : (
                                                <div className="flex flex-col items-center justify-center h-28 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                    <Icons.Gift className="w-10 h-10 mb-2 opacity-50" />
                                                    <p className="text-sm font-medium">Нет записей на эту дату</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Все дни рождения за весь год */}
                                    <div className="mt-8 pt-6 border-t border-slate-100">
                                        <div className="flex items-center justify-between mb-4">
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-700">Все дни рождения</h3>
                                                <p className="text-xs text-slate-400 font-medium">{(birthdays || []).length} записей за год</p>
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            {(birthdays || []).length > 0 ? (
                                                [...(birthdays || [])]
                                                    .sort((a, b) => {
                                                        // Сортировка по месяцу, затем по дню
                                                        const monthA = Number(a.month) || 1;
                                                        const monthB = Number(b.month) || 1;
                                                        if (monthA !== monthB) return monthA - monthB;
                                                        const dayA = Number(a.day) || 1;
                                                        const dayB = Number(b.day) || 1;
                                                        return dayA - dayB;
                                                    })
                                                    .map(b => {
                                                        const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
                                                        const monthName = monthNames[(Number(b.month) || 1) - 1] || 'Янв';
                                                        const day = Number(b.day) || 1;

                                                        return (
                                                            <PressableScale
                                                                key={b.id}
                                                                onClick={() => {
                                                                    const d = safeDate(today0.getFullYear(), (Number(b.month) || 1) - 1, day);
                                                                    setBdSelectedDate(d);
                                                                    setBdViewMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                                                                    openEditBirthday(b);
                                                                }}
                                                                className="bg-white border border-slate-100 rounded-2xl p-3 flex items-center justify-between shadow-sm"
                                                            >
                                                                <div className="flex items-center gap-3 min-w-0">
                                                                    {/* Дата в компактном виде */}
                                                                    <div className="w-12 h-12 rounded-xl bg-violet-50 flex flex-col items-center justify-center shrink-0">
                                                                        <span className="text-[10px] font-black text-violet-400 uppercase">{monthName}</span>
                                                                        <span className="text-base font-extrabold text-violet-700 -mt-0.5">{day}</span>
                                                                    </div>
                                                                    <div className="min-w-0">
                                                                        <p className="font-bold text-slate-800 truncate">{b.name}</p>
                                                                        <p className="text-xs text-slate-400 truncate">
                                                                            {b.year ? `${today0.getFullYear() - Number(b.year)} лет` : ''}
                                                                            {b.note ? (b.year ? ' • ' : '') + b.note : ''}
                                                                            {!b.year && !b.note ? 'Без заметки' : ''}
                                                                        </p>
                                                                    </div>
                                                                </div>
                                                                <Icons.ChevronRight className="w-5 h-5 text-slate-300 shrink-0" />
                                                            </PressableScale>
                                                        );
                                                    })
                                            ) : (
                                                <div className="flex flex-col items-center justify-center h-32 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                    <Icons.Gift className="w-10 h-10 mb-2 opacity-50" />
                                                    <p className="text-sm font-medium">Список пуст</p>
                                                    <p className="text-xs">Добавьте первый день рождения</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Модалка добавить/редактировать ДР (поверх менеджера) */}
                    {isBirthdayModalOpen && (
                        <div className="fixed inset-0 z-[150] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setBirthdayModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp max-h-[90vh] overflow-y-auto scrollbar-hide">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingBirthday ? 'Редактирование' : 'Новый день рождения'}</h2>
                                    {editingBirthday && (
                                        <button onClick={deleteBirthday} className="bg-rose-50 p-3 rounded-full text-rose-500" title="Удалить">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Имя</label>
                                        <input
                                            value={birthdayForm.name}
                                            onChange={e => setBirthdayForm({ ...birthdayForm, name: e.target.value })}
                                            placeholder="Напр: Оля"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-2">
                                            <label className={THEME.label}>День</label>
                                            <input
                                                type="number"
                                                min="1"
                                                max="31"
                                                value={birthdayForm.day}
                                                onChange={e => setBirthdayForm({ ...birthdayForm, day: Number(e.target.value) })}
                                                className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            />
                                        </div>
                                        <div className="space-y-2">
                                            <label className={THEME.label}>Месяц</label>
                                            <select
                                                value={birthdayForm.month}
                                                onChange={e => setBirthdayForm({ ...birthdayForm, month: Number(e.target.value) })}
                                                className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            >
                                                {['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'].map((m, i) => (
                                                    <option key={m} value={i + 1}>{m}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Год (необязательно)</label>
                                        <input
                                            type="number"
                                            value={birthdayForm.year}
                                            onChange={e => setBirthdayForm({ ...birthdayForm, year: e.target.value })}
                                            placeholder="Напр: 1995"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Заметка</label>
                                        <textarea
                                            value={birthdayForm.note}
                                            onChange={e => setBirthdayForm({ ...birthdayForm, note: e.target.value })}
                                            placeholder="Подарок, пожелания..."
                                            rows={3}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                </div>

                                <PressableScale onClick={saveBirthday} className="w-full pt-2">
                                    <div className="bg-violet-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Сохранить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}

                    {/* Блок «Заметки» удалён по запросу */}

                    {/* Life goal modal */}
                    {isLifeGoalModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setLifeGoalModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingLifeGoal ? 'Редактирование' : 'Новая цель'}</h2>
                                    {editingLifeGoal && (
                                        <button onClick={deleteLifeGoal} className="bg-rose-50 p-3 rounded-full text-rose-500">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-2">
                                    <label className={THEME.label}>Формулировка</label>
                                    <input
                                        value={lifeGoalDraft}
                                        onChange={(e) => setLifeGoalDraft(e.target.value)}
                                        className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        placeholder="Напр: Пробежать 5 км"
                                        autoFocus
                                    />
                                </div>

                                <PressableScale onClick={saveLifeGoal} className="w-full pt-2">
                                    <div className="bg-slate-900 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Сохранить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                    
                    {/* Archive Modal - История достижений */}
                    {showArchiveModal && (
                        <div className="modal-overlay flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setShowArchiveModal(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden" style={{ height: '80vh' }}>
                                <div className="flex justify-between items-center p-5 pb-2 bg-white shrink-0">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900">История достижений</h2>
                                        <p className="text-slate-500 text-sm">Все выполненные цели</p>
                                    </div>
                                    <button onClick={() => setShowArchiveModal(false)} className="bg-slate-100 p-2 rounded-full text-slate-400">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto px-5 pb-6 pt-2 scrollbar-hide">
                                    {/* Статистика */}
                                    <div className="bg-gradient-to-br from-amber-50 to-amber-100/50 rounded-3xl p-5 mb-5 border border-amber-100">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className={THEME.label}>Всего достижений</p>
                                                <p className="text-3xl font-extrabold text-amber-700 mt-1">{(archivedGoals || []).length}</p>
                                            </div>
                                            <div className="bg-gradient-to-br from-amber-400 to-amber-500 text-white px-4 py-2 rounded-2xl shadow-lg shadow-amber-200">
                                                <span className="text-lg font-black">Lvl {goalsLevel}</span>
                                            </div>
                                        </div>
                                        <div className="mt-3 pt-3 border-t border-amber-200/50">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-bold text-amber-600">Накоплено XP:</span>
                                                <span className="text-sm font-extrabold text-amber-700">{goalsXP} XP</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Список архивных целей */}
                                    <div className="space-y-3">
                                        {(archivedGoals || []).length > 0 ? (
                                            (archivedGoals || []).map((g, idx) => (
                                                <div 
                                                    key={g.id + '-' + idx}
                                                    className="bg-slate-50 border border-slate-100 rounded-2xl p-4 flex items-start gap-3"
                                                >
                                                    <div className="w-9 h-9 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                                                        <Icons.CheckCircle className="w-5 h-5" />
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <p className="font-bold text-slate-800">{g.title}</p>
                                                        <p className="text-xs text-slate-400 mt-1">
                                                            Выполнено: {g.archivedAt ? new Date(g.archivedAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Дата неизвестна'}
                                                        </p>
                                                    </div>
                                                    <div className="text-xs font-black text-amber-600 bg-amber-50 px-2 py-1 rounded-full shrink-0">
                                                        +{XP_PER_GOAL} XP
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-48 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                <Icons.Clock className="w-12 h-12 mb-3 opacity-50" />
                                                <p className="text-sm font-medium">История пуста</p>
                                                <p className="text-xs mt-1">Выполняйте цели, чтобы они появились здесь</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Stage Clear Modal - Уведомление об архивации */}
                    {showStageClearModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-md" />
                            <div className="bg-white rounded-[32px] p-8 shadow-2xl relative animate-zoomIn text-center max-w-sm">
                                <div className="text-6xl mb-4">🏆</div>
                                <h2 className="text-2xl font-extrabold text-slate-900 mb-2">Все цели достигнуты!</h2>
                                <p className="text-slate-500 mb-4">Список очищен и перемещён в архив. Готовы к новым свершениям!</p>
                                <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4">
                                    <p className="text-sm font-bold text-amber-700">
                                        Очищено целей: {stageClearCount}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Sync Status Indicator ---
        const GoalsTab = () => {
            const [financialGoals, setFinancialGoals] = useLocalStorage('lifehub_goals', []);
            const [lifeGoals, setLifeGoals] = useLocalStorage('lifehub_life_goals', []);
            const [selectedGoalId, setSelectedGoalId] = useState(null);
            const [mobileDetailOpen, setMobileDetailOpen] = useState(false);
            const [filterOpen, setFilterOpen] = useState(false);
            const [statusFilter, setStatusFilter] = useState('all');
            const [editorOpen, setEditorOpen] = useState(false);
            const [progressOpen, setProgressOpen] = useState(false);
            const [menuGoal, setMenuGoal] = useState(null);
            const [deleteGoalCandidate, setDeleteGoalCandidate] = useState(null);
            const [showDetails, setShowDetails] = useState(false);
            const [toast, setToast] = useState('');
            const [progressDraft, setProgressDraft] = useState('');
            const [progressMode, setProgressMode] = useState('add');
            const [goalForm, setGoalForm] = useState({
                title: '',
                type: 'money',
                targetAmount: '',
                currentAmount: '',
                deadline: '',
                category: 'Личное',
                description: '',
                unit: '',
                icon: '🎯'
            });

            const categories = [
                { id: 'Финансы', label: 'Финансы', color: '#047857', soft: '#eef8f2', icon: Icons.Wallet },
                { id: 'Здоровье', label: 'Здоровье', color: '#ef7462', soft: '#fff1ee', icon: Icons.CheckCircle },
                { id: 'Обучение', label: 'Обучение', color: '#2563eb', soft: '#eef5ff', icon: Icons.List },
                { id: 'Саморазвитие', label: 'Саморазвитие', color: '#7c3aed', soft: '#f4efff', icon: Icons.Sparkle },
                { id: 'Карьера', label: 'Карьера', color: '#0f766e', soft: '#ecfdf5', icon: Icons.TrendingUp },
                { id: 'Личное', label: 'Личное', color: '#64748b', soft: '#f1f5f9', icon: Icons.Target },
            ];
            const statusFilters = [
                { id: 'all', label: 'Все' },
                { id: 'active', label: 'Активные' },
                { id: 'paused', label: 'На паузе' },
                { id: 'completed', label: 'Завершённые' },
            ];
            const filterEmptyCopy = {
                all: ['Пока нет целей', 'Создайте первую цель, чтобы начать отслеживать прогресс.'],
                active: ['Активных целей нет', 'Можно создать новую цель или возобновить цель на паузе.'],
                paused: ['Целей на паузе нет', 'Здесь появятся цели, которые вы временно отложите.'],
                completed: ['Завершённых целей пока нет', 'Когда цель достигнет 100%, её можно будет завершить.']
            };

            const showGoalToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(''), 1800);
            };

            const clampPercent = (value) => Math.max(0, Math.min(100, Number(value || 0)));
            const calculateGoalProgress = (goal) => {
                const target = Number(goal?.targetAmount ?? goal?.target ?? 0);
                const current = Number(goal?.currentAmount ?? goal?.current ?? 0);
                const hasValidTarget = Number.isFinite(target) && target > 0;
                const raw = hasValidTarget ? Math.max(0, Math.round((current / target) * 100)) : 0;
                const storedCompleted = goal?.status === 'completed' || goal?.done === true;
                const effectiveCompleted = storedCompleted && (raw >= 100 || current >= target && hasValidTarget);
                return {
                    raw,
                    display: clampPercent(raw),
                    visual: clampPercent(effectiveCompleted ? 100 : raw),
                    target: hasValidTarget ? target : 0,
                    current: Number.isFinite(current) ? current : 0,
                    effectiveStatus: effectiveCompleted ? 'completed' : (goal?.status === 'paused' ? 'paused' : 'active')
                };
            };
            const categoryMeta = (category) => categories.find(item => item.id === category) || categories[categories.length - 1];
            const statusOf = (goal) => calculateGoalProgress(goal).effectiveStatus;
            const typeOf = (goal) => goal.type || (goal.source === 'financial' ? 'money' : 'percent');
            const formatGoalValue = (goal) => {
                const type = typeOf(goal);
                const progress = calculateGoalProgress(goal);
                const current = progress.current;
                const target = progress.target;
                if (type === 'money') return `${currency(current)} из ${currency(target)}`;
                if (type === 'number') return `${current.toLocaleString('ru-RU')} из ${target.toLocaleString('ru-RU')} ${goal.unit || ''}`.trim();
                return `${progress.display}% из 100%`;
            };
            const deadlineText = (goal) => {
                const value = goal.date || goal.deadline || goal.targetDate;
                if (!value) return 'Без срока';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return 'Без срока';
                return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            };
            const daysLeft = (goal) => {
                const value = goal.date || goal.deadline || goal.targetDate;
                if (!value) return 'Без срока';
                const end = new Date(value);
                if (Number.isNaN(end.getTime())) return 'Без срока';
                const today = startOfDay(new Date());
                const diff = Math.ceil((startOfDay(end) - today) / 86400000);
                if (diff < 0 && statusOf(goal) !== 'completed') return 'Срок прошёл';
                if (diff === 0) return 'Сегодня';
                return `${diff} дн.`;
            };

            const allGoals = useMemo(() => {
                const money = (Array.isArray(financialGoals) ? financialGoals : []).map(goal => ({
                    ...goal,
                    source: 'financial',
                    type: goal.type || 'money',
                    category: goal.category || 'Финансы',
                    status: calculateGoalProgress(goal).effectiveStatus,
                    currentAmount: Number(goal.currentAmount || 0),
                    targetAmount: Number(goal.targetAmount || 0),
                    updatedAt: Number(goal.updatedAt || goal.createdAt || Date.now())
                }));
                const personal = (Array.isArray(lifeGoals) ? lifeGoals : []).map(goal => {
                    const type = goal.type || (goal.targetAmount ? 'number' : 'percent');
                    const done = Boolean(goal.done || goal.status === 'completed');
                    return {
                        ...goal,
                        source: 'life',
                        type,
                        category: goal.category || 'Личное',
                        status: calculateGoalProgress({ ...goal, currentAmount: Number(goal.currentAmount ?? (done ? 1 : 0)), targetAmount: Number(goal.targetAmount ?? 1) }).effectiveStatus,
                        currentAmount: Number(goal.currentAmount ?? (done ? 1 : 0)),
                        targetAmount: Number(goal.targetAmount ?? 1),
                        unit: goal.unit || (type === 'number' ? 'шагов' : ''),
                        updatedAt: Number(goal.updatedAt || goal.createdAt || Date.now())
                    };
                });
                return [...money, ...personal].sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0));
            }, [financialGoals, lifeGoals]);

            const filteredGoals = useMemo(() => allGoals.filter(goal => statusFilter === 'all' || statusOf(goal) === statusFilter), [allGoals, statusFilter]);
            const selectedGoal = filteredGoals.find(goal => goal.id === selectedGoalId) || filteredGoals[0] || allGoals.find(goal => goal.id === selectedGoalId) || allGoals[0] || null;
            const completedCount = allGoals.filter(goal => statusOf(goal) === 'completed').length;
            const pausedCount = allGoals.filter(goal => statusOf(goal) === 'paused').length;
            const activeCount = allGoals.filter(goal => statusOf(goal) === 'active').length;
            const overallProgress = allGoals.length ? Math.round(allGoals.reduce((sum, goal) => sum + calculateGoalProgress(goal).visual, 0) / allGoals.length) : 0;
            const categoryProgress = useMemo(() => {
                const map = {};
                allGoals.forEach(goal => {
                    const category = goal.category || 'Личное';
                    if (!map[category]) map[category] = [];
                    map[category].push(calculateGoalProgress(goal).visual);
                });
                return Object.entries(map).map(([name, values]) => ({
                    name,
                    progress: Math.round(values.reduce((sum, value) => sum + value, 0) / values.length),
                    count: values.length
                })).sort((a, b) => b.progress - a.progress).slice(0, 5);
            }, [allGoals]);

            useEffect(() => {
                if (!selectedGoalId && filteredGoals[0]) setSelectedGoalId(filteredGoals[0].id);
                if (selectedGoalId && filteredGoals.length && !filteredGoals.some(goal => goal.id === selectedGoalId)) setSelectedGoalId(filteredGoals[0].id);
                if (selectedGoalId && !allGoals.some(goal => goal.id === selectedGoalId)) setSelectedGoalId(filteredGoals[0]?.id || null);
            }, [selectedGoalId, filteredGoals, allGoals]);

            const updateGoal = (goal, patch, message = 'Цель обновлена') => {
                const draft = { ...goal, ...patch, updatedAt: Date.now() };
                const draftProgress = calculateGoalProgress(draft);
                const shouldComplete = patch.status === 'completed' || patch.done === true;
                const safePatch = shouldComplete && draftProgress.raw < 100
                    ? { ...patch, status: 'active', done: false }
                    : patch;
                const next = { ...goal, ...safePatch, updatedAt: Date.now() };
                if (goal.source === 'financial') {
                    setFinancialGoals(prev => (Array.isArray(prev) ? prev : []).map(item => item.id === goal.id ? { ...item, ...next, source: undefined } : item));
                } else {
                    setLifeGoals(prev => (Array.isArray(prev) ? prev : []).map(item => item.id === goal.id ? { ...item, ...next, source: undefined, done: next.status === 'completed' } : item));
                }
                setSelectedGoalId(goal.id);
                showGoalToast(message);
            };

            const openCreate = () => {
                setGoalForm({ title: '', type: 'money', targetAmount: '', currentAmount: '', deadline: '', category: 'Личное', description: '', unit: '', icon: '🎯' });
                setShowDetails(false);
                setEditorOpen(true);
            };
            const openEdit = (goal) => {
                setGoalForm({
                    id: goal.id,
                    source: goal.source,
                    title: goal.title || '',
                    type: typeOf(goal),
                    targetAmount: String(goal.targetAmount || ''),
                    currentAmount: String(goal.currentAmount || ''),
                    deadline: goal.date || goal.deadline || '',
                    category: goal.category || 'Личное',
                    description: goal.description || '',
                    unit: goal.unit || '',
                    icon: goal.icon || '🎯',
                    status: statusOf(goal)
                });
                setShowDetails(false);
                setEditorOpen(true);
            };

            useEffect(() => {
                const onQuickGoal = () => openCreate();
                window.addEventListener('lifehub:add-goal', onQuickGoal);
                return () => window.removeEventListener('lifehub:add-goal', onQuickGoal);
            }, []);

            const saveGoal = () => {
                const title = String(goalForm.title || '').trim();
                const type = goalForm.type || 'money';
                const target = type === 'percent' ? 100 : Number(goalForm.targetAmount || 0);
                const current = type === 'percent' ? Number(goalForm.currentAmount || 0) : Number(goalForm.currentAmount || 0);
                if (!title || target <= 0) return;
                const payload = {
                    title,
                    type,
                    category: goalForm.category || (type === 'money' ? 'Финансы' : 'Личное'),
                    targetAmount: target,
                    currentAmount: Math.max(0, current),
                    date: goalForm.deadline,
                    deadline: goalForm.deadline,
                    description: goalForm.description,
                    unit: goalForm.unit,
                    icon: goalForm.icon || '🎯',
                    status: goalForm.status || 'active',
                    updatedAt: Date.now()
                };
                const normalizedProgress = calculateGoalProgress(payload);
                if (payload.status === 'completed' && normalizedProgress.raw < 100) {
                    payload.status = 'active';
                }
                if (goalForm.id) {
                    const source = goalForm.source || (type === 'money' ? 'financial' : 'life');
                    if (source === 'financial') setFinancialGoals(prev => (Array.isArray(prev) ? prev : []).map(goal => goal.id === goalForm.id ? { ...goal, ...payload } : goal));
                    else setLifeGoals(prev => (Array.isArray(prev) ? prev : []).map(goal => goal.id === goalForm.id ? { ...goal, ...payload, done: payload.status === 'completed' } : goal));
                    setSelectedGoalId(goalForm.id);
                    showGoalToast('Изменения сохранены');
                } else {
                    const id = String(Date.now());
                    const next = { id, ...payload, createdAt: Date.now() };
                    if (type === 'money') setFinancialGoals(prev => [next, ...(Array.isArray(prev) ? prev : [])]);
                    else setLifeGoals(prev => [{ ...next, done: false }, ...(Array.isArray(prev) ? prev : [])]);
                    setSelectedGoalId(id);
                    showGoalToast('Цель создана');
                }
                setEditorOpen(false);
            };

            const saveProgress = () => {
                if (!selectedGoal) return;
                const value = Number(progressDraft || 0);
                if (!Number.isFinite(value)) return;
                const current = Number(selectedGoal.currentAmount || 0);
                const nextValue = progressMode === 'add' ? current + value : value;
                const nextProgress = calculateGoalProgress({ ...selectedGoal, currentAmount: Math.max(0, nextValue) });
                updateGoal(selectedGoal, {
                    currentAmount: Math.max(0, nextValue),
                    status: nextProgress.raw >= 100 ? selectedGoal.status : statusOf(selectedGoal),
                    done: nextProgress.raw >= 100 ? selectedGoal.done : false,
                    progressHistory: [...(selectedGoal.progressHistory || []), { date: new Date().toISOString(), value: Math.max(0, nextValue) }]
                }, 'Прогресс обновлён');
                setProgressOpen(false);
                setProgressDraft('');
            };

            const removeGoal = () => {
                if (!deleteGoalCandidate) return;
                if (deleteGoalCandidate.source === 'financial') setFinancialGoals(prev => (Array.isArray(prev) ? prev : []).filter(goal => goal.id !== deleteGoalCandidate.id));
                else setLifeGoals(prev => (Array.isArray(prev) ? prev : []).filter(goal => goal.id !== deleteGoalCandidate.id));
                setDeleteGoalCandidate(null);
                setMenuGoal(null);
                setMobileDetailOpen(false);
                setSelectedGoalId(filteredGoals.find(goal => goal.id !== deleteGoalCandidate.id)?.id || null);
                showGoalToast('Цель удалена');
            };

            const GoalCircle = ({ value, size = 'default' }) => {
                const percent = clampPercent(value);
                return (
                    <div className={`go-circle ${size === 'small' ? '!w-28 !h-28' : ''}`} role="img" aria-label={`Общий прогресс ${percent}%`}>
                        <svg viewBox="0 0 120 120">
                            <circle className="go-circle-bg" cx="60" cy="60" r="48" />
                            <circle className="go-circle-fg" cx="60" cy="60" r="48" strokeDasharray={`${percent * 3.015} 301.5`} />
                        </svg>
                        <div className="go-circle-text"><div><strong>{percent}%</strong><span>общий прогресс</span></div></div>
                    </div>
                );
            };

            const GoalCard = ({ goal }) => {
                const meta = categoryMeta(goal.category);
                const MetaIcon = meta.icon;
                const progress = calculateGoalProgress(goal);
                const percent = progress.visual;
                const status = progress.effectiveStatus;
                return (
                    <button onClick={() => { setSelectedGoalId(goal.id); setMobileDetailOpen(true); }} className={`go-card ${selectedGoal?.id === goal.id ? 'is-active' : ''}`} style={{ '--go-color': meta.color, '--go-soft': meta.soft, '--go-progress': `${percent}%` }}>
                        <div>
                            <div className="flex items-start justify-between gap-2">
                                <span className="go-badge"><MetaIcon className="w-4 h-4" />{goal.category}</span>
                                <span className={`go-status ${status}`}>{status === 'completed' ? 'Завершена' : status === 'paused' ? 'Пауза' : 'Активная'}</span>
                            </div>
                            <h3 className="go-card-title mt-4">{goal.title}</h3>
                            <p className="go-muted mt-2">{formatGoalValue(goal)}</p>
                        </div>
                        <div>
                            <div className="go-progress-line"><span>{progress.display}%</span><span>{deadlineText(goal)}</span></div>
                            <div className="go-bar mt-2"><span /></div>
                        </div>
                    </button>
                );
            };

            const Milestones = ({ goal }) => {
                const progress = calculateGoalProgress(goal);
                const target = progress.target;
                const current = progress.current;
                const marks = Array.isArray(goal?.milestones) && goal.milestones.length
                    ? goal.milestones
                    : [25, 50, 75, 100].map(percent => ({ label: typeOf(goal) === 'money' ? currency(Math.round(target * percent / 100)) : `${percent}%`, value: target * percent / 100 }));
                return <div className="go-milestones">{marks.map((mark, index) => {
                    const value = Number(mark.value ?? mark.amount ?? 0);
                    const done = target > 0 && current >= value;
                    const currentMark = !done && index === marks.findIndex(item => current < Number(item.value ?? item.amount ?? 0));
                    return <div key={`${mark.label}-${index}`} className={`go-milestone ${done ? 'done' : currentMark ? 'current' : ''}`}><span className="go-milestone-mark">{done && <Icons.Check className="w-3 h-3" />}</span><span>{mark.label || value}</span></div>;
                })}</div>;
            };

            const GoalDetail = ({ goal, mobile = false }) => {
                if (!goal) return null;
                const meta = categoryMeta(goal.category);
                const MetaIcon = meta.icon;
                const progress = calculateGoalProgress(goal);
                const percent = progress.visual;
                const remaining = Math.max(0, progress.target - progress.current);
                const status = progress.effectiveStatus;
                return (
                    <div className="go-detail-grid">
                        <section className={mobile ? '' : 'go-detail'} style={{ '--go-color': meta.color, '--go-soft': meta.soft, '--go-progress': `${percent}%` }}>
                            <div className="flex items-start justify-between gap-3">
                                {mobile && <button onClick={() => setMobileDetailOpen(false)} className="nt-icon-btn"><Icons.ChevronLeft className="w-4 h-4" /></button>}
                                <div className="min-w-0 flex-1">
                                    <span className="go-badge"><MetaIcon className="w-4 h-4" />{goal.category}</span>
                                    <h2 className="go-detail-title mt-3">{goal.title}</h2>
                                </div>
                                <button onClick={() => setMenuGoal(goal)} className="nt-icon-btn" aria-label="Действия с целью"><Icons.Ellipsis className="w-5 h-5" /></button>
                            </div>
                            <p className="go-detail-value">{formatGoalValue(goal)}</p>
                            <div className="go-progress-line"><span>{progress.display}%</span><span>{status === 'completed' ? 'Готово' : `Осталось: ${typeOf(goal) === 'money' ? currency(remaining) : remaining.toLocaleString('ru-RU')}`}</span></div>
                            <div className="go-bar mt-3"><span /></div>
                            {goal.description && <p className="go-muted mt-4">{goal.description}</p>}
                            {progress.raw >= 100 && status !== 'completed' && (
                                <div className="go-complete-hint">
                                    <strong>Цель достигнута</strong>
                                    <button onClick={() => updateGoal(goal, { status: 'completed', done: true }, 'Цель завершена')} className="go-secondary">Завершить цель</button>
                                </div>
                            )}
                            <div className="go-actions">
                                <button onClick={() => { setProgressOpen(true); setProgressDraft(''); setProgressMode('add'); }} className="go-primary"><Icons.Plus className="w-4 h-4" />Добавить прогресс</button>
                            </div>
                        </section>
                        <section className={mobile ? 'go-panel mt-4' : 'go-detail'}>
                            <div className="go-panel-head"><div><p className="go-kicker">Вехи</p><h3 className="go-heading">Маленькие шаги</h3></div></div>
                            <Milestones goal={goal} />
                        </section>
                        <section className={mobile ? 'go-panel mt-4' : 'go-detail'}>
                            <div className="go-panel-head"><div><p className="go-kicker">Статистика</p><h3 className="go-heading">Состояние</h3></div></div>
                            <div className="go-stat-grid">
                                <div className="go-stat-row"><span>Статус</span><strong>{status === 'completed' ? 'Завершена' : status === 'paused' ? 'На паузе' : 'Активная'}</strong></div>
                                <div className="go-stat-row"><span>Начата</span><strong>{new Date(goal.createdAt || Date.now()).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}</strong></div>
                                <div className="go-stat-row"><span>Дедлайн</span><strong>{deadlineText(goal)}</strong></div>
                                <div className="go-stat-row"><span>Осталось</span><strong>{daysLeft(goal)}</strong></div>
                            </div>
                        </section>
                    </div>
                );
            };

            return (
                <div className="go-page animate-fadeIn">
                    {allGoals.length === 0 ? (
                        <div className="go-empty go-panel">
                            <div className="nt-empty-icon"><Icons.Target className="w-7 h-7" /></div>
                            <h3 className="go-heading mt-4">Пока нет целей</h3>
                            <p className="go-muted mt-2 max-w-xs">Создайте первую цель, чтобы начать отслеживать прогресс.</p>
                            <button onClick={openCreate} className="go-primary mt-5"><Icons.Plus className="w-4 h-4" />Создать цель</button>
                        </div>
                    ) : (
                        <>
                            <div className="go-overview-row">
                                <section className="go-panel">
                                    <div className="go-panel-head"><div><p className="go-kicker">Обзор целей</p><h2 className="go-heading">Ваш общий прогресс</h2></div><button className="go-secondary go-overview-link px-3" onClick={() => setStatusFilter('all')}>Все цели →</button></div>
                                    <div className="go-circle-wrap">
                                        <GoalCircle value={overallProgress} />
                                        <div className="go-legend">
                                            <div className="go-legend-item"><span className="go-dot" />{activeCount} активных целей</div>
                                            <div className="go-legend-item"><span className="go-dot done" />{completedCount} завершено</div>
                                            <div className="go-legend-item"><span className="go-dot paused" />{pausedCount} на паузе</div>
                                            <div className="go-legend-item"><span className="go-dot neutral" />{allGoals.length} всего</div>
                                        </div>
                                    </div>
                                </section>
                                {categoryProgress.length > 0 && (
                                    <section className="go-panel">
                                        <div className="go-panel-head"><div><p className="go-kicker">Прогресс по категориям</p><h2 className="go-heading">Где уже есть движение</h2></div></div>
                                        <div className="go-cat-list">
                                            {categoryProgress.map(item => {
                                                const meta = categoryMeta(item.name);
                                                const MetaIcon = meta.icon;
                                                return <div key={item.name} className="go-cat-row" style={{ '--go-color': meta.color, '--go-soft': meta.soft, '--go-progress': `${clampPercent(item.progress)}%` }}><div className="go-icon"><MetaIcon className="w-4 h-4" /></div><div><div className="flex justify-between gap-3 mb-2"><p className="font-extrabold text-slate-800">{item.name}</p><span className="go-muted">{item.count}</span></div><div className="go-bar"><span /></div></div><strong className="text-sm font-black text-slate-800">{item.progress}%</strong></div>;
                                            })}
                                        </div>
                                    </section>
                                )}
                            </div>

                            <div className="go-filter-line">
                                <div><p className="go-kicker">Мои цели</p><h2 className="go-heading">{statusFilter === 'all' ? 'Все цели' : statusFilters.find(item => item.id === statusFilter)?.label}</h2></div>
                                <div className="go-filter-wrap">
                                    <button onClick={() => setFilterOpen(prev => !prev)} className="go-filter-btn"><Icons.Filter className="w-4 h-4" />Фильтр: <strong>{statusFilters.find(item => item.id === statusFilter)?.label || 'Все'}</strong><Icons.ChevronRight className={`w-4 h-4 transition-transform ${filterOpen ? 'rotate-90' : ''}`} /></button>
                                    {filterOpen && <div className="go-filter-menu">{statusFilters.map(item => <button key={item.id} onClick={() => { setStatusFilter(item.id); setFilterOpen(false); }} className={`go-filter-option ${statusFilter === item.id ? 'is-active' : ''}`}><span>{item.label}</span>{statusFilter === item.id && <Icons.Check className="w-4 h-4" />}</button>)}</div>}
                                </div>
                            </div>

                            {filteredGoals.length ? (
                                <div className="go-cards-grid">{filteredGoals.slice(0, 8).map(goal => <GoalCard key={`${goal.source}-${goal.id}`} goal={goal} />)}</div>
                            ) : (
                                <div className="go-empty go-panel">
                                    <div className="nt-empty-icon"><Icons.Target className="w-7 h-7" /></div>
                                    <h3 className="go-heading mt-4">{(filterEmptyCopy[statusFilter] || filterEmptyCopy.all)[0]}</h3>
                                    <p className="go-muted mt-2 max-w-xs">{(filterEmptyCopy[statusFilter] || filterEmptyCopy.all)[1]}</p>
                                    {statusFilter !== 'completed' && <button onClick={openCreate} className="go-primary mt-5"><Icons.Plus className="w-4 h-4" />Новая цель</button>}
                                </div>
                            )}

                            <div className="go-detail">
                                <GoalDetail goal={selectedGoal} />
                            </div>
                        </>
                    )}

                    {selectedGoal && mobileDetailOpen && (
                        <div className="go-mobile-detail"><div className="go-mobile-card"><GoalDetail goal={selectedGoal} mobile /></div></div>
                    )}

                    {editorOpen && (
                        <div className="go-overlay">
                            <div className="absolute inset-0" onClick={() => setEditorOpen(false)} />
                            <div className="go-sheet relative animate-slideUp">
                                <div className="flex items-center justify-between gap-3 mb-4">
                                    <h2 className="go-heading">{goalForm.id ? 'Редактировать цель' : 'Новая цель'}</h2>
                                    <button onClick={() => setEditorOpen(false)} className="nt-icon-btn"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="go-field mb-3"><label>Название цели</label><input value={goalForm.title} onChange={e => setGoalForm({ ...goalForm, title: e.target.value })} placeholder="Например: читать 20 минут в день" autoFocus /></div>
                                <div className="go-field mb-3"><label>Тип</label><div className="go-type-row">{[['money','₽ Деньги'],['number','123 Количество'],['percent','% Процент']].map(([id,label]) => <button key={id} onClick={() => setGoalForm({ ...goalForm, type: id, targetAmount: id === 'percent' ? '100' : goalForm.targetAmount })} className={`go-type-btn ${goalForm.type === id ? 'is-active' : ''}`} type="button">{label}</button>)}</div></div>
                                <div className="go-form-grid">
                                    <div className="go-field"><label>{goalForm.type === 'percent' ? 'Текущий прогресс' : 'Целевое значение'}</label><input type="number" value={goalForm.type === 'percent' ? goalForm.currentAmount : goalForm.targetAmount} onChange={e => goalForm.type === 'percent' ? setGoalForm({ ...goalForm, currentAmount: e.target.value, targetAmount: '100' }) : setGoalForm({ ...goalForm, targetAmount: e.target.value })} placeholder={goalForm.type === 'money' ? '120000' : '12'} /></div>
                                    {goalForm.type !== 'percent' && <div className="go-field"><label>Уже есть</label><input type="number" value={goalForm.currentAmount} onChange={e => setGoalForm({ ...goalForm, currentAmount: e.target.value })} placeholder="0" /></div>}
                                    <div className="go-field"><label>Дедлайн</label><input type="date" value={goalForm.deadline} onChange={e => setGoalForm({ ...goalForm, deadline: e.target.value })} /></div>
                                    <div className="go-field"><label>Категория</label><select value={goalForm.category} onChange={e => setGoalForm({ ...goalForm, category: e.target.value })}>{categories.map(cat => <option key={cat.id} value={cat.id}>{cat.label}</option>)}</select></div>
                                </div>
                                <button onClick={() => setShowDetails(prev => !prev)} className="go-secondary mt-3" type="button"><Icons.Plus className="w-4 h-4" />Добавить детали</button>
                                {showDetails && <div className="go-form-grid mt-3"><div className="go-field"><label>Единица</label><input value={goalForm.unit} onChange={e => setGoalForm({ ...goalForm, unit: e.target.value })} placeholder="книг, тренировок..." /></div><div className="go-field"><label>Иконка</label><input value={goalForm.icon} onChange={e => setGoalForm({ ...goalForm, icon: e.target.value })} placeholder="🎯" /></div><div className="go-field md:col-span-2"><label>Описание</label><textarea value={goalForm.description} onChange={e => setGoalForm({ ...goalForm, description: e.target.value })} rows={3} placeholder="Зачем эта цель важна?" /></div></div>}
                                <div className="flex justify-end gap-2 mt-5"><button onClick={() => setEditorOpen(false)} className="go-secondary">Отмена</button><button onClick={saveGoal} className="go-primary">{goalForm.id ? 'Сохранить' : 'Создать цель'}</button></div>
                            </div>
                        </div>
                    )}

                    {progressOpen && selectedGoal && (
                        <div className="go-overlay">
                            <div className="absolute inset-0" onClick={() => setProgressOpen(false)} />
                            <div className="go-confirm relative animate-slideUp">
                                <h3 className="go-heading">Добавить прогресс</h3>
                                <p className="go-muted mt-2">{selectedGoal.title}</p>
                                <div className="go-type-row mt-4"><button onClick={() => setProgressMode('add')} className={`go-type-btn ${progressMode === 'add' ? 'is-active' : ''}`}>Добавить к текущему</button><button onClick={() => setProgressMode('set')} className={`go-type-btn ${progressMode === 'set' ? 'is-active' : ''}`}>Установить значение</button></div>
                                <div className="go-field mt-4"><label>{typeOf(selectedGoal) === 'money' ? 'Сумма' : 'Значение'}</label><input type="number" value={progressDraft} onChange={e => setProgressDraft(e.target.value)} placeholder={typeOf(selectedGoal) === 'money' ? '5000' : '1'} autoFocus /></div>
                                {typeOf(selectedGoal) === 'percent' && <p className="go-muted mt-3">Текущий прогресс: {calculateGoalProgress(selectedGoal).display}%</p>}
                                <p className="go-muted mt-3">Новое значение: {typeOf(selectedGoal) === 'money' ? currency(progressMode === 'add' ? Number(selectedGoal.currentAmount || 0) + Number(progressDraft || 0) : Number(progressDraft || 0)) : (progressMode === 'add' ? Number(selectedGoal.currentAmount || 0) + Number(progressDraft || 0) : Number(progressDraft || 0)).toLocaleString('ru-RU')}</p>
                                <div className="flex justify-end gap-2 mt-5"><button onClick={() => setProgressOpen(false)} className="go-secondary">Отмена</button><button onClick={saveProgress} className="go-primary">Сохранить</button></div>
                            </div>
                        </div>
                    )}

                    {menuGoal && (
                        <div className="go-overlay">
                            <div className="absolute inset-0" onClick={() => setMenuGoal(null)} />
                            <div className="go-confirm relative animate-slideUp">
                                <div className="flex items-start justify-between gap-3"><div><h3 className="go-heading">{menuGoal.title}</h3><p className="go-muted mt-1">{menuGoal.category}</p></div><button onClick={() => setMenuGoal(null)} className="nt-icon-btn"><Icons.X className="w-4 h-4" /></button></div>
                                <div className="grid gap-2 mt-4">
                                    <button onClick={() => { openEdit(menuGoal); setMenuGoal(null); }} className="go-secondary justify-start"><Icons.Pencil className="w-4 h-4" />Редактировать</button>
                                    <button onClick={() => { updateGoal(menuGoal, { status: statusOf(menuGoal) === 'paused' ? 'active' : 'paused' }, statusOf(menuGoal) === 'paused' ? 'Цель возобновлена' : 'Цель на паузе'); setMenuGoal(null); }} className="go-secondary justify-start">{statusOf(menuGoal) === 'paused' ? 'Возобновить' : 'Поставить на паузу'}</button>
                                    {calculateGoalProgress(menuGoal).raw >= 100 && <button onClick={() => { updateGoal(menuGoal, { status: 'completed', done: true }, 'Цель завершена'); setMenuGoal(null); }} className="go-secondary justify-start"><Icons.CheckCircle className="w-4 h-4" />Завершить</button>}
                                    <button onClick={() => { setDeleteGoalCandidate(menuGoal); setMenuGoal(null); }} className="go-danger-subtle"><Icons.Trash className="w-4 h-4" />Удалить цель</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteGoalCandidate && (
                        <div className="go-overlay">
                            <div className="absolute inset-0" onClick={() => setDeleteGoalCandidate(null)} />
                            <div className="go-confirm relative animate-slideUp">
                                <h3 className="go-heading">Удалить цель?</h3>
                                <p className="go-muted mt-2">Прогресс и данные этой цели будут удалены.</p>
                                <div className="flex justify-end gap-2 mt-5"><button onClick={() => setDeleteGoalCandidate(null)} className="go-secondary">Отмена</button><button onClick={removeGoal} className="go-danger-subtle">Удалить</button></div>
                            </div>
                        </div>
                    )}

                    {toast && <div className="go-toast">{toast}</div>}
                </div>
            );
        };

        const SyncIndicator = () => {
            const { syncStatus, lastSyncTime } = useData();
            
            if (syncStatus === 'idle' && !lastSyncTime) return null;
            
            const statusConfig = {
                idle: { icon: null, text: '', bg: '' },
                saving: { icon: Icons.Loader, text: 'Сохранение...', bg: 'bg-amber-50 text-amber-700 border-amber-100' },
                saved: { icon: Icons.CheckCircle, text: 'Сохранено', bg: 'bg-emerald-50 text-emerald-700 border-emerald-100' },
                error: { icon: Icons.AlertTriangle, text: 'Ошибка синхронизации', bg: 'bg-rose-50 text-rose-700 border-rose-100' }
            };
            
            const config = statusConfig[syncStatus];
            if (!config || syncStatus === 'idle') return null;
            
            const IconComponent = config.icon;
            
            return (
                <div className={`fixed top-2 left-1/2 -translate-x-1/2 z-[100] px-4 py-2 rounded-full border shadow-lg flex items-center gap-2 text-xs font-bold ${config.bg} animate-fadeIn`}>
                    {IconComponent && <IconComponent className="w-4 h-4" />}
                    <span>{config.text}</span>
                </div>
            );
        };
        
        // --- Debug Panel (можно скрыть в продакшене) ---
        const DebugPanel = () => {
            const [isOpen, setIsOpen] = useState(false);
            const { lastSyncTime } = useData();

            // Показываем Debug только:
            // если явно включено через параметр ?debug=1
            const allowDebug = (() => {
                try {
                    const qs = new URLSearchParams(window.location.search);
                    if (qs.get('debug') === '1') return true;
                    const hash = String(window.location.hash || '').replace(/^#/, '');
                    const hs = new URLSearchParams(hash);
                    if (hs.get('debug') === '1') return true;
                } catch (e) {}
                return false;
            })();

            if (!allowDebug) return null;
            
            return (
                <div className="fixed top-14 right-2 z-[100]">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-lg shadow-lg"
                    >
                        {isOpen ? '✕' : 'Debug'}
                    </button>
                    
                    {isOpen && (
                        <div className="mt-2 bg-white border border-slate-200 rounded-xl p-3 shadow-xl text-xs w-64 max-h-80 overflow-auto">
                            <div className="font-bold text-slate-800 mb-2">Debug Info</div>
                            <div className="space-y-1 text-slate-600">
                                <div><span className="font-bold">User ID:</span> {USER_ID}</div>
                                <div><span className="font-bold">Telegram:</span> {window.Telegram?.WebApp ? 'Да' : 'Нет'}</div>
                                <div><span className="font-bold">initDataUnsafe.user.id:</span> {window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 'null'}</div>
                                <div><span className="font-bold">Последняя синхронизация:</span> {lastSyncTime ? lastSyncTime.toLocaleTimeString('ru-RU') : 'нет'}</div>
                            </div>
                            <div className="mt-3 pt-2 border-t border-slate-100">
                                <div className="font-bold text-slate-800 mb-1">initDataUnsafe:</div>
                                <pre className="text-[9px] bg-slate-50 p-2 rounded overflow-auto max-h-32">
                                    {JSON.stringify(window.Telegram?.WebApp?.initDataUnsafe, null, 2) || 'null'}
                                </pre>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const { loading, error, data, reload, updateKey } = useData();
            const [activeTab, setActiveTab] = useState('home');
            const [quickMenuOpen, setQuickMenuOpen] = useState(false);
            const [moreMenuOpen, setMoreMenuOpen] = useState(false);
            const [searchOpen, setSearchOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            const closeActionOverlays = useCallback(() => {
                setQuickMenuOpen(false);
                setMoreMenuOpen(false);
                setSearchOpen(false);
            }, []);

            const closeActionOverlaysAndScroll = useCallback((event) => {
                const deltaY = event?.deltaY || 0;
                closeActionOverlays();
                window.requestAnimationFrame(() => {
                    const appShell = document.querySelector('.app-container.lh-app-shell');
                    const appContent = document.querySelector('.app-content');
                    const shellCanScroll = appShell && appShell.scrollHeight > appShell.clientHeight;
                    const appCanScroll = appContent
                        && getComputedStyle(appContent).overflowY !== 'visible'
                        && appContent.scrollHeight > appContent.clientHeight;
                    const scrollTarget = shellCanScroll ? appShell : (appCanScroll ? appContent : (document.scrollingElement || document.documentElement));
                    if (scrollTarget && typeof scrollTarget.scrollBy === 'function') {
                        scrollTarget.scrollBy({ top: deltaY, behavior: 'auto' });
                    } else {
                        window.scrollBy(0, deltaY);
                    }
                });
            }, [closeActionOverlays]);
