                    description: event.description || event.note || '',
                    location: event.location || '',
                    onlineUrl: event.onlineUrl || '',
                    participants: Array.isArray(event.participants) ? event.participants.join(', ') : (event.participants || ''),
                    agenda: Array.isArray(event.agenda) ? event.agenda.map(item => typeof item === 'string' ? item : item.text).join('\n') : (event.agenda || ''),
                    reminder: event.reminder || 'none',
                    recurrence: event.recurrence || 'none'
                });
                setModalOpen(true);
            };

            const validateForm = () => {
                const errors = {};
                if (!form.title.trim()) errors.title = 'Введите название события';
                if (!form.date) errors.date = 'Выберите дату';
                if (!form.allDay && form.time && form.endTime && form.endTime < form.time) errors.endTime = 'Окончание не может быть раньше начала';
                setValidation(errors);
                return Object.keys(errors).length === 0;
            };

            const handleSave = () => {
                if (!validateForm()) return;
                const date = parseDateKey(form.date);
                const payload = {
                    title: form.title.trim(),
                    name: form.title.trim(),
                    dateKey: form.date,
                    day: date.getDate(),
                    month: date.getMonth() + 1,
                    year: date.getFullYear(),
                    time: form.allDay ? '' : form.time,
                    endTime: form.allDay ? '' : form.endTime,
                    allDay: Boolean(form.allDay),
                    category: form.category,
                    description: form.description.trim(),
                    note: form.description.trim(),
                    location: form.location.trim(),
                    onlineUrl: form.onlineUrl.trim(),
                    participants: form.participants.split(',').map(x => x.trim()).filter(Boolean),
                    agenda: form.agenda.split('\n').map(text => text.trim()).filter(Boolean).map(text => ({ text, done: false })),
                    reminder: form.reminder,
                    recurrence: form.recurrence,
                };
                if (editingEvent) {
                    setEvents((events || []).map(event => event.id === editingEvent.id ? { ...event, ...payload, updatedAt: Date.now() } : event));
                    setSelectedEventId(editingEvent.id);
                } else {
                    const newEvent = { id: String(Date.now()), ...payload, createdAt: Date.now() };
                    setEvents([newEvent, ...(events || [])]);
                    setSelectedEventId(newEvent.id);
                }
                setSelectedDate(date);
                setViewMonth(new Date(date.getFullYear(), date.getMonth(), 1));
                setModalOpen(false);
            };

            const handleDelete = (eventToDelete = editingEvent || selectedEvent) => {
                if (!eventToDelete) return;
                if (!window.confirm('Удалить событие?')) return;
                setEvents((events || []).filter(event => event.id !== eventToDelete.id));
                setSelectedEventId(null);
                setModalOpen(false);
            };

            const EventRow = ({ event, compact = false }) => {
                const cat = getCategory(event);
                return (
                    <button onClick={() => setSelectedEventId(event.id)} onDoubleClick={() => openEdit(event)} className="ev-event-row">
                        <span className="ev-marker" style={{ background: cat.color }} />
                        <span className="min-w-0 flex-1">
                            <span className="block font-semibold text-slate-900 truncate">{event._title}</span>
                            <span className="ev-muted block truncate">{formatEventTime(event)}{compact ? ` · ${formatShortDate(event._date)}` : event.location ? ` · ${event.location}` : ''}</span>
                        </span>
                        <span className="ev-badge" style={{ background: cat.soft, color: cat.color }}>{cat.label}</span>
                    </button>
                );
            };

            const DetailPanel = ({ mobile = false }) => {
                if (!selectedEvent) {
                    return (
                        <div className="ev-empty h-full">
                            <div>
                                <div className="ev-empty-icon"><Icons.Calendar className="w-5 h-5" /></div>
                                <p className="font-semibold text-slate-900">Выберите событие</p>
                                <p className="ev-muted mt-1">Детали, участники и повестка появятся здесь.</p>
                            </div>
                        </div>
                    );
                }
                const cat = getCategory(selectedEvent);
                return (
                    <div className={mobile ? 'ev-mobile-detail' : ''}>
                        {mobile && (
                            <div className="flex items-center justify-between mb-5">
                                <button onClick={() => setSelectedEventId(null)} className="ev-icon-btn"><Icons.ChevronLeft className="w-5 h-5" /></button>
                                <p className="font-bold text-slate-900">Событие</p>
                                <button onClick={() => openEdit(selectedEvent)} className="ev-icon-btn"><Icons.Pencil className="w-5 h-5" /></button>
                            </div>
                        )}
                        <div className={mobile ? 'ev-card' : ''}>
                            <div className="flex items-start justify-between gap-3">
                                <div className="min-w-0">
                                    <span className="ev-badge mb-3" style={{ background: cat.soft, color: cat.color }}>{cat.label}</span>
                                    <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight leading-tight">{selectedEvent._title}</h2>
                                </div>
                                {!mobile && <button onClick={() => setSelectedEventId(null)} className="ev-icon-btn"><Icons.X className="w-5 h-5" /></button>}
                            </div>
                            <div className="ev-detail-section grid gap-3">
                                <div className="flex gap-3"><Icons.Clock className="w-5 h-5 text-slate-400 shrink-0" /><div><p className="font-semibold text-slate-900">{formatEventTime(selectedEvent)}</p><p className="ev-muted">{formatFullDate(selectedEvent._date)}</p></div></div>
                                {selectedEvent.location && <div className="flex gap-3"><Icons.Calendar className="w-5 h-5 text-slate-400 shrink-0" /><p className="font-semibold text-slate-800">{selectedEvent.location}</p></div>}
                                {selectedEvent.onlineUrl && <div className="flex gap-3"><Icons.Repeat className="w-5 h-5 text-slate-400 shrink-0" /><p className="font-semibold text-slate-800 truncate">{selectedEvent.onlineUrl}</p></div>}
                            </div>
                            {participants.length > 0 && <div className="ev-detail-section"><p className="ev-card-title mb-3">Участники ({participants.length})</p><div className="flex -space-x-2">{participants.slice(0,4).map((name, index) => <div key={`${name}-${index}`} className="w-9 h-9 rounded-full bg-emerald-900 text-white border-2 border-white grid place-items-center text-xs font-black">{String(name).slice(0,2).toUpperCase()}</div>)}{participants.length > 4 && <div className="w-9 h-9 rounded-full bg-slate-100 border-2 border-white grid place-items-center text-xs font-black text-slate-500">+{participants.length - 4}</div>}</div></div>}
                            {(selectedEvent.description || selectedEvent.note) && <div className="ev-detail-section"><p className="ev-card-title mb-2">Описание</p><p className="text-sm text-slate-600 leading-relaxed">{selectedEvent.description || selectedEvent.note}</p></div>}
                            <div className="ev-detail-section"><p className="ev-card-title mb-2">Повестка</p>{agendaItems.length ? agendaItems.map((item, index) => <div key={`${item.text}-${index}`} className="ev-check-row"><Icons.Circle className="w-5 h-5 text-slate-300" /><span className="text-sm font-semibold text-slate-700">{item.text}</span></div>) : <p className="ev-muted">Повестка пока не добавлена.</p>}</div>
                            <div className="ev-detail-section flex gap-2">
                                <button onClick={() => openEdit(selectedEvent)} className="flex-1 h-11 rounded-xl bg-emerald-900 text-white font-bold">Редактировать</button>
                                <button onClick={() => handleDelete(selectedEvent)} className="h-11 px-4 rounded-xl bg-rose-50 text-rose-600 font-bold">Событие</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="ev-page animate-fadeIn">
                    <header className="ev-header">
                        <h1 className="ev-title">Событие</h1>
                        <div />
                        <button onClick={() => openAdd(selectedDate)} className="lh-primary-btn"><Icons.Plus className="w-5 h-5" />Добавить</button>
                    </header>

                    <div className="ev-filter-wrap">
                        <button
                            onClick={() => setEventFilterOpen(prev => !prev)}
                            className="ev-filter-button"
                            aria-haspopup="menu"
                            aria-expanded={eventFilterOpen}
                        >
                            <Icons.Filter className="w-4 h-4" />
                            Фильтр: <strong>{categoryById[activeCategory]?.label || 'Все'}</strong>
                            <Icons.ChevronRight className={`w-4 h-4 transition-transform ${eventFilterOpen ? 'rotate-90' : ''}`} />
                        </button>
                        {eventFilterOpen && (
                            <div className="ev-filter-menu" role="menu">
                                {eventCategories.map(cat => {
                                    const CatIcon = cat.icon;
                                    return (
                                        <button
                                            key={cat.id}
                                            onClick={() => {
                                                setActiveCategory(cat.id);
                                                setEventFilterOpen(false);
                                            }}
                                            className={`ev-filter-option ${activeCategory === cat.id ? 'is-active' : ''}`}
                                            role="menuitem"
                                        >
                                            <span className="ev-filter-option-label">
                                                <CatIcon className="w-4 h-4" />
                                                {cat.label}
                                            </span>
                                            {activeCategory === cat.id && <Icons.Check className="w-4 h-4" />}
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div className="ev-grid">
                        <div className="ev-left">
                            <section className="ev-card">
                                <div className="ev-month-head">
                                    <button onClick={goPrevMonth} className="ev-icon-btn" aria-label="Предыдущий месяц"><Icons.ChevronLeft className="w-5 h-5" /></button>
                                    <div className="text-center">
                                        <p className="ev-card-title">{monthNames[viewMonth.getMonth()]} {viewMonth.getFullYear()}</p>
                                        {!isSameDayLocal(selectedDate, today) ? (
                                            <button onClick={goToday} className="ev-muted underline underline-offset-4">Сегодня</button>
                                        ) : (
                                            <p className="ev-muted">Календарь месяца</p>
                                        )}
                                    </div>
                                    <button onClick={goNextMonth} className="ev-icon-btn" aria-label="Следующий месяц"><Icons.ChevronRight className="w-5 h-5" /></button>
                                </div>
                                <div className="ev-calendar-grid">
                                    {weekdayNames.map(day => <div key={day} className="ev-weekday">{day}</div>)}
                                    {calendarCells.map(cell => cell.empty ? <div key={cell.key} /> : (() => {
                                        const isSelected = isSameDayLocal(cell.date, selectedDate);
                                        const isToday = isSameDayLocal(cell.date, today);
                                        const dots = [...new Set(cell.events.map(event => getCategory(event).color))].slice(0, 3);
                                        return (
                                            <button key={cell.key} onClick={() => selectDay(cell.date)} className={`ev-day ${isSelected ? 'is-selected' : ''} ${isToday ? 'is-today' : ''}`} aria-label={`${formatFullDate(cell.date)}, событий: ${cell.events.length}`}>
                                                <span>{cell.day}</span>
                                                <span className="ev-dots">{dots.map(color => <span key={color} className="ev-dot" style={{ background: color }} />)}</span>
                                            </button>
                                        );
                                    })())}
                                </div>
                            </section>

                            <section className="ev-card ev-selected-list">
                                <div className="flex items-center justify-between gap-3 mb-2">
                                    <div><p className="ev-card-title">План на день</p><p className="ev-muted">{formatFullDate(selectedDate)}</p></div>
                                    <button onClick={() => openAdd(selectedDate)} className="ev-chip"><Icons.Plus className="w-4 h-4" />Добавить</button>
                                </div>
                                {selectedHasConflict && <div className="mb-2 rounded-xl bg-amber-50 text-amber-800 px-3 py-2 text-xs font-bold">Есть пересечение по времени</div>}
                                {selectedDayEvents.length ? selectedDayEvents.map(event => <EventRow key={event.id} event={event} />) : (
                                    <div className="ev-empty"><div><div className="ev-empty-icon"><Icons.Calendar className="w-5 h-5" /></div><p className="font-semibold text-slate-900">Сегодня свободно</p><p className="ev-muted mt-1">На этот день ничего не запланировано.</p><button onClick={() => openAdd(selectedDate)} className="fin-footer-link">+ Добавить событие</button></div></div>
                                )}
                            </section>
                        </div>

                        <div className="ev-mid">
                            <section className="ev-card">
                                <div className="flex items-center justify-between mb-2"><p className="ev-card-title">Ближайшие события</p><span className="ev-muted">{upcomingEvents.length}</span></div>
                                {upcomingEvents.length ? upcomingEvents.map(event => <EventRow key={event.id} event={event} compact />) : <div className="ev-empty"><div><div className="ev-empty-icon"><Icons.Calendar className="w-5 h-5" /></div><p className="font-semibold text-slate-900">Календарь пока пуст</p><p className="ev-muted mt-1">Добавьте первое событие, чтобы начать планировать время.</p></div></div>}
                            </section>

                            <section className="ev-card">
                                <p className="ev-card-title mb-3">Таймлайн дня</p>
                                {selectedDayEvents.length ? <div className="ev-timeline">{selectedDayEvents.map(event => <div key={event.id} className="ev-time-row"><span className="ev-muted text-right">{event.allDay ? 'день' : event.time || '—'}</span><span className="ev-time-dot" style={{ background: getCategory(event).color }} /><button onClick={() => setSelectedEventId(event.id)} className="text-left min-w-0"><span className="block font-semibold text-slate-900 truncate">{event._title}</span><span className="ev-muted truncate block">{formatEventTime(event)}</span></button><span className="ev-badge" style={{ background: getCategory(event).soft, color: getCategory(event).color }}>{getCategory(event).label}</span></div>)}</div> : <p className="ev-muted">Свободный день без таймлайна.</p>}
                            </section>

                            <section className="ev-card">
                                <p className="ev-card-title mb-3">Чек-лист события</p>
                                {agendaItems.length ? agendaItems.slice(0, 5).map((item, index) => <div key={`${item.text}-${index}`} className="ev-check-row"><Icons.Circle className="w-5 h-5 text-slate-300" /><span className="text-sm font-semibold text-slate-700">{item.text}</span></div>) : <p className="ev-muted">Выберите событие с повесткой или добавьте пункты при редактировании.</p>}
                            </section>
                        </div>

                        <aside className="ev-card ev-details">
                            <DetailPanel />
                        </aside>
                    </div>

                    {selectedEventId && window.matchMedia('(max-width: 1023px)').matches && <DetailPanel mobile />}

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[170] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/35 backdrop-blur-sm" onClick={() => setModalOpen(false)} />
                            <div className="ev-sheet bg-white w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden">
                                <div className="px-5 pt-4 pb-3 flex items-center justify-between border-b border-slate-100">
                                    <h2 className="text-xl font-extrabold text-slate-900">{editingEvent ? 'Редактировать событие' : 'Новое событие'}</h2>
                                    <button onClick={() => setModalOpen(false)} className="ev-icon-btn"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="ev-sheet-body">
                                    <div className="ev-field"><label>Название</label><input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="ev-input" placeholder="Например: встреча, тренировка, дедлайн" autoFocus />{validation.title && <p className="ev-error">{validation.title}</p>}</div>
                                    <div className="ev-form-grid">
                                        <div className="ev-field"><label>Дата</label><input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} className="ev-input" />{validation.date && <p className="ev-error">{validation.date}</p>}</div>
                                        <div className="ev-field"><label>Категория</label><select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className="ev-input">{eventCategories.filter(cat => cat.id !== 'all').map(cat => <option key={cat.id} value={cat.id}>{cat.label}</option>)}</select></div>
                                    </div>
                                    <label className="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 font-bold text-slate-700"><input type="checkbox" checked={form.allDay} onChange={e => setForm({ ...form, allDay: e.target.checked })} /> Весь день</label>
                                    {!form.allDay && <div className="ev-form-grid"><div className="ev-field"><label>Начало</label><input type="time" value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} className="ev-input" /></div><div className="ev-field"><label>Окончание</label><input type="time" value={form.endTime} onChange={e => setForm({ ...form, endTime: e.target.value })} className="ev-input" />{validation.endTime && <p className="ev-error">{validation.endTime}</p>}</div></div>}
                                    <button type="button" onClick={() => setShowEventDetailsFields(prev => !prev)} className="ev-details-toggle">
                                        <Icons.Plus className={`w-4 h-4 transition-transform ${showEventDetailsFields ? 'rotate-45' : ''}`} />
                                        {showEventDetailsFields ? 'Скрыть детали' : '+ Добавить детали'}
                                    </button>
                                    {showEventDetailsFields && (
                                        <div className="ev-extra-fields">
                                            <div className="ev-field"><label>Описание</label><textarea value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} className="ev-input" placeholder="Коротко о событии" /></div>
                                            <div className="ev-form-grid"><div className="ev-field"><label>Место</label><input value={form.location} onChange={e => setForm({ ...form, location: e.target.value })} className="ev-input" placeholder="Офис, дом, зал" /></div><div className="ev-field"><label>Онлайн-ссылка</label><input value={form.onlineUrl} onChange={e => setForm({ ...form, onlineUrl: e.target.value })} className="ev-input" placeholder="https://..." /></div></div>
                                            <div className="ev-field"><label>Участники</label><input value={form.participants} onChange={e => setForm({ ...form, participants: e.target.value })} className="ev-input" placeholder="Имена через запятую" /></div>
                                            <div className="ev-field"><label>Повестка / чек-лист</label><textarea value={form.agenda} onChange={e => setForm({ ...form, agenda: e.target.value })} className="ev-input" placeholder="Каждый пункт с новой строки" /></div>
                                            <div className="ev-form-grid">
                                                <div className="ev-field"><label>Напоминание</label><select value={form.reminder} onChange={e => setForm({ ...form, reminder: e.target.value })} className="ev-input"><option value="none">Без напоминания</option><option value="15m">За 15 минут</option><option value="1h">За час</option><option value="1d">За день</option></select></div>
                                                <div className="ev-field"><label>Повтор</label><select value={form.recurrence} onChange={e => setForm({ ...form, recurrence: e.target.value })} className="ev-input"><option value="none">Не повторять</option><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option><option value="yearly">Каждый год</option></select></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="ev-sheet-footer">
                                    {editingEvent && <button onClick={() => handleDelete(editingEvent)} className="h-12 px-4 rounded-2xl bg-rose-50 text-rose-600 font-bold"><Icons.Trash className="w-5 h-5" /></button>}
                                    <button onClick={handleSave} className="flex-1 h-12 rounded-2xl bg-emerald-900 text-white font-extrabold">{editingEvent ? 'Сохранить' : 'Создать событие'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Supplies Tab (Дом / Запасы) ---
        const LegacySuppliesTab = () => {
            const [supplies, setSupplies] = useLocalStorage('lifehub_supplies', []);
            const [isAddOpen, setAddOpen] = useState(false);
            const [showShoppingList, setShowShoppingList] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [newItem, setNewItem] = useState({ name: '', category: 'Еда', price: '' });

            // Редактирование наименования
            const [isEditOpen, setEditOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [editNameDraft, setEditNameDraft] = useState('');

            // AI recipes module removed from Дом (disabled by request).

            // миграция старых записей, где price отсутствовал
            useEffect(() => {
                if (!supplies || supplies.length === 0) return;
                const needs = supplies.some(s => typeof s.price === 'undefined');
                if (!needs) return;
                setSupplies(supplies.map(s => (typeof s.price === 'undefined' ? { ...s, price: null } : s)));
            }, []);

            useEffect(() => {
                const onQuickSupply = () => setAddOpen(true);
                window.addEventListener('lifehub:add-supply', onQuickSupply);
                return () => window.removeEventListener('lifehub:add-supply', onQuickSupply);
            }, []);

            const categories = ['Еда', 'Уборка', 'Гигиена', 'Другое'];

            const categoryIcons = {
                'Еда': Icons.Apple,
                'Уборка': Icons.Sparkle,
                'Гигиена': Icons.Droplet,
                'Другое': Icons.Package
            };

            const categoryColors = {
                'Еда': { bg: 'bg-emerald-50', icon: 'bg-emerald-100', text: 'text-emerald-500' },
                'Уборка': { bg: 'bg-sky-50', icon: 'bg-sky-100', text: 'text-sky-500' },
                'Гигиена': { bg: 'bg-violet-50', icon: 'bg-violet-100', text: 'text-violet-500' },
                'Другое': { bg: 'bg-slate-50', icon: 'bg-slate-100', text: 'text-slate-500' }
            };

            const outOfStockCount = supplies.filter(s => !s.inStock).length;
            const outOfStockTotal = useMemo(() => {
                return (supplies || [])
                    .filter(s => !s.inStock)
                    .reduce((acc, s) => acc + (typeof s.price === 'number' && Number.isFinite(s.price) ? s.price : 0), 0);
            }, [supplies]);

            const displayedSupplies = useMemo(() => {
                const base = showShoppingList
                    ? (supplies || []).filter(s => !s.inStock)
                    : (supplies || []);

                const q = String(searchQuery || '').trim().toLowerCase();
                if (!q) return base;

                return base.filter(s => String(s.name || '').toLowerCase().includes(q));
            }, [supplies, showShoppingList, searchQuery]);

            const toggleStock = (id) => {
                setSupplies(supplies.map(s => s.id === id ? { ...s, inStock: !s.inStock } : s));
            };

            const deleteItem = (id) => {
                setSupplies(supplies.filter(s => s.id !== id));
            };

            const openEditItemName = (item) => {
                setEditingItem(item);
                setEditNameDraft(String(item?.name || ''));
                setEditOpen(true);
            };

            const saveEditedItemName = () => {
                if (!editingItem) return;
                const nextName = String(editNameDraft || '').trim();
                if (!nextName) return;
                setSupplies((supplies || []).map(s => s.id === editingItem.id ? { ...s, name: nextName } : s));
                setEditOpen(false);
                setEditingItem(null);
                setEditNameDraft('');
            };

            const handleAdd = () => {
                if (!newItem.name.trim()) return;
                const priceNum = newItem.price === '' || newItem.price === null || typeof newItem.price === 'undefined'
                    ? null
                    : Number(newItem.price);

                const item = {
                    id: Date.now().toString(),
                    name: newItem.name.trim(),
                    category: newItem.category,
                    inStock: true,
                    price: Number.isFinite(priceNum) ? priceNum : null,
                    createdAt: Date.now()
                };
                setSupplies([item, ...supplies]);
                setNewItem({ name: '', category: 'Еда', price: '' });
                setAddOpen(false);
            };

            // Group by category
            const groupedSupplies = displayedSupplies.reduce((acc, item) => {
                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4">
                        <p className={THEME.label}>Запасы</p>
                        <h1 className="text-3xl font-extrabold text-slate-800 mt-1">Дом</h1>
                    </header>

                    {/* Search */}
                    <div className="bg-white border border-slate-100 rounded-3xl p-4 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="p-2 rounded-2xl bg-slate-50 text-slate-400">
                                <Icons.Search className="w-5 h-5" />
                            </div>
                            <input
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Поиск товара..."
                                className="flex-1 bg-transparent outline-none font-bold text-slate-800 placeholder:text-slate-300"
                            />
                            {String(searchQuery || '').trim() !== '' && (
                                <button
                                    onClick={() => setSearchQuery('')}
                                    className="p-2 rounded-2xl bg-slate-50 text-slate-400 hover:text-slate-700"
                                    title="Очистить"
                                >
                                    <Icons.X className="w-4 h-4" />
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Control Panel */}
                    <div className="flex gap-3">
                        <PressableScale 
                            onClick={() => setShowShoppingList(!showShoppingList)}
                            className={`flex-1 py-3 px-4 rounded-2xl flex items-center justify-center gap-2 transition-all
                                ${showShoppingList ? 'bg-rose-500 text-white shadow-lg' : 'bg-white text-slate-700 border border-slate-100 shadow-sm'}
                            `}
                        >
                            <Icons.ShoppingCart className="w-5 h-5" />
                            <span className="font-bold">Список покупок</span>
                            {outOfStockCount > 0 && (
                                <span className={`ml-1 px-2 py-0.5 rounded-full text-xs font-bold
                                    ${showShoppingList ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-600'}
                                `}>
                                    {outOfStockCount}
                                </span>
                            )}
                        </PressableScale>

                        <PressableScale 
                            onClick={() => setAddOpen(true)}
                            className="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center text-white lh-glow-secondary"
                        >
                            <Icons.Plus className="w-6 h-6" />
                        </PressableScale>
                    </div>

                    {/* AI recipes removed */}

                    {/* Supplies List */}
                    <div className="space-y-3">
                        {showShoppingList && outOfStockCount > 0 && (
                            <BentoCard className="bg-gradient-to-br from-rose-50 to-rose-100/50 !p-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <div className="text-xs font-black uppercase tracking-widest text-rose-600">Итого на покупки</div>
                                        <div className="text-2xl font-extrabold text-rose-700 mt-1">{outOfStockTotal.toLocaleString('ru-RU')} ₽</div>
                                    </div>
                                    <div className="w-10 h-10 rounded-2xl bg-white/60 flex items-center justify-center text-rose-600">
                                        <Icons.ShoppingCart className="w-5 h-5" />
                                    </div>
                                </div>
                                <p className="text-sm text-rose-700/80 mt-2">Сумма считается по ценам товаров со статусом «Купить».</p>
                            </BentoCard>
                        )}
                    </div>

                    <div className="space-y-6">
                        {Object.entries(groupedSupplies).map(([category, items]) => {
                            const IconComponent = categoryIcons[category] || Icons.Package;
                            const colors = categoryColors[category] || categoryColors['Другое'];
                            
                            return (
                                <section key={category}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <div className={`p-1.5 rounded-lg ${colors.icon}`}>
                                            <IconComponent className={`w-4 h-4 ${colors.text}`} />
                                        </div>
                                        <h3 className="font-bold text-slate-700">{category}</h3>
                                        <span className="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{items.length}</span>
                                    </div>
                                    <div className="space-y-2">
                                        {items.map(item => {
                                            const ItemIcon = categoryIcons[item.category] || Icons.Package;
                                            const itemColors = categoryColors[item.category] || categoryColors['Другое'];
                                            
                                            return (
                                                <div 
                                                    key={item.id}
                                                    className={`p-4 rounded-2xl border flex items-center justify-between transition-all
                                                        ${item.inStock 
                                                            ? 'bg-white border-slate-100 shadow-sm' 
                                                            : 'bg-slate-50/50 border-slate-100'
                                                        }
                                                    `}
                                                    style={{ opacity: item.inStock ? 1 : 0.7 }}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <PressableScale 
                                                            onClick={() => toggleStock(item.id)}
                                                            className={`p-2.5 rounded-xl transition-all ${item.inStock ? itemColors.icon : 'bg-slate-100'}`}
                                                        >
                                                            <ItemIcon className={`w-5 h-5 ${item.inStock ? itemColors.text : 'text-slate-400'}`} />
                                                        </PressableScale>
                                                        <div>
                                                            <p className={`font-bold ${item.inStock ? 'text-slate-800' : 'text-slate-500'}`}>
                                                                {item.name}
                                                            </p>

                                                            <div className="flex items-center gap-2 mt-1">
                                                                {!item.inStock && (
                                                                    <span className="text-xs font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">
                                                                        Купить
                                                                    </span>
                                                                )}
                                                                {typeof item.price === 'number' && Number.isFinite(item.price) && (
                                                                    <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">
                                                                        {item.price.toLocaleString('ru-RU')} ₽
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        {item.inStock && (
                                                            <span className="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded-lg">
                                                                Есть
                                                            </span>
                                                        )}
                                                        <PressableScale 
                                                            onClick={() => openEditItemName(item)}
                                                            className="p-2 rounded-lg text-slate-300 hover:text-slate-700 hover:bg-slate-100 transition-colors"
                                                            title="Переименовать"
                                                        >
                                                            <Icons.Pencil className="w-4 h-4" />
                                                        </PressableScale>
                                                        <PressableScale 
                                                            onClick={() => deleteItem(item.id)}
                                                            className="p-2 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-colors"
                                                            title="Удалить"
                                                        >
                                                            <Icons.Trash className="w-4 h-4" />
                                                        </PressableScale>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            );
                        })}
                    </div>

                    {displayedSupplies.length === 0 && (
                        <div className="flex flex-col items-center justify-center h-60 text-slate-300">
                            {String(searchQuery || '').trim() !== '' ? (
                                <>
                                    <Icons.Search className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Ничего не найдено</p>
                                    <p className="text-sm">Попробуйте изменить запрос</p>
                                </>
                            ) : showShoppingList ? (
                                <>
                                    <Icons.CheckCircle className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Всё куплено!</p>
                                    <p className="text-sm">Список покупок пуст</p>
                                </>
                            ) : (
                                <>
                                    <Icons.Package className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Нет товаров</p>
                                    <p className="text-sm">Добавьте первый товар</p>
                                </>
                            )}
                        </div>
                    )}

                    {/* AI favorites removed */}

                    {/* Edit Name Modal */}
                    {isEditOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => { setEditOpen(false); setEditingItem(null); setEditNameDraft(''); }} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900">Переименовать</h2>
                                        <p className="text-sm text-slate-500">Измените название товара.</p>
                                    </div>
                                    <button onClick={() => { setEditOpen(false); setEditingItem(null); setEditNameDraft(''); }} className="bg-slate-50 p-2 rounded-full text-slate-400">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    <label className={THEME.label}>Название</label>
                                    <input
                                        value={editNameDraft}
                                        onChange={(e) => setEditNameDraft(e.target.value)}
                                        placeholder="Название товара"
                                        className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        autoFocus
                                    />
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => { setEditOpen(false); setEditingItem(null); setEditNameDraft(''); }}
                                        className="flex-1 h-12 bg-slate-50 rounded-2xl font-bold text-slate-400 hover:text-slate-600"
                                    >
                                        Отмена
                                    </button>
                                    <button
                                        onClick={saveEditedItemName}
                                        className="flex-1 h-12 bg-slate-900 rounded-2xl font-bold text-white"
                                    >
                                        Сохранить
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add Item Modal */}
                    {isAddOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setAddOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900">Новый товар</h2>
                                        <p className="text-sm text-slate-500">Можно указать цену — она попадёт в итог «Список покупок».</p>
                                    </div>
                                    <button onClick={() => setAddOpen(false)} className="bg-slate-50 p-2 rounded-full text-slate-400">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={newItem.name}
                                            onChange={e => setNewItem({ ...newItem, name: e.target.value })}
                                            placeholder="Название товара"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Цена (₽)</label>
                                        <input
                                            type="number"
                                            value={newItem.price}
                                            onChange={e => setNewItem({ ...newItem, price: e.target.value })}
                                            placeholder="Напр: 1000"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-mono text-xl font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Категория</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {categories.map(cat => {
                                                const CatIcon = categoryIcons[cat];
                                                const colors = categoryColors[cat];
                                                const isSelected = newItem.category === cat;
                                                
                                                return (
                                                    <button
                                                        key={cat}
                                                        onClick={() => setNewItem({ ...newItem, category: cat })}
                                                        className={`p-4 rounded-2xl flex items-center gap-3 transition-all border-2
                                                            ${isSelected 
                                                                ? `${colors.bg} border-current ${colors.text}` 
                                                                : 'bg-slate-50 border-transparent text-slate-600'
                                                            }
                                                        `}
                                                    >
                                                        <div className={`p-2 rounded-xl ${isSelected ? colors.icon : 'bg-slate-100'}`}>
                                                            <CatIcon className={`w-5 h-5 ${isSelected ? colors.text : 'text-slate-400'}`} />
                                                        </div>
                                                        <span className="font-bold">{cat}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={handleAdd} className="w-full pt-2">
                                    <div className="bg-sky-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Добавить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SuppliesTab = () => {
            const [supplies, setSupplies] = useLocalStorage('lifehub_supplies', []);
            const [searchQuery, setSearchQuery] = useState('');
            const [mobileSearchOpen, setMobileSearchOpen] = useState(false);
            const [selectedCategory, setSelectedCategory] = useState('Все');
            const [showShoppingList, setShowShoppingList] = useState(false);
            const [editorOpen, setEditorOpen] = useState(false);
            const [detailItemId, setDetailItemId] = useState(null);
            const [toast, setToast] = useState('');
            const [itemForm, setItemForm] = useState({ name: '', category: 'Продукты', quantity: '1', unit: 'шт.', minimumQuantity: '', location: '', expiryDate: '', purchaseDate: '', price: '', notes: '', barcode: '' });

            const baseCategories = [
                { id: 'Продукты', aliases: ['Еда'], color: '#047857', soft: '#eef8f2', icon: Icons.Apple },
                { id: 'Напитки', aliases: [], color: '#2563eb', soft: '#eef5ff', icon: Icons.Droplet },
                { id: 'Бытовая химия', aliases: ['Уборка'], color: '#7c3aed', soft: '#f4efff', icon: Icons.Sparkle },
                { id: 'Гигиена', aliases: [], color: '#0891b2', soft: '#ecfeff', icon: Icons.Droplet },
                { id: 'Лекарства', aliases: [], color: '#ef7462', soft: '#fff1ee', icon: Icons.CheckCircle },
                { id: 'Для животных', aliases: [], color: '#b45309', soft: '#fff7ed', icon: Icons.Package },
                { id: 'Другое', aliases: [], color: '#64748b', soft: '#f1f5f9', icon: Icons.Package }
            ];
            const units = ['шт.', 'кг', 'г', 'л', 'мл', 'уп.', 'бут.', 'рул.', 'таб.'];
            const locations = ['Холодильник', 'Морозилка', 'Кухня', 'Кладовая', 'Ванная', 'Аптечка', 'Гараж', 'Дача', 'Другое'];
            const expiryWarningDays = 7;

            const showSupplyToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(''), 1800);
            };
            const normalizeNumber = (value, fallback = 0) => {
                const number = Number(value);
                return Number.isFinite(number) ? number : fallback;
            };
            const prettyNumber = (value) => Number(normalizeNumber(value, 0).toFixed(2)).toLocaleString('ru-RU');
            const normalizeCategory = (category) => {
                const raw = String(category || '').trim();
                const found = baseCategories.find(item => item.id === raw || item.aliases.includes(raw));
                return found?.id || raw || 'Другое';
            };
            const getQuantity = (item) => {
                if (typeof item.quantity !== 'undefined') return Math.max(0, normalizeNumber(item.quantity, 0));
                return item.inStock === false ? 0 : 1;
            };
            const normalizeSupply = (item) => {
                const quantity = getQuantity(item);
                return {
                    ...item,
                    id: String(item.id || Date.now()),
                    name: String(item.name || 'Товар').trim(),
                    category: normalizeCategory(item.category),
                    quantity,
                    unit: item.unit || 'шт.',
                    minimumQuantity: item.minimumQuantity === '' || item.minimumQuantity === null || typeof item.minimumQuantity === 'undefined' ? null : normalizeNumber(item.minimumQuantity, null),
                    location: String(item.location || '').trim(),
                    expiryDate: item.expiryDate || item.expiresAt || '',
                    purchaseDate: item.purchaseDate || '',
                    price: item.price === '' || item.price === null || typeof item.price === 'undefined' ? null : normalizeNumber(item.price, null),
                    notes: item.notes || '',
                    barcode: item.barcode || '',
                    inStock: quantity > 0,
                    createdAt: item.createdAt || Date.now(),
                    updatedAt: item.updatedAt || item.createdAt || Date.now()
                };
            };
            const inventory = useMemo(() => (Array.isArray(supplies) ? supplies : []).map(normalizeSupply), [supplies]);

            useEffect(() => {
                if (!Array.isArray(supplies) || supplies.length === 0) return;
                const needsMigration = supplies.some(item => typeof item.quantity === 'undefined' || normalizeCategory(item.category) !== item.category || typeof item.updatedAt === 'undefined');
                if (needsMigration) setSupplies(supplies.map(normalizeSupply));
            }, []);

            useEffect(() => {
                const onQuickSupply = () => openCreateItem();
                window.addEventListener('lifehub:add-supply', onQuickSupply);
                return () => window.removeEventListener('lifehub:add-supply', onQuickSupply);
            }, []);

            const categoryMeta = (category) => {
                const normalized = normalizeCategory(category);
                return baseCategories.find(item => item.id === normalized) || { id: normalized, color: '#64748b', soft: '#f1f5f9', icon: Icons.Package };
            };
            const expiryInfo = (item) => {
                if (!item.expiryDate) return { state: 'none', label: '—', days: null };
                const date = new Date(`${item.expiryDate}T00:00:00`);
                if (Number.isNaN(date.getTime())) return { state: 'none', label: '—', days: null };
                const diff = Math.ceil((startOfDay(date) - startOfDay(new Date())) / 86400000);
                if (diff < 0) return { state: 'expired', label: 'Просрочено', days: diff };
                if (diff === 0) return { state: 'today', label: 'Истекает сегодня', days: 0 };
                if (diff <= expiryWarningDays) return { state: 'soon', label: `Осталось ${diff} дн.`, days: diff };
                return { state: 'ok', label: 'Нормальный срок', days: diff };
            };
            const statusOf = (item) => {
                const quantity = getQuantity(item);
                const min = item.minimumQuantity === null || typeof item.minimumQuantity === 'undefined' || item.minimumQuantity === '' ? null : normalizeNumber(item.minimumQuantity, null);
                const expiry = expiryInfo(item);
                if (quantity <= 0) return { key: 'out', label: 'Нет в наличии', icon: Icons.ShoppingCart };
                if (expiry.state === 'expired') return { key: 'expired', label: 'Просрочено', icon: Icons.AlertTriangle };
                if (expiry.state === 'today' || expiry.state === 'soon') return { key: 'expiring', label: 'Скоро истекает', icon: Icons.Clock };
                if (min !== null && Number.isFinite(min) && quantity <= min) return { key: 'low', label: 'Заканчивается', icon: Icons.AlertTriangle };
                return { key: 'ok', label: 'В наличии', icon: Icons.CheckCircle };
            };
            const isPurchaseCandidate = (item) => ['out', 'low'].includes(statusOf(item).key) || item.shopping === true;
            const itemText = (item) => [item.name, item.category, item.location, item.notes, item.barcode].join(' ').toLowerCase();

            const categories = useMemo(() => {
                const counts = new Map();
                inventory.forEach(item => counts.set(item.category, (counts.get(item.category) || 0) + 1));
                const custom = Array.from(counts.keys()).filter(category => !baseCategories.some(item => item.id === category));
                return [
                    { id: 'Все', label: 'Все', count: inventory.length, color: '#047857', soft: '#eef8f2', icon: Icons.Package },
                    ...baseCategories.map(item => ({ ...item, label: item.id, count: counts.get(item.id) || 0 })),
                    ...custom.map(category => ({ id: category, label: category, count: counts.get(category) || 0, color: '#64748b', soft: '#f1f5f9', icon: Icons.Package }))
                ];
            }, [inventory]);

            const filteredInventory = useMemo(() => {
                const query = searchQuery.trim().toLowerCase();
                return inventory
                    .filter(item => selectedCategory === 'Все' || item.category === selectedCategory)
                    .filter(item => !showShoppingList || isPurchaseCandidate(item))
                    .filter(item => !query || itemText(item).includes(query))
                    .sort((a, b) => {
                        const order = { expired: 0, out: 1, low: 2, expiring: 3, ok: 4 };
                        return (order[statusOf(a).key] ?? 5) - (order[statusOf(b).key] ?? 5) || Number(b.updatedAt || 0) - Number(a.updatedAt || 0);
                    });
            }, [inventory, selectedCategory, showShoppingList, searchQuery]);

            const attentionItems = useMemo(() => inventory.filter(item => statusOf(item).key !== 'ok').slice(0, 5), [inventory]);
            const shoppingItems = useMemo(() => inventory.filter(isPurchaseCandidate).slice(0, 5), [inventory]);
            const selectedItem = inventory.find(item => item.id === detailItemId) || null;
            const summary = useMemo(() => ({
                total: inventory.length,
                low: inventory.filter(item => statusOf(item).key === 'low').length,
                expiring: inventory.filter(item => ['expired', 'expiring'].includes(statusOf(item).key)).length,
                buy: inventory.filter(isPurchaseCandidate).length,
                totalCost: inventory.reduce((sum, item) => sum + (Number.isFinite(item.price) ? item.price * getQuantity(item) : 0), 0)
            }), [inventory]);
            const weeklyTip = summary.buy > 0
                ? `${summary.buy} ${summary.buy === 1 ? 'товар стоит' : 'товаров стоит'} добавить в покупки заранее.`
                : attentionItems.length > 0
                    ? 'Проверьте товары с ближайшими сроками, чтобы ничего не пропало.'
                    : '';

            const openCreateItem = () => {
                setItemForm({ name: '', category: 'Продукты', quantity: '1', unit: 'шт.', minimumQuantity: '', location: '', expiryDate: '', purchaseDate: '', price: '', notes: '', barcode: '' });
                setEditorOpen(true);
            };
            const openEditItem = (item) => {
                setItemForm({
                    id: item.id,
                    name: item.name || '',
                    category: item.category || 'Продукты',
                    quantity: String(getQuantity(item)),
                    unit: item.unit || 'шт.',
                    minimumQuantity: item.minimumQuantity === null || typeof item.minimumQuantity === 'undefined' ? '' : String(item.minimumQuantity),
                    location: item.location || '',
                    expiryDate: item.expiryDate || '',
                    purchaseDate: item.purchaseDate || '',
                    price: item.price === null || typeof item.price === 'undefined' ? '' : String(item.price),
                    notes: item.notes || '',
                    barcode: item.barcode || ''
                });
                setEditorOpen(true);
            };
            const saveItem = () => {
                const name = String(itemForm.name || '').trim();
                if (!name) return;
                const quantity = Math.max(0, normalizeNumber(itemForm.quantity, 0));
                const payload = normalizeSupply({
                    ...itemForm,
                    id: itemForm.id || Date.now().toString(),
                    name,
                    category: normalizeCategory(itemForm.category),
                    quantity,
                    minimumQuantity: itemForm.minimumQuantity === '' ? null : normalizeNumber(itemForm.minimumQuantity, null),
                    price: itemForm.price === '' ? null : normalizeNumber(itemForm.price, null),
                    inStock: quantity > 0,
                    createdAt: itemForm.id ? inventory.find(item => item.id === itemForm.id)?.createdAt : Date.now(),
                    updatedAt: Date.now()
                });
                if (itemForm.id) {
                    setSupplies(inventory.map(item => item.id === itemForm.id ? payload : item));
                    setDetailItemId(payload.id);
                    showSupplyToast('Товар обновлён');
                } else {
                    setSupplies([payload, ...inventory]);
                    setDetailItemId(payload.id);
                    showSupplyToast('Товар добавлен');
                }
                setEditorOpen(false);
            };
            const updateItem = (item, patch, message = 'Товар обновлён') => {
                const next = normalizeSupply({ ...item, ...patch, updatedAt: Date.now() });
                setSupplies(inventory.map(row => row.id === item.id ? next : row));
                setDetailItemId(next.id);
                showSupplyToast(message);
            };
            const changeQuantity = (item, delta) => {
                const unit = String(item.unit || '').toLowerCase();
                const step = ['кг', 'л'].includes(unit) ? 0.5 : ['г', 'мл'].includes(unit) ? 100 : 1;
                const next = Math.max(0, normalizeNumber((getQuantity(item) + delta * step).toFixed(2), 0));
                updateItem(item, { quantity: next, inStock: next > 0 }, 'Количество обновлено');
            };
            const deleteItem = (item) => {
                setSupplies(inventory.filter(row => row.id !== item.id));
                setDetailItemId(null);
                showSupplyToast('Товар удалён');
            };

            const SummaryCard = ({ icon: IconComponent, label, value, tone = '#047857', soft = '#eef8f2' }) => (
                <div className="inv-card" style={{ '--inv-color': tone, '--inv-soft': soft }}>
                    <div className="inv-card-top"><div className="inv-icon"><IconComponent className="w-5 h-5" /></div></div>
                    <div><p className="inv-muted">{label}</p><strong className="inv-metric">{value}</strong></div>
                </div>
            );
            const StatusBadge = ({ item }) => {
                const status = statusOf(item);
                const StatusIcon = status.icon;
                return <span className={`inv-status ${status.key}`}><StatusIcon className="w-3.5 h-3.5" />{status.label}</span>;
            };
            const QuantityControl = ({ item }) => (
                <div className="inv-qty" onClick={e => e.stopPropagation()}>
                    <button onClick={() => changeQuantity(item, -1)} aria-label="Уменьшить количество"><Icons.Minus className="w-4 h-4" /></button>
                    <strong>{prettyNumber(getQuantity(item))} {item.unit}</strong>
                    <button onClick={() => changeQuantity(item, 1)} aria-label="Увеличить количество"><Icons.Plus className="w-4 h-4" /></button>
                </div>
            );
            const InventoryRow = ({ item }) => {
                const meta = categoryMeta(item.category);
                const ItemIcon = meta.icon;
                const expiry = expiryInfo(item);
                return (
                    <div className="inv-row" role="button" tabIndex={0} onClick={() => setDetailItemId(item.id)} onKeyDown={e => e.key === 'Enter' && setDetailItemId(item.id)} style={{ '--inv-color': meta.color, '--inv-soft': meta.soft }}>
                        <div className="inv-item-main">
                            <div className="inv-icon"><ItemIcon className="w-5 h-5" /></div>
                            <div className="min-w-0">
                                <p className="inv-item-title">{item.name}</p>
                                <p className="inv-item-sub">{item.category}{item.location ? ` · ${item.location}` : ''}</p>
                            </div>
                        </div>
                        <div className="inv-col-category"><span className="inv-badge">{item.category}</span></div>
                        <div><QuantityControl item={item} /></div>
                        <div className="inv-col-location inv-muted">{item.location || '—'}</div>
                        <div className="inv-col-expiry inv-muted">{expiry.label}</div>
                        <div className="inv-col-status"><StatusBadge item={item} /></div>
                        <div className="inv-col-actions">
                            <button onClick={(e) => { e.stopPropagation(); setDetailItemId(item.id); }} className="inv-icon-btn" aria-label="Открыть товар"><Icons.Ellipsis className="w-4 h-4" /></button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="inv-page animate-fadeIn">
                    <header className="inv-header">
                        <div>
                            <p className="inv-kicker">Дом</p>
                            <h1 className="inv-title">Запасы</h1>
                            <p className="inv-subtitle">Покупки, сроки и всё необходимое для дома.</p>
                        </div>
                        <div className="inv-actions">
                            <div className="inv-search">
                                <Icons.Search className="w-5 h-5" />
                                <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Поиск в запасах..." />
                                {searchQuery && <button onClick={() => setSearchQuery('')} aria-label="Очистить поиск"><Icons.X className="w-4 h-4" /></button>}
                            </div>
                            <button onClick={openCreateItem} className="inv-primary"><Icons.Plus className="w-4 h-4" />Добавить товар</button>
                        </div>
                    </header>

                    <header className="inv-mobile-head">
                        <h1 className="inv-title">Дом</h1>
                        <div className="inv-actions">
                            <button onClick={() => setMobileSearchOpen(prev => !prev)} className="inv-icon-btn" aria-label="Поиск"><Icons.Search className="w-5 h-5" /></button>
                            <button onClick={openCreateItem} className="inv-icon-btn !bg-emerald-600 !text-white" aria-label="Добавить товар"><Icons.Plus className="w-5 h-5" /></button>
                        </div>
                    </header>

                    {mobileSearchOpen && (
                        <div className="inv-search inv-mobile-search">
                            <Icons.Search className="w-5 h-5" />
                            <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Поиск в запасах..." autoFocus />
                            {searchQuery && <button onClick={() => setSearchQuery('')} aria-label="Очистить поиск"><Icons.X className="w-4 h-4" /></button>}
                        </div>
                    )}

                    <section className="inv-overview">
                        <SummaryCard icon={Icons.Package} label="Всего позиций" value={summary.total} />
                        <SummaryCard icon={Icons.AlertTriangle} label="Заканчивается" value={summary.low} tone="#ea580c" soft="#fff7ed" />
                        <SummaryCard icon={Icons.Clock} label="Сроки" value={summary.expiring} tone="#b45309" soft="#fef3c7" />
                        <SummaryCard icon={Icons.ShoppingCart} label="Нужно купить" value={summary.buy} tone="#dc2626" soft="#fff1f2" />
                    </section>

                    <div className="inv-layout">
                        <main className="inv-main">
                            <section className="inv-panel">
                                <div className="inv-panel-head">
                                    <div><p className="inv-kicker">Категории</p><h2 className="inv-heading">Что есть дома</h2></div>
                                    {summary.total > 0 && <button onClick={() => { setSelectedCategory('Все'); setShowShoppingList(false); }} className="inv-secondary">Все</button>}
                                </div>
                                <div className="inv-category-strip">
                                    {categories.map(category => {
                                        const CategoryIcon = category.icon;
                                        return (
                                            <button key={category.id} onClick={() => setSelectedCategory(category.id)} className={`inv-chip ${selectedCategory === category.id ? 'is-active' : ''}`} style={{ '--inv-color': category.color, '--inv-soft': category.soft }}>
                                                <CategoryIcon className="w-4 h-4" />{category.label}<span>{category.count}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>

                            {attentionItems.length > 0 ? (
                                <section className="inv-panel">
                                    <div className="inv-panel-head"><div><p className="inv-kicker">Требует внимания</p><h2 className="inv-heading">Проверьте это</h2></div></div>
                                    <div className="inv-attention-list">
                                        {attentionItems.slice(0, 3).map(item => <div key={item.id} className="inv-mini-row"><div><p className="inv-mini-title">{item.name}</p><p className="inv-muted">{expiryInfo(item).label} · {prettyNumber(getQuantity(item))} {item.unit}</p></div><StatusBadge item={item} /></div>)}
                                    </div>
                                </section>
                            ) : (
                                <section className="inv-panel">
                                    <div className="inv-mini-row"><div><p className="inv-mini-title">Всё в порядке ✓</p><p className="inv-muted">Запасов достаточно, сроки годности в норме.</p></div></div>
                                </section>
                            )}

                            <section className="inv-panel">
                                <div className="inv-panel-head">
                                    <div><p className="inv-kicker">Запасы</p><h2 className="inv-heading">{showShoppingList ? 'Список покупок' : 'Все запасы'}</h2></div>
                                    <button onClick={() => setShowShoppingList(prev => !prev)} className={showShoppingList ? 'inv-primary' : 'inv-secondary'}><Icons.ShoppingCart className="w-4 h-4" />{showShoppingList ? 'Все запасы' : 'Покупки'}</button>
                                </div>

                                {filteredInventory.length > 0 ? (
                                    <div className="inv-table">
                                        <div className="inv-table-head">
                                            <span>Товар</span><span>Категория</span><span>Количество</span><span>Место</span><span className="inv-col-expiry">Срок</span><span>Статус</span><span></span>
                                        </div>
                                        {filteredInventory.map(item => <InventoryRow key={item.id} item={item} />)}
                                    </div>
                                ) : (
                                    <div className="inv-empty">
                                        <div className="nt-empty-icon"><Icons.Package className="w-7 h-7" /></div>
                                        <h3 className="inv-heading mt-4">{searchQuery ? 'Ничего не найдено' : selectedCategory !== 'Все' ? 'В этой категории пока ничего нет' : showShoppingList ? 'Список покупок пуст' : 'Дом пока пуст'}</h3>
                                        <p className="inv-muted mt-2 max-w-xs">{searchQuery ? 'Попробуйте изменить запрос или фильтр.' : 'Добавьте первые продукты или бытовые товары.'}</p>
                                        {!searchQuery && <button onClick={openCreateItem} className="inv-primary mt-5"><Icons.Plus className="w-4 h-4" />Добавить товар</button>}
                                    </div>
                                )}
                            </section>
                        </main>

                        <aside className="inv-side">
                            <section className="inv-side-card inv-desktop-only">
                                <div className="inv-panel-head"><div><p className="inv-kicker">Быстрые действия</p><h2 className="inv-heading">Управление</h2></div></div>
                                <div className="inv-action-list">
                                    <button onClick={openCreateItem} className="inv-mini-row"><div><p className="inv-mini-title">Добавить вручную</p><p className="inv-muted">Новый товар или запас</p></div><Icons.Plus className="w-4 h-4" /></button>
                                    <button onClick={() => { setShowShoppingList(true); setSelectedCategory('Все'); }} className="inv-mini-row"><div><p className="inv-mini-title">Список покупок</p><p className="inv-muted">{summary.buy} позиций</p></div><Icons.ShoppingCart className="w-4 h-4" /></button>
                                    <button onClick={() => setMobileSearchOpen(true)} className="inv-mini-row"><div><p className="inv-mini-title">Найти товар</p><p className="inv-muted">По имени, месту или коду</p></div><Icons.Search className="w-4 h-4" /></button>
                                </div>
                            </section>

                            <section className="inv-side-card">
                                <div className="inv-panel-head"><div><p className="inv-kicker">Покупки</p><h2 className="inv-heading">Нужно пополнить</h2></div></div>
                                {shoppingItems.length > 0 ? (
                                    <div className="inv-shopping-list">
                                        {shoppingItems.map(item => <div key={item.id} className="inv-mini-row"><div><p className="inv-mini-title">{item.name}</p><p className="inv-muted">{item.category} · {prettyNumber(getQuantity(item))} {item.unit}</p></div><StatusBadge item={item} /></div>)}
                                    </div>
                                ) : (
                                    <p className="inv-muted">Список покупок пуст.</p>
                                )}
                            </section>

                            {weeklyTip && (
                                <section className="inv-side-card inv-desktop-only">
                                    <div className="inv-tip"><Icons.Sparkles className="w-5 h-5 text-emerald-600 flex-none" /><span>{weeklyTip}</span></div>
                                </section>
                            )}
                        </aside>
                    </div>

                    {selectedItem && (
                        <div className="inv-overlay">
                            <div className="absolute inset-0" onClick={() => setDetailItemId(null)} />
                            <div className="inv-sheet relative animate-slideUp">
                                <div className="flex items-start justify-between gap-3">
                                    <div className="min-w-0">
                                        <p className="inv-kicker">Товар</p>
                                        <h2 className="inv-heading">{selectedItem.name}</h2>
                                        <p className="inv-muted mt-1">{selectedItem.category}{selectedItem.location ? ` · ${selectedItem.location}` : ''}</p>
                                    </div>
                                    <button onClick={() => setDetailItemId(null)} className="inv-icon-btn"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="inv-detail-card mt-5">
                                    <div className="inv-mini-row"><div><p className="inv-mini-title">Количество</p><p className="inv-muted">Минимум: {selectedItem.minimumQuantity ?? 'не задан'}</p></div><QuantityControl item={selectedItem} /></div>
                                    <div className="inv-mini-row"><div><p className="inv-mini-title">Срок годности</p><p className="inv-muted">{expiryInfo(selectedItem).label}</p></div><StatusBadge item={selectedItem} /></div>
