                draggingRef.current = false;
                setTranslateY(h);
                setBackdropOpacity(0);
                // даём время анимации
                window.setTimeout(() => {
                    onClose?.();
                    // на всякий случай
                    setTranslateY(0);
                    setBackdropOpacity(initialBackdrop);
                }, 220);
            }, [onClose, initialBackdrop]);

            const onTouchStart = (e) => {
                if (!open) return;
                const t = e.touches?.[0];
                if (!t) return;
                startYRef.current = t.clientY;
                lastYRef.current = t.clientY;
                startTRef.current = performance.now();
                lastTRef.current = startTRef.current;
                draggingRef.current = false;
                setIsDragging(false);
            };

            const onTouchMove = (e) => {
                if (!open) return;
                const t = e.touches?.[0];
                if (!t) return;

                const now = performance.now();
                const y = t.clientY;
                const dy = y - startYRef.current;

                const sc = scrollRef.current;
                const scrollTop = sc ? sc.scrollTop : 0;

                // ВАЖНО: стартуем жест закрытия только если скролл вверху и пользователь тянет вниз
                if (!draggingRef.current) {
                    if (dy > 0 && scrollTop <= 0) {
                        draggingRef.current = true;
                        setIsDragging(true);
                    } else {
                        return; // пусть работает обычный скролл
                    }
                }

                // если тянем вверх — даём сопротивление
                const elasticDy = dy < 0 ? dy / 4 : dy;
                setTranslateY(elasticDy);

                const h = getSheetHeightPx();
                const threshold = Math.max(100, h * 0.2);
                const progress = Math.max(0, Math.min(1, dy / (threshold * 1.1)));
                setBackdropOpacity(initialBackdrop * (1 - progress));

                lastYRef.current = y;
                lastTRef.current = now;

                // когда тянем — предотвращаем прокрутку body
                try { e.preventDefault(); } catch (err) {}
            };

            const onTouchEnd = () => {
                if (!open) return;
                if (!draggingRef.current) return;

                const endY = lastYRef.current;
                const endT = lastTRef.current;
                const dy = endY - startYRef.current;
                const dt = Math.max(1, endT - startTRef.current);
                const velocity = dy / dt; // px/ms

                const h = getSheetHeightPx();
                const threshold = Math.max(100, h * 0.2);

                const shouldClose = dy > threshold || (velocity > 1.0 && dy > 30);

                if (shouldClose) {
                    requestCloseAnimated();
                } else {
                    // bounce back
                    setIsDragging(false);
                    draggingRef.current = false;
                    setTranslateY(0);
                    setBackdropOpacity(initialBackdrop);
                }
            };

            if (!open) return null;

            return (
                <div className="modal-overlay flex items-end overflow-hidden" style={{ zIndex }}>
                    <div
                        className="absolute inset-0 bg-slate-900/40 backdrop-blur-md"
                        style={{ opacity: backdropOpacity }}
                        onClick={requestCloseAnimated}
                    />

                                                        <div
                        ref={sheetRef}
                        className={`bg-white/85 dark:bg-white/10 backdrop-blur-xl w-full ${maxWidth} mx-auto rounded-t-3xl relative flex flex-col overflow-hidden lh-glow-modal border border-white/10`}
                        style={{
                            height,
                            transform: `translate3d(0, ${translateY}px, 0)`,
                            transition: isDragging ? 'none' : 'transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1)',
                            touchAction: 'pan-y'
                        }}
                        onTouchStart={onTouchStart}
                        onTouchMove={onTouchMove}
                        onTouchEnd={onTouchEnd}
                    >
                        {/* Handle bar */}
                        <div className="pt-3 pb-2 shrink-0">
                            <div className="mx-auto w-10 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700" />
                        </div>

                        {header ? (
                            <div className="shrink-0 px-5 pb-2">
                                {header}
                            </div>
                        ) : null}

                        <div ref={scrollRef} className="flex-1 overflow-y-auto px-5 pb-6 pt-2 scrollbar-hide">
                            {children}
                        </div>

                        {footer ? (
                            <div className="shrink-0 px-5 pb-5 pt-2 border-t border-slate-100 dark:border-slate-700">
                                {footer}
                            </div>
                        ) : null}
                    </div>
                </div>
            );
        };

        // --- Helpers ---
        const pad2 = (n) => String(n).padStart(2, '0');
        const formatDateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const parseDateKey = (key) => {
            if (!key) return null;
            const [y, m, d] = String(key).split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d);
        };
        const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

        // --- Month Calendar (полноценный) ---
        const MonthCalendar = ({
            viewMonth,
            selectedDate,
            onSelectDate,
            onPrevMonth,
            onNextMonth,
            renderMarkers,
            selectedClassName = 'bg-slate-900 text-white shadow-lg',
            todayClassName = 'bg-slate-100 text-slate-800'
        }) => {
            const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
            const firstWeekdayMondayBased = (new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1).getDay() + 6) % 7;
            const monthTitle = viewMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
            const today = startOfDay(new Date());

            return (
                <div className="bg-slate-50 rounded-3xl p-4">
                    <div className="flex items-center justify-between mb-3">
                        <PressableScale onClick={onPrevMonth} className="p-2 rounded-xl bg-white text-slate-500 border border-slate-100 shadow-sm hover:bg-slate-50">
                            <Icons.ChevronLeft className="w-5 h-5" />
                        </PressableScale>
                        <div className="text-center">
                            <div className="text-sm font-extrabold text-slate-900 capitalize">{monthTitle}</div>
                            <div className="text-[11px] font-bold uppercase tracking-widest text-slate-400">выберите дату</div>
                        </div>
                        <PressableScale onClick={onNextMonth} className="p-2 rounded-xl bg-white text-slate-500 border border-slate-100 shadow-sm hover:bg-slate-50">
                            <Icons.ChevronRight className="w-5 h-5" />
                        </PressableScale>
                    </div>

                    <div className="grid grid-cols-7 gap-1">
                        {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => (
                            <div key={d} className="h-8 flex items-center justify-center text-[10px] font-black text-slate-300 uppercase">{d}</div>
                        ))}

                        {Array.from({ length: firstWeekdayMondayBased }, (_, i) => (
                            <div key={`empty-${i}`} className="aspect-square" />
                        ))}

                        {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
                            const cellDate = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
                            const selected = isSameDay(cellDate, selectedDate);
                            const isToday = isSameDay(cellDate, today);

                            return (
                                <button
                                    key={day}
                                    onClick={() => onSelectDate(cellDate)}
                                    className={`aspect-square rounded-2xl flex flex-col items-center justify-center relative transition-all
                                        ${selected ? selectedClassName : isToday ? todayClassName : 'hover:bg-white text-slate-700'}
                                    `}
                                >
                                    <span className="text-sm font-bold">{day}</span>
                                    {renderMarkers ? renderMarkers(day, selected) : null}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- Budget Tab ---
        const BudgetTab = () => {
            const [advice, setAdvice] = useState(null);
            const [loadingAI, setLoadingAI] = useState(false);
            const [isDailyOpen, setDailyOpen] = useState(false);
            const [isBillsOpen, setBillsOpen] = useState(false);
            const [isEditBalanceOpen, setEditBalanceOpen] = useState(false);
            const [isEditLimitOpen, setEditLimitOpen] = useState(false);
            const [isAddTransOpen, setAddTransOpen] = useState(false);
            const [isAddBillOpen, setAddBillOpen] = useState(false);
            const [isStatsOpen, setStatsOpen] = useState(false);
            const [isGoalModalOpen, setGoalModalOpen] = useState(false);
            const [editingGoalId, setEditingGoalId] = useState(null);
            
            // Редактирование/удаление операций
            const [editingTransactionId, setEditingTransactionId] = useState(null);
            const [financePeriod, setFinancePeriod] = useState('month');
            const [selectedFinanceMonth, setSelectedFinanceMonth] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
            });
            const [transactionFilter, setTransactionFilter] = useState('all');
            const [categoryFilter, setCategoryFilter] = useState('all');

            const [totalBalance, setTotalBalance] = useCloudStorage('balance', 0);
            const [monthLimit, setMonthLimit] = useCloudStorage('limit', 60000);

            // --- Категории и лимиты ---
            const [categoryLimits, setCategoryLimits] = useCloudStorage('category_limits', {});
            const [categoriesList, setCategoriesList] = useCloudStorage('categories', ['Еда', 'Транспорт', 'Дом', 'Развлечения', 'Здоровье', 'Шоппинг', 'Фриланс', 'Разное']);
            const categories = categoriesList || [];

            // Модалка управления категорией (добавить/редактировать/удалить)
            const [isCategoryLimitOpen, setCategoryLimitOpen] = useState(false);
            const [categoryModalMode, setCategoryModalMode] = useState('edit'); // 'add' | 'edit'
            const [editingLimitCategory, setEditingLimitCategory] = useState(null); // исходное имя (для редактирования)
            const [categoryNameDraft, setCategoryNameDraft] = useState('');
            const [categoryLimitDraft, setCategoryLimitDraft] = useState('');
            const [categoryModalError, setCategoryModalError] = useState('');

            // Быстрое добавление категории из модалки операции
            const [isAddingCategory, setIsAddingCategory] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState('');

            // Операции: полноценный календарь (месяц/год)
            const [selectedDateObj, setSelectedDateObj] = useState(() => startOfDay(new Date()));
            const [opsViewMonth, setOpsViewMonth] = useState(() => new Date(selectedDateObj.getFullYear(), selectedDateObj.getMonth(), 1));

            // Платежи: календарь с навигацией по месяцам (для выбора дня)
            const [selectedBillDateObj, setSelectedBillDateObj] = useState(() => startOfDay(new Date()));
            const [billsViewMonth, setBillsViewMonth] = useState(() => new Date(selectedBillDateObj.getFullYear(), selectedBillDateObj.getMonth(), 1));

            const [transactions, setTransactions] = useCloudStorage('transactions', []);
            const [bills, setBills] = useCloudStorage('bills', []);
            const [goals, setGoals] = useCloudStorage('goals', []);

            // Миграция старых транзакций (где была только "date" как число)
            useEffect(() => {
                if (!transactions || transactions.length === 0) return;
                const needs = transactions.some(t => !t.dateKey);
                if (!needs) return;
                setTransactions(transactions.map(t => {
                    if (t.dateKey) return t;
                    const base = t.createdAt ? startOfDay(new Date(t.createdAt)) : startOfDay(new Date());
                    return { ...t, dateKey: formatDateKey(base) };
                }));
            }, [transactions]);

            const [newTrans, setNewTrans] = useState({ amount: '', title: '', type: 'expense', category: '' });

            // Если категория в форме невалидна — подхватываем первую из списка
            useEffect(() => {
                if (!Array.isArray(categories) || categories.length === 0) return;
                if (!newTrans.category || !categories.includes(newTrans.category)) {
                    setNewTrans(prev => ({ ...prev, category: categories[0] }));
                }
            }, [categoriesList]);
            const [newBill, setNewBill] = useState({ title: '', amount: '', repeat: 'monthly' });
            const [goalForm, setGoalForm] = useState({ title: '', targetAmount: '', currentAmount: '', date: '' });
            const [manualBalanceInput, setManualBalanceInput] = useState('');
            const [manualLimitInput, setManualLimitInput] = useState('');

            // Получить фактический день платежа с учётом коротких месяцев
            // Например: платёж на 31-е в феврале → 28 (или 29)
            const getAdjustedBillDay = (billDay, year, month) => {
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                return Math.min(Number(billDay) || 1, daysInMonth);
            };

            // Текущий месяц для расчётов лимитов
            const today0 = startOfDay(new Date());
            const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today0);
            const txMonthKey = (t) => {
                if (t.dateKey) return String(t.dateKey).slice(0, 7);
                if (t.createdAt) return monthKey(startOfDay(new Date(t.createdAt)));
                return currentMonthKey;
            };

            const spentThisMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            const progress = useMemo(() => {
                if (Number(monthLimit) === 0) return 0;
                return Math.min((spentThisMonth / Number(monthLimit)) * 100, 100);
            }, [spentThisMonth, monthLimit]);

            const expensesByCategory = useMemo(() => {
                const stats = {};
                (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .forEach(t => {
                        const c = t.category || 'Разное';
                        stats[c] = (stats[c] || 0) + Number(t.amount || 0);
                    });
                return Object.entries(stats)
                    .map(([name, amount]) => ({ name, amount }))
                    .sort((a, b) => b.amount - a.amount);
            }, [transactions, currentMonthKey]);

            const expensesByCategoryMap = useMemo(() => {
                const map = {};
                (expensesByCategory || []).forEach(x => { map[x.name] = x.amount; });
                return map;
            }, [expensesByCategory]);

            const getFinancialAdvice = async () => {
                setLoadingAI(true);
                await new Promise(resolve => setTimeout(resolve, 1500));
                const advices = [
                    `При текущих расходах ${spentThisMonth.toLocaleString()} ₽ вы используете ${Math.round(progress)}% лимита. Попробуйте сократить расходы на развлечения.`,
                    `Ваш баланс ${totalBalance.toLocaleString()} ₽ позволяет откладывать по ${Math.round((totalBalance - spentThisMonth) / 30)} ₽ в день.`,
                    `Совет: ведите учёт мелких расходов — они часто составляют до 30% бюджета!`,
                    `Рекомендую создать "подушку безопасности" в размере 3-х месячных расходов.`
                ];
                setAdvice(advices[Math.floor(Math.random() * advices.length)]);
                setLoadingAI(false);
            };

            const handleManualBalanceUpdate = () => {
                if (manualBalanceInput) {
                    setTotalBalance(Number(manualBalanceInput));
                    setEditBalanceOpen(false);
                }
            };

            const handleManualLimitUpdate = () => {
                if (manualLimitInput) {
                    setMonthLimit(Number(manualLimitInput));
                    setEditLimitOpen(false);
                }
            };

            const openAddTransactionModal = () => {
                setEditingTransactionId(null);
                const fallbackCat = (categories && categories.length > 0) ? categories[0] : '';
                setNewTrans({ amount: '', title: '', type: 'expense', category: fallbackCat });
                setAddTransOpen(true);
            };

            const openEditTransactionModal = (t) => {
                if (!t) return;
                setEditingTransactionId(t.id);
                const fallbackCat = (categories && categories.length > 0) ? categories[0] : '';
                setNewTrans({
                    amount: String(t.amount ?? ''),
                    title: String(t.title ?? ''),
                    type: t.type === 'income' ? 'income' : 'expense',
                    category: t.category || fallbackCat,
                });

                // синхронизируем календарь на дату операции
                try {
                    const d = t.dateKey ? parseDateKey(t.dateKey) : null;
                    if (d) {
                        const sd = startOfDay(d);
                        setSelectedDateObj(sd);
                        setOpsViewMonth(new Date(sd.getFullYear(), sd.getMonth(), 1));
                    }
                } catch (e) {}

                setAddTransOpen(true);
            };

            useEffect(() => {
                const onQuickTransaction = (event) => {
                    openAddTransactionModal();
                    const txType = event?.detail?.type === 'income' ? 'income' : 'expense';
                    setNewTrans(prev => ({ ...prev, type: txType }));
                };
                window.addEventListener('lifehub:add-transaction', onQuickTransaction);
                return () => window.removeEventListener('lifehub:add-transaction', onQuickTransaction);
            }, [categoriesList]);

            const deleteTransaction = (txId) => {
                const existing = (transactions || []).find(x => x.id === txId);
                if (!existing) return;

                const amt = Number(existing.amount || 0);
                const oldDelta = existing.type === 'income' ? amt : -amt;

                setTransactions((prev) => (prev || []).filter(x => x.id !== txId));
                setTotalBalance((b) => Number(b) - oldDelta);
            };

            const handleAddTransaction = () => {
                if (!newTrans.amount || !newTrans.title) return;

                const amount = Number(newTrans.amount);
                if (!Number.isFinite(amount) || amount <= 0) return;

                const newDelta = (newTrans.type === 'income') ? amount : -amount;

                if (editingTransactionId) {
                    const existing = (transactions || []).find(x => x.id === editingTransactionId);
                    if (!existing) {
                        setEditingTransactionId(null);
                        setAddTransOpen(false);
                        return;
                    }

                    const oldAmount = Number(existing.amount || 0);
                    const oldDelta = (existing.type === 'income') ? oldAmount : -oldAmount;

                    const updated = {
                        ...existing,
                        ...newTrans,
                        amount,
                        // по умолчанию сохраняем дату операции (или текущую выбранную дату)
                        dateKey: existing.dateKey || formatDateKey(selectedDateObj),
                        updatedAt: Date.now(),
                    };

                    setTransactions((prev) => (prev || []).map(x => x.id === editingTransactionId ? updated : x));
                    setTotalBalance((b) => Number(b) + (newDelta - oldDelta));
                } else {
                    const newTransaction = {
                        id: Date.now().toString(),
                        ...newTrans,
                        amount,
                        dateKey: formatDateKey(selectedDateObj),
                        createdAt: Date.now(),
                    };

                    setTransactions((prev) => [newTransaction, ...(prev || [])]);
                    setTotalBalance((b) => Number(b) + newDelta);
                }

                setAddTransOpen(false);
                setEditingTransactionId(null);
                const fallbackCat = (categories && categories.length > 0) ? categories[0] : '';
                setNewTrans({ amount: '', title: '', type: 'expense', category: fallbackCat });
            };

            const handleAddBill = () => {
                if (!newBill.amount || !newBill.title) return;
                const newBillItem = {
                    id: Date.now().toString(),
                    title: newBill.title,
                    amount: Number(newBill.amount),
                    date: selectedBillDateObj.getDate(),
                    repeat: newBill.repeat || 'monthly',
                    paid: false,
                    createdAt: Date.now()
                };
                setBills([newBillItem, ...bills]);
                setAddBillOpen(false);
                setNewBill({ title: '', amount: '', repeat: 'monthly' });
            };

            const toggleBillPaid = (billId) => {
                setBills(bills.map(b => b.id === billId ? { ...b, paid: !b.paid } : b));
            };

            const deleteBill = (billId) => {
                setBills(bills.filter(b => b.id !== billId));
            };

            const openAddGoalModal = () => {
                setEditingGoalId(null);
                setGoalForm({ title: '', targetAmount: '', currentAmount: '', date: '' });
                setGoalModalOpen(true);
            };

            const openEditGoalModal = (goal) => {
                setEditingGoalId(goal.id);
                setGoalForm({
                    title: goal.title,
                    targetAmount: String(goal.targetAmount),
                    currentAmount: String(goal.currentAmount),
                    date: goal.date
                });
                setGoalModalOpen(true);
            };

            const handleSaveGoal = () => {
                if (!goalForm.title || !goalForm.targetAmount || !goalForm.date) return;
                const target = Number(goalForm.targetAmount);
                const current = Number(goalForm.currentAmount) || 0;

                const goalData = {
                    title: goalForm.title,
                    targetAmount: target,
                    currentAmount: current,
                    date: goalForm.date,
                    color: 'bg-emerald-500'
                };

                if (editingGoalId) {
                    setGoals(goals.map(g => g.id === editingGoalId ? { ...g, ...goalData } : g));
                } else {
                    const newGoal = {
                        id: Date.now().toString(),
                        ...goalData,
                        createdAt: Date.now()
                    };
                    setGoals([newGoal, ...goals]);
                }
                setGoalModalOpen(false);
            };

            const handleDeleteGoal = () => {
                if (editingGoalId) {
                    setGoals(goals.filter(g => g.id !== editingGoalId));
                    setGoalModalOpen(false);
                }
            };

            useEffect(() => {
                const onQuickGoal = () => openAddGoalModal();
                window.addEventListener('lifehub:add-financial-goal', onQuickGoal);
                return () => window.removeEventListener('lifehub:add-financial-goal', onQuickGoal);
            }, []);

            const calculateDailySavings = (targetAmount, currentAmount, targetDate) => {
                const today = new Date();
                const target = new Date(targetDate);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays <= 0) return 0;
                const remaining = Math.max(0, targetAmount - currentAmount);
                return Math.ceil(remaining / diffDays);
            };

            const filteredTransactions = useMemo(() => {
                const key = formatDateKey(selectedDateObj);
                return (transactions || []).filter(t => t.dateKey === key);
            }, [transactions, selectedDateObj]);

            // Итоги за выбранный день
            const dayExpenseTotal = useMemo(() => {
                return (filteredTransactions || [])
                    .filter(t => t.type === 'expense')
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [filteredTransactions]);

            const dayIncomeTotal = useMemo(() => {
                return (filteredTransactions || [])
                    .filter(t => t.type === 'income')
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [filteredTransactions]);

            const dayNetTotal = useMemo(() => {
                return Number(dayIncomeTotal) - Number(dayExpenseTotal);
            }, [dayIncomeTotal, dayExpenseTotal]);

            // Баланс на конец выбранного дня.
            // Текущий totalBalance — баланс после всех операций.
            // Чтобы получить баланс на конец выбранной даты, вычтем влияние операций ПОСЛЕ этой даты.
            const balanceAtEndOfSelectedDay = useMemo(() => {
                const selectedKey = formatDateKey(selectedDateObj);
                const deltaAfter = (transactions || [])
                    .filter(t => t.dateKey && String(t.dateKey) > selectedKey)
                    .reduce((acc, t) => {
                        const amt = Number(t.amount || 0);
                        return acc + (t.type === 'income' ? amt : -amt);
                    }, 0);
                return Number(totalBalance) - Number(deltaAfter);
            }, [transactions, totalBalance, selectedDateObj]);

            const filteredBills = useMemo(() => {
                const selectedDay = selectedBillDateObj.getDate();
                const year = selectedBillDateObj.getFullYear();
                const month = selectedBillDateObj.getMonth();
                
                return (bills || []).filter(b => {
                    const originalDay = Number(b.date) || 1;
                    // Корректируем день платежа для выбранного месяца
                    const adjustedDay = getAdjustedBillDay(originalDay, year, month);
                    return adjustedDay === selectedDay;
                });
            }, [bills, selectedBillDateObj]);

            const opsMarkersByDay = useMemo(() => {
                const map = {};
                (transactions || []).forEach(t => {
                    if (!t.dateKey) return;
                    const d = parseDateKey(t.dateKey);
                    if (!d) return;
                    if (d.getFullYear() !== opsViewMonth.getFullYear() || d.getMonth() !== opsViewMonth.getMonth()) return;
                    const day = d.getDate();
                    map[day] = map[day] || { income: false, expense: false };
                    if (t.type === 'income') map[day].income = true;
                    if (t.type === 'expense') map[day].expense = true;
                });
                return map;
            }, [transactions, opsViewMonth]);

            const billsMarkersByDay = useMemo(() => {
                const map = {};
                const year = billsViewMonth.getFullYear();
                const month = billsViewMonth.getMonth();
                (bills || []).forEach(b => {
                    const originalDay = Number(b.date);
                    if (!originalDay) return;
                    // Корректируем день для текущего отображаемого месяца
                    const adjustedDay = getAdjustedBillDay(originalDay, year, month);
                    map[adjustedDay] = map[adjustedDay] || { paid: false, unpaid: false };
                    if (b.paid) map[adjustedDay].paid = true;
                    else map[adjustedDay].unpaid = true;
                });
                return map;
            }, [bills, billsViewMonth]);

            const normalizeCategory = (s) => String(s || '').trim().replace(/\s+/g, ' ');
            const isTaken = (name, excludeName = null) => {
                const low = normalizeCategory(name).toLowerCase();
                return (categories || []).some(c => {
                    const cc = normalizeCategory(c).toLowerCase();
                    if (!cc) return false;
                    if (excludeName && normalizeCategory(c) === normalizeCategory(excludeName)) return false;
                    return cc === low;
                });
            };

            // Legacy quick-add from "Новая операция" modal
            const handleAddCustomCategory = () => {
                const name = normalizeCategory(newCategoryName);
                if (!name) return;
                if (isTaken(name)) {
                    setNewTrans({ ...newTrans, category: name });
                    setNewCategoryName('');
                    setIsAddingCategory(false);
                    return;
                }

                const nextList = [...(categories || []), name];
                setCategoriesList(nextList);

                // keep legacy key in sync (not used as source anymore)
                setCustomCategories([...(customCategories || []), name]);

                setNewTrans({ ...newTrans, category: name });
                setNewCategoryName('');
                setIsAddingCategory(false);
            };

            // Legacy: customCategories not used anymore, но нужен для совместимости
            const customCategories = [];
            const setCustomCategories = () => {};

            const removeCustomCategory = (name) => {
                const n = normalizeCategory(name);
                setCategoriesList((categories || []).filter(c => normalizeCategory(c) !== n));

                // remove limit
                const nextLimits = { ...(categoryLimits || {}) };
                if (typeof nextLimits[n] !== 'undefined') delete nextLimits[n];
                setCategoryLimits(nextLimits);

                if (newTrans.category === n) {
                    setNewTrans({ ...newTrans, category: (categories || []).filter(c => normalizeCategory(c) !== n)[0] || '' });
                }
            };

            const openAddCategoryModal = () => {
                setCategoryModalError('');
                setCategoryModalMode('add');
                setEditingLimitCategory(null);
                setCategoryNameDraft('');
                setCategoryLimitDraft('');
                setCategoryLimitOpen(true);
            };

            const openEditCategoryModal = (cat) => {
                const n = normalizeCategory(cat);
                setCategoryModalError('');
                setCategoryModalMode('edit');
                setEditingLimitCategory(n);
                setCategoryNameDraft(n);
                const existing = categoryLimits && typeof categoryLimits[n] !== 'undefined' ? categoryLimits[n] : null;
                setCategoryLimitDraft(existing ? String(existing) : '');
                setCategoryLimitOpen(true);
            };

            const applyCategoryLimitToMap = (map, categoryName, rawLimit) => {
                const raw = String(rawLimit || '').trim();
                const val = raw === '' ? null : Number(raw);
                const next = { ...(map || {}) };
                if (val === null || !Number.isFinite(val) || val <= 0) {
                    delete next[categoryName];
                } else {
                    next[categoryName] = val;
                }
                return next;
            };

            const saveCategoryFromModal = () => {
                const name = normalizeCategory(categoryNameDraft);
                if (!name) {
                    setCategoryModalError('Введите название категории.');
                    return;
                }

                if (categoryModalMode === 'add') {
                    if (isTaken(name)) {
                        setCategoryModalError('Такая категория уже существует.');
                        return;
                    }

                    const nextList = [...(categories || []), name];
                    setCategoriesList(nextList);

                    const nextLimits = applyCategoryLimitToMap(categoryLimits, name, categoryLimitDraft);
                    setCategoryLimits(nextLimits);

                    // удобство: сразу выбрать добавленную категорию
                    setNewTrans(prev => ({ ...prev, category: name }));

                    setCategoryLimitOpen(false);
                    return;
                }

                // edit mode
                const oldName = normalizeCategory(editingLimitCategory);
                if (!oldName) {
                    setCategoryLimitOpen(false);
                    return;
                }

                if (isTaken(name, oldName)) {
                    setCategoryModalError('Категория с таким названием уже есть.');
                    return;
                }

                // rename in categories list
                const nextList = (categories || []).map(c => normalizeCategory(c) === oldName ? name : normalizeCategory(c));
                setCategoriesList(nextList);

                // move limits key if renamed
                let nextLimits = { ...(categoryLimits || {}) };
                if (oldName !== name) {
                    if (typeof nextLimits[oldName] !== 'undefined') {
                        nextLimits[name] = nextLimits[oldName];
                        delete nextLimits[oldName];
                    }
                }
                nextLimits = applyCategoryLimitToMap(nextLimits, name, categoryLimitDraft);
                setCategoryLimits(nextLimits);

                // rename in transactions history (to avoid "призрачных" категорий)
                if (oldName !== name) {
                    setTransactions((transactions || []).map(t => (t.category === oldName ? { ...t, category: name } : t)));
                    if (newTrans.category === oldName) setNewTrans(prev => ({ ...prev, category: name }));
                }

                setCategoryLimitOpen(false);
            };

            const deleteCategoryFromModal = () => {
                const oldName = normalizeCategory(editingLimitCategory);
                if (!oldName) return;

                // remove from categories list
                const nextList = (categories || []).filter(c => normalizeCategory(c) !== oldName);
                setCategoriesList(nextList);

                // remove limit
                const nextLimits = { ...(categoryLimits || {}) };
                if (typeof nextLimits[oldName] !== 'undefined') delete nextLimits[oldName];
                setCategoryLimits(nextLimits);

                // if selected in new transaction form, fallback
                if (newTrans.category === oldName) {
                    setNewTrans(prev => ({ ...prev, category: nextList[0] || '' }));
                }

                setCategoryLimitOpen(false);
            };

            const money = (value) => `${Number(value || 0).toLocaleString('ru-RU')} ₽`;
            const signedMoney = (value) => `${Number(value || 0) >= 0 ? '+' : '−'}${Math.abs(Number(value || 0)).toLocaleString('ru-RU')} ₽`;
            const txDate = (tx) => {
                if (tx.dateKey) return parseDateKey(tx.dateKey) || startOfDay(new Date(tx.createdAt || Date.now()));
                return startOfDay(new Date(tx.createdAt || Date.now()));
            };
            const formatTxDate = (tx) => {
                const d = txDate(tx);
                const now = startOfDay(new Date());
                const diffDays = Math.round((now - startOfDay(d)) / 86400000);
                const time = tx.createdAt ? new Date(tx.createdAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
                if (diffDays === 0) return `Сегодня${time ? `, ${time}` : ''}`;
                if (diffDays === 1) return `Вчера${time ? `, ${time}` : ''}`;
                return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + (time ? `, ${time}` : '');
            };
            const categoryPalette = ['#064c35', '#2f80ed', '#e89f3d', '#7c5cff', '#ee6b5f', '#98a09b'];
            const getCategoryColor = (name) => {
                const index = Math.abs(String(name || 'Разное').split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0)) % categoryPalette.length;
                return categoryPalette[index];
            };
            const periodMeta = useMemo(() => {
                const [yearRaw, monthRaw] = String(selectedFinanceMonth).split('-');
                const year = Number(yearRaw) || new Date().getFullYear();
                const month = (Number(monthRaw) || 1) - 1;
                const end = startOfDay(new Date(year, month + 1, 0));
                const start = financePeriod === 'year'
                    ? startOfDay(new Date(year, 0, 1))
                    : financePeriod === 'quarter'
                        ? startOfDay(new Date(year, Math.max(0, month - 2), 1))
                        : startOfDay(new Date(year, month, 1));
                const prevEnd = startOfDay(new Date(start.getFullYear(), start.getMonth(), 0));
                const monthsBack = financePeriod === 'year' ? 12 : financePeriod === 'quarter' ? 3 : 1;
                const prevStart = startOfDay(new Date(prevEnd.getFullYear(), prevEnd.getMonth() - monthsBack + 1, 1));
                const label = financePeriod === 'month'
                    ? start.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })
                    : financePeriod === 'quarter'
                        ? `${start.toLocaleDateString('ru-RU', { month: 'short' })} — ${end.toLocaleDateString('ru-RU', { month: 'short', year: 'numeric' })}`
                        : String(year);
                return { start, end, prevStart, prevEnd, label };
            }, [financePeriod, selectedFinanceMonth]);
            const isInRange = (date, start, end) => date >= start && date <= end;
            const periodTransactions = useMemo(() => {
                return (transactions || []).filter(tx => isInRange(txDate(tx), periodMeta.start, periodMeta.end));
            }, [transactions, periodMeta]);
            const previousPeriodTransactions = useMemo(() => {
                return (transactions || []).filter(tx => isInRange(txDate(tx), periodMeta.prevStart, periodMeta.prevEnd));
            }, [transactions, periodMeta]);
            const periodIncome = useMemo(() => periodTransactions.filter(tx => tx.type === 'income').reduce((sum, tx) => sum + Number(tx.amount || 0), 0), [periodTransactions]);
            const periodExpenses = useMemo(() => periodTransactions.filter(tx => tx.type === 'expense').reduce((sum, tx) => sum + Number(tx.amount || 0), 0), [periodTransactions]);
            const previousIncome = useMemo(() => previousPeriodTransactions.filter(tx => tx.type === 'income').reduce((sum, tx) => sum + Number(tx.amount || 0), 0), [previousPeriodTransactions]);
            const previousExpenses = useMemo(() => previousPeriodTransactions.filter(tx => tx.type === 'expense').reduce((sum, tx) => sum + Number(tx.amount || 0), 0), [previousPeriodTransactions]);
            const compareText = (current, previous) => {
                if (!previous) return 'нет данных ранее';
                const pct = Math.round(((Number(current || 0) - Number(previous || 0)) / Math.max(1, Number(previous))) * 100);
                return `${pct >= 0 ? '+' : '−'}${Math.abs(pct)}% к прошлому периоду`;
            };
            const balanceDelta = periodIncome - periodExpenses;
            const budgetRawPercent = Number(monthLimit) > 0 ? Math.round((periodExpenses / Number(monthLimit)) * 100) : 0;
            const budgetRingPercent = Math.min(100, Math.max(0, budgetRawPercent));
            const periodCategoryRows = useMemo(() => {
                const map = {};
                periodTransactions.filter(tx => tx.type === 'expense').forEach(tx => {
                    const name = tx.category || 'Разное';
                    map[name] = (map[name] || 0) + Number(tx.amount || 0);
                });
                const sorted = Object.entries(map).map(([name, amount]) => ({ name, amount, color: getCategoryColor(name) })).sort((a, b) => b.amount - a.amount);
                if (sorted.length <= 6) return sorted;
                const top = sorted.slice(0, 5);
                const other = sorted.slice(5).reduce((sum, row) => sum + Number(row.amount || 0), 0);
                return [...top, { name: 'Прочее', amount: other, color: '#98a09b' }];
            }, [periodTransactions]);
            const chartBuckets = useMemo(() => {
                const bucketMap = {};
                const makeKey = (date) => {
                    if (financePeriod === 'year') return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
                    if (financePeriod === 'quarter') {
                        const week = Math.ceil((date - periodMeta.start) / 604800000) + 1;
                        return `Неделя ${Math.max(1, week)}`;
                    }
                    return formatDateKey(date);
                };
                periodTransactions.filter(tx => tx.type === 'expense').forEach(tx => {
                    const date = txDate(tx);
                    const key = makeKey(date);
                    if (!bucketMap[key]) bucketMap[key] = { key, label: financePeriod === 'month' ? String(date.getDate()) : key, amount: 0, count: 0, date };
                    bucketMap[key].amount += Number(tx.amount || 0);
                    bucketMap[key].count += 1;
                });
                if (financePeriod === 'month') {
                    const days = new Date(periodMeta.end.getFullYear(), periodMeta.end.getMonth() + 1, 0).getDate();
                    return Array.from({ length: days }, (_, index) => {
                        const date = new Date(periodMeta.start.getFullYear(), periodMeta.start.getMonth(), index + 1);
                        const key = formatDateKey(date);
                        return bucketMap[key] || { key, label: String(index + 1), amount: 0, count: 0, date };
                    });
                }
                return Object.values(bucketMap).sort((a, b) => a.date - b.date);
            }, [periodTransactions, financePeriod, periodMeta]);
            const maxBucketAmount = Math.max(1, ...chartBuckets.map(row => Number(row.amount || 0)));
            const averageExpense = chartBuckets.length ? Math.round(chartBuckets.reduce((sum, row) => sum + Number(row.amount || 0), 0) / chartBuckets.length) : 0;
            const budgetRows = useMemo(() => {
                return (categories || []).map(name => {
                    const plan = Number(categoryLimits?.[name] || 0);
                    const fact = Number((periodCategoryRows || []).find(row => row.name === name)?.amount || 0);
                    const left = plan - fact;
                    const pct = plan > 0 ? Math.round((fact / plan) * 100) : 0;
                    return { name, plan, fact, left, pct, hasLimit: plan > 0 };
                }).filter(row => row.hasLimit || row.fact > 0).slice(0, 6);
            }, [categories, categoryLimits, periodCategoryRows]);
            const visibleTransactions = useMemo(() => {
                return [...periodTransactions]
                    .filter(tx => transactionFilter === 'all' || tx.type === transactionFilter)
                    .filter(tx => categoryFilter === 'all' || (tx.category || 'Разное') === categoryFilter)
                    .sort((a, b) => (txDate(b).getTime() || 0) - (txDate(a).getTime() || 0) || Number(b.createdAt || 0) - Number(a.createdAt || 0))
                    .slice(0, 7);
            }, [periodTransactions, transactionFilter, categoryFilter]);
            const insight = periodCategoryRows.length
                ? `Самая большая категория расходов — ${periodCategoryRows[0].name}: ${money(periodCategoryRows[0].amount)}.`
                : '';

            return (
                <div className="fin-page animate-fadeIn">
                    <header className="fin-header">
                        <h1 className="fin-title">Финансы</h1>
                        <div className="fin-toolbar">
                            <div className="fin-tabs" aria-label="Период финансов">
                                {[
                                    ['month', 'Месяц'],
                                    ['quarter', '3 месяца'],
                                    ['year', 'Год'],
                                ].map(([id, label]) => (
                                    <button key={id} onClick={() => setFinancePeriod(id)} className={`fin-tab ${financePeriod === id ? 'is-active' : ''}`}>
                                        {label}
                                    </button>
                                ))}
                            </div>
                            <input
                                type="month"
                                value={selectedFinanceMonth}
                                onChange={event => event.target.value && setSelectedFinanceMonth(event.target.value)}
                                className="fin-month"
                                aria-label="Выбрать месяц"
                            />
                            <button onClick={openAddTransactionModal} className="lh-primary-btn hidden lg:inline-flex">
                                <Icons.Plus className="w-5 h-5" />
                                Добавить операцию
                            </button>
                        </div>
                    </header>

                    <div className="fin-grid fin-summary mb-3">
                        <button onClick={() => { setManualBalanceInput(String(totalBalance)); setEditBalanceOpen(true); }} className="fin-card text-left">
                            <div className="flex items-start justify-between gap-3">
                                <div>
                                    <p className="fin-card-title">Баланс</p>
                                    <p className="fin-value mt-4">{money(totalBalance)}</p>
                                    <p className={`fin-delta mt-2 ${balanceDelta >= 0 ? 'fin-positive' : 'fin-negative'}`}>{signedMoney(balanceDelta)} за период</p>
                                </div>
                                <MiniLineChart points={chartBuckets.map(row => row.amount)} stroke="#0a7a52" className="fin-spark" />
                            </div>
                        </button>

                        <button onClick={() => { setTransactionFilter('income'); setDailyOpen(true); }} className="fin-card text-left">
                            <div className="flex items-start justify-between gap-3">
                                <div>
                                    <p className="fin-card-title">Доходы</p>
                                    <p className="fin-value mt-4">{money(periodIncome)}</p>
                                    <p className="fin-delta fin-positive mt-2">{compareText(periodIncome, previousIncome)}</p>
                                </div>
                                <MiniLineChart points={chartBuckets.map(row => row.amount * 0.45)} stroke="#15803d" className="fin-spark" />
                            </div>
                        </button>

                        <button onClick={() => { setTransactionFilter('expense'); setDailyOpen(true); }} className="fin-card text-left">
                            <div className="flex items-start justify-between gap-3">
                                <div>
                                    <p className="fin-card-title">Расходы</p>
                                    <p className="fin-value mt-4">{money(periodExpenses)}</p>
                                    <p className={`fin-delta mt-2 ${periodExpenses <= previousExpenses || !previousExpenses ? 'fin-positive' : 'fin-negative'}`}>{compareText(periodExpenses, previousExpenses)}</p>
                                </div>
                                <MiniLineChart points={chartBuckets.map(row => row.amount)} stroke="#0a7a52" className="fin-spark" />
                            </div>
                        </button>

                        <button onClick={() => { setManualLimitInput(String(monthLimit || '')); setEditLimitOpen(true); }} className="fin-card text-left">
                            {Number(monthLimit) > 0 ? (
                                <div className="flex items-center justify-between gap-3">
                                    <div>
                                        <p className="fin-card-title">Бюджет</p>
                                        <p className={`fin-value mt-4 ${budgetRawPercent >= 100 ? 'fin-negative' : ''}`}>{budgetRawPercent}%</p>
                                        <p className="fin-label mt-2">из {money(monthLimit)}</p>
                                    </div>
                                    <div className="fin-budget-ring" style={{ '--fin-pct': `${budgetRingPercent * 3.6}deg` }}><span>{budgetRawPercent}%</span></div>
                                </div>
                            ) : (
                                <div>
                                    <p className="fin-card-title">Бюджет</p>
                                    <p className="fin-value mt-4 text-lg">Не установлен</p>
                                    <span className="fin-footer-link inline-block">Настроить →</span>
                                </div>
                            )}
                        </button>
                    </div>

                    <article className="fin-card fin-actions-card mb-3">
                        <p className="fin-card-title mb-3">Быстрые действия</p>
                        <div className="fin-actions-grid">
                            <button onClick={() => { openAddTransactionModal(); setNewTrans(prev => ({ ...prev, type: 'income' })); }} className="fin-action-row">
                                <span className="fin-icon bg-emerald-50 text-emerald-600"><Icons.TrendingUp className="w-5 h-5" /></span>
                                <span><span className="block font-semibold text-slate-900">Добавить доход</span><span className="fin-label">Зарплата, перевод, возврат</span></span>
                            </button>
                            <button onClick={() => { openAddTransactionModal(); setNewTrans(prev => ({ ...prev, type: 'expense' })); }} className="fin-action-row">
                                <span className="fin-icon bg-rose-50 text-rose-500"><Icons.TrendingDown className="w-5 h-5" /></span>
                                <span><span className="block font-semibold text-slate-900">Добавить расход</span><span className="fin-label">Покупка или оплата</span></span>
                            </button>
                            <button onClick={() => { openAddTransactionModal(); setNewTrans(prev => ({ ...prev, type: 'expense', title: 'Перевод между счетами' })); }} className="fin-action-row">
                                <span className="fin-icon bg-blue-50 text-blue-600"><Icons.Repeat className="w-5 h-5" /></span>
                                <span><span className="block font-semibold text-slate-900">Перевод между счетами</span><span className="fin-label">Внутренняя операция</span></span>
                            </button>
                            <button onClick={() => setBillsOpen(true)} className="fin-action-row">
                                <span className="fin-icon bg-violet-50 text-violet-600"><Icons.Calendar className="w-5 h-5" /></span>
                                <span><span className="block font-semibold text-slate-900">Запланированная операция</span><span className="fin-label">Платёж или счёт</span></span>
                            </button>
                        </div>
                    </article>


                    <div className="fin-grid fin-row-2 mb-3">
                        <article className="fin-card">
                            <div className="flex items-center justify-between gap-3 mb-4">
                                <p className="fin-card-title">Расходы по категориям</p>
                                <span className="fin-label">{periodMeta.label}</span>
                            </div>
                            {periodCategoryRows.length ? (
                                <div className="fin-donut-block">
                                    <DonutChart items={periodCategoryRows} total={periodExpenses} compact />
                                    <div className="fin-legend">
                                        {periodCategoryRows.map(row => {
                                            const pct = periodExpenses > 0 ? Math.round((row.amount / periodExpenses) * 100) : 0;
                                            return (
                                                <button key={row.name} onClick={() => { setCategoryFilter(row.name); setDailyOpen(true); }} className="fin-legend-row text-left">
                                                    <span className="fin-dot" style={{ background: row.color }} />
                                                    <span className="flex-1 min-w-0 truncate text-sm font-semibold text-slate-800">{row.name}</span>
                                                    <span className="fin-label">{pct}%</span>
                                                    <span className="text-xs font-semibold text-slate-800">{money(row.amount)}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="fin-empty">
                                    <div>
                                        <p className="font-semibold text-slate-800">Расходов по категориям пока нет</p>
                                        <p className="fin-label mt-1">Добавьте первую операцию, и здесь появится аналитика.</p>
                                        <button onClick={openAddTransactionModal} className="fin-footer-link">Добавить расход →</button>
                                    </div>
                                </div>
                            )}
                            <button onClick={() => { setCategoryModalMode('edit'); setEditingLimitCategory(null); setCategoryLimitOpen(true); }} className="fin-footer-link">Все категории →</button>
                        </article>

                        <article className="fin-card">
                            <div className="flex items-start justify-between gap-3 mb-3">
                                <p className="fin-card-title">Динамика расходов</p>
                                <div className="text-right">
                                    <p className="fin-label">Среднее за период</p>
                                    <p className="text-sm font-semibold text-slate-800">{money(averageExpense)}</p>
                                </div>
                            </div>
                            <div className="fin-bar-chart" aria-label="Динамика расходов">
                                {chartBuckets.map((row, index) => (
                                    <button
                                        key={`${row.key}-${index}`}
                                        className="fin-bar"
                                        style={{ height: `${Math.max(4, Math.round((Number(row.amount || 0) / maxBucketAmount) * 100))}%` }}
                                        title={`${row.label}: ${money(row.amount)} · операций: ${row.count}`}
                                        aria-label={`${row.label}: ${money(row.amount)}, операций ${row.count}`}
                                    />
                                ))}
                            </div>
                            <div className="flex items-center justify-between mt-2 fin-label">
                                <span>{periodMeta.start.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}</span>
                                <span>{periodMeta.end.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}</span>
                            </div>
                            <button onClick={() => setStatsOpen(true)} className="fin-footer-link">Подробнее о динамике →</button>
                        </article>

                        <article className="fin-card">
                            <div className="flex items-center justify-between gap-3 mb-4">
                                <p className="fin-card-title">Бюджет по категориям</p>
                                <button onClick={() => { setCategoryModalMode('edit'); setEditingLimitCategory(null); setCategoryLimitOpen(true); }} className="fin-footer-link !mt-0">Настроить</button>
                            </div>
                            {budgetRows.length ? (
                                <div className="fin-table">
                                    <div className="fin-table-row fin-table-head">
                                        <span>Категория</span><span>План</span><span>Факт</span><span>Ост.</span><span>%</span>
                                    </div>
                                    {budgetRows.map(row => {
                                        const state = row.pct >= 100 ? 'danger' : row.pct >= 80 ? 'warn' : '';
                                        return (
                                            <button key={row.name} onClick={() => openEditCategoryModal(row.name)} className="fin-table-row text-left">
                                                <span className="truncate font-semibold text-slate-800">{row.name}</span>
                                                <span>{row.hasLimit ? money(row.plan) : '—'}</span>
                                                <span>{money(row.fact)}</span>
                                                <span className={row.left < 0 ? 'fin-negative' : 'fin-muted'}>{row.hasLimit ? money(row.left) : '—'}</span>
                                                <span className={`fin-badge ${state}`}>{row.hasLimit ? `${row.pct}%` : '—'}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="fin-empty">
                                    <div>
                                        <p className="font-semibold text-slate-800">Бюджет не настроен</p>
                                        <p className="fin-label mt-1">Установите лимиты, чтобы отслеживать расходы.</p>
                                        <button onClick={() => { setManualLimitInput(String(monthLimit || '')); setEditLimitOpen(true); }} className="fin-footer-link">Настроить бюджет →</button>
                                    </div>
                                </div>
                            )}
                            <button onClick={() => { setCategoryModalMode('edit'); setEditingLimitCategory(null); setCategoryLimitOpen(true); }} className="fin-footer-link">Управление бюджетом →</button>
                        </article>
                    </div>

                    <div className="fin-grid fin-row-3">
                        <article className="fin-card">
                            <div className="flex items-center justify-between gap-3 mb-3">
                                <p className="fin-card-title">Последние операции</p>
                                <button onClick={() => setDailyOpen(true)} className="fin-footer-link !mt-0">Все операции →</button>
                            </div>
                            <div className="fin-filterbar">
                                {[
                                    ['all', 'Все'],
                                    ['expense', 'Расходы'],
                                    ['income', 'Доходы'],
                                ].map(([id, label]) => (
                                    <button key={id} onClick={() => setTransactionFilter(id)} className={`fin-filter ${transactionFilter === id ? 'is-active' : ''}`}>{label}</button>
                                ))}
                                {categoryFilter !== 'all' && <button onClick={() => setCategoryFilter('all')} className="fin-filter is-active">{categoryFilter} ×</button>}
                            </div>
                            {visibleTransactions.length ? (
                                <div>
                                    {visibleTransactions.map(tx => {
                                        const isIncome = tx.type === 'income';
                                        return (
                                            <button key={tx.id} onClick={() => openEditTransactionModal(tx)} className="fin-tx-row">
                                                <div className="fin-icon" style={{ color: isIncome ? '#047857' : getCategoryColor(tx.category), background: isIncome ? '#eef8f2' : '#f6f7f5' }}>
                                                    {isIncome ? <Icons.TrendingUp className="w-5 h-5" /> : <Icons.TrendingDown className="w-5 h-5" />}
                                                </div>
                                                <div className="min-w-0 flex-1">
                                                    <p className="font-semibold text-slate-900 truncate">{tx.title || tx.category || 'Операция'}</p>
                                                    <p className="fin-label truncate">{tx.category || (isIncome ? 'Доход' : 'Расход')}</p>
                                                </div>
                                                <div className="text-right shrink-0">
                                                    <p className={`font-semibold ${isIncome ? 'fin-positive' : 'text-slate-900'}`}>{isIncome ? '+' : '−'}{money(tx.amount)}</p>
                                                    <p className="fin-label">{formatTxDate(tx)}</p>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="fin-empty">
                                    <div>
                                        <p className="font-semibold text-slate-800">Операций пока нет</p>
                                        <p className="fin-label mt-1">Добавьте расход или доход, чтобы увидеть историю.</p>
                                        <button onClick={openAddTransactionModal} className="fin-footer-link">Добавить операцию →</button>
                                    </div>
                                </div>
                            )}
                        </article>

                        <article className="fin-card">
                            <p className="fin-card-title mb-3">Счета и кошельки</p>
                            <button onClick={() => { setManualBalanceInput(String(totalBalance)); setEditBalanceOpen(true); }} className="fin-account-row text-left">
                                <span className="fin-icon bg-emerald-50 text-emerald-700"><Icons.Wallet className="w-5 h-5" /></span>
                                <span className="min-w-0 flex-1">
                                    <span className="block font-semibold text-slate-900">Основной баланс</span>
                                    <span className="fin-label">manual account</span>
                                </span>
                                <span className="font-semibold text-slate-900">{money(totalBalance)}</span>
                            </button>
                            <div className="fin-empty !min-h-[74px] mt-2">
                                <p className="fin-label">Отдельные счета пока не поддерживаются. Используется текущий общий баланс.</p>
                            </div>
                            {insight && <div className="mt-3 rounded-2xl bg-emerald-50 border border-emerald-100 p-3 text-sm text-emerald-900">{insight}</div>}
                        </article>
                    </div>

                    {/* --- MODALS --- */}

                    {/* Edit Balance Modal */}
                    {isEditBalanceOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" onClick={() => setEditBalanceOpen(false)} />
                            <div className="bg-white w-full max-w-xs rounded-3xl p-5 shadow-2xl relative animate-zoomIn mx-4">
                                <h2 className="text-lg font-bold text-center text-slate-800 mb-6">Баланс</h2>
                                <input
                                    type="number"
                                    value={manualBalanceInput}
                                    onChange={(e) => setManualBalanceInput(e.target.value)}
                                    className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-2xl font-bold text-center text-slate-900 outline-none mb-6"
                                    autoFocus
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setEditBalanceOpen(false)} className="flex-1 h-12 bg-slate-50 rounded-2xl font-bold text-slate-400">Отмена</button>
                                    <button onClick={handleManualBalanceUpdate} className="flex-1 h-12 bg-slate-900 rounded-2xl font-bold text-white">OK</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Limit Modal */}
                    {isEditLimitOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" onClick={() => setEditLimitOpen(false)} />
                            <div className="bg-white w-full max-w-xs rounded-3xl p-5 shadow-2xl relative animate-zoomIn mx-4">
                                <h2 className="text-lg font-bold text-center text-slate-800 mb-6">Лимит</h2>
                                <input
                                    type="number"
                                    value={manualLimitInput}
                                    onChange={(e) => setManualLimitInput(e.target.value)}
                                    className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-2xl font-bold text-center text-slate-900 outline-none mb-6"
                                    autoFocus
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setEditLimitOpen(false)} className="flex-1 h-12 bg-slate-50 rounded-2xl font-bold text-slate-400">Отмена</button>
                                    <button onClick={handleManualLimitUpdate} className="flex-1 h-12 bg-slate-900 rounded-2xl font-bold text-white">OK</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Statistics Modal */}
                    <BottomSheetModal
                        open={isStatsOpen}
                        onClose={() => setStatsOpen(false)}
                        zIndex={120}
                        height="90vh"
                        header={
                            <div className="flex justify-between items-center">
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Статистика</h2>
                                    <p className="text-slate-500 dark:text-slate-400 text-sm">Расходы по категориям</p>
                                </div>
                                <button
                                    onClick={() => setStatsOpen(false)}
                                    className="bg-slate-50 dark:bg-slate-700 p-2 rounded-full text-slate-400"
                                    title="Закрыть"
                                >
                                    <Icons.X className="w-5 h-5" />
                                </button>
                            </div>
                        }
                    >
                        <div className="space-y-6">
                            <div className="bg-indigo-50 border border-indigo-100 dark:bg-indigo-950/30 dark:border-indigo-900/40 p-5 rounded-3xl">
                                <div className="flex justify-between items-center mb-3">
                                    <div className="flex items-center gap-2">
                                        <Icons.Sparkles className="w-5 h-5 text-indigo-500" />
                                        <span className="text-xs font-black text-indigo-900 dark:text-indigo-200 uppercase">AI Анализ</span>
                                    </div>
                                    <PressableScale onClick={getFinancialAdvice} disabled={loadingAI}>
                                        <div className="bg-white dark:bg-slate-900 p-2 rounded-full shadow-sm text-indigo-500">
                                            {loadingAI ? <Icons.Loader className="w-4 h-4" /> : <Icons.Wand className="w-4 h-4" />}
                                        </div>
                                    </PressableScale>
                                </div>
                                <p className="text-indigo-900 dark:text-indigo-100 text-sm leading-relaxed font-semibold">
                                    {advice || "Нажмите на палочку для AI-анализа ✨"}
                                </p>
                            </div>

                            <div className="space-y-5">
                                {expensesByCategory.length > 0 ? (
                                    expensesByCategory.map((item, index) => {
                                        const percentage = spentThisMonth > 0 ? Math.round((item.amount / spentThisMonth) * 100) : 0;
                                        return (
                                            <div key={index} className="space-y-2">
                                                <div className="flex justify-between items-end px-1">
                                                    <span className="font-bold text-slate-700 dark:text-slate-200">{item.name}</span>
                                                    <div className="flex items-baseline gap-2">
                                                        <span className="font-bold text-slate-900 dark:text-white">{item.amount.toLocaleString()} ₽</span>
                                                        <span className="text-xs text-slate-400 font-bold bg-slate-50 dark:bg-slate-900 px-1.5 py-0.5 rounded">{percentage}%</span>
                                                    </div>
                                                </div>
                                                <div className="w-full h-3 bg-slate-50 dark:bg-slate-900 rounded-full overflow-hidden">
                                                    <div className="h-full bg-emerald-400 rounded-full" style={{ width: `${percentage}%` }} />
                                                </div>
                                            </div>
                                        );
                                    })
                                ) : (
                                    <div className="py-20 text-center text-slate-300">
                                        <Icons.PieChart className="w-16 h-16 mx-auto mb-4 opacity-50" />
                                        <p className="font-medium">Нет данных о расходах</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </BottomSheetModal>

                    {/* Daily Operations Modal */}
                    {isDailyOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setDailyOpen(false)} />
                            <div className="bg-white dark:bg-slate-800 w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden" style={{ height: '90vh' }}>
                                <div className="flex justify-between items-center p-5 pb-2 bg-white dark:bg-slate-800 shrink-0">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Операции</h2>
                                        <p className="text-slate-500 dark:text-slate-400 text-sm">История и Календарь</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <PressableScale onClick={openAddTransactionModal} className="bg-emerald-500 p-2.5 rounded-xl text-white shadow-lg">
                                            <Icons.Plus className="w-5 h-5" />
                                        </PressableScale>
                                        <button onClick={() => setDailyOpen(false)} className="bg-slate-100 dark:bg-slate-700 p-2 rounded-full text-slate-400"><Icons.X className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto px-5 pb-6 pt-2 scrollbar-hide">
                                    <MonthCalendar
                                        viewMonth={opsViewMonth}
                                        selectedDate={selectedDateObj}
                                        onSelectDate={(d) => setSelectedDateObj(startOfDay(d))}
                                        onPrevMonth={() => setOpsViewMonth(new Date(opsViewMonth.getFullYear(), opsViewMonth.getMonth() - 1, 1))}
                                        onNextMonth={() => setOpsViewMonth(new Date(opsViewMonth.getFullYear(), opsViewMonth.getMonth() + 1, 1))}
                                        selectedClassName="bg-slate-900 text-white shadow-lg"
                                        todayClassName="bg-slate-100 text-slate-800"
                                        renderMarkers={(day, selected) => {
                                            const m = opsMarkersByDay[day];
                                            if (!m) return null;
                                            return (
                                                <div className="flex gap-0.5 absolute bottom-1.5">
                                                    {m.income && <div className={`w-1.5 h-1.5 rounded-full ${selected ? 'bg-white' : 'bg-emerald-400'}`} />}
                                                    {m.expense && <div className={`w-1.5 h-1.5 rounded-full ${selected ? 'bg-white/70' : 'bg-rose-400'}`} />}
                                                </div>
                                            );
