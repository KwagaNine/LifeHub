    <script>
        // Apply theme ASAP to avoid flashes.
        // Priority:
        // 1) User setting in localStorage (lifehub_theme)
        // 2) Telegram WebApp theme (if inside Telegram)
        // 3) light
        (function () {
            try {
                const raw = localStorage.getItem('lifehub_theme');
                const hasUserTheme = raw !== null && raw !== undefined;
                let theme = hasUserTheme ? JSON.parse(raw) : 'light';

                if (!hasUserTheme) {
                    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                    if (tg && tg.colorScheme) {
                        theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
                    }
                }

                if (theme === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}

            // Viewport height helper for mobile keyboards (Telegram/iOS)
            const setAppHeight = () => {
                try {
                    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                    const viewportH = (tg && tg.viewportHeight) ? tg.viewportHeight : window.innerHeight;
                    const stableH = (tg && tg.viewportStableHeight) ? tg.viewportStableHeight : window.innerHeight;
                    const keyboardH = Math.max(0, stableH - viewportH);
                    document.documentElement.style.setProperty('--app-height', viewportH + 'px');
                    document.documentElement.style.setProperty('--keyboard-height', keyboardH + 'px');
                } catch (e) {
                    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
                    document.documentElement.style.setProperty('--keyboard-height', '0px');
                }
            };

            setAppHeight();
            window.addEventListener('resize', setAppHeight);

            // Telegram init (safe)
            try {
                const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                if (tg) {
                    tg.ready();
                    tg.expand();
                    if (tg.onEvent) tg.onEvent('viewportChanged', setAppHeight);
                }
            } catch (e) {}
        })();
    </script>

        const { useState, useMemo, useEffect, Component, createContext, useContext, useCallback, useRef } = React;

        // --- Supabase Configuration ---
        const SUPABASE_URL = 'https://xhywokafvifzyoxuklqi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoeXdva2FmdmlmenlveHVrbHFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDU2NTcsImV4cCI6MjA4NTcyMTY1N30.P74yViXWfSEA-WzC5o06ZDz-qVYU7PgAGUFpKnouw18';
        
        // Инициализация Supabase клиента
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Получение ID пользователя из Telegram или тестовый ID
        const getUserId = () => {
            // Попробуем разные способы получения ID из Telegram
            try {
                // Способ 1: initDataUnsafe.user.id (нормальный путь)
                if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) {
                    return String(window.Telegram.WebApp.initDataUnsafe.user.id);
                }

                // Способ 2: initData (строка формата querystring)
                if (window.Telegram?.WebApp?.initData) {
                    const params = new URLSearchParams(window.Telegram.WebApp.initData);
                    const userJson = params.get('user');
                    if (userJson) {
                        try {
                            const user = JSON.parse(userJson);
                            if (user?.id) return String(user.id);
                        } catch (e) {
                            console.warn('Failed to parse user from initData:', e);
                        }
                    }
                }

                // Способ 3: Telegram часто пробрасывает данные в URL как tgWebAppData (query или hash)
                // Пример: ?tgWebAppData=... или #tgWebAppData=...
                const readTgWebAppDataFromUrl = () => {
                    const q = new URLSearchParams(window.location.search);
                    const hRaw = String(window.location.hash || '').replace(/^#/, '');
                    const h = new URLSearchParams(hRaw);
                    return q.get('tgWebAppData') || h.get('tgWebAppData') || null;
                };

                const tgWebAppData = readTgWebAppDataFromUrl();
                if (tgWebAppData) {
                    // tgWebAppData сам является querystring-ом, URL-encoded
                    const inner = new URLSearchParams(tgWebAppData);
                    const userJson = inner.get('user');
                    if (userJson) {
                        try {
                            const user = JSON.parse(userJson);
                            if (user?.id) return String(user.id);
                        } catch (e) {
                            console.warn('Failed to parse user from tgWebAppData:', e);
                        }
                    }
                }
            } catch (e) {
                console.warn('Error getting Telegram user ID:', e);
            }

            // Тестовый ID для разработки в браузере
            return '111111';
        };

        const USER_ID = getUserId();
        
        // Детальное логирование для отладки
        console.log('=== LifeHub Debug Info ===');
        console.log('User ID:', USER_ID);
        console.log('Telegram WebApp available:', !!window.Telegram?.WebApp);
        console.log('initDataUnsafe:', window.Telegram?.WebApp?.initDataUnsafe);
        console.log('initData:', window.Telegram?.WebApp?.initData);
        console.log('========================');

        // --- Supabase Data Context ---
        const DataContext = createContext(null);

        const DataProvider = ({ children }) => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [syncStatus, setSyncStatus] = useState('idle'); // 'idle' | 'saving' | 'saved' | 'error'
            const [lastSyncTime, setLastSyncTime] = useState(null);
            const saveTimeoutRef = useRef(null);
            const syncIndicatorTimeoutRef = useRef(null);
            const pendingDataRef = useRef(null);

            // Загрузка данных из Supabase
            const loadData = useCallback(async () => {
                try {
                    setLoading(true);
                    setError(null);
                    setSyncStatus('idle');
                    
                    console.log('[Supabase] Loading data for user:', USER_ID);
                    
                    const { data: row, error: fetchError } = await supabase
                        .from('user_data')
                        .select('data')
                        .eq('user_id', USER_ID)
                        .single();

                    console.log('[Supabase] Fetch result:', { row, error: fetchError });

                    if (fetchError && fetchError.code !== 'PGRST116') {
                        // PGRST116 = no rows found (new user)
                        throw fetchError;
                    }

                    if (row?.data) {
                        console.log('[Supabase] Loaded existing data');
                        setData(row.data);
                        setLastSyncTime(new Date());
                    } else {
                        // Новый пользователь — устанавливаем дефолтные данные
                        console.log('[Supabase] New user, creating default data');
                        const defaultData = getDefaultData();
                        setData(defaultData);
                        
                        // Сохраняем в базу
                        const { error: insertError } = await supabase.from('user_data').upsert({
                            user_id: USER_ID,
                            data: defaultData
                        });
                        
                        if (insertError) {
                            console.error('[Supabase] Error creating new user:', insertError);
                            throw insertError;
                        }
                        
                        console.log('[Supabase] Created new user data successfully');
                        setLastSyncTime(new Date());
                    }
                } catch (err) {
                    console.error('[Supabase] Error loading data:', err);
                    setError(err.message || 'Ошибка загрузки данных');
                    // Fallback to default data
                    setData(getDefaultData());
                } finally {
                    setLoading(false);
                }
            }, []);

            // Сохранение данных в Supabase (с дебаунсом)
            const flushSave = useCallback(async () => {
                const payload = pendingDataRef.current;
                if (!payload) return;

                // если есть отложенный таймер — отменяем и сохраняем сразу
                if (saveTimeoutRef.current) {
                    clearTimeout(saveTimeoutRef.current);
                    saveTimeoutRef.current = null;
                }

                try {
                    console.log('[Supabase] Flush saving data for user:', USER_ID);
                    const { error: saveError } = await supabase.from('user_data').upsert({
                        user_id: USER_ID,
                        data: payload
                    });
                    if (saveError) throw saveError;

                    console.log('[Supabase] Flush saved successfully');
                    setSyncStatus('saved');
                    setLastSyncTime(new Date());

                    // После успешного flush — очищаем pending
                    pendingDataRef.current = null;

                    if (syncIndicatorTimeoutRef.current) clearTimeout(syncIndicatorTimeoutRef.current);
                    syncIndicatorTimeoutRef.current = setTimeout(() => setSyncStatus('idle'), 2000);
                } catch (err) {
                    console.error('[Supabase] Flush save error:', err);
                    setSyncStatus('error');
                }
            }, []);

            const saveData = useCallback(async (newData) => {
                setData(newData);
                setSyncStatus('saving');
                pendingDataRef.current = newData;

                // Дебаунс — сохраняем через 500мс после последнего изменения
                if (saveTimeoutRef.current) {
                    clearTimeout(saveTimeoutRef.current);
                }

                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        console.log('[Supabase] Saving data for user:', USER_ID);

                        const { error: saveError } = await supabase.from('user_data').upsert({
                            user_id: USER_ID,
                            data: newData
                        });

                        if (saveError) throw saveError;

                        console.log('[Supabase] Data saved successfully');
                        setSyncStatus('saved');
                        setLastSyncTime(new Date());

                        // убираем pending только если он совпадает с тем, что сохранили
                        if (pendingDataRef.current === newData) pendingDataRef.current = null;

                        // Сбрасываем статус через 2 секунды
                        if (syncIndicatorTimeoutRef.current) {
                            clearTimeout(syncIndicatorTimeoutRef.current);
                        }
                        syncIndicatorTimeoutRef.current = setTimeout(() => {
                            setSyncStatus('idle');
                        }, 2000);

                    } catch (err) {
                        console.error('[Supabase] Error saving data:', err);
                        setSyncStatus('error');
                    }
                }, 500);
            }, []);

            // Обновление конкретного ключа в данных
            const updateKey = useCallback((key, value) => {
                setData(prev => {
                    const newData = { ...prev, [key]: value };
                    saveData(newData);
                    return newData;
                });
            }, [saveData]);

            useEffect(() => {
                loadData();
            }, [loadData]);

            // Надёжное сохранение при сворачивании/закрытии (Telegram WebApp часто выгружается резко)
            useEffect(() => {
                const onVis = () => {
                    if (document.visibilityState === 'hidden') {
                        flushSave();
                    }
                };
                const onPageHide = () => {
                    flushSave();
                };

                document.addEventListener('visibilitychange', onVis);
                window.addEventListener('pagehide', onPageHide);

                // Telegram events
                const tg = window.Telegram?.WebApp;
                const onTgBack = () => flushSave();
                try {
                    if (tg && tg.onEvent) tg.onEvent('viewportChanged', onTgBack);
                } catch (e) {}

                return () => {
                    document.removeEventListener('visibilitychange', onVis);
                    window.removeEventListener('pagehide', onPageHide);
                    try {
                        if (tg && tg.offEvent) tg.offEvent('viewportChanged', onTgBack);
                    } catch (e) {}
                };
            }, [flushSave]);

            return (
                <DataContext.Provider value={{ data, loading, error, syncStatus, lastSyncTime, updateKey, saveData, reload: loadData }}>
                    {children}
                </DataContext.Provider>
            );
        };

        const useData = () => useContext(DataContext);

        // Дефолтные данные для нового пользователя
        const getDefaultData = () => ({
            balance: 0,
            limit: 60000,
            transactions: [],
            bills: [],
            goals: [],
            birthdays: [],
            notes: [],
            supplies: [],
            life_goals: [],
            reminders: [],
            ideas: [],
            categories: ['Еда', 'Транспорт', 'Дом', 'Развлечения', 'Здоровье', 'Шоппинг', 'Фриланс', 'Разное'],
            category_limits: {},
            theme: 'light',
            home_greeting: 'Добрый день! 👋',
            ideas_title: 'Идеи'
        });

        // --- Хук для работы с данными (замена useLocalStorage) ---
        const useCloudStorage = (key, initialValue) => {
            const { data, updateKey } = useData();
            
            const value = data?.[key] ?? initialValue;
            
            const setValue = useCallback((newValue) => {
                const valueToStore = newValue instanceof Function ? newValue(value) : newValue;
                updateKey(key, valueToStore);
            }, [key, value, updateKey]);

            return [value, setValue];
        };

        // Алиас для совместимости (все компоненты будут использовать useCloudStorage)
        const useLocalStorage = useCloudStorage;

        // --- Icons (SVG components) ---

            <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke={stroke}>
                <path strokeLinecap="round" strokeLinejoin="round" d={d} />

            Calendar: (p) => <Icon {...p} d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />,
            StickyNote: (p) => <Icon {...p} d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />,
            Plus: (p) => <Icon {...p} d="M12 4.5v15m7.5-7.5h-15" />,
            X: (p) => <Icon {...p} d="M6 18L18 6M6 6l12 12" />,
            Trash: (p) => <Icon {...p} d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />,

            TrendingDown: (p) => <Icon {...p} d="M2.25 6L9 12.75l4.286-4.286a11.948 11.948 0 014.306 6.43l.776 2.898m0 0l3.182-5.511m-3.182 5.51l-5.511-3.181" />,
            Clock: (p) => <Icon {...p} d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />,
            PieChart: (p) => <Icon {...p} d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z" />,
            Receipt: (p) => <Icon {...p} d="M9 14.25l6-6m4.5-3.493V21.75l-3.75-1.5-3.75 1.5-3.75-1.5-3.75 1.5V4.757c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0c1.1.128 1.907 1.077 1.907 2.185zM9.75 9h.008v.008H9.75V9zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm4.125 4.5h.008v.008h-.008V13.5zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />,

            Droplet: (p) => <Icon {...p} d="M12 21.5c-3.5 0-6.5-2.5-6.5-6.5 0-4.5 6.5-12 6.5-12s6.5 7.5 6.5 12c0 4-3 6.5-6.5 6.5z" />,
            Filter: (p) => <Icon {...p} d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z" />,

            Gift: (p) => <Icon {...p} d="M21 11.25v8.25a1.5 1.5 0 01-1.5 1.5H5.25a1.5 1.5 0 01-1.5-1.5v-8.25M12 4.875A2.625 2.625 0 109.375 7.5H12m0-2.625V7.5m0-2.625A2.625 2.625 0 1114.625 7.5H12m0 0V21m-8.625-9.75h18c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125h-18c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />,
            Moon: (p) => <Icon {...p} d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />,
        };

        // --- Error Boundary ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
                            <Icons.AlertTriangle className="w-16 h-16 text-rose-500 mb-4" />
                            <h1 className="text-2xl font-bold mb-2 text-slate-800">Что-то пошло не так</h1>
                            <p className="text-slate-500 text-center mb-6">Приложение столкнулось с ошибкой.</p>
                            <button onClick={() => window.location.reload()} className="bg-slate-900 text-white px-6 py-3 rounded-full font-bold">
                                Перезагрузить
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Design System ---
        const THEME = {
            card: 'bg-white rounded-3xl border border-slate-100 shadow-lg shadow-slate-100',
            label: 'text-xs font-bold uppercase tracking-widest text-slate-400'
        };

        // --- Components ---
        const PressableScale = ({ children, onClick, className = "", disabled = false }) => (
            <button onClick={onClick} disabled={disabled} className={`active:scale-95 transition-all duration-200 outline-none disabled:opacity-50 cursor-pointer ${className}`}>
                {children}
            </button>
        );

        const BentoCard = ({ children, className = "" }) => (
            <div className={`${THEME.card} p-5 ${className}`}>{children}</div>
        );

        const SectionHeader = ({ title, actionLabel, onAction }) => (
            <div className="flex justify-between items-center mb-4">
                <h2 className="text-lg font-bold text-slate-700">{title}</h2>
                {actionLabel && (
                    <button onClick={onAction} className="text-sm font-bold text-slate-400 hover:text-slate-800 bg-white px-3 py-1.5 rounded-full shadow-sm">
                        {actionLabel}
                    </button>
                )}
            </div>
        );

        // --- Helpers ---
        const pad2 = (n) => String(n).padStart(2, '0');
        const formatDateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const parseDateKey = (key) => {
            if (!key) return null;
            const [y, m, d] = String(key).split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d);
        };
        const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

        // --- Month Calendar (полноценный) ---
        const MonthCalendar = ({
            viewMonth,
            selectedDate,
            onSelectDate,
            onPrevMonth,
            onNextMonth,
            renderMarkers,
            selectedClassName = 'bg-slate-900 text-white shadow-lg',
            todayClassName = 'bg-slate-100 text-slate-800'
        }) => {
            const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
            const firstWeekdayMondayBased = (new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1).getDay() + 6) % 7;
            const monthTitle = viewMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
            const today = startOfDay(new Date());

            return (
                <div className="bg-slate-50 rounded-3xl p-4">
                    <div className="flex items-center justify-between mb-3">
                        <PressableScale onClick={onPrevMonth} className="p-2 rounded-xl bg-white text-slate-500 border border-slate-100 shadow-sm hover:bg-slate-50">
                            <Icons.ChevronLeft className="w-5 h-5" />
                        </PressableScale>
                        <div className="text-center">
                            <div className="text-sm font-extrabold text-slate-900 capitalize">{monthTitle}</div>
                            <div className="text-[11px] font-bold uppercase tracking-widest text-slate-400">выберите дату</div>
                        </div>
                        <PressableScale onClick={onNextMonth} className="p-2 rounded-xl bg-white text-slate-500 border border-slate-100 shadow-sm hover:bg-slate-50">
                            <Icons.ChevronRight className="w-5 h-5" />
                        </PressableScale>
                    </div>

                    <div className="grid grid-cols-7 gap-1">
                        {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => (
                            <div key={d} className="h-8 flex items-center justify-center text-[10px] font-black text-slate-300 uppercase">{d}</div>
                        ))}

                        {Array.from({ length: firstWeekdayMondayBased }, (_, i) => (
                            <div key={`empty-${i}`} className="aspect-square" />
                        ))}

                        {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
                            const cellDate = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
                            const selected = isSameDay(cellDate, selectedDate);
                            const isToday = isSameDay(cellDate, today);

                            return (
                                <button
                                    key={day}
                                    onClick={() => onSelectDate(cellDate)}
                                    className={`aspect-square rounded-2xl flex flex-col items-center justify-center relative transition-all
                                        ${selected ? selectedClassName : isToday ? todayClassName : 'hover:bg-white text-slate-700'}
                                    `}
                                >
                                    <span className="text-sm font-bold">{day}</span>
                                    {renderMarkers ? renderMarkers(day, selected) : null}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- Budget Tab ---
        const BudgetTab = () => {
            const [advice, setAdvice] = useState(null);
            const [loadingAI, setLoadingAI] = useState(false);
            const [isDailyOpen, setDailyOpen] = useState(false);
            const [isBillsOpen, setBillsOpen] = useState(false);
            const [isEditBalanceOpen, setEditBalanceOpen] = useState(false);
            const [isEditLimitOpen, setEditLimitOpen] = useState(false);
            const [isAddTransOpen, setAddTransOpen] = useState(false);
            const [isAddBillOpen, setAddBillOpen] = useState(false);
            const [isStatsOpen, setStatsOpen] = useState(false);
            const [isGoalModalOpen, setGoalModalOpen] = useState(false);
            const [editingGoalId, setEditingGoalId] = useState(null);

            const [totalBalance, setTotalBalance] = useCloudStorage('balance', 0);
            const [monthLimit, setMonthLimit] = useCloudStorage('limit', 60000);

            // --- Категории и лимиты ---
            const [categoryLimits, setCategoryLimits] = useCloudStorage('category_limits', {});
            const [categoriesList, setCategoriesList] = useCloudStorage('categories', ['Еда', 'Транспорт', 'Дом', 'Развлечения', 'Здоровье', 'Шоппинг', 'Фриланс', 'Разное']);
            const categories = categoriesList || [];

            // Модалка управления категорией (добавить/редактировать/удалить)
            const [isCategoryLimitOpen, setCategoryLimitOpen] = useState(false);
            const [categoryModalMode, setCategoryModalMode] = useState('edit'); // 'add' | 'edit'
            const [editingLimitCategory, setEditingLimitCategory] = useState(null); // исходное имя (для редактирования)
            const [categoryNameDraft, setCategoryNameDraft] = useState('');
            const [categoryLimitDraft, setCategoryLimitDraft] = useState('');
            const [categoryModalError, setCategoryModalError] = useState('');

            // Быстрое добавление категории из модалки операции
            const [isAddingCategory, setIsAddingCategory] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState('');

            // Операции: полноценный календарь (месяц/год)
            const [selectedDateObj, setSelectedDateObj] = useState(() => startOfDay(new Date()));
            const [opsViewMonth, setOpsViewMonth] = useState(() => new Date(selectedDateObj.getFullYear(), selectedDateObj.getMonth(), 1));

            // Платежи: календарь с навигацией по месяцам (для выбора дня)
            const [selectedBillDateObj, setSelectedBillDateObj] = useState(() => startOfDay(new Date()));
            const [billsViewMonth, setBillsViewMonth] = useState(() => new Date(selectedBillDateObj.getFullYear(), selectedBillDateObj.getMonth(), 1));

            const [transactions, setTransactions] = useCloudStorage('transactions', []);
            const [bills, setBills] = useCloudStorage('bills', []);
            const [goals, setGoals] = useCloudStorage('goals', []);

            // Миграция старых транзакций (где была только "date" как число)
            useEffect(() => {
                if (!transactions || transactions.length === 0) return;
                const needs = transactions.some(t => !t.dateKey);
                if (!needs) return;
                setTransactions(transactions.map(t => {
                    if (t.dateKey) return t;
                    const base = t.createdAt ? startOfDay(new Date(t.createdAt)) : startOfDay(new Date());
                    return { ...t, dateKey: formatDateKey(base) };
                }));
            }, [transactions]);

            const [newTrans, setNewTrans] = useState({ amount: '', title: '', type: 'expense', category: '' });

            // Если категория в форме невалидна — подхватываем первую из списка
            useEffect(() => {
                if (!Array.isArray(categories) || categories.length === 0) return;
                if (!newTrans.category || !categories.includes(newTrans.category)) {
                    setNewTrans(prev => ({ ...prev, category: categories[0] }));
                }
            }, [categoriesList]);
            const [newBill, setNewBill] = useState({ title: '', amount: '', repeat: 'monthly' });
            const [goalForm, setGoalForm] = useState({ title: '', targetAmount: '', currentAmount: '', date: '' });
            const [manualBalanceInput, setManualBalanceInput] = useState('');
            const [manualLimitInput, setManualLimitInput] = useState('');

            // Текущий месяц для расчётов лимитов
            const today0 = startOfDay(new Date());
            const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today0);
            const txMonthKey = (t) => {
                if (t.dateKey) return String(t.dateKey).slice(0, 7);
                if (t.createdAt) return monthKey(startOfDay(new Date(t.createdAt)));
                return currentMonthKey;
            };

            const spentThisMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            const progress = useMemo(() => {
                if (Number(monthLimit) === 0) return 0;
                return Math.min((spentThisMonth / Number(monthLimit)) * 100, 100);
            }, [spentThisMonth, monthLimit]);

            const expensesByCategory = useMemo(() => {
                const stats = {};
                (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .forEach(t => {
                        const c = t.category || 'Разное';
                        stats[c] = (stats[c] || 0) + Number(t.amount || 0);
                    });
                return Object.entries(stats)
                    .map(([name, amount]) => ({ name, amount }))
                    .sort((a, b) => b.amount - a.amount);
            }, [transactions, currentMonthKey]);

            const expensesByCategoryMap = useMemo(() => {
                const map = {};
                (expensesByCategory || []).forEach(x => { map[x.name] = x.amount; });
                return map;
            }, [expensesByCategory]);

            const getFinancialAdvice = async () => {
                setLoadingAI(true);
                await new Promise(resolve => setTimeout(resolve, 1500));
                const advices = [
                    `При текущих расходах ${spentThisMonth.toLocaleString()} ₽ вы используете ${Math.round(progress)}% лимита. Попробуйте сократить расходы на развлечения.`,
                    `Ваш баланс ${totalBalance.toLocaleString()} ₽ позволяет откладывать по ${Math.round((totalBalance - spentThisMonth) / 30)} ₽ в день.`,
                    `Совет: ведите учёт мелких расходов — они часто составляют до 30% бюджета!`,
                    `Рекомендую создать "подушку безопасности" в размере 3-х месячных расходов.`
                ];
                setAdvice(advices[Math.floor(Math.random() * advices.length)]);
                setLoadingAI(false);
            };

            const handleManualBalanceUpdate = () => {
                if (manualBalanceInput) {
                    setTotalBalance(Number(manualBalanceInput));
                    setEditBalanceOpen(false);
                }
            };

            const handleManualLimitUpdate = () => {
                if (manualLimitInput) {
                    setMonthLimit(Number(manualLimitInput));
                    setEditLimitOpen(false);
                }
            };

            const handleAddTransaction = () => {
                if (!newTrans.amount || !newTrans.title) return;
                const amount = Number(newTrans.amount);
                const newTransaction = {
                    id: Date.now().toString(),
                    ...newTrans,
                    amount: amount,
                    dateKey: formatDateKey(selectedDateObj),
                    createdAt: Date.now()
                };
                setTransactions([newTransaction, ...transactions]);

                if (newTrans.type === 'expense') {
                    setTotalBalance(totalBalance - amount);
                } else {
                    setTotalBalance(totalBalance + amount);
                }

                setAddTransOpen(false);
                setNewTrans({ amount: '', title: '', type: 'expense', category: 'Еда' });
            };

            const handleAddBill = () => {
                if (!newBill.amount || !newBill.title) return;
                const newBillItem = {
                    id: Date.now().toString(),
                    title: newBill.title,
                    amount: Number(newBill.amount),
                    date: selectedBillDateObj.getDate(),
                    repeat: newBill.repeat || 'monthly',
                    paid: false,
                    createdAt: Date.now()
                };
                setBills([newBillItem, ...bills]);
                setAddBillOpen(false);
                setNewBill({ title: '', amount: '', repeat: 'monthly' });
            };

            const toggleBillPaid = (billId) => {
                setBills(bills.map(b => b.id === billId ? { ...b, paid: !b.paid } : b));
            };

            const deleteBill = (billId) => {
                setBills(bills.filter(b => b.id !== billId));
            };

            const openAddGoalModal = () => {
                setEditingGoalId(null);
                setGoalForm({ title: '', targetAmount: '', currentAmount: '', date: '' });
                setGoalModalOpen(true);
            };

            const openEditGoalModal = (goal) => {
                setEditingGoalId(goal.id);
                setGoalForm({
                    title: goal.title,
                    targetAmount: String(goal.targetAmount),
                    currentAmount: String(goal.currentAmount),
                    date: goal.date
                });
                setGoalModalOpen(true);
            };

            const handleSaveGoal = () => {
                if (!goalForm.title || !goalForm.targetAmount || !goalForm.date) return;
                const target = Number(goalForm.targetAmount);
                const current = Number(goalForm.currentAmount) || 0;

                const goalData = {
                    title: goalForm.title,
                    targetAmount: target,
                    currentAmount: current,
                    date: goalForm.date,
                    color: 'bg-emerald-500'
                };

                if (editingGoalId) {
                    setGoals(goals.map(g => g.id === editingGoalId ? { ...g, ...goalData } : g));
                } else {
                    const newGoal = {
                        id: Date.now().toString(),
                        ...goalData,
                        createdAt: Date.now()
                    };
                    setGoals([newGoal, ...goals]);
                }
                setGoalModalOpen(false);
            };

            const handleDeleteGoal = () => {
                if (editingGoalId) {
                    setGoals(goals.filter(g => g.id !== editingGoalId));
                    setGoalModalOpen(false);
                }
            };

            const calculateDailySavings = (targetAmount, currentAmount, targetDate) => {
                const today = new Date();
                const target = new Date(targetDate);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays <= 0) return 0;
                const remaining = Math.max(0, targetAmount - currentAmount);
                return Math.ceil(remaining / diffDays);
            };

            const filteredTransactions = useMemo(() => {
                const key = formatDateKey(selectedDateObj);
                return (transactions || []).filter(t => t.dateKey === key);
            }, [transactions, selectedDateObj]);

            const filteredBills = useMemo(() => {
                const day = selectedBillDateObj.getDate();
                return (bills || []).filter(b => Number(b.date) === day);
            }, [bills, selectedBillDateObj]);

            const opsMarkersByDay = useMemo(() => {
                const map = {};
                (transactions || []).forEach(t => {
                    if (!t.dateKey) return;
                    const d = parseDateKey(t.dateKey);
                    if (!d) return;
                    if (d.getFullYear() !== opsViewMonth.getFullYear() || d.getMonth() !== opsViewMonth.getMonth()) return;
                    const day = d.getDate();
                    map[day] = map[day] || { income: false, expense: false };
                    if (t.type === 'income') map[day].income = true;
                    if (t.type === 'expense') map[day].expense = true;
                });
                return map;
            }, [transactions, opsViewMonth]);

            const billsMarkersByDay = useMemo(() => {
                const map = {};
                (bills || []).forEach(b => {
                    const day = Number(b.date);
                    if (!day) return;
                    map[day] = map[day] || { paid: false, unpaid: false };
                    if (b.paid) map[day].paid = true;
                    else map[day].unpaid = true;
                });
                return map;
            }, [bills]);

            const normalizeCategory = (s) => String(s || '').trim().replace(/\s+/g, ' ');
            const isTaken = (name, excludeName = null) => {
                const low = normalizeCategory(name).toLowerCase();
                return (categories || []).some(c => {
                    const cc = normalizeCategory(c).toLowerCase();
                    if (!cc) return false;
                    if (excludeName && normalizeCategory(c) === normalizeCategory(excludeName)) return false;
                    return cc === low;
                });
            };

            // Legacy quick-add from "Новая операция" modal
            const handleAddCustomCategory = () => {
                const name = normalizeCategory(newCategoryName);
                if (!name) return;
                if (isTaken(name)) {
                    setNewTrans({ ...newTrans, category: name });
                    setNewCategoryName('');
                    setIsAddingCategory(false);
                    return;
                }

                const nextList = [...(categories || []), name];
                setCategoriesList(nextList);

                // keep legacy key in sync (not used as source anymore)
                setCustomCategories([...(customCategories || []), name]);

                setNewTrans({ ...newTrans, category: name });
                setNewCategoryName('');
                setIsAddingCategory(false);
            };

            // Legacy: customCategories not used anymore, но нужен для совместимости
            const customCategories = [];
            const setCustomCategories = () => {};

            const removeCustomCategory = (name) => {
                const n = normalizeCategory(name);
                setCategoriesList((categories || []).filter(c => normalizeCategory(c) !== n));

                // remove limit
                const nextLimits = { ...(categoryLimits || {}) };
                if (typeof nextLimits[n] !== 'undefined') delete nextLimits[n];
                setCategoryLimits(nextLimits);

                if (newTrans.category === n) {
                    setNewTrans({ ...newTrans, category: (categories || []).filter(c => normalizeCategory(c) !== n)[0] || '' });
                }
            };

            const openAddCategoryModal = () => {
                setCategoryModalError('');
                setCategoryModalMode('add');
                setEditingLimitCategory(null);
                setCategoryNameDraft('');
                setCategoryLimitDraft('');
                setCategoryLimitOpen(true);
            };

            const openEditCategoryModal = (cat) => {
                const n = normalizeCategory(cat);
                setCategoryModalError('');
                setCategoryModalMode('edit');
                setEditingLimitCategory(n);
                setCategoryNameDraft(n);
                const existing = categoryLimits && typeof categoryLimits[n] !== 'undefined' ? categoryLimits[n] : null;
                setCategoryLimitDraft(existing ? String(existing) : '');
                setCategoryLimitOpen(true);
            };

            const applyCategoryLimitToMap = (map, categoryName, rawLimit) => {
                const raw = String(rawLimit || '').trim();
                const val = raw === '' ? null : Number(raw);
                const next = { ...(map || {}) };
                if (val === null || !Number.isFinite(val) || val <= 0) {
                    delete next[categoryName];
                } else {
                    next[categoryName] = val;
                }
                return next;
            };

            const saveCategoryFromModal = () => {
                const name = normalizeCategory(categoryNameDraft);
                if (!name) {
                    setCategoryModalError('Введите название категории.');
                    return;

                if (categoryModalMode === 'add') {

                        return;

                    const nextList = [...(categories || []), name];
                    setCategoriesList(nextList);

                    const nextLimits = applyCategoryLimitToMap(categoryLimits, name, categoryLimitDraft);
                    setCategoryLimits(nextLimits);

                    // удобство: сразу выбрать добавленную категорию

                    setCategoryLimitOpen(false);
                    return;

                    setCategoryLimitOpen(false);
                    return;

                if (isTaken(name, oldName)) {
                    setCategoryModalError('Категория с таким названием уже есть.');
                    return;

                // rename in categories list
                const nextList = (categories || []).map(c => normalizeCategory(c) === oldName ? name : normalizeCategory(c));
                setCategoriesList(nextList);

                // move limits key if renamed
                let nextLimits = { ...(categoryLimits || {}) };
                if (oldName !== name) {
                    if (typeof nextLimits[oldName] !== 'undefined') {
                        nextLimits[name] = nextLimits[oldName];
                        delete nextLimits[oldName];

                nextLimits = applyCategoryLimitToMap(nextLimits, name, categoryLimitDraft);
                setCategoryLimits(nextLimits);

                // rename in transactions history (to avoid "призрачных" категорий)
                if (oldName !== name) {
                    setTransactions((transactions || []).map(t => (t.category === oldName ? { ...t, category: name } : t)));
                    if (newTrans.category === oldName) setNewTrans(prev => ({ ...prev, category: name }));
                }

                setCategoryLimitOpen(false);
            };

            const deleteCategoryFromModal = () => {
                const oldName = normalizeCategory(editingLimitCategory);
                if (!oldName) return;

                // remove from categories list
                const nextList = (categories || []).filter(c => normalizeCategory(c) !== oldName);

                // remove limit

                // if selected in new transaction form, fallback

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Дата цели</label>
                                        <input
                                            type="date"
                                            value={goalForm.date}
                                            onChange={e => setGoalForm({ ...goalForm, date: e.target.value })}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>
                                </div>

                                <PressableScale onClick={handleSaveGoal} className="w-full pt-2">
                                    <div className="bg-emerald-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingGoalId ? 'Сохранить' : 'Создать'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Notes Tab ---
        const NotesTab = () => {
            const [notes, setNotes] = useLocalStorage('lifehub_notes', [
                { id: '1', title: 'Идеи для проекта', content: 'Разработать мобильное приложение', color: 'bg-amber-100', createdAt: Date.now() },
                { id: '2', title: 'Список покупок', content: 'Молоко, хлеб, яйца, сыр', color: 'bg-emerald-100', createdAt: Date.now() - 86400000 },
            ]);
            const [isAddOpen, setAddOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [noteForm, setNoteForm] = useState({ title: '', content: '', color: 'bg-amber-100' });

            const colors = ['bg-amber-100', 'bg-emerald-100', 'bg-violet-100', 'bg-rose-100', 'bg-sky-100'];

            const openAdd = () => {
                setEditingNote(null);
                setNoteForm({ title: '', content: '', color: 'bg-amber-100' });
                setAddOpen(true);
            };

            const openEdit = (note) => {
                setEditingNote(note);
                setNoteForm({ title: note.title, content: note.content, color: note.color });
                setAddOpen(true);
            };

            const handleSave = () => {
                if (!noteForm.title) return;
                if (editingNote) {
                    setNotes(notes.map(n => n.id === editingNote.id ? { ...n, ...noteForm } : n));
                } else {
                    const newNote = { id: Date.now().toString(), ...noteForm, createdAt: Date.now() };
                    setNotes([newNote, ...notes]);
                }
                setAddOpen(false);
            };

            const handleDelete = () => {
                if (editingNote) {
                    setNotes(notes.filter(n => n.id !== editingNote.id));
                    setAddOpen(false);
                }
            };

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4 flex justify-between items-center">
                        <div>
                            <p className={THEME.label}>Заметки</p>
                            <h1 className="text-3xl font-extrabold text-slate-800 mt-1">Мои записи</h1>
                        </div>
                        <PressableScale onClick={openAdd} className="bg-amber-500 p-3 rounded-2xl shadow-lg text-white">
                            <Icons.Plus className="w-6 h-6" />
                        </PressableScale>
                    </header>

                    <div className="grid grid-cols-2 gap-4">
                        {notes.map(note => (
                            <PressableScale key={note.id} onClick={() => openEdit(note)} className={`${note.color} p-5 rounded-3xl min-h-[150px] flex flex-col justify-between`}>
                                <div>
                                    <h3 className="font-bold text-slate-800 text-lg mb-2">{note.title}</h3>
                                    <p className="text-slate-600 text-sm line-clamp-4">{note.content}</p>
                                </div>
                                <p className="text-xs text-slate-400 mt-3">{new Date(note.createdAt).toLocaleDateString('ru-RU')}</p>
                            </PressableScale>
                        ))}
                    </div>

                    {notes.length === 0 && (
                        <div className="flex flex-col items-center justify-center h-60 text-slate-300">
                            <Icons.StickyNote className="w-16 h-16 mb-4 opacity-50" />
                            <p className="font-medium">Нет заметок</p>
                        </div>
                    )}

                    {isAddOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setAddOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingNote ? 'Редактирование' : 'Новая заметка'}</h2>
                                    {editingNote && (
                                        <button onClick={handleDelete} className="bg-rose-50 p-3 rounded-full text-rose-500">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Заголовок</label>
                                        <input
                                            value={noteForm.title}
                                            onChange={e => setNoteForm({ ...noteForm, title: e.target.value })}
                                            placeholder="Название заметки"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Содержание</label>
                                        <textarea
                                            value={noteForm.content}
                                            onChange={e => setNoteForm({ ...noteForm, content: e.target.value })}
                                            placeholder="Текст заметки..."
                                            rows={4}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Цвет</label>
                                        <div className="flex gap-2">
                                            {colors.map(color => (
                                                <button
                                                    key={color}
                                                    onClick={() => setNoteForm({ ...noteForm, color })}
                                                    className={`w-10 h-10 rounded-xl ${color} ${noteForm.color === color ? 'ring-2 ring-slate-400 ring-offset-2' : ''}`}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={handleSave} className="w-full pt-2">
                                    <div className="bg-amber-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingNote ? 'Сохранить' : 'Создать'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Birthdays Tab (События → напоминания о Днях рождения) ---
        const EventsTab = () => {
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

            const [birthdays, setBirthdays] = useLocalStorage('lifehub_birthdays', [
                { id: 'b1', name: 'Мама', day: 22, month: 7, year: 1965, note: 'Купить цветы', createdAt: Date.now() },
                { id: 'b2', name: 'Аня', day: 3, month: 3, year: 1998, note: 'Подарок: сертификат', createdAt: Date.now() },
            ]);

            const today = useMemo(() => {
                const d = new Date();
                return new Date(d.getFullYear(), d.getMonth(), d.getDate());
            }, []);

            const [viewMonth, setViewMonth] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
            const [selectedDate, setSelectedDate] = useState(() => today);

            const [isModalOpen, setModalOpen] = useState(false);
            const [editingBirthday, setEditingBirthday] = useState(null);
            const [form, setForm] = useState({ name: '', day: today.getDate(), month: today.getMonth() + 1, year: '', note: '' });

            const safeDate = (year, monthIndex, day) => {
                const d = new Date(year, monthIndex, day);
                if (d.getMonth() !== monthIndex) {
                    // Например, 31 апреля → берём последний день месяца
                    return new Date(year, monthIndex + 1, 0);
                }
                return d;
            };

            const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

            const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

            const openAdd = (presetDate) => {
                const d = presetDate || selectedDate;
                setEditingBirthday(null);
                setForm({ name: '', day: d.getDate(), month: d.getMonth() + 1, year: '', note: '' });
                setModalOpen(true);
            };

            const openEdit = (b) => {
                setEditingBirthday(b);
                setForm({
                    name: b.name || '',
                    day: b.day,
                    month: b.month,
                    year: b.year ? String(b.year) : '',
                    note: b.note || ''
                });
                setModalOpen(true);
            };

            const handleSave = () => {
                if (!form.name.trim()) return;

                const day = Number(form.day);
                const month = Number(form.month);
                const year = form.year ? Number(form.year) : null;

                const payload = {
                    name: form.name.trim(),
                    day,
                    month,
                    year,
                    note: form.note.trim()
                };

                if (editingBirthday) {
                    setBirthdays(birthdays.map(b => b.id === editingBirthday.id ? { ...b, ...payload } : b));
                } else {
                    setBirthdays([{ id: String(Date.now()), ...payload, createdAt: Date.now() }, ...birthdays]);
                }

                setModalOpen(false);
            };

            const handleDelete = () => {
                if (!editingBirthday) return;
                setBirthdays(birthdays.filter(b => b.id !== editingBirthday.id));
                setModalOpen(false);
            };

            const daysInViewMonth = useMemo(() => {
                return new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
            }, [viewMonth]);

            const firstWeekdayMondayBased = useMemo(() => {
                // JS: 0=Вс..6=Сб → делаем 0=Пн..6=Вс
                const js = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1).getDay();
                return (js + 6) % 7;
            }, [viewMonth]);

            const birthdaysInViewMonthByDay = useMemo(() => {
                const m = viewMonth.getMonth() + 1;
                const map = {};
                birthdays.filter(b => b.month === m).forEach(b => {
                    map[b.day] = (map[b.day] || 0) + 1;
                });
                return map;
            }, [birthdays, viewMonth]);

            const birthdaysForSelectedDate = useMemo(() => {
                const d = selectedDate.getDate();
                const m = selectedDate.getMonth() + 1;
                return birthdays.filter(b => b.day === d && b.month === m);
            }, [birthdays, selectedDate]);

            const closestThisYear = useMemo(() => {
                const yearNow = today.getFullYear();
                const untilEndOfYear = new Date(yearNow, 11, 31);
                const today0 = startOfDay(today);

                return birthdays
                    .map(b => {
                        const occ = safeDate(yearNow, b.month - 1, b.day);
                        return { b, occ };
                    })
                    .filter(x => x.occ >= today0 && x.occ <= untilEndOfYear)
                    .sort((a, b) => a.occ.getTime() - b.occ.getTime());
            }, [birthdays, today]);

            const goPrevMonth = () => {
                setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1));
            };

            const goNextMonth = () => {
                setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1));
            };

            // Если пользователь выбрал дату вне текущего отображаемого месяца — синхронизируем, чтобы не было «пропажи» выделения.
            useEffect(() => {
                if (selectedDate.getFullYear() !== viewMonth.getFullYear() || selectedDate.getMonth() !== viewMonth.getMonth()) {
                    setViewMonth(new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1));
                }
            }, [selectedDate]);

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4 flex justify-between items-center">
                        <div>
                            <p className={THEME.label}>Напоминания</p>
                            <h1 className="text-3xl font-extrabold text-slate-800 mt-1">Дни рождения</h1>
                        </div>
                        <PressableScale onClick={() => openAdd(selectedDate)} className="bg-violet-500 p-3 rounded-2xl shadow-lg text-white">
                            <Icons.Plus className="w-6 h-6" />
                        </PressableScale>
                    </header>

                    {/* Calendar (листать по месяцам) */}
                    <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-4">
                        <div className="flex items-center justify-between px-2">
                            <PressableScale onClick={goPrevMonth} className="p-2 rounded-xl bg-slate-50 text-slate-500 hover:bg-slate-100">
                                <Icons.ChevronLeft className="w-5 h-5" />
                            </PressableScale>
                            <div className="text-center">
                                <div className="text-sm font-extrabold text-slate-900">
                                    {monthNames[viewMonth.getMonth()]} {viewMonth.getFullYear()}
                                </div>
                                <div className="text-[11px] font-bold uppercase tracking-widest text-slate-400">Выберите дату</div>
                            </div>
                            <PressableScale onClick={goNextMonth} className="p-2 rounded-xl bg-slate-50 text-slate-500 hover:bg-slate-100">
                                <Icons.ChevronRight className="w-5 h-5" />
                            </PressableScale>
                        </div>

                        <div className="grid grid-cols-7 gap-1 mt-4">
                            {['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w => (
                                <div key={w} className="h-7 flex items-center justify-center text-[10px] font-black text-slate-300 uppercase">{w}</div>
                            ))}

                            {Array.from({ length: firstWeekdayMondayBased }, (_, i) => (
                                <div key={`empty-${i}`} className="aspect-square" />
                            ))}

                            {Array.from({ length: daysInViewMonth }, (_, idx) => {
                                const day = idx + 1;
                                const cellDate = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
                                const isSelected = isSameDay(cellDate, selectedDate);
                                const isToday = isSameDay(cellDate, today);
                                const hasBd = Boolean(birthdaysInViewMonthByDay[day]);

                                return (
                                    <button
                                        key={day}
                                        onClick={() => setSelectedDate(cellDate)}
                                        className={`aspect-square rounded-2xl flex flex-col items-center justify-center relative transition-all
                                            ${isSelected ? 'bg-violet-500 text-white shadow-lg' : isToday ? 'bg-violet-50 text-violet-700' : 'hover:bg-slate-50 text-slate-700'}
                                        `}
                                    >
                                        <span className="text-sm font-bold">{day}</span>
                                        {hasBd && (
                                            <div className={`absolute bottom-1.5 w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-violet-400'}`} />
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Birthdays on selected day */}
                    <section>
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-lg font-bold text-slate-700">
                                {selectedDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                            </h2>
                            <button
                                onClick={() => openAdd(selectedDate)}
                                className="text-sm font-bold text-slate-400 hover:text-slate-800 transition-colors bg-white px-3 py-1.5 rounded-full shadow-sm"
                            >
                                + Добавить
                            </button>
                        </div>

                        <div className="space-y-3">
                            {birthdaysForSelectedDate.length > 0 ? birthdaysForSelectedDate.map(b => (
                                <PressableScale key={b.id} onClick={() => openEdit(b)} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex gap-4">
                                    <div className="w-1.5 rounded-full bg-violet-500" />
                                    <div className="flex-1">
                                        <div className="flex justify-between items-start">
                                            <h3 className="font-bold text-slate-800 text-lg">{b.name}</h3>
                                            <Icons.ChevronRight className="w-5 h-5 text-slate-300" />
                                        </div>
                                        {b.note && <p className="text-slate-500 text-sm mt-1">{b.note}</p>}
                                        {b.year && (
                                            <p className="text-xs text-slate-400 mt-2">
                                                Исполнится {today.getFullYear() - b.year}
                                            </p>
                                        )}
                                    </div>
                                </PressableScale>
                            )) : (
                                <div className="flex flex-col items-center justify-center h-28 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                    <Icons.Gift className="w-10 h-10 mb-2 opacity-50" />
                                    <p className="text-sm font-medium">На эту дату ничего нет</p>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Closest birthdays this year */}
                    <section className="mt-6 pt-4 border-t border-slate-100">
                        <p className={`${THEME.label} mb-3`}>Ближайшие в этом году</p>
                        <div className="space-y-2">
                            {closestThisYear.length > 0 ? closestThisYear.map(({ b, occ }) => {
                                const daysLeft = Math.max(0, Math.round((startOfDay(occ).getTime() - startOfDay(today).getTime()) / 86400000));
                                const badge = daysLeft === 0
                                    ? 'bg-rose-50 text-rose-600'
                                    : daysLeft <= 7
                                        ? 'bg-amber-50 text-amber-700'
                                        : daysLeft <= 31
                                            ? 'bg-emerald-50 text-emerald-700'
                                            : 'bg-slate-50 text-slate-500';

                                return (
                                    <PressableScale
                                        key={b.id}
                                        onClick={() => {
                                            const d = safeDate(today.getFullYear(), b.month - 1, b.day);
                                            setSelectedDate(d);
                                            setViewMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                                            openEdit(b);
                                        }}
                                        className="bg-white border border-slate-100 rounded-2xl p-4 flex items-center justify-between shadow-sm"
                                    >
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-2xl bg-violet-50 flex items-center justify-center text-violet-600">
                                                <Icons.Gift className="w-5 h-5" />
                                            </div>
                                            <div>
                                                <div className="font-bold text-slate-800">{b.name}</div>
                                                <div className="text-xs text-slate-400 font-medium">
                                                    {occ.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                                                    {b.year ? ` • исполнится ${today.getFullYear() - b.year}` : ''}
                                                </div>
                                            </div>
                                        </div>
                                        <div className={`text-xs font-black px-2.5 py-1 rounded-full ${badge}`}>
                                            {daysLeft === 0 ? 'Сегодня' : `через ${daysLeft} дн.`}
                                        </div>
                                    </PressableScale>
                                );
                            }) : (
                                <div className="text-sm text-slate-400 bg-slate-50 border border-slate-100 rounded-2xl p-4">
                                    На этот год ближайших дней рождения больше нет.
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Add/Edit Birthday Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingBirthday ? 'Редактирование' : 'Новый день рождения'}</h2>
                                    {editingBirthday && (
                                        <button onClick={handleDelete} className="bg-rose-50 p-3 rounded-full text-rose-500">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Имя</label>
                                        <input
                                            value={form.name}
                                            onChange={e => setForm({ ...form, name: e.target.value })}
                                            placeholder="Напр: Оля"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-2">
                                            <label className={THEME.label}>День</label>
                                            <input
                                                type="number"
                                                min="1"
                                                max="31"
                                                value={form.day}
                                                onChange={e => setForm({ ...form, day: Number(e.target.value) })}
                                                className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            />
                                        </div>
                                        <div className="space-y-2">
                                            <label className={THEME.label}>Месяц</label>
                                            <select
                                                value={form.month}
                                                onChange={e => setForm({ ...form, month: Number(e.target.value) })}
                                                className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            >
                                                {monthNames.map((m, i) => (
                                                    <option key={m} value={i + 1}>{m}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Год (необязательно)</label>
                                        <input
                                            type="number"
                                            value={form.year}
                                            onChange={e => setForm({ ...form, year: e.target.value })}
                                            placeholder="Напр: 1995"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Заметка</label>
                                        <textarea
                                            value={form.note}
                                            onChange={e => setForm({ ...form, note: e.target.value })}
                                            placeholder="Подарок, пожелания..."
                                            rows={3}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                </div>

                                <PressableScale onClick={handleSave} className="w-full pt-2">
                                    <div className="bg-violet-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingBirthday ? 'Сохранить' : 'Создать'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Supplies Tab (Дом / Запасы) ---
        const SuppliesTab = () => {
            const [supplies, setSupplies] = useLocalStorage('lifehub_supplies', [
                { id: '1', name: 'Молоко', category: 'Еда', inStock: true, price: 120, createdAt: Date.now() },
                { id: '2', name: 'Хлеб', category: 'Еда', inStock: false, price: 60, createdAt: Date.now() },
                { id: '3', name: 'Мыло', category: 'Гигиена', inStock: true, price: 90, createdAt: Date.now() },
                { id: '4', name: 'Средство для пола', category: 'Уборка', inStock: false, price: 250, createdAt: Date.now() },
            ]);
            const [isAddOpen, setAddOpen] = useState(false);
            const [showShoppingList, setShowShoppingList] = useState(false);
            const [newItem, setNewItem] = useState({ name: '', category: 'Еда', price: '' });

            // миграция старых записей, где price отсутствовал
            useEffect(() => {
                if (!supplies || supplies.length === 0) return;
                const needs = supplies.some(s => typeof s.price === 'undefined');
                if (!needs) return;
                setSupplies(supplies.map(s => (typeof s.price === 'undefined' ? { ...s, price: null } : s)));
            }, []);

            const categories = ['Еда', 'Уборка', 'Гигиена', 'Другое'];

            const categoryIcons = {
                'Еда': Icons.Apple,
                'Уборка': Icons.Sparkle,
                'Гигиена': Icons.Droplet,
                'Другое': Icons.Package
            };

            const categoryColors = {
                'Еда': { bg: 'bg-emerald-50', icon: 'bg-emerald-100', text: 'text-emerald-500' },
                'Уборка': { bg: 'bg-sky-50', icon: 'bg-sky-100', text: 'text-sky-500' },
                'Гигиена': { bg: 'bg-violet-50', icon: 'bg-violet-100', text: 'text-violet-500' },
                'Другое': { bg: 'bg-slate-50', icon: 'bg-slate-100', text: 'text-slate-500' }
            };

            const outOfStockCount = supplies.filter(s => !s.inStock).length;
            const outOfStockTotal = useMemo(() => {
                return (supplies || [])
                    .filter(s => !s.inStock)
                    .reduce((acc, s) => acc + (typeof s.price === 'number' && Number.isFinite(s.price) ? s.price : 0), 0);
            }, [supplies]);

            const displayedSupplies = showShoppingList 
                ? supplies.filter(s => !s.inStock)
                : supplies;

            const toggleStock = (id) => {
                setSupplies(supplies.map(s => s.id === id ? { ...s, inStock: !s.inStock } : s));
            };

            const deleteItem = (id) => {
                setSupplies(supplies.filter(s => s.id !== id));
            };

            const handleAdd = () => {
                if (!newItem.name.trim()) return;
                const priceNum = newItem.price === '' || newItem.price === null || typeof newItem.price === 'undefined'
                    ? null
                    : Number(newItem.price);

                const item = {
                    id: Date.now().toString(),
                    name: newItem.name.trim(),
                    category: newItem.category,
                    inStock: true,
                    price: Number.isFinite(priceNum) ? priceNum : null,
                    createdAt: Date.now()
                };
                setSupplies([item, ...supplies]);
                setNewItem({ name: '', category: 'Еда', price: '' });
                setAddOpen(false);
            };

            // Group by category
            const groupedSupplies = displayedSupplies.reduce((acc, item) => {
