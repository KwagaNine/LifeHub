            const saveNote = () => {
                if (!noteForm.title.trim()) return;
                if (editingNote) {
                    setNotes(notes.map(n => n.id === editingNote.id ? { ...n, ...noteForm } : n));
                } else {
                    setNotes([{ id: String(Date.now()), ...noteForm, createdAt: Date.now() }, ...notes]);
                }
                setNoteModalOpen(false);
            };
            const deleteNote = () => {
                if (!editingNote) return;
                setNotes(notes.filter(n => n.id !== editingNote.id));
                setNoteModalOpen(false);
            };

            // Achievements / Life goals (новый блок)
            const [lifeGoals, setLifeGoals] = useLocalStorage('lifehub_life_goals', [
                { id: 'lg1', title: 'Сделать чек-лист целей', done: true, createdAt: Date.now() - 3 * 86400000 },
                { id: 'lg2', title: 'Нарисовать картину', done: false, createdAt: Date.now() - 2 * 86400000 },
                { id: 'lg3', title: 'Пройти 10 000 шагов', done: false, createdAt: Date.now() - 86400000 },
            ]);
            const [isLifeGoalModalOpen, setLifeGoalModalOpen] = useState(false);
            const [editingLifeGoal, setEditingLifeGoal] = useState(null);
            const [lifeGoalDraft, setLifeGoalDraft] = useState('');
            
            // --- Общая система XP/Уровней (единая для Целей + Привычек) ---
            // Источник истины: Supabase user_profile.user_xp (state userXp).
            const [archivedGoals, setArchivedGoals] = useLocalStorage('lifehub_goals_archived', []);
            const [showArchiveModal, setShowArchiveModal] = useState(false);
            const [showStageClearModal, setShowStageClearModal] = useState(false);
            const [stageClearCount, setStageClearCount] = useState(0);

            // Общий XP (общий для целей и привычек)
            // ВАЖНО: уровень должен падать при списании XP, поэтому считаем его напрямую от текущего userXp.
            const goalsXP = Number(userXp || 0);
            const goalsLevel = calcLevel(goalsXP);

            // Прогресс XP до следующего уровня
            const xpForCurrentLevel = useMemo(() => {
                const totalXPForPrevLevels = (Number(goalsLevel) - 1) * XP_PER_LEVEL;
                return Math.max(0, Number(goalsXP) - totalXPForPrevLevels);
            }, [goalsXP, goalsLevel]);

            const xpProgress = useMemo(() => {
                return Math.min(100, (xpForCurrentLevel / XP_PER_LEVEL) * 100);
            }, [xpForCurrentLevel]);

            // Уведомление о повышении уровня: показываем только ПОСЛЕ того,
            // как первый раз загрузили XP из Supabase. На старте — не показываем.
            useEffect(() => {
                // Пока XP не загружен — вообще ничего не показываем.
                if (!xpLoaded) return;

                const current = goalsLevel;

                // Если prevLevel ещё не инициализирован — инициализируем и не показываем уведомление.
                if (!levelTracker.ready) {
                    levelTracker.ready = true;
                    levelTracker.prevLevel = current;
                    return;
                }

                // Показываем тост только при реальном росте уровня в результате действий пользователя.
                if (current > Number(levelTracker.prevLevel || 1)) {
                    try {
                        if (window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred) {
                            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                        }
                    } catch (e) {}
                    showToast('Новый уровень!', `Lvl ${current}`, 'success');
                }

                levelTracker.prevLevel = current;
            }, [xpLoaded, goalsLevel, showToast]);

            // Атомарно добавить/убавить XP в Supabase кошельке.
            // Если RPC не настроен — не блокируем UI, просто показываем предупреждение.
            const addUserXp = useCallback(async (delta) => {
                const d = Number(delta || 0);
                if (!Number.isFinite(d) || d === 0) return null;

                // Оптимистично обновляем UI сразу (чтобы шкала XP не "стояла")
                setUserXp(prev => Math.max(0, Number(prev || 0) + d));

                try {
                    const { data: res, error: rpcErr } = await supabase.rpc('user_add_xp', {
                        p_user_id: USER_ID,
                        p_amount: d,
                    });
                    if (rpcErr) throw rpcErr;

                    const row = Array.isArray(res) ? res[0] : res;
                    const wallet = Number(row?.user_xp ?? NaN);

                    if (Number.isFinite(wallet)) {
                        setUserXp(wallet);
                        return wallet;
                    }

                    // На всякий случай дотягиваем актуальное значение из БД
                    const refreshed = await refreshUserXp();
                    return refreshed;
                } catch (e) {
                    console.error('user_add_xp error:', e);
                    // UI уже обновлён оптимистично; просто предупреждаем
                    showToast('Внимание', 'XP не удалось синхронизировать (RPC user_add_xp).', 'error');
                    // Попробуем всё равно подтянуть актуальный wallet из БД чуть позже
                    setTimeout(() => { refreshUserXp(); }, 800);
                    return null;
                }
            }, [showToast, refreshUserXp]);

            // Авто-архивация при 100% выполнении
            const handleStageClear = useCallback(() => {
                if ((lifeGoals || []).length === 0) return;

                const count = (lifeGoals || []).length;
                setStageClearCount(count);

                // Архивируем все цели
                const completedGoals = (lifeGoals || []).map(g => ({
                    ...g,
                    archivedAt: Date.now()
                }));

                setArchivedGoals(prev => [...completedGoals, ...(prev || [])]);

                // Очищаем текущий список
                setLifeGoals([]);

                // Показываем модалку "Stage Clear"
                setShowStageClearModal(true);

                // Закрываем через 3 секунды
                setTimeout(() => {
                    setShowStageClearModal(false);
                }, 3000);
            }, [lifeGoals, setArchivedGoals, setLifeGoals]);

            // Important reminders (старый функционал оставлен в коде, но UI заменён на «Важные встречи»)
            const [reminders, setReminders] = useLocalStorage('lifehub_reminders', [
                { id: 'r1', text: 'Позвонить родителям', createdAt: Date.now() - 3600_000 },
                { id: 'r2', text: 'Записаться к врачу', createdAt: Date.now() - 7200_000 },
            ]);
            const [reminderDraft, setReminderDraft] = useState('');
            const addReminder = () => {
                const t = (reminderDraft || '').trim();
                if (!t) return;
                setReminders([{ id: String(Date.now()), text: t, createdAt: Date.now() }, ...(reminders || [])]);
                setReminderDraft('');
            };
            const deleteReminder = (id) => setReminders((reminders || []).filter(r => r.id !== id));

            // --- Важные встречи (новый блок вместо напоминаний) ---
            const [meetings, setMeetings] = useLocalStorage('lifehub_meetings', [
                // пример
                { id: 'm1', title: 'Встреча', dateKey: formatDateKey(today0), time: '19:00', note: 'Коротко обсудить планы', createdAt: Date.now() - 3600_000 },
            ]);
            const [isMeetingsManagerOpen, setMeetingsManagerOpen] = useState(false);
            const [isMeetingModalOpen, setMeetingModalOpen] = useState(false);
            const [editingMeeting, setEditingMeeting] = useState(null);
            const [meetingForm, setMeetingForm] = useState({ title: '', time: '', note: '' });
            const [meetingsViewMonth, setMeetingsViewMonth] = useState(() => new Date(today0.getFullYear(), today0.getMonth(), 1));
            const [meetingsSelectedDate, setMeetingsSelectedDate] = useState(() => today0);

            const openAddMeeting = (presetDate = meetingsSelectedDate) => {
                setEditingMeeting(null);
                setMeetingForm({ title: '', time: '', note: '' });
                setMeetingsSelectedDate(startOfDay(presetDate || today0));
                setMeetingModalOpen(true);
            };
            const openEditMeeting = (m) => {
                setEditingMeeting(m);
                setMeetingForm({ title: m?.title || '', time: m?.time || '', note: m?.note || '' });
                if (m?.dateKey) {
                    const d = parseDateKey(m.dateKey);
                    if (d) {
                        setMeetingsSelectedDate(startOfDay(d));
                        setMeetingsViewMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                    }
                }
                setMeetingModalOpen(true);
            };
            const saveMeeting = () => {
                const title = String(meetingForm.title || '').trim();
                if (!title) return;
                const payload = {
                    title,
                    dateKey: formatDateKey(meetingsSelectedDate),
                    time: String(meetingForm.time || '').trim(),
                    note: String(meetingForm.note || '').trim(),
                };
                if (editingMeeting?.id) {
                    setMeetings((meetings || []).map(x => x.id === editingMeeting.id ? { ...x, ...payload, updatedAt: Date.now() } : x));
                } else {
                    setMeetings([{ id: String(Date.now()), ...payload, createdAt: Date.now() }, ...(meetings || [])]);
                }
                setMeetingModalOpen(false);
            };
            const deleteMeeting = () => {
                if (!editingMeeting?.id) return;
                setMeetings((meetings || []).filter(x => x.id !== editingMeeting.id));
                setMeetingModalOpen(false);
            };

            const meetingsMarkersByDay = useMemo(() => {
                const map = {};
                const y = meetingsViewMonth.getFullYear();
                const m = meetingsViewMonth.getMonth();
                (meetings || []).forEach(mt => {
                    const d = mt.dateKey ? parseDateKey(mt.dateKey) : null;
                    if (!d) return;
                    if (d.getFullYear() !== y || d.getMonth() !== m) return;
                    const day = d.getDate();
                    map[day] = (map[day] || 0) + 1;
                });
                return map;
            }, [meetings, meetingsViewMonth]);

            const meetingsForSelectedDate = useMemo(() => {
                const key = formatDateKey(meetingsSelectedDate);
                return (meetings || [])
                    .filter(m => m.dateKey === key)
                    .slice()
                    .sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
            }, [meetings, meetingsSelectedDate]);

            const upcomingMeetings = useMemo(() => {
                const nowKey = formatDateKey(today0);
                return (meetings || [])
                    .filter(m => m.dateKey && String(m.dateKey) >= nowKey)
                    .slice()
                    .sort((a, b) => {
                        const ak = String(a.dateKey || '');
                        const bk = String(b.dateKey || '');
                        if (ak !== bk) return ak.localeCompare(bk);
                        return String(a.time || '').localeCompare(String(b.time || ''));
                    });
            }, [meetings, today0]);

            const nearestMeeting = upcomingMeetings[0] || null;

            // Ideas (wishlist) — новый блок
            const [ideasTitle] = useLocalStorage('lifehub_ideas_title', 'Идеи');

            const [ideas, setIdeas] = useLocalStorage('lifehub_ideas', []);
            const [ideaDraft, setIdeaDraft] = useState('');

            // миграция: если ранее в localStorage могли быть строки вместо объектов
            useEffect(() => {
                if (!Array.isArray(ideas) || ideas.length === 0) return;
                const needs = ideas.some(x => typeof x === 'string');
                if (!needs) return;
                setIdeas(ideas.map((x, idx) => (typeof x === 'string' ? { id: String(Date.now() + idx), text: x, createdAt: Date.now() } : x)));
            }, []);

            const addIdea = () => {
                const t = String(ideaDraft || '').trim();
                if (!t) return;
                setIdeas([{ id: String(Date.now()), text: t, createdAt: Date.now() }, ...(ideas || [])]);
                setIdeaDraft('');
            };

            const deleteIdea = (id) => setIdeas((ideas || []).filter(x => x.id !== id));

            const openAddLifeGoal = () => {
                setEditingLifeGoal(null);
                setLifeGoalDraft('');
                setLifeGoalModalOpen(true);
            };
            const openEditLifeGoal = (g) => {
                setEditingLifeGoal(g);
                setLifeGoalDraft(g.title);
                setLifeGoalModalOpen(true);
            };
            const saveLifeGoal = () => {
                const t = (lifeGoalDraft || '').trim();
                if (!t) return;
                if (editingLifeGoal) {
                    setLifeGoals(lifeGoals.map(g => g.id === editingLifeGoal.id ? { ...g, title: t } : g));
                } else {
                    setLifeGoals([{ id: String(Date.now()), title: t, done: false, createdAt: Date.now() }, ...lifeGoals]);
                }
                setLifeGoalModalOpen(false);
            };
            const deleteLifeGoal = () => {
                if (!editingLifeGoal) return;
                setLifeGoals(lifeGoals.filter(g => g.id !== editingLifeGoal.id));
                setLifeGoalModalOpen(false);
            };
            const toggleLifeGoal = (id) => setLifeGoals(lifeGoals.map(g => g.id === id ? { ...g, done: !g.done } : g));

            const doneCount = (lifeGoals || []).filter(g => g.done).length;
            const totalCount = (lifeGoals || []).length;
            const progressPercent = totalCount === 0 ? 0 : Math.round((doneCount / totalCount) * 100);
            const isAllComplete = totalCount > 0 && doneCount === totalCount;

            // Sorted goals: active first, then completed
            const sortedLifeGoals = useMemo(() => {
                return [...(lifeGoals || [])].sort((a, b) => {
                    if (a.done === b.done) return 0;
                    return a.done ? 1 : -1; // active first
                });
            }, [lifeGoals]);

            // Sound effect for completing a goal (short pop sound)
            const playCompleteSound = useCallback(() => {
                try {
                    // Short "pop" sound - base64 encoded for reliability
                    const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU' + 
                        'tvT19' + 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
                        'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA');
                    audio.volume = 0.3;
                    audio.play().catch(() => {});
                } catch (e) {
                    // Silently fail if sound doesn't work
                }
            }, []);

            // Confetti explosion at coordinates
            const fireConfetti = useCallback((originX = 0.5, originY = 0.5, big = false) => {
                try {
                    if (typeof confetti !== 'function') return;
                    
                    if (big) {
                        // Big celebration for 100% completion
                        const duration = 3000;
                        const end = Date.now() + duration;
                        
                        const colors = ['#f59e0b', '#fbbf24', '#10b981', '#8b5cf6', '#ef4444'];
                        
                        (function frame() {
                            confetti({
                                particleCount: 5,
                                angle: 60,
                                spread: 55,
                                origin: { x: 0 },
                                colors: colors
                            });
                            confetti({
                                particleCount: 5,
                                angle: 120,
                                spread: 55,
                                origin: { x: 1 },
                                colors: colors
                            });
                            
                            if (Date.now() < end) {
                                requestAnimationFrame(frame);
                            }
                        })();
                    } else {
                        // Small burst for single goal completion
                        confetti({
                            particleCount: 50,
                            spread: 60,
                            origin: { x: originX, y: originY },
                            colors: ['#10b981', '#fbbf24', '#8b5cf6'],
                            ticks: 100,
                            gravity: 1.2,
                            scalar: 0.9
                        });
                    }
                } catch (e) {
                    // Silently fail if confetti doesn't work
                }
            }, []);

            // Haptic feedback
            const triggerHaptic = useCallback((type = 'medium') => {
                try {
                    if (window.Telegram?.WebApp?.HapticFeedback?.impactOccurred) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
                    }
                } catch (e) {
                    // Silently fail
                }
            }, []);

            // Enhanced toggle with gamification effects
            const toggleLifeGoalWithEffects = useCallback((id, event) => {
                const goal = (lifeGoals || []).find(g => g.id === id);
                if (!goal) return;

                const willBeDone = !goal.done;

                // Calculate if this will complete ALL goals
                const newDoneCount = willBeDone ? doneCount + 1 : doneCount - 1;
                const willBeAllComplete = totalCount > 0 && newDoneCount === totalCount;

                // Haptic feedback
                triggerHaptic(willBeDone ? 'medium' : 'light');

                // If marking as done
                if (willBeDone) {
                    // Play sound
                    playCompleteSound();

                    // +XP за выполнение цели (единый XP кошелёк, общий с привычками)
                    addUserXp(XP_PER_GOAL);
                } else {
                    // Если снимаем галочку — возвращаем XP обратно
                    addUserXp(-XP_PER_GOAL);
                }

                // If marking as done
                if (willBeDone) {

                    // Get click position for confetti origin
                    let originX = 0.5;
                    let originY = 0.5;
                    if (event) {
                        const rect = event.currentTarget?.getBoundingClientRect?.();
                        if (rect) {
                            originX = (rect.left + rect.width / 2) / window.innerWidth;
                            originY = (rect.top + rect.height / 2) / window.innerHeight;
                        }
                    }

                    // Fire confetti
                    setTimeout(() => {
                        fireConfetti(originX, originY, false);

                        // If all goals complete, fire big celebration after small one
                        if (willBeAllComplete) {
                            setTimeout(() => {
                                triggerHaptic('heavy');
                                fireConfetti(0.5, 0.5, true);

                                // Авто-архивация через 1.5 секунды после большого конфетти
                                setTimeout(() => {
                                    handleStageClear();
                                }, 1500);
                            }, 300);
                        }
                    }, 100);
                }

                // Update state
                setLifeGoals((lifeGoals || []).map(g => g.id === id ? { ...g, done: willBeDone } : g));
            }, [lifeGoals, doneCount, totalCount, triggerHaptic, playCompleteSound, fireConfetti, addUserXp, handleStageClear]);

            // Дни рождения (вернули функционал на Главную)
            const [birthdays, setBirthdays] = useLocalStorage('lifehub_birthdays', []);
            const [bills] = useLocalStorage('lifehub_bills', []);

            const [isBirthdaysManagerOpen, setBirthdaysManagerOpen] = useState(false);
            const [isBirthdayModalOpen, setBirthdayModalOpen] = useState(false);
            const [editingBirthday, setEditingBirthday] = useState(null);
            const [birthdayForm, setBirthdayForm] = useState({
                name: '',
                day: today0.getDate(),
                month: today0.getMonth() + 1,
                year: '',
                note: ''
            });

            // safeDate как function (хойстится), чтобы использовать выше по коду
            function safeDate(year, monthIndex, day) {
                const d = new Date(year, monthIndex, day);
                if (d.getMonth() !== monthIndex) return new Date(year, monthIndex + 1, 0);
                return d;
            }

            // Полноэкранный менеджер календаря ДР (внутри Главной)
            const [bdViewMonth, setBdViewMonth] = useState(() => new Date(today0.getFullYear(), today0.getMonth(), 1));
            const [bdSelectedDate, setBdSelectedDate] = useState(() => today0);

            const birthdaysMarkersByDay = useMemo(() => {
                const map = {};
                const m = bdViewMonth.getMonth() + 1;
                const y = bdViewMonth.getFullYear();
                (birthdays || []).forEach(b => {
                    if (Number(b.month) !== m) return;
                    const d = safeDate(y, m - 1, Number(b.day) || 1);
                    const day = d.getDate();
                    map[day] = (map[day] || 0) + 1;
                });
                return map;
            }, [birthdays, bdViewMonth]);

            const birthdaysForSelectedManagerDay = useMemo(() => {
                const d = bdSelectedDate.getDate();
                const m = bdSelectedDate.getMonth() + 1;
                return (birthdays || []).filter(b => Number(b.day) === d && Number(b.month) === m);
            }, [birthdays, bdSelectedDate]);

            const openAddBirthday = (presetDate = today0) => {
                const d = presetDate || today0;
                setEditingBirthday(null);
                setBirthdayForm({ name: '', day: d.getDate(), month: d.getMonth() + 1, year: '', note: '' });
                setBirthdayModalOpen(true);
            };

            const openEditBirthday = (b) => {
                setEditingBirthday(b);
                setBirthdayForm({
                    name: b?.name || '',
                    day: Number(b?.day) || today0.getDate(),
                    month: Number(b?.month) || (today0.getMonth() + 1),
                    year: b?.year ? String(b.year) : '',
                    note: b?.note || ''
                });
                setBirthdayModalOpen(true);
            };

            const saveBirthday = () => {
                const name = String(birthdayForm.name || '').trim();
                if (!name) return;
                const payload = {
                    name,
                    day: Math.min(31, Math.max(1, Number(birthdayForm.day) || 1)),
                    month: Math.min(12, Math.max(1, Number(birthdayForm.month) || 1)),
                    year: birthdayForm.year ? Number(birthdayForm.year) : null,
                    note: String(birthdayForm.note || '').trim(),
                };

                if (editingBirthday?.id) {
                    setBirthdays((birthdays || []).map(x => x.id === editingBirthday.id ? { ...x, ...payload } : x));
                } else {
                    setBirthdays([{ id: String(Date.now()), ...payload, createdAt: Date.now() }, ...(birthdays || [])]);
                }
                setBirthdayModalOpen(false);
            };

            const deleteBirthday = () => {
                if (!editingBirthday?.id) return;
                setBirthdays((birthdays || []).filter(x => x.id !== editingBirthday.id));
                setBirthdayModalOpen(false);
            };

            // (safeDate определён выше как function safeDate())

            const upcomingBirthdays = useMemo(() => {
                if (!birthdays || birthdays.length === 0) return [];
                const year = today0.getFullYear();
                const candidates = birthdays
                    .map(b => ({ b, occ: safeDate(year, b.month - 1, b.day) }))
                    .filter(x => x.occ >= today0)
                    .sort((a, b) => a.occ.getTime() - b.occ.getTime());
                return candidates.slice(0, 3);
            }, [birthdays]);

            const nearestBirthday = upcomingBirthdays[0] || null;

            const upcomingPayments = useMemo(() => {
                if (!bills || bills.length === 0) return [];

                const now = today0;
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth();

                // Корректируем 30/31 для коротких месяцев (например февраль)
                const getAdjustedDay = (dayOfMonth, year, month) => {
                    const dim = new Date(year, month + 1, 0).getDate();
                    return Math.min(Number(dayOfMonth) || 1, dim);
                };

                const nextOccurrence = (dayOfMonth) => {
                    const adjustedDay = getAdjustedDay(dayOfMonth, currentYear, currentMonth);
                    const candidate = startOfDay(new Date(currentYear, currentMonth, adjustedDay));
                    if (candidate >= now) return candidate;
                    const nextAdjusted = getAdjustedDay(dayOfMonth, currentYear, currentMonth + 1);
                    return startOfDay(new Date(currentYear, currentMonth + 1, nextAdjusted));
                };

                return (bills || [])
                    .filter(b => !b.paid)
                    .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                    .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());
            }, [bills, today0]);

            const nearestPayment = upcomingPayments[0] || null;
            const topPayments = (upcomingPayments || []).slice(0, 3);

            return (
                <div className="space-y-6 animate-fadeIn">
                    {/* Greeting & Summary Widget */}
                    <section className="mt-2 relative rounded-3xl p-6 overflow-hidden bg-gradient-to-br from-[#1e3a8a] via-[#0b1228] to-[#09090b] shadow-[0_0_0_1px_rgba(255,255,255,0.08),0_20px_60px_rgba(30,58,138,0.35)] edge-to-edge-bg">
                        {/* glow blobs */}
                        <div className="pointer-events-none absolute -top-20 -left-24 h-56 w-56 rounded-full blur-3xl" style={{ background: 'rgba(59,130,246,0.35)' }} />
                        <div className="pointer-events-none absolute -bottom-24 -right-24 h-64 w-64 rounded-full blur-3xl" style={{ background: 'rgba(217,249,157,0.12)' }} />

                        <div className="relative">
                            <div className="flex items-start justify-between gap-4">
                                <div className="min-w-0">
                                    {!isEditingGreeting ? (
                                        <h1 className="text-white text-2xl sm:text-3xl font-extrabold tracking-tight truncate">
                                            {customGreeting}
                                        </h1>
                                    ) : (
                                        <input
                                            value={greetingDraft}
                                            onChange={(e) => setGreetingDraft(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') {
                                                    const next = (greetingDraft || '').trim();
                                                    setCustomGreeting(next || `${timeGreeting}! 👋`);
                                                    setIsEditingGreeting(false);
                                                }
                                                if (e.key === 'Escape') {
                                                    setIsEditingGreeting(false);
                                                    setGreetingDraft(customGreeting);
                                                }
                                            }}
                                            onBlur={() => {
                                                const next = (greetingDraft || '').trim();
                                                setCustomGreeting(next || `${timeGreeting}! 👋`);
                                                setIsEditingGreeting(false);
                                            }}
                                            className="mt-1 w-full bg-white/10 border border-white/10 backdrop-blur-md rounded-2xl px-4 py-3 font-extrabold text-white outline-none placeholder:text-white/40"
                                            placeholder="..."
                                            autoFocus
                                        />
                                    )}
                                </div>

                                <div className="flex items-center gap-2 shrink-0">
                                    {/* Edit */}
                                    <PressableScale
                                        onClick={() => { setGreetingDraft(customGreeting); setIsEditingGreeting(true); }}
                                        className="rounded-full p-2.5 bg-white/10 border border-white/10 backdrop-blur-md text-white/80 hover:text-white hover:bg-white/15 transition-colors"
                                        title="Редактировать"
                                    >
                                        <Icons.Pencil className="w-5 h-5" />
                                    </PressableScale>
                                </div>
                            </div>

                            {/* Inner data container */}
                            <div className="mt-5 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm p-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="min-w-0">
                                        <div className="text-[10px] font-black uppercase tracking-widest text-blue-200/80">СЛЕДУЮЩИЙ ПЛАТЁЖ</div>
                                        <div className="mt-1 text-white text-xl sm:text-2xl font-extrabold tracking-tight truncate tabular-nums">
                                            {nearestPayment ? `${Number(nearestPayment.amount || 0).toLocaleString('ru-RU')} ₽` : '—'}
                                        </div>
                                        <div className="mt-1 text-xs font-bold text-white/55 truncate">
                                            {nearestPayment ? nearestPayment.nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : 'Нет неоплаченных'}
                                        </div>
                                    </div>

                                    <div className="min-w-0 text-right">
                                        <div className="text-[10px] font-black uppercase tracking-widest text-blue-200/80">БЛИЖАЙШЕЕ СОБЫТИЕ</div>
                                        <div className="mt-1 text-white text-xl sm:text-2xl font-extrabold tracking-tight truncate">
                                            {nearestMeeting ? nearestMeeting.title : '—'}
                                        </div>
                                        <div className="mt-1 text-xs font-bold text-white/55 truncate">
                                            {nearestMeeting ? (() => {
                                                const d = nearestMeeting.dateKey ? parseDateKey(nearestMeeting.dateKey) : null;
                                                const dateStr = d ? d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : '';
                                                const timeStr = nearestMeeting.time ? ` • ${nearestMeeting.time}` : '';
                                                return `${dateStr}${timeStr}`.trim() || '—';
                                            })() : 'Нет встреч'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Ближайшие платежи (скролл: видно 3, можно листать дальше) */}
                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">Ближайшие платежи</h2>
                            <span className="text-[11px] font-black uppercase tracking-widest text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                                {(upcomingPayments || []).length}
                            </span>
                        </div>

                        {(upcomingPayments || []).length > 0 ? (
                            <div className="relative">
                                <div className="overflow-y-auto scrollbar-hide space-y-3 pr-1" style={{ maxHeight: '264px' }}>
                                    {(upcomingPayments || []).map((p) => {
                                        const daysLeft = Math.max(0, Math.round((startOfDay(p.nextDate).getTime() - startOfDay(today0).getTime()) / 86400000));
                                        const badge = daysLeft === 0
                                            ? 'bg-rose-50 text-rose-600'
                                            : daysLeft <= 3
                                                ? 'bg-amber-50 text-amber-700'
                                                : daysLeft <= 7
                                                    ? 'bg-violet-50 text-violet-700'
                                                    : 'bg-slate-50 text-slate-500';

                                        return (
                                            <BentoCard key={p.id} className="!p-4 flex gap-4 items-center">
                                                <div className="w-10 h-10 rounded-2xl bg-violet-50 flex items-center justify-center text-violet-600">
                                                    <Icons.Landmark className="w-5 h-5" />
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center justify-between gap-3">
                                                        <h3 className="font-bold text-slate-800 truncate">{p.title}</h3>
                                                        <span className={`text-xs font-black px-2.5 py-1 rounded-full ${badge}`}>
                                                            {daysLeft === 0 ? 'Сегодня' : `через ${daysLeft} дн.`}
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center justify-between mt-1">
                                                        <p className="text-xs text-slate-400 font-medium">
                                                            {p.nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
                                                        </p>
                                                        <p className="text-sm font-extrabold text-slate-700">{Number(p.amount || 0).toLocaleString('ru-RU')} ₽</p>
                                                    </div>
                                                </div>
                                            </BentoCard>
                                        );
                                    })}
                                </div>

                                {(upcomingPayments || []).length > 3 && (
                                    <>
                                        <div className="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white dark:from-slate-950 to-transparent pointer-events-none rounded-b-2xl" />
                                        <p className="text-xs text-slate-400 text-center mt-2 font-medium">
                                            Прокрутите, чтобы увидеть все {(upcomingPayments || []).length} платежей
                                        </p>
                                    </>
                                )}
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-28 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                <Icons.Landmark className="w-10 h-10 mb-2 opacity-50" />
                                <p className="text-sm font-medium">Нет ближайших платежей</p>
                            </div>
                        )}
                    </section>

                    {/* Важные встречи (3 ближайших + скролл) */}
                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">Важные встречи</h2>
                            <PressableScale
                                onClick={() => {
                                    setMeetingsSelectedDate(today0);
                                    setMeetingsViewMonth(new Date(today0.getFullYear(), today0.getMonth(), 1));
                                    setMeetingsManagerOpen(true);
                                }}
                                className="bg-sky-500 text-white shadow-lg px-4 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-2"
                                title="Открыть календарь встреч и добавить"
                            >
                                <Icons.Calendar className="w-4 h-4" />
                                <span>Календарь</span>
                                <span className="w-px h-4 bg-white/30" />
                                <Icons.Plus className="w-4 h-4" />
                            </PressableScale>
                        </div>

                        {(upcomingMeetings || []).length > 0 ? (
                            <div className="relative">
                                <div className="overflow-y-auto scrollbar-hide space-y-3 pr-1" style={{ maxHeight: '264px' }}>
                                    {(upcomingMeetings || []).map((m) => {
                                        const md = m.dateKey ? parseDateKey(m.dateKey) : null;
                                        const daysLeft = md ? Math.max(0, Math.round((startOfDay(md).getTime() - startOfDay(today0).getTime()) / 86400000)) : null;
                                        const badge = daysLeft === 0
                                            ? 'bg-rose-50 text-rose-600'
                                            : (daysLeft !== null && daysLeft <= 3)
                                                ? 'bg-amber-50 text-amber-700'
                                                : (daysLeft !== null && daysLeft <= 7)
                                                    ? 'bg-sky-50 text-sky-700'
                                                    : 'bg-slate-50 text-slate-500';

                                        return (
                                            <PressableScale key={m.id} onClick={() => openEditMeeting(m)} className="w-full">
                                                <BentoCard className="!p-4 flex gap-4 items-center">
                                                    <div className="w-10 h-10 rounded-2xl bg-sky-50 flex items-center justify-center text-sky-600">
                                                        <Icons.Calendar className="w-5 h-5" />
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-3">
                                                            <h3 className="font-bold text-slate-800 truncate">{m.title}</h3>
                                                            <span className={`text-xs font-black px-2.5 py-1 rounded-full ${badge}`}>
                                                                {daysLeft === 0 ? 'Сегодня' : (daysLeft !== null ? `через ${daysLeft} дн.` : '—')}
                                                            </span>
                                                        </div>
                                                        <p className="text-xs text-slate-400 mt-1 truncate">
                                                            {md ? md.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : ''}
                                                            {m.time ? ` • ${m.time}` : ''}
                                                            {m.note ? ` • ${m.note}` : ''}
                                                        </p>
                                                    </div>
                                                    <Icons.ChevronRight className="w-5 h-5 text-slate-300 shrink-0" />
                                                </BentoCard>
                                            </PressableScale>
                                        );
                                    })}
                                </div>

                                {(upcomingMeetings || []).length > 3 && (
                                    <>
                                        <div className="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white dark:from-slate-950 to-transparent pointer-events-none rounded-b-2xl" />
                                        <p className="text-xs text-slate-400 text-center mt-2 font-medium">
                                            Прокрутите, чтобы увидеть все {(upcomingMeetings || []).length} встречи
                                        </p>
                                    </>
                                )}
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-28 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                <Icons.Calendar className="w-10 h-10 mb-2 opacity-50" />
                                <p className="text-sm font-medium">Нет ближайших встреч</p>
                            </div>
                        )}
                    </section>

                    {/* Ближайшие дни рождения */}
                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">Ближайшие дни рождения</h2>
                            {/* Объединённая кнопка "Календарь +" */}
                            <PressableScale
                                onClick={() => {
                                    setBdSelectedDate(today0);
                                    setBdViewMonth(new Date(today0.getFullYear(), today0.getMonth(), 1));
                                    setBirthdaysManagerOpen(true);
                                }}
                                className="bg-violet-500 text-white shadow-lg px-4 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-2"
                                title="Открыть календарь и добавить"
                            >
                                <Icons.Calendar className="w-4 h-4" />
                                <span>Календарь</span>
                                <span className="w-px h-4 bg-white/30" />
                                <Icons.Plus className="w-4 h-4" />
                            </PressableScale>
                        </div>

                        <div className="space-y-3">
                            {upcomingBirthdays.length > 0 ? upcomingBirthdays.map(({ b, occ }) => {
                                const daysLeft = Math.max(0, Math.round((startOfDay(occ).getTime() - startOfDay(today0).getTime()) / 86400000));
                                const badge = daysLeft === 0
                                    ? 'bg-rose-50 text-rose-600'
                                    : daysLeft <= 7
                                        ? 'bg-amber-50 text-amber-700'
                                        : daysLeft <= 31
                                            ? 'bg-emerald-50 text-emerald-700'
                                            : 'bg-slate-50 text-slate-500';

                                return (
                                    <PressableScale
                                        key={b.id}
                                        onClick={() => openEditBirthday(b)}
                                        className="w-full"
                                    >
                                        <BentoCard className="!p-4 flex gap-4 items-center">
                                            <div className="w-10 h-10 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-600">
                                                <Icons.Gift className="w-5 h-5" />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center justify-between gap-3">
                                                    <h3 className="font-bold text-slate-800 truncate">{b.name}</h3>
                                                    <span className={`text-xs font-black px-2.5 py-1 rounded-full ${badge}`}>
                                                        {daysLeft === 0 ? 'Сегодня' : `через ${daysLeft} дн.`}
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-400 mt-1">
                                                    {occ.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
                                                    {b.year ? ` • исполнится ${today0.getFullYear() - b.year}` : ''}
                                                </p>
                                            </div>
                                            <Icons.ChevronRight className="w-5 h-5 text-slate-300 shrink-0" />
                                        </BentoCard>
                                    </PressableScale>
                                );
                            }) : (
                                <div className="flex flex-col items-center justify-center h-32 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                    <Icons.Gift className="w-10 h-10 mb-2 opacity-50" />
                                    <p className="text-sm font-medium">Нет ближайших дат</p>
                                </div>
                            )}
                        </div>

                        <p className="text-xs text-slate-400 mt-2 font-medium">Совет: нажмите «Календарь», чтобы увидеть все даты.</p>
                    </section>

                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">Достижения / Цели</h2>
                            <div className="flex items-center gap-2">
                                {/* Кнопка архива */}
                                <PressableScale
                                    onClick={() => setShowArchiveModal(true)}
                                    className="bg-slate-100 p-2.5 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-200"
                                    title="История достижений"
                                >
                                    <Icons.Clock className="w-4 h-4" />
                                </PressableScale>
                                {/* Кнопка добавить */}
                                <PressableScale
                                    onClick={openAddLifeGoal}
                                    className="bg-slate-900 p-2.5 rounded-xl text-white shadow-sm"
                                    title="Добавить цель"
                                >
                                    <Icons.Plus className="w-4 h-4" />
                                </PressableScale>
                            </div>
                        </div>
                        <BentoCard className={`!p-4 ${isAllComplete ? 'celebrate' : ''}`}>
                            {/* Level & XP header */}
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center gap-3">
                                    {/* Level badge */}
                                    <div className="bg-gradient-to-br from-amber-400 to-amber-500 text-white px-3 py-1.5 rounded-xl shadow-lg shadow-amber-200">
                                        <span className="text-xs font-black">Lvl {goalsLevel}</span>
                                    </div>
                                    <div>
                                        <p className={THEME.label}>Прогресс целей</p>
                                        <p className="text-lg font-extrabold text-slate-800">{doneCount} / {totalCount}</p>
                                    </div>
                                </div>
                                <div className={`text-xs font-black px-2.5 py-1 rounded-full ${isAllComplete ? 'bg-amber-100 text-amber-700' : 'bg-slate-50 text-slate-500'}`}>
                                    {progressPercent}%
                                </div>
                            </div>
                            
                            {/* XP progress bar */}
                            <div className="mb-3 bg-slate-50 rounded-2xl p-3 border border-slate-100">
                                <div className="flex items-center justify-between mb-1.5">
                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Опыт (XP)</span>
                                    <span className="text-xs font-bold text-amber-600">{xpForCurrentLevel} / {XP_PER_LEVEL}</span>
                                </div>
                                <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full rounded-full bg-gradient-to-r from-amber-400 to-amber-500 progress-bar-animated"
                                        style={{ width: `${xpProgress}%` }}
                                    />
                                </div>
                                <p className="text-[10px] text-slate-400 mt-1.5">+{XP_PER_GOAL} XP за каждую выполненную цель</p>
                            </div>
                            
                            {/* Goals progress bar */}
                            {totalCount > 0 && (
                                <div className="mb-4">
                                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                        <div 
                                            className={`h-full rounded-full progress-bar-animated ${isAllComplete ? 'progress-bar-complete' : 'bg-emerald-400'}`}
                                            style={{ width: `${progressPercent}%` }}
                                        />
                                    </div>
                                    {isAllComplete && (
                                        <p className="text-xs font-bold text-amber-600 mt-2 text-center animate-fadeIn">
                                            🎉 Все цели выполнены! Архивируем...
                                        </p>
                                    )}
                                </div>
                            )}

                            {/* Goals list - sorted: active first, completed last */}
                            <div className="space-y-2">
                                {sortedLifeGoals.length > 0 ? sortedLifeGoals.map(g => (
                                    <div 
                                        key={g.id} 
                                        className={`goal-item flex items-center justify-between gap-3 py-2 ${g.done ? 'completed' : ''}`}
                                    >
                                        <button
                                            onClick={(e) => toggleLifeGoalWithEffects(g.id, e)}
                                            className="flex items-center gap-3 text-left flex-1"
                                        >
                                            <div className={`w-9 h-9 rounded-2xl flex items-center justify-center transition-all duration-300 ${g.done ? 'bg-emerald-100 text-emerald-600 scale-110' : 'bg-slate-100 text-slate-400'}`}>
                                                {g.done ? <Icons.CheckCircle className="w-5 h-5" /> : <Icons.Circle className="w-5 h-5" />}
                                            </div>
                                            <div>
                                                <p className={`font-bold transition-all duration-300 ${g.done ? 'text-slate-400 line-through' : 'text-slate-800'}`}>{g.title}</p>
                                                <p className="text-xs text-slate-400">
                                                    {g.done ? '✓ Выполнено' : 'Нажмите, чтобы отметить'}
                                                </p>
                                            </div>
                                        </button>
                                        <div className="flex items-center gap-2">
                                            <PressableScale onClick={() => openEditLifeGoal(g)} className="p-2 rounded-xl bg-slate-50 text-slate-400 hover:text-slate-700">
                                                <Icons.Pencil className="w-4 h-4" />
                                            </PressableScale>
                                        </div>
                                    </div>
                                )) : (
                                    <div className="py-6 text-center text-slate-300">
                                        <Icons.Target className="w-10 h-10 mx-auto opacity-40" />
                                    </div>
                                )}
                            </div>

                            {/* Habit Tracker встроен в тот же блок (общие XP/уровень) */}
                            <div className="mt-6 pt-5 border-t border-slate-100">
                                <div className="flex items-start justify-between gap-3 mb-3">
                                    <div className="min-w-0">
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">Трекер привычек</span>
                                            <span className="text-[10px] font-black text-slate-300">•</span>
                                            <span className="text-[10px] font-black text-slate-400">{(habitsVM || []).length} шт.</span>
                                        </div>
                                        <p className="text-xs text-slate-400 font-medium mt-1">Майнинг XP за воздержание</p>
                                    </div>
                                    <PressableScale
                                        onClick={() => { setHabitForm({ title: '', icon: '⚡️' }); setHabitModalOpen(true); }}
                                        className="bg-slate-900 p-2.5 rounded-xl text-white shadow-sm shrink-0"
                                        title="Добавить привычку"
                                    >
                                        <Icons.Plus className="w-4 h-4" />
                                    </PressableScale>
                                </div>

                                {habitsLoading ? (
                                    <div className="py-6 text-center text-slate-300">
                                        <Icons.Loader className="w-8 h-8 mx-auto mb-3 opacity-60" />
                                        <p className="text-sm font-medium">Загрузка привычек...</p>
                                    </div>
                                ) : habitsError ? (
                                    <div className="bg-rose-50 border border-rose-100 rounded-2xl p-4 text-rose-700">
                                        <p className="font-extrabold text-sm">Ошибка привычек</p>
                                        <p className="text-xs font-medium mt-1">{habitsError}</p>
                                        <button
                                            onClick={loadHabits}
                                            className="mt-3 text-xs font-black px-3 py-2 rounded-xl bg-white/70 border border-rose-100"
                                        >
                                            Повторить
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {habitsVM.length > 0 ? habitsVM.map(h => (
                                            <div key={h.id} className="bg-slate-50 border border-slate-100 rounded-3xl p-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-2xl bg-white border border-slate-100 flex items-center justify-center text-2xl shadow-sm shrink-0">
                                                        {h.icon || '⚡️'}
                                                    </div>

                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-start justify-between gap-3">
                                                            <div className="min-w-0">
                                                                <p className="font-extrabold text-slate-800 truncate">{h.title}</p>
                                                                <p className="text-xs text-slate-400 font-bold mt-1">
                                                                    {h._timer} • +{Number(h._pendingXp).toLocaleString('ru-RU')} XP
                                                                </p>
                                                            </div>

                                                            <div className="flex items-center gap-2 shrink-0">
                                                                <button
                                                                    onClick={() => relapseHabit(h.id)}
                                                                    disabled={habitBusyId === h.id}
                                                                    className="px-3 py-2 rounded-2xl bg-amber-50 text-amber-700 text-xs font-black border border-amber-100 hover:bg-amber-100 disabled:opacity-50"
                                                                    title="Срыв (штраф -1000 XP)"
                                                                >
                                                                    Срыв
                                                                </button>
                                                                <button
                                                                    onClick={() => deleteHabit(h.id)}
                                                                    disabled={habitBusyId === h.id}
                                                                    className="p-2.5 rounded-2xl bg-rose-50 text-rose-600 border border-rose-100 hover:bg-rose-100 disabled:opacity-50"
                                                                    title="Удалить привычку (аннулирует весь прогресс)"
                                                                >
                                                                    <Icons.Trash className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        </div>

                                                        <div className="mt-3">
                                                            <PressableScale
                                                                onClick={(e) => claimHabit(h.id, e)}
                                                                disabled={habitBusyId === h.id}
                                                                className="w-full"
                                                            >
                                                                <div className={`h-12 rounded-2xl flex items-center justify-center font-extrabold shadow-sm transition-all ${habitBusyId === h.id ? 'bg-slate-200 text-slate-500' : 'bg-emerald-500 text-white hover:bg-emerald-600'}`}>
                                                                    {habitBusyId === h.id ? '...' : 'Собрать'}
                                                                </div>
                                                            </PressableScale>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )) : (
                                            <div className="py-8 text-center text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                <div className="text-4xl mb-2">⛏️</div>
                                                <p className="text-sm font-medium">Добавьте привычку</p>
                                                <p className="text-xs mt-1">Например: «Не курить», «Не есть сладкое»</p>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </BentoCard>
                    </section>

                    {/* Habit modal: create */}
                    {isHabitModalOpen && (
                        <div className="fixed inset-0 z-[150] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setHabitModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp max-h-[90vh] overflow-y-auto scrollbar-hide">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">Новая привычка</h2>
                                    <button onClick={() => setHabitModalOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-400" title="Закрыть">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Иконка</label>
                                        <div className="flex flex-wrap gap-2">
                                            {HABIT_ICONS.map(ic => {
                                                const selected = habitForm.icon === ic;
                                                return (
                                                    <button
                                                        key={ic}
                                                        onClick={() => setHabitForm(prev => ({ ...prev, icon: ic }))}
                                                        className={`w-12 h-12 rounded-2xl border flex items-center justify-center text-2xl transition-all ${selected ? 'bg-violet-50 border-violet-200 ring-2 ring-violet-200' : 'bg-slate-50 border-slate-100 hover:bg-slate-100'}`}
                                                        title={ic}
                                                    >
                                                        {ic}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={habitForm.title}
                                            onChange={(e) => setHabitForm(prev => ({ ...prev, title: e.target.value }))}
                                            placeholder="Напр: Не курить"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="text-xs text-slate-400 font-medium bg-slate-50 border border-slate-100 rounded-2xl p-4">
                                        Награда копится с момента последнего сбора. Чем дольше держитесь — тем больше XP нужно собрать.
                                    </div>
                                </div>

                                <PressableScale onClick={createHabit} className="w-full pt-1" disabled={habitBusyId === 'new'}>
                                    <div className={`h-14 rounded-3xl flex items-center justify-center shadow-xl ${habitBusyId === 'new' ? 'bg-slate-200 text-slate-500' : 'bg-slate-900 text-white'}`}>
                                        <span className="font-bold text-lg">Создать</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}

                    {/* Habit Toast */}
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[220] w-[92vw] max-w-md px-4">
                            <div className={`toast-in rounded-2xl border shadow-lg px-4 py-3 bg-white ${toast.tone === 'error' ? 'border-rose-100' : toast.tone === 'success' ? 'border-emerald-100' : 'border-slate-100'}`}>
                                <div className="flex items-start justify-between gap-3">
                                    <div className="min-w-0">
                                        <div className={`text-sm font-extrabold ${toast.tone === 'error' ? 'text-rose-700' : toast.tone === 'success' ? 'text-emerald-700' : 'text-slate-800'}`}>{toast.title}</div>
                                        {toast.message ? <div className="text-xs text-slate-500 font-medium mt-0.5">{toast.message}</div> : null}
                                    </div>
                                    <button onClick={() => setToast(null)} className="p-2 rounded-xl bg-slate-50 text-slate-400" title="Закрыть">
                                        <Icons.X className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Habit XP particles */}
                    {xpParticles.map(p => (
                        <div
                            key={p.id}
                            className="xp-fly text-emerald-600 font-black"
                            style={{ left: p.x - 20, top: p.y - 10 }}
                        >
                            {p.text}
                        </div>
                    ))}

                    {/* Менеджер календаря встреч (поверх главной) */}
                    {isMeetingsManagerOpen && (
                        <div className="modal-overlay flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setMeetingsManagerOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative animate-slideUp flex flex-col overflow-hidden" style={{ height: '90vh' }}>
                                <div className="flex justify-between items-center p-5 pb-2 bg-white shrink-0">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900">Важные встречи</h2>
                                        <p className="text-slate-500 text-sm">Календарь и список на дату</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <PressableScale
                                            onClick={() => openAddMeeting(meetingsSelectedDate)}
                                            className="bg-sky-500 p-2.5 rounded-xl text-white shadow-lg"
                                            title="Добавить"
                                        >
                                            <Icons.Plus className="w-5 h-5" />
                                        </PressableScale>
                                        <button onClick={() => setMeetingsManagerOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-400" title="Закрыть">
                                            <Icons.X className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto px-5 pb-6 pt-2 scrollbar-hide">
                                    <MonthCalendar
                                        viewMonth={meetingsViewMonth}
                                        selectedDate={meetingsSelectedDate}
                                        onSelectDate={(d) => setMeetingsSelectedDate(startOfDay(d))}
                                        onPrevMonth={() => setMeetingsViewMonth(new Date(meetingsViewMonth.getFullYear(), meetingsViewMonth.getMonth() - 1, 1))}
                                        onNextMonth={() => setMeetingsViewMonth(new Date(meetingsViewMonth.getFullYear(), meetingsViewMonth.getMonth() + 1, 1))}
                                        selectedClassName="bg-sky-500 text-white shadow-lg"
                                        todayClassName="bg-sky-50 text-sky-700"
                                        renderMarkers={(day, selected) => {
                                            const count = meetingsMarkersByDay[day];
                                            if (!count) return null;
                                            return (
                                                <div className="absolute bottom-1.5 flex items-center gap-1">
                                                    <div className={`w-1.5 h-1.5 rounded-full ${selected ? 'bg-white' : 'bg-sky-400'}`} />
                                                    {count > 1 && (
                                                        <span className={`text-[9px] font-black ${selected ? 'text-white/90' : 'text-sky-600'}`}>+{count - 1}</span>
                                                    )}
                                                </div>
                                            );
                                        }}
                                    />

                                    <div className="mt-5">
                                        <SectionHeader
                                            title={meetingsSelectedDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                                            actionLabel="+"
                                            onAction={() => openAddMeeting(meetingsSelectedDate)}
                                        />

                                        <div className="space-y-3">
                                            {meetingsForSelectedDate.length > 0 ? meetingsForSelectedDate.map(m => (
                                                <PressableScale key={m.id} onClick={() => openEditMeeting(m)} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <div className="w-10 h-10 rounded-2xl bg-sky-50 flex items-center justify-center text-sky-600 shrink-0">
                                                            <Icons.Calendar className="w-5 h-5" />
                                                        </div>
                                                        <div className="min-w-0">
                                                            <p className="font-bold text-slate-800 truncate">{m.title}</p>
                                                            <p className="text-xs text-slate-400 truncate">
                                                                {m.time ? m.time : 'Без времени'}
                                                                {m.note ? ` • ${m.note}` : ''}
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <Icons.ChevronRight className="w-5 h-5 text-slate-300" />
                                                </PressableScale>
                                            )) : (
                                                <div className="flex flex-col items-center justify-center h-28 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                                    <Icons.Calendar className="w-10 h-10 mb-2 opacity-50" />
                                                    <p className="text-sm font-medium">Нет встреч на эту дату</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Модалка добавить/редактировать встречу */}
                    {isMeetingModalOpen && (
                        <div className="fixed inset-0 z-[150] flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setMeetingModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp max-h-[90vh] overflow-y-auto scrollbar-hide">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingMeeting ? 'Редактирование' : 'Новая встреча'}</h2>
                                    {editingMeeting && (
                                        <button onClick={deleteMeeting} className="bg-rose-50 p-3 rounded-full text-rose-500" title="Удалить">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="text-xs text-slate-400 font-bold bg-slate-50 px-3 py-2 rounded-2xl border border-slate-100">
