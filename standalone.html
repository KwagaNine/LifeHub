                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4">
                        <p className={THEME.label}>Запасы</p>
                        <h1 className="text-3xl font-extrabold text-slate-800 mt-1">Дом</h1>
                    </header>

                    {/* Control Panel */}
                    <div className="flex gap-3">
                        <PressableScale 
                            onClick={() => setShowShoppingList(!showShoppingList)}
                            className={`flex-1 py-3 px-4 rounded-2xl flex items-center justify-center gap-2 transition-all
                                ${showShoppingList ? 'bg-rose-500 text-white shadow-lg' : 'bg-white text-slate-700 border border-slate-100 shadow-sm'}
                            `}
                        >
                            <Icons.ShoppingCart className="w-5 h-5" />
                            <span className="font-bold">Список покупок</span>
                            {outOfStockCount > 0 && (
                                <span className={`ml-1 px-2 py-0.5 rounded-full text-xs font-bold
                                    ${showShoppingList ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-600'}
                                `}>
                                    {outOfStockCount}
                                </span>
                            )}
                        </PressableScale>

                        <PressableScale 
                            onClick={() => setAddOpen(true)}
                            className="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center shadow-lg text-white"
                        >
                            <Icons.Plus className="w-6 h-6" />
                        </PressableScale>
                    </div>

                    {/* Supplies List */}
                    <div className="space-y-3">
                        {showShoppingList && outOfStockCount > 0 && (
                            <BentoCard className="bg-gradient-to-br from-rose-50 to-rose-100/50 !p-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <div className="text-xs font-black uppercase tracking-widest text-rose-600">Итого на покупки</div>
                                        <div className="text-2xl font-extrabold text-rose-700 mt-1">{outOfStockTotal.toLocaleString('ru-RU')} ₽</div>
                                    </div>
                                    <div className="w-10 h-10 rounded-2xl bg-white/60 flex items-center justify-center text-rose-600">
                                        <Icons.ShoppingCart className="w-5 h-5" />
                                    </div>
                                </div>
                                <p className="text-sm text-rose-700/80 mt-2">Сумма считается по ценам товаров со статусом «Купить».</p>
                            </BentoCard>
                        )}
                    </div>

                    <div className="space-y-6">
                        {Object.entries(groupedSupplies).map(([category, items]) => {
                            const IconComponent = categoryIcons[category] || Icons.Package;
                            const colors = categoryColors[category] || categoryColors['Другое'];
                            
                            return (
                                <section key={category}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <div className={`p-1.5 rounded-lg ${colors.icon}`}>
                                            <IconComponent className={`w-4 h-4 ${colors.text}`} />
                                        </div>
                                        <h3 className="font-bold text-slate-700">{category}</h3>
                                        <span className="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{items.length}</span>
                                    </div>
                                    <div className="space-y-2">
                                        {items.map(item => {
                                            const ItemIcon = categoryIcons[item.category] || Icons.Package;
                                            const itemColors = categoryColors[item.category] || categoryColors['Другое'];
                                            
                                            return (
                                                <div 
                                                    key={item.id}
                                                    className={`p-4 rounded-2xl border flex items-center justify-between transition-all
                                                        ${item.inStock 
                                                            ? 'bg-white border-slate-100 shadow-sm' 
                                                            : 'bg-slate-50/50 border-slate-100'
                                                        }
                                                    `}
                                                    style={{ opacity: item.inStock ? 1 : 0.7 }}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <PressableScale 
                                                            onClick={() => toggleStock(item.id)}
                                                            className={`p-2.5 rounded-xl transition-all ${item.inStock ? itemColors.icon : 'bg-slate-100'}`}
                                                        >
                                                            <ItemIcon className={`w-5 h-5 ${item.inStock ? itemColors.text : 'text-slate-400'}`} />
                                                        </PressableScale>
                                                        <div>
                                                            <p className={`font-bold ${item.inStock ? 'text-slate-800' : 'text-slate-500'}`}>
                                                                {item.name}
                                                            </p>

                                                            <div className="flex items-center gap-2 mt-1">
                                                                {!item.inStock && (
                                                                    <span className="text-xs font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">
                                                                        Купить
                                                                    </span>
                                                                )}
                                                                {typeof item.price === 'number' && Number.isFinite(item.price) && (
                                                                    <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">
                                                                        {item.price.toLocaleString('ru-RU')} ₽
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        {item.inStock && (
                                                            <span className="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded-lg">
                                                                Есть
                                                            </span>
                                                        )}
                                                        <PressableScale 
                                                            onClick={() => deleteItem(item.id)}
                                                            className="p-2 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-colors"
                                                        >
                                                            <Icons.Trash className="w-4 h-4" />
                                                        </PressableScale>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            );
                        })}
                    </div>

                    {displayedSupplies.length === 0 && (
                        <div className="flex flex-col items-center justify-center h-60 text-slate-300">
                            {showShoppingList ? (
                                <>
                                    <Icons.CheckCircle className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Всё куплено!</p>
                                    <p className="text-sm">Список покупок пуст</p>
                                </>
                            ) : (
                                <>
                                    <Icons.Package className="w-16 h-16 mb-4 opacity-50" />
                                    <p className="font-medium">Нет товаров</p>
                                    <p className="text-sm">Добавьте первый товар</p>
                                </>
                            )}
                        </div>
                    )}

                    {/* Add Item Modal */}
                    {isAddOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setAddOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">Новый товар</h2>
                                <p className="text-sm text-slate-500">Можно указать цену — она попадёт в итог «Список покупок».</p>
                                    <button onClick={() => setAddOpen(false)} className="bg-slate-50 p-2 rounded-full text-slate-400">
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Название</label>
                                        <input
                                            value={newItem.name}
                                            onChange={e => setNewItem({ ...newItem, name: e.target.value })}
                                            placeholder="Напр: Яйца"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Цена (₽)</label>
                                        <input
                                            type="number"
                                            value={newItem.price}
                                            onChange={e => setNewItem({ ...newItem, price: e.target.value })}
                                            placeholder="Напр: 1000"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-mono text-xl font-bold text-slate-800 outline-none"
                                        />
                                    </div>

                                    <div className="space-y-2">
                                        <label className={THEME.label}>Категория</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {categories.map(cat => {
                                                const CatIcon = categoryIcons[cat];
                                                const colors = categoryColors[cat];
                                                const isSelected = newItem.category === cat;
                                                
                                                return (
                                                    <button
                                                        key={cat}
                                                        onClick={() => setNewItem({ ...newItem, category: cat })}
                                                        className={`p-4 rounded-2xl flex items-center gap-3 transition-all border-2
                                                            ${isSelected 
                                                                ? `${colors.bg} border-current ${colors.text}` 
                                                                : 'bg-slate-50 border-transparent text-slate-600'
                                                            }
                                                        `}
                                                    >
                                                        <div className={`p-2 rounded-xl ${isSelected ? colors.icon : 'bg-slate-100'}`}>
                                                            <CatIcon className={`w-5 h-5 ${isSelected ? colors.text : 'text-slate-400'}`} />
                                                        </div>
                                                        <span className="font-bold">{cat}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={handleAdd} className="w-full pt-2">
                                    <div className="bg-sky-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Добавить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Statistics Tab (бывшая "Главная") ---
        const StatisticsTab = () => {
            const [totalBalance] = useLocalStorage('lifehub_balance', 125000);
            const [transactions] = useLocalStorage('lifehub_transactions', []);
            const [bills] = useLocalStorage('lifehub_bills', []);
            const [monthLimit] = useLocalStorage('lifehub_limit', 60000);
            const [categoryLimits] = useLocalStorage('lifehub_category_limits', {});

            const today = new Date();
            const today0 = startOfDay(today);

            const nearestCreditPayment = useMemo(() => {
                if (!bills || bills.length === 0) return null;

                const currentYear = today0.getFullYear();
                const currentMonth = today0.getMonth();

                const nextOccurrence = (dayOfMonth) => {
                    const d1 = new Date(currentYear, currentMonth, dayOfMonth);
                    const candidate = startOfDay(d1);
                    if (candidate >= today0) return candidate;
                    return startOfDay(new Date(currentYear, currentMonth + 1, dayOfMonth));
                };

                const candidates = bills
                    .filter(b => !b.paid)
                    .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                    .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());

                return candidates[0] || null;
            }, [bills]);

            // --- Analytics ---
            const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
            const currentMonthKey = monthKey(today0);
            const prevMonthDate = new Date(today0.getFullYear(), today0.getMonth() - 1, 1);
            const prevMonthKey = monthKey(prevMonthDate);

            const txMonthKey = (t) => {
                if (t.dateKey) return String(t.dateKey).slice(0, 7);
                if (t.createdAt) return monthKey(startOfDay(new Date(t.createdAt)));
                return currentMonthKey;
            };

            const expensesCurrentMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, currentMonthKey]);

            const expensesPrevMonth = useMemo(() => {
                return (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === prevMonthKey)
                    .reduce((acc, t) => acc + Number(t.amount || 0), 0);
            }, [transactions, prevMonthKey]);

            const spentProgress = useMemo(() => {
                if (!monthLimit) return 0;
                return Math.min(100, Math.round((expensesCurrentMonth / Number(monthLimit)) * 100));
            }, [expensesCurrentMonth, monthLimit]);

            const expensesByCategory = useMemo(() => {
                const stats = {};
                (transactions || [])
                    .filter(t => t.type === 'expense' && txMonthKey(t) === currentMonthKey)
                    .forEach(t => {
                        const c = t.category || 'Разное';
                        stats[c] = (stats[c] || 0) + Number(t.amount || 0);
                    });
                return Object.entries(stats)
                    .map(([name, amount]) => ({ name, amount }))
                    .sort((a, b) => b.amount - a.amount);
            }, [transactions, currentMonthKey]);

            const pieData = useMemo(() => {
                const total = expensesByCategory.reduce((acc, x) => acc + x.amount, 0);
                const palette = ['#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#0ea5e9', '#64748b', '#22c55e', '#a855f7'];

                let accAngle = 0;
                const arcs = expensesByCategory.map((x, i) => {
                    const frac = total > 0 ? x.amount / total : 0;
                    const start = accAngle;
                    const end = accAngle + frac * 360;
                    accAngle = end;
                    return { ...x, frac, start, end, color: palette[i % palette.length] };
                });

                return { total, arcs };
            }, [expensesByCategory]);

            const polarToCartesian = (cx, cy, r, angleDeg) => {
                const a = (angleDeg - 90) * Math.PI / 180.0;
                return { x: cx + (r * Math.cos(a)), y: cy + (r * Math.sin(a)) };
            };

            const describeArc = (cx, cy, r, startAngle, endAngle) => {
                const start = polarToCartesian(cx, cy, r, endAngle);
                const end = polarToCartesian(cx, cy, r, startAngle);
                const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
                return [
                    'M', start.x, start.y,
                    'A', r, r, 0, largeArcFlag, 0, end.x, end.y,
                    'L', cx, cy,
                    'Z'
                ].join(' ');
            };

            const compare = useMemo(() => {
                const diff = expensesCurrentMonth - expensesPrevMonth;
                const pct = expensesPrevMonth > 0 ? Math.round((diff / expensesPrevMonth) * 100) : null;
                return { diff, pct };
            }, [expensesCurrentMonth, expensesPrevMonth]);

            return (
                <div className="space-y-6 animate-fadeIn pt-4">
                    {/* Страница начинается сразу с карточек "Баланс" и "Расходы" (шапку убрали) */}

                    <div className="grid grid-cols-2 gap-4">
                        <BentoCard className="bg-gradient-to-br from-emerald-50 to-emerald-100/50">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="bg-emerald-100 p-2.5 rounded-xl">
                                    <Icons.Wallet className="w-5 h-5 text-emerald-600" />
                                </div>
                                <span className={THEME.label}>Баланс</span>
                            </div>
                            <p className="text-2xl font-extrabold text-emerald-700">{Number(totalBalance).toLocaleString('ru-RU')} ₽</p>
                        </BentoCard>

                        <BentoCard className="bg-gradient-to-br from-rose-50 to-rose-100/50">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="bg-rose-100 p-2.5 rounded-xl">
                                    <Icons.TrendingDown className="w-5 h-5 text-rose-600" />
                                </div>
                                <span className={THEME.label}>Расходы</span>
                            </div>
                            <p className="text-2xl font-extrabold text-rose-700">{Number(expensesCurrentMonth).toLocaleString('ru-RU')} ₽</p>
                        </BentoCard>
                    </div>

                    {/* Ближайшие платежи/кредиты (оставляем) */}
                    {nearestCreditPayment && (
                        <section>
                            <SectionHeader title="Ближайшие платежи" />
                            <BentoCard className="!p-4 flex gap-4 items-center">
                                <div className="w-10 h-10 rounded-2xl bg-violet-50 flex items-center justify-center text-violet-600">
                                    <Icons.Landmark className="w-5 h-5" />
                                </div>
                                <div className="flex-1">
                                    <div className="flex items-center justify-between gap-3">
                                        <h3 className="font-bold text-slate-800">{nearestCreditPayment.title}</h3>
                                        <span className="text-xs font-black px-2.5 py-1 rounded-full bg-violet-50 text-violet-700">
                                            {nearestCreditPayment.nextDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-1">Сумма: {Number(nearestCreditPayment.amount).toLocaleString('ru-RU')} ₽ • день месяца: {nearestCreditPayment.date}</p>
                                </div>
                            </BentoCard>
                        </section>
                    )}

                    {/* Новые виджеты аналитики */}
                    <section>
                        <SectionHeader title="Аналитика" />

                        {/* Pie Chart + легенда */}
                        <BentoCard className="!p-4">
                            <div className="flex items-center justify-between mb-3">
                                <div>
                                    <p className={THEME.label}>Категории трат</p>
                                    <p className="text-sm text-slate-500 font-medium">{today.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}</p>
                                </div>
                                <div className="text-xs font-black px-2.5 py-1 rounded-full bg-slate-50 text-slate-500">
                                    {pieData.total > 0 ? `${expensesByCategory.length} кат.` : 'нет данных'}
                                </div>
                            </div>

                            <div className="flex gap-4">
                                <div className="shrink-0">
                                    <svg width="140" height="140" viewBox="0 0 140 140" className="block">
                                        <circle cx="70" cy="70" r="56" fill="#f1f5f9" />
                                        {pieData.arcs.map((a, i) => (
                                            a.frac > 0 ? (
                                                <path key={i} d={describeArc(70, 70, 56, a.start, a.end)} fill={a.color} />
                                            ) : null
                                        ))}
                                        <circle cx="70" cy="70" r="34" fill="white" />
                                        <text x="70" y="66" textAnchor="middle" className="fill-slate-900" style={{ fontSize: 14, fontWeight: 800 }}>
                                            {Number(expensesCurrentMonth).toLocaleString('ru-RU')}
                                        </text>
                                        <text x="70" y="84" textAnchor="middle" className="fill-slate-400" style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.2 }}>
                                            ₽ / мес
                                        </text>
                                    </svg>
                                </div>

                                <div className="flex-1 min-w-0">
                                    <div className="space-y-2">
                                        {expensesByCategory.length > 0 ? expensesByCategory.slice(0, 6).map((c, idx) => {
                                            const color = pieData.arcs[idx]?.color || '#64748b';
                                            const pct = pieData.total > 0 ? Math.round((c.amount / pieData.total) * 100) : 0;
                                            return (
                                                <div key={c.name} className="flex items-center justify-between gap-2">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <span className="w-2.5 h-2.5 rounded-full" style={{ background: color }} />
                                                        <span className="text-sm font-bold text-slate-700 truncate">{c.name}</span>
                                                    </div>
                                                    <div className="flex items-baseline gap-2 shrink-0">
                                                        <span className="text-sm font-bold text-slate-900">{Number(c.amount).toLocaleString('ru-RU')} ₽</span>
                                                        <span className="text-[11px] font-black text-slate-400 bg-slate-50 px-2 py-0.5 rounded-full">{pct}%</span>
                                                    </div>
                                                </div>
                                            );
                                        }) : (
                                            <div className="py-8 text-center text-slate-300">
                                                <Icons.PieChart className="w-12 h-12 mx-auto mb-3 opacity-50" />
                                                <p className="text-sm font-medium">Нет расходов за месяц</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </BentoCard>

                        {/* Progress: Потрачено от бюджета */}
                        <BentoCard className="!p-4">
                            <div className="flex items-end justify-between mb-3">
                                <div>
                                    <p className={THEME.label}>Потрачено от бюджета</p>
                                    <p className="text-xl font-extrabold text-slate-800 mt-1">
                                        {Number(expensesCurrentMonth).toLocaleString('ru-RU')} <span className="text-slate-300 text-base">/ {Number(monthLimit).toLocaleString('ru-RU')} ₽</span>
                                    </p>
                                </div>
                                <span className={`text-xs font-black px-2.5 py-1 rounded-full ${spentProgress >= 100 ? 'bg-rose-50 text-rose-600' : spentProgress >= 80 ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'}`}>
                                    {spentProgress}%
                                </span>
                            </div>
                            <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                <div
                                    className={`h-full rounded-full ${spentProgress >= 100 ? 'bg-rose-400' : spentProgress >= 80 ? 'bg-amber-400' : 'bg-emerald-400'}`}
                                    style={{ width: `${Math.min(100, spentProgress)}%` }}
                                />
                            </div>
                            {spentProgress >= 100 && (
                                <p className="text-xs text-rose-600 font-bold mt-2">Лимит бюджета превышен.</p>
                            )}
                        </BentoCard>

                        {/* Category limits progress */}
                        {categoryLimits && Object.keys(categoryLimits).length > 0 && (
                            <BentoCard className="!p-4">
                                <div className="flex items-center justify-between mb-3">
                                    <div>
                                        <p className={THEME.label}>Лимиты по категориям</p>
                                        <p className="text-sm text-slate-500 font-medium">Показываются только категории с лимитом</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {Object.entries(categoryLimits)
                                        .filter(([_, lim]) => typeof lim === 'number' && Number.isFinite(lim) && lim > 0)
                                        .map(([cat, lim]) => {
                                            const spent = (expensesByCategory || []).find(x => x.name === cat)?.amount || 0;
                                            const pct = lim > 0 ? Math.round((spent / lim) * 100) : 0;
                                            const over = spent > lim;
                                            return (
                                                <div key={cat} className="bg-slate-50 border border-slate-100 rounded-2xl p-4">
                                                    <div className="flex items-center justify-between gap-3">
                                                        <div className="min-w-0">
                                                            <p className="font-extrabold text-slate-800 truncate">{cat}</p>
                                                            <p className="text-xs text-slate-500 font-bold mt-1">
                                                                {Number(spent).toLocaleString('ru-RU')} ₽ / {Number(lim).toLocaleString('ru-RU')} ₽
                                                            </p>
                                                        </div>
                                                        <span className={`text-xs font-black px-2.5 py-1 rounded-full ${over ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-700'}`}>
                                                            {pct}%
                                                        </span>
                                                    </div>
                                                    <div className="mt-3 w-full h-2.5 bg-white rounded-full overflow-hidden border border-slate-100">
                                                        <div className={`h-full rounded-full ${over ? 'bg-rose-400' : pct >= 80 ? 'bg-amber-400' : 'bg-emerald-400'}`} style={{ width: `${Math.min(100, pct)}%` }} />
                                                    </div>
                                                    {over && (
                                                        <p className="text-xs text-rose-600 font-bold mt-2">Лимит превышен.</p>
                                                    )}
                                                </div>
                                            );
                                        })}
                                </div>
                            </BentoCard>
                        )}

                        {/* Compare with previous month */}
                        <BentoCard className="!p-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className={THEME.label}>Сравнение с прошлым месяцем</p>
                                    <p className="text-sm text-slate-500 mt-1">{prevMonthDate.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })} → {today.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}</p>
                                </div>
                                <div className={`text-xs font-black px-2.5 py-1 rounded-full ${compare.diff > 0 ? 'bg-rose-50 text-rose-600' : compare.diff < 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-50 text-slate-500'}`}>
                                    {compare.diff > 0 ? 'Больше' : compare.diff < 0 ? 'Меньше' : 'Ровно'}
                                </div>
                            </div>

                            <div className="mt-3 grid grid-cols-2 gap-3">
                                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                                    <p className={THEME.label}>Прошлый</p>
                                    <p className="text-lg font-extrabold text-slate-800 mt-1">{Number(expensesPrevMonth).toLocaleString('ru-RU')} ₽</p>
                                </div>
                                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                                    <p className={THEME.label}>Текущий</p>
                                    <p className="text-lg font-extrabold text-slate-800 mt-1">{Number(expensesCurrentMonth).toLocaleString('ru-RU')} ₽</p>
                                </div>
                            </div>

                            <div className="mt-3 flex items-center justify-between">
                                <p className="text-sm font-bold text-slate-700">
                                    Разница: <span className={`${compare.diff > 0 ? 'text-rose-600' : compare.diff < 0 ? 'text-emerald-700' : 'text-slate-500'}`}>{compare.diff > 0 ? '+' : ''}{Number(compare.diff).toLocaleString('ru-RU')} ₽</span>
                                </p>
                                <p className="text-xs font-black text-slate-400 bg-slate-50 px-2.5 py-1 rounded-full">
                                    {compare.pct === null ? '—' : `${compare.pct > 0 ? '+' : ''}${compare.pct}%`}
                                </p>
                            </div>
                        </BentoCard>
                    </section>
                </div>
            );
        };

        // --- Home Tab (Важное): личная страница, заметки и жизненные цели ---
        const HomeTab = () => {
            const today = new Date();
            const today0 = startOfDay(today);
            const timeGreeting = today.getHours() < 12 ? 'Доброе утро' : today.getHours() < 18 ? 'Добрый день' : 'Добрый вечер';

            // Editable greeting
            const [customGreeting, setCustomGreeting] = useLocalStorage('lifehub_home_greeting', `${timeGreeting}! 👋`);
            const [isEditingGreeting, setIsEditingGreeting] = useState(false);
            const [greetingDraft, setGreetingDraft] = useState(customGreeting);

            // Theme toggle
            const [theme, setTheme] = useLocalStorage('lifehub_theme', 'light');
            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'dark') root.classList.add('dark');
                else root.classList.remove('dark');
            }, [theme]);

            // Notes (перенос из бывшей вкладки "Заметки")
            const [notes, setNotes] = useLocalStorage('lifehub_notes', [
                { id: '1', title: 'Идеи', content: 'Сделать привычку читать 20 минут в день', color: 'bg-amber-100', createdAt: Date.now() },
                { id: '2', title: 'Планы', content: 'Разобрать бюджет и обновить цели', color: 'bg-emerald-100', createdAt: Date.now() - 86400000 },
            ]);
            const [isNoteModalOpen, setNoteModalOpen] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [noteForm, setNoteForm] = useState({ title: '', content: '', color: 'bg-amber-100' });
            const noteColors = ['bg-amber-100', 'bg-emerald-100', 'bg-violet-100', 'bg-rose-100', 'bg-sky-100'];

            const openAddNote = () => {
                setEditingNote(null);
                setNoteForm({ title: '', content: '', color: 'bg-amber-100' });
                setNoteModalOpen(true);
            };
            const openEditNote = (note) => {
                setEditingNote(note);
                setNoteForm({ title: note.title, content: note.content, color: note.color });
                setNoteModalOpen(true);
            };
            const saveNote = () => {
                if (!noteForm.title.trim()) return;
                if (editingNote) {
                    setNotes(notes.map(n => n.id === editingNote.id ? { ...n, ...noteForm } : n));
                } else {
                    setNotes([{ id: String(Date.now()), ...noteForm, createdAt: Date.now() }, ...notes]);
                }
                setNoteModalOpen(false);
            };
            const deleteNote = () => {
                if (!editingNote) return;
                setNotes(notes.filter(n => n.id !== editingNote.id));
                setNoteModalOpen(false);
            };

            // Achievements / Life goals (новый блок)
            const [lifeGoals, setLifeGoals] = useLocalStorage('lifehub_life_goals', [
                { id: 'lg1', title: 'Сделать чек-лист целей', done: true, createdAt: Date.now() - 3 * 86400000 },
                { id: 'lg2', title: 'Нарисовать картину', done: false, createdAt: Date.now() - 2 * 86400000 },
                { id: 'lg3', title: 'Пройти 10 000 шагов', done: false, createdAt: Date.now() - 86400000 },
            ]);
            const [isLifeGoalModalOpen, setLifeGoalModalOpen] = useState(false);
            const [editingLifeGoal, setEditingLifeGoal] = useState(null);
            const [lifeGoalDraft, setLifeGoalDraft] = useState('');

            // Important reminders (новая функция)
            const [reminders, setReminders] = useLocalStorage('lifehub_reminders', [
                { id: 'r1', text: 'Позвонить родителям', createdAt: Date.now() - 3600_000 },
                { id: 'r2', text: 'Записаться к врачу', createdAt: Date.now() - 7200_000 },
            ]);
            const [reminderDraft, setReminderDraft] = useState('');
            const addReminder = () => {
                const t = (reminderDraft || '').trim();
                if (!t) return;
                setReminders([{ id: String(Date.now()), text: t, createdAt: Date.now() }, ...(reminders || [])]);
                setReminderDraft('');
            };
            const deleteReminder = (id) => setReminders((reminders || []).filter(r => r.id !== id));

            // Ideas (wishlist) — новый блок
            const [ideasTitle] = useLocalStorage('lifehub_ideas_title', 'Идеи');

            const [ideas, setIdeas] = useLocalStorage('lifehub_ideas', []);
            const [ideaDraft, setIdeaDraft] = useState('');

            // миграция: если ранее в localStorage могли быть строки вместо объектов
            useEffect(() => {
                if (!Array.isArray(ideas) || ideas.length === 0) return;
                const needs = ideas.some(x => typeof x === 'string');
                if (!needs) return;
                setIdeas(ideas.map((x, idx) => (typeof x === 'string' ? { id: String(Date.now() + idx), text: x, createdAt: Date.now() } : x)));
            }, []);

            const addIdea = () => {
                const t = String(ideaDraft || '').trim();
                if (!t) return;
                setIdeas([{ id: String(Date.now()), text: t, createdAt: Date.now() }, ...(ideas || [])]);
                setIdeaDraft('');
            };

            const deleteIdea = (id) => setIdeas((ideas || []).filter(x => x.id !== id));

            const openAddLifeGoal = () => {
                setEditingLifeGoal(null);
                setLifeGoalDraft('');
                setLifeGoalModalOpen(true);
            };
            const openEditLifeGoal = (g) => {
                setEditingLifeGoal(g);
                setLifeGoalDraft(g.title);
                setLifeGoalModalOpen(true);
            };
            const saveLifeGoal = () => {
                const t = (lifeGoalDraft || '').trim();
                if (!t) return;
                if (editingLifeGoal) {
                    setLifeGoals(lifeGoals.map(g => g.id === editingLifeGoal.id ? { ...g, title: t } : g));
                } else {
                    setLifeGoals([{ id: String(Date.now()), title: t, done: false, createdAt: Date.now() }, ...lifeGoals]);
                }
                setLifeGoalModalOpen(false);
            };
            const deleteLifeGoal = () => {
                if (!editingLifeGoal) return;
                setLifeGoals(lifeGoals.filter(g => g.id !== editingLifeGoal.id));
                setLifeGoalModalOpen(false);
            };
            const toggleLifeGoal = (id) => setLifeGoals(lifeGoals.map(g => g.id === id ? { ...g, done: !g.done } : g));

            const doneCount = (lifeGoals || []).filter(g => g.done).length;
            const totalCount = (lifeGoals || []).length;

            // Keep access to existing reminders (не удаляем функциональность)
            const [birthdays] = useLocalStorage('lifehub_birthdays', []);
            const [bills] = useLocalStorage('lifehub_bills', []);

            const safeDate = (year, monthIndex, day) => {
                const d = new Date(year, monthIndex, day);
                if (d.getMonth() !== monthIndex) return new Date(year, monthIndex + 1, 0);
                return d;
            };

            const upcomingBirthdays = useMemo(() => {
                if (!birthdays || birthdays.length === 0) return [];
                const year = today0.getFullYear();
                const candidates = birthdays
                    .map(b => ({ b, occ: safeDate(year, b.month - 1, b.day) }))
                    .filter(x => x.occ >= today0)
                    .sort((a, b) => a.occ.getTime() - b.occ.getTime());
                return candidates.slice(0, 3);
            }, [birthdays]);

            const nearestBirthday = upcomingBirthdays[0] || null;

            const nearestPayment = useMemo(() => {
                if (!bills || bills.length === 0) return null;
                const currentYear = today0.getFullYear();
                const currentMonth = today0.getMonth();
                const nextOccurrence = (dayOfMonth) => {
                    const candidate = startOfDay(new Date(currentYear, currentMonth, dayOfMonth));
                    if (candidate >= today0) return candidate;
                    return startOfDay(new Date(currentYear, currentMonth + 1, dayOfMonth));
                };
                const candidates = bills
                    .filter(b => !b.paid)
                    .map(b => ({ ...b, nextDate: nextOccurrence(Number(b.date) || 1) }))
                    .sort((a, b) => a.nextDate.getTime() - b.nextDate.getTime());
                return candidates[0] || null;
            }, [bills]);

            return (
                <div className="space-y-6 animate-fadeIn">
                    <header className="pt-4">
                        <div className="flex items-start justify-between gap-3">
                            {!isEditingGreeting ? (
                                <div>
                                    <p className={THEME.label}>Важное</p>
                                    <h1 className="text-3xl font-extrabold text-slate-800 leading-tight mt-1">{customGreeting}</h1>
                                </div>
                            ) : (
                                <div className="flex-1">
                                    <p className={THEME.label}>Важное</p>
                                </div>
                            )}

                            {/* Moon toggle instead of text theme button */}
                            <div className="flex items-center gap-2">
                                <PressableScale
                                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                                    className="bg-white border border-slate-100 shadow-sm p-2.5 rounded-2xl text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-colors"
                                    title={theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'}
                                >
                                    <Icons.Moon className="w-5 h-5" />
                                </PressableScale>

                                {!isEditingGreeting && (
                                    <PressableScale
                                        onClick={() => { setGreetingDraft(customGreeting); setIsEditingGreeting(true); }}
                                        className="bg-white border border-slate-100 shadow-sm p-2.5 rounded-2xl text-slate-400 hover:text-slate-700"
                                        title="Изменить приветствие"
                                    >
                                        <Icons.Pencil className="w-4 h-4" />
                                    </PressableScale>
                                )}
                            </div>
                        </div>

                        {isEditingGreeting && (
                            <div className="mt-3 bg-white border border-slate-100 rounded-3xl p-4 shadow-sm">
                                <div className="flex items-center gap-2">
                                    <input
                                        value={greetingDraft}
                                        onChange={(e) => setGreetingDraft(e.target.value)}
                                        className="flex-1 bg-slate-50 rounded-2xl px-4 py-3 font-bold text-slate-800 outline-none"
                                        placeholder="Введите заголовок..."
                                        autoFocus
                                    />
                                    <PressableScale
                                        onClick={() => {
                                            const next = (greetingDraft || '').trim();
                                            setCustomGreeting(next || `${timeGreeting}!`);
                                            setIsEditingGreeting(false);
                                        }}
                                        className="px-4 py-3 rounded-2xl bg-emerald-500 text-white font-bold"
                                        title="Сохранить"
                                    >
                                        <Icons.Check className="w-5 h-5" />
                                    </PressableScale>
                                    <PressableScale
                                        onClick={() => { setIsEditingGreeting(false); setGreetingDraft(customGreeting); }}
                                        className="px-4 py-3 rounded-2xl bg-slate-100 text-slate-500 font-bold"
                                        title="Отмена"
                                    >
                                        <Icons.X className="w-5 h-5" />
                                    </PressableScale>
                                </div>
                                <p className="text-xs text-slate-400 mt-3">Например: «Фокус на здоровье» или «Главное на сегодня».</p>
                            </div>
                        )}
                    </header>

                    {/* Important reminders */}
                    <section>
                        <SectionHeader title="Важные напоминания" />
                        <BentoCard className="!p-4">
                            <div className="flex gap-2">
                                <input
                                    value={reminderDraft}
                                    onChange={(e) => setReminderDraft(e.target.value)}
                                    placeholder="Напр: Оплатить кредит"
                                    className="flex-1 bg-slate-50 rounded-2xl px-4 py-3 font-bold text-slate-800 outline-none"
                                />
                                <PressableScale
                                    onClick={addReminder}
                                    className="w-12 h-12 rounded-2xl bg-slate-900 text-white font-bold flex items-center justify-center"
                                    title="Добавить"
                                >
                                    <Icons.Plus className="w-5 h-5" />
                                </PressableScale>
                            </div>

                            <div className="mt-4 space-y-2">
                                {(reminders || []).length > 0 ? (reminders || []).slice(0, 8).map(r => (
                                    <div key={r.id} className="flex items-center justify-between gap-3 bg-white border border-slate-100 rounded-2xl p-3 shadow-sm">
                                        <p className="font-bold text-slate-700 text-sm">{r.text}</p>
                                        <button
                                            onClick={() => deleteReminder(r.id)}
                                            className="p-2 rounded-xl bg-slate-50 text-slate-400 hover:text-rose-500 hover:bg-rose-50"
                                            title="Удалить"
                                        >
                                            <Icons.X className="w-4 h-4" />
                                        </button>
                                    </div>
                                )) : (
                                    <div className="py-6 text-center text-slate-300">
                                        <p className="text-sm font-medium">Пока напоминаний нет</p>
                                    </div>
                                )}
                            </div>
                        </BentoCard>
                    </section>

                    <section>
                        <SectionHeader title="Достижения / Цели" actionLabel="+" onAction={openAddLifeGoal} />
                        <BentoCard className="!p-4">
                            <div className="flex items-center justify-between mb-3">
                                <div>
                                    <p className={THEME.label}>Прогресс</p>
                                    <p className="text-lg font-extrabold text-slate-800">{doneCount} / {totalCount}</p>
                                </div>
                                <div className="text-xs font-black px-2.5 py-1 rounded-full bg-slate-50 text-slate-500">
                                    {totalCount === 0 ? '0%' : `${Math.round((doneCount / totalCount) * 100)}%`}
                                </div>
                            </div>

                            <div className="space-y-2">
                                {(lifeGoals || []).length > 0 ? (lifeGoals || []).map(g => (
                                    <div key={g.id} className="flex items-center justify-between gap-3 py-2">
                                        <button
                                            onClick={() => toggleLifeGoal(g.id)}
                                            className="flex items-center gap-3 text-left flex-1"
                                        >
                                            <div className={`w-9 h-9 rounded-2xl flex items-center justify-center ${g.done ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}>
                                                {g.done ? <Icons.CheckCircle className="w-5 h-5" /> : <Icons.Circle className="w-5 h-5" />}
                                            </div>
                                            <div>
                                                <p className={`font-bold ${g.done ? 'text-slate-500 line-through' : 'text-slate-800'}`}>{g.title}</p>
                                                <p className="text-xs text-slate-400">Нажмите, чтобы отметить</p>
                                            </div>
                                        </button>
                                        <div className="flex items-center gap-2">
                                            <PressableScale onClick={() => openEditLifeGoal(g)} className="p-2 rounded-xl bg-slate-50 text-slate-400 hover:text-slate-700">
                                                <Icons.Pencil className="w-4 h-4" />
                                            </PressableScale>
                                        </div>
                                    </div>
                                )) : (
                                    <div className="py-8 text-center text-slate-300">
                                        <Icons.Target className="w-12 h-12 mx-auto mb-3 opacity-50" />
                                        <p className="text-sm font-medium">Добавьте первую цель</p>
                                    </div>
                                )}
                            </div>
                        </BentoCard>
                    </section>

                    {/* Ideas (Wishlist) — строго ниже "Достижения / Цели" и выше "Ближайшие дни рождения" */}
                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">{ideasTitle || 'Идеи'}</h2>
                            <div className="text-[11px] font-black uppercase tracking-widest text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                                {Array.isArray(ideas) ? ideas.length : 0}
                            </div>
                        </div>

                        <BentoCard className="!p-4">
                            <div className="flex gap-2">
                                <input
                                    value={ideaDraft}
                                    onChange={(e) => setIdeaDraft(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter') {
                                            e.preventDefault();
                                            addIdea();
                                        }
                                    }}
                                    placeholder="Добавить идею..."
                                    className="flex-1 bg-slate-50 rounded-2xl px-4 py-3 font-bold text-slate-800 outline-none"
                                />
                                <PressableScale
                                    onClick={addIdea}
                                    className="w-12 h-12 rounded-2xl bg-slate-900 text-white font-bold flex items-center justify-center"
                                    title="Добавить"
                                >
                                    <Icons.Plus className="w-5 h-5" />
                                </PressableScale>
                            </div>

                            <div className="mt-4 space-y-2">
                                {(Array.isArray(ideas) && ideas.length > 0) ? (
                                    ideas.map(item => (
                                        <div key={item.id} className="flex items-center justify-between gap-3 bg-white border border-slate-100 rounded-2xl p-3 shadow-sm">
                                            <p className="font-bold text-slate-700 text-sm">{item.text}</p>
                                            <button
                                                onClick={() => deleteIdea(item.id)}
                                                className="p-2 rounded-xl bg-slate-50 text-slate-400 hover:text-rose-500 hover:bg-rose-50"
                                                title="Удалить"
                                            >
                                                <Icons.X className="w-4 h-4" />
                                            </button>
                                        </div>
                                    ))
                                ) : (
                                    <div className="py-8 text-center text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                        <p className="text-sm font-medium">Запиши идею для подарка или свидания...</p>
                                    </div>
                                )}
                            </div>
                        </BentoCard>
                    </section>

                    {/* Ближайшие дни рождения */}
                    <section>
                        <SectionHeader title="Ближайшие дни рождения" />
                        <div className="space-y-3">
                            {upcomingBirthdays.length > 0 ? upcomingBirthdays.map(({ b, occ }) => {
                                const daysLeft = Math.max(0, Math.round((startOfDay(occ).getTime() - startOfDay(today0).getTime()) / 86400000));
                                const badge = daysLeft === 0
                                    ? 'bg-rose-50 text-rose-600'
                                    : daysLeft <= 7
                                        ? 'bg-amber-50 text-amber-700'
                                        : daysLeft <= 31
                                            ? 'bg-emerald-50 text-emerald-700'
                                            : 'bg-slate-50 text-slate-500';

                                return (
                                    <BentoCard key={b.id} className="!p-4 flex gap-4 items-center">
                                        <div className="w-10 h-10 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-600">
                                            <Icons.Gift className="w-5 h-5" />
                                        </div>
                                        <div className="flex-1">
                                            <div className="flex items-center justify-between gap-3">
                                                <h3 className="font-bold text-slate-800">{b.name}</h3>
                                                <span className={`text-xs font-black px-2.5 py-1 rounded-full ${badge}`}>
                                                    {daysLeft === 0 ? 'Сегодня' : `через ${daysLeft} дн.`}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-400 mt-1">
                                                {occ.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
                                                {b.year ? ` • исполнится ${today0.getFullYear() - b.year}` : ''}
                                            </p>
                                        </div>
                                    </BentoCard>
                                );
                            }) : (
                                <div className="flex flex-col items-center justify-center h-32 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                    <Icons.Gift className="w-10 h-10 mb-2 opacity-50" />
                                    <p className="text-sm font-medium">Нет ближайших дат</p>
                                </div>
                            )}
                        </div>
                    </section>

                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-slate-700">Заметки</h2>
                            <PressableScale
                                onClick={openAddNote}
                                className="w-12 h-12 rounded-2xl bg-amber-500 text-white font-bold flex items-center justify-center shadow-sm"
                                title="Добавить"
                            >
                                <Icons.Plus className="w-5 h-5" />
                            </PressableScale>
                        </div>

                        {(notes || []).length > 0 ? (
                            <div className="grid grid-cols-2 gap-4">
                                {(notes || []).map(note => (
                                    <PressableScale key={note.id} onClick={() => openEditNote(note)} className={`${note.color} p-5 rounded-3xl min-h-[150px] flex flex-col justify-between`}>
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-lg mb-2">{note.title}</h3>
                                            <p className="text-slate-600 text-sm line-clamp-4">{note.content}</p>
                                        </div>
                                        <p className="text-xs text-slate-400 mt-3">{new Date(note.createdAt).toLocaleDateString('ru-RU')}</p>
                                    </PressableScale>
                                ))}
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-40 text-slate-300 border-2 border-dashed border-slate-100 rounded-3xl">
                                <Icons.StickyNote className="w-12 h-12 mb-2 opacity-50" />
                                <p className="text-sm font-medium">Нет заметок</p>
                            </div>
                        )}
                    </section>

                    {/* Note Modal */}
                    {isNoteModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setNoteModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp max-h-[92vh] overflow-y-auto scrollbar-hide kbd-safe-bottom">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingNote ? 'Редактирование' : 'Новая заметка'}</h2>
                                    {editingNote && (
                                        <button onClick={deleteNote} className="bg-rose-50 p-3 rounded-full text-rose-500">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Заголовок</label>
                                        <input
                                            value={noteForm.title}
                                            onChange={e => setNoteForm({ ...noteForm, title: e.target.value })}
                                            placeholder="Название"
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                            autoFocus
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Содержание</label>
                                        <textarea
                                            value={noteForm.content}
                                            onChange={e => setNoteForm({ ...noteForm, content: e.target.value })}
                                            onFocus={(e) => {
                                                // Ensure textarea is visible above keyboard
                                                try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
                                            }}
                                            placeholder="Текст..."
                                            rows={4}
                                            className="w-full bg-slate-50 rounded-2xl py-4 px-5 text-slate-800 outline-none resize-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className={THEME.label}>Цвет</label>
                                        <div className="flex gap-2">
                                            {noteColors.map(color => (
                                                <button
                                                    key={color}
                                                    onClick={() => setNoteForm({ ...noteForm, color })}
                                                    className={`w-10 h-10 rounded-xl ${color} ${noteForm.color === color ? 'ring-2 ring-slate-400 ring-offset-2' : ''}`}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <PressableScale onClick={saveNote} className="w-full pt-2">
                                    <div className="bg-amber-500 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">{editingNote ? 'Сохранить' : 'Создать'}</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}

                    {/* Life goal modal */}
                    {isLifeGoalModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onClick={() => setLifeGoalModalOpen(false)} />
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 space-y-5 shadow-2xl relative animate-slideUp">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">{editingLifeGoal ? 'Редактирование' : 'Новая цель'}</h2>
                                    {editingLifeGoal && (
                                        <button onClick={deleteLifeGoal} className="bg-rose-50 p-3 rounded-full text-rose-500">
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-2">
                                    <label className={THEME.label}>Формулировка</label>
                                    <input
                                        value={lifeGoalDraft}
                                        onChange={(e) => setLifeGoalDraft(e.target.value)}
                                        className="w-full bg-slate-50 rounded-2xl py-4 px-5 font-bold text-slate-800 outline-none"
                                        placeholder="Напр: Пробежать 5 км"
                                        autoFocus
                                    />
                                </div>

                                <PressableScale onClick={saveLifeGoal} className="w-full pt-2">
                                    <div className="bg-slate-900 h-14 rounded-3xl flex items-center justify-center shadow-xl">
                                        <span className="text-white font-bold text-lg">Сохранить</span>
                                    </div>
                                </PressableScale>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Sync Status Indicator ---
        const SyncIndicator = () => {
            const { syncStatus, lastSyncTime } = useData();
            
            if (syncStatus === 'idle' && !lastSyncTime) return null;
            
            const statusConfig = {
                idle: { icon: null, text: '', bg: '' },
                saving: { icon: Icons.Loader, text: 'Сохранение...', bg: 'bg-amber-50 text-amber-700 border-amber-100' },
                saved: { icon: Icons.CheckCircle, text: 'Сохранено', bg: 'bg-emerald-50 text-emerald-700 border-emerald-100' },
                error: { icon: Icons.AlertTriangle, text: 'Ошибка синхронизации', bg: 'bg-rose-50 text-rose-700 border-rose-100' }
            };
            
            const config = statusConfig[syncStatus];
            if (!config || syncStatus === 'idle') return null;
            
            const IconComponent = config.icon;
            
            return (
                <div className={`fixed top-2 left-1/2 -translate-x-1/2 z-[100] px-4 py-2 rounded-full border shadow-lg flex items-center gap-2 text-xs font-bold ${config.bg} animate-fadeIn`}>
                    {IconComponent && <IconComponent className="w-4 h-4" />}
                    <span>{config.text}</span>
                </div>
            );
        };
        
        // --- Debug Panel (можно скрыть в продакшене) ---
        const DebugPanel = () => {
            const [isOpen, setIsOpen] = useState(false);
            const { lastSyncTime } = useData();

            // Показываем Debug только:
            // 1) в режиме разработки (тестовый пользователь), или
            // 2) если явно включено через параметр ?debug=1
            const allowDebug = (() => {
                try {
                    if (String(USER_ID) === '111111') return true;
                    const qs = new URLSearchParams(window.location.search);
                    if (qs.get('debug') === '1') return true;
                    const hash = String(window.location.hash || '').replace(/^#/, '');
                    const hs = new URLSearchParams(hash);
                    if (hs.get('debug') === '1') return true;
                } catch (e) {}
                return false;
            })();

            if (!allowDebug) return null;
            
            return (
                <div className="fixed top-14 right-2 z-[100]">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-lg shadow-lg"
                    >
                        {isOpen ? '✕' : 'Debug'}
                    </button>
                    
                    {isOpen && (
                        <div className="mt-2 bg-white border border-slate-200 rounded-xl p-3 shadow-xl text-xs w-64 max-h-80 overflow-auto">
                            <div className="font-bold text-slate-800 mb-2">Debug Info</div>
                            <div className="space-y-1 text-slate-600">
                                <div><span className="font-bold">User ID:</span> {USER_ID}</div>
                                <div><span className="font-bold">Telegram:</span> {window.Telegram?.WebApp ? 'Да' : 'Нет'}</div>
                                <div><span className="font-bold">initDataUnsafe.user.id:</span> {window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 'null'}</div>
                                <div><span className="font-bold">Последняя синхронизация:</span> {lastSyncTime ? lastSyncTime.toLocaleTimeString('ru-RU') : 'нет'}</div>
                            </div>
                            <div className="mt-3 pt-2 border-t border-slate-100">
                                <div className="font-bold text-slate-800 mb-1">initDataUnsafe:</div>
                                <pre className="text-[9px] bg-slate-50 p-2 rounded overflow-auto max-h-32">
                                    {JSON.stringify(window.Telegram?.WebApp?.initDataUnsafe, null, 2) || 'null'}
                                </pre>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const { loading, error } = useData();
            const [activeTab, setActiveTab] = useState('home');

            // Показываем лоадер пока данные загружаются из Supabase
            if (loading) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
                        <Icons.Loader className="w-12 h-12 text-slate-400 mb-4" />
                        <p className="text-slate-500 font-bold">Загрузка данных...</p>
                        <p className="text-slate-400 text-sm mt-2">Синхронизация с облаком</p>
                        <p className="text-slate-300 text-xs mt-4">User ID: {USER_ID}</p>
                    </div>
                );
            }

            // Показываем ошибку если не удалось загрузить
            if (error) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
                        <Icons.AlertTriangle className="w-16 h-16 text-amber-500 mb-4" />
                        <h1 className="text-xl font-bold text-slate-800 mb-2">Ошибка загрузки</h1>
                        <p className="text-slate-500 text-center mb-4">{error}</p>
                        <p className="text-slate-300 text-xs mb-4">User ID: {USER_ID}</p>
                        <button
                            onClick={() => window.location.reload()}
                            className="bg-slate-900 text-white px-6 py-3 rounded-full font-bold"
                        >
                            Перезагрузить
                        </button>
                    </div>
                );
            }

            // Tabs (ровно 4): Главная (Важное) → Бюджет → Статистика → Дом
            const tabs = [
                { id: 'home', icon: Icons.Home, label: 'Главная' },
                { id: 'budget', icon: Icons.Wallet, label: 'Бюджет' },
                { id: 'stats', icon: Icons.PieChart, label: 'Статистика' },
                { id: 'supplies', icon: Icons.Package, label: 'Дом' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'home': return <HomeTab />;
                    case 'budget': return <BudgetTab />;
                    case 'stats': return <StatisticsTab />;
                    case 'supplies': return <SuppliesTab />;
                    default: return <HomeTab />;
                }
            };

            return (
                <ErrorBoundary>
                    <div className="app-container bg-slate-50">
                        {/* Sync Status Indicator */}
                        <SyncIndicator />
                        
                        {/* Debug Panel (можно убрать в продакшене) */}
                        <DebugPanel />
                        
                        {/* Scrollable content area - ends BEFORE navbar */}
                        <main className="app-content w-full max-w-md mx-auto px-4 sm:px-5">
                            {renderTab()}
                        </main>

                        {/* Bottom Navigation - fixed at very bottom, z-index ниже модалок */}
                        <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-xl border-t border-slate-100 safe-bottom px-2 pt-2" style={{ paddingBottom: 'max(0.5rem, env(safe-area-inset-bottom))' }}>
                            <div className="w-full max-w-md mx-auto flex justify-around items-center h-full">
                                {tabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    const TabIcon = tab.icon;
                                    return (
                                        <PressableScale
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className="flex flex-col items-center gap-0.5 py-1.5 px-1 min-w-0 flex-1 no-select"
                                        >
                                            <div className={`p-2 rounded-xl transition-all ${isActive ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>
                                                <TabIcon className="w-5 h-5" />
                                            </div>
                                            <span className={`text-[9px] font-bold uppercase tracking-wider truncate ${isActive ? 'text-slate-900' : 'text-slate-400'}`}>
                                                {tab.label}
                                            </span>
                                        </PressableScale>
                                    );
                                })}
                            </div>
                        </nav>
                    </div>
                </ErrorBoundary>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <DataProvider>
                <App />
            </DataProvider>
        );
    </script>
</body>
</html>
