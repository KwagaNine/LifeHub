  <body class="bg-slate-50">
    <style>
      /* Простая страница техработ (на случай если standalone.html отсутствует) */
      #maintenance {
        display: none;
        min-height: 100vh;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #maintenance .card {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        padding: 22px;
      }
      #maintenance h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      #maintenance p {
        margin: 10px 0 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
        font-weight: 600;
      }
      #maintenance .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 999px;
        background: #f1f5f9;
        color: #0f172a;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #maintenance .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #f59e0b;
        box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.18);
      }
    </style>

    <div id="maintenance">
      <div class="card">
        <div class="badge"><span class="dot"></span> Сервис недоступен</div>
        <h1 style="margin-top: 14px;">Ведутся технические работы</h1>
        <p>Приложение в данный момент обновляется.</p>
        <p style="margin-top: 14px; font-size: 12px; color: #94a3b8; font-weight: 700;">
          Попробуйте открыть позже.
        </p>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        const maintenance = document.getElementById('maintenance');
        const root = document.getElementById('root');

        const showMaintenance = () => {
          if (maintenance) maintenance.style.display = 'flex';
          if (root) root.style.display = 'none';
        };

        const hideMaintenance = () => {
          if (maintenance) maintenance.style.display = 'none';
          if (root) root.style.display = 'block';
        };

        const isFile = location.protocol === 'file:';
        const isGitHubPages = /(^|\.)github\.io$/.test(location.hostname);
        const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

        // На file:// и github pages (из корня) предпочитаем standalone.
        // Если standalone отсутствует — показываем техработы.
        if (isFile || (isGitHubPages && !isLocalhost)) {
          // Не запускаем Vite entrypoint в этих режимах
          window.__LH_SKIP_VITE__ = true;

          const standaloneUrl = new URL('standalone.html', location.href);
          // Проверяем существование файла, чтобы не редиректить на 404
          fetch(standaloneUrl.toString(), { method: 'HEAD', cache: 'no-store' })
            .then((r) => {
              if (r.ok) {
                // ВАЖНО: сохраняем query+hash, т.к. Telegram Mini Apps передаёт initData именно там.
                const target = new URL('standalone.html', location.href);
                target.search = location.search;
                target.hash = location.hash;
                // cache-buster, чтобы Telegram не держал старый HTML
                target.searchParams.set('_v', '20260205');

                if (!/standalone\.html(\?.*)?$/.test(location.pathname)) {
                  location.replace(target.toString());
                }
              } else {
                showMaintenance();
              }
            })
            .catch(() => showMaintenance());
        } else {
          // Dev / Vite build preview
          hideMaintenance();
        }
      })();
    </script>

    <!-- При запуске через dev-сервер/сборку Vite работает обычное React-приложение -->
  </body>
</html>
